ituída e em funcionamento há pelo menos 1 ano (art. 5º, LXX, e art. 21 da lei), em defesa de interesses coletivos/líquidos e certos de seus membros ou associados (dispensada a autorização).", "analise": "As demais alternativas contrariam os prazos e efeitos previstos na lei.", "ref": "Lei nº 12.016/2009; CF/88 art. 5º, LXIX e LXX"}, {"id": "DPC-008", "materia": "DPC", "topico": "Ação civil pública (Lei nº 7.347/1985) e tutela provisória contra o Poder Público", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a tutela provisória contra o Poder Público (Lei nº 8.437/1992), é CORRETO afirmar que:", "alternativas": ["é vedada a concessão de liminar que esgote, no todo ou em parte, o objeto da ação, quando a ação principal tiver sido proposta em face de ato do Poder Público (hipótese da liminar satisfativa), ressalvadas as situações previstas na lei e na jurisprudência (v.g., quando houver manifesto risco de dano irreparável e as hipóteses sumuladas do STF)", "é vedada qualquer tutela provisória contra o Poder Público", "a liminar sempre pode esgotar o objeto da ação", "não há limites para a concessão de liminar contra o Poder Público", "a lei foi revogada pelo CPC/2015"], "correta": 0, "comentario": "Lei nº 8.437/1992, art. 1º, §3º: 'Não será cabível medida liminar que esgote, no todo ou em qualquer parte, o objeto da ação'. §4º: 'Nos casos de comprovada urgência e de flagrante ilegitimidade, o presidente do tribunal poderá suspender a execução da liminar...'. E §5º: 'Não será cabível, no juízo de primeiro grau, medida cautelar inominada ou a sua liminar, quando impugnado ato de autoridade sujeita, na via de mandado de segurança, à competência originária do tribunal'. A jurisprudência consolidou as exceções (súmulas 729 e 730 do STF) para assegurar direitos sociais, especialmente saúde, com risco de dano irreparável.", "analise": "As demais alternativas negam ou extrapolam o regime legal da liminar contra o Poder Público.", "ref": "Lei nº 8.437/1992; Súmulas 729 e 730 do STF"}, {"id": "DPC-009", "materia": "DPC", "topico": "ADC e controle abstrato: aspectos processuais", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a Ação Declaratória de Constitucionalidade (ADC), é CORRETO afirmar que:", "alternativas": ["tem como objeto lei ou ato normativo federal, exige demonstração de controvérsia judicial relevante e, julgada procedente, produz efeitos erga omnes e vinculantes, com declaração de constitucionalidade que vincula o Judiciário e a Administração", "tem como objeto lei municipal", "dispensa a demonstração de controvérsia judicial", "admite desistência após o ajuizamento", "não admite liminar"], "correta": 0, "comentario": "Art. 102, I, 'a', e §2º, da CF (com a redação da EC 45/2004); Lei nº 9.868/1999, art. 14: 'A petição inicial indicará... a existência de controvérsia judicial relevante sobre a aplicação da disposição objeto da ação declaratória'. A ADC tem como objeto lei ou ato normativo FEDERAL (a Constituição não a admite para lei estadual/municipal), não admite desistência (art. 16), admite concessão de liminar para suspender o julgamento de processos que envolvam a aplicação da lei questionada (art. 21, parágrafo único) e a decisão de mérito tem eficácia contra todos e efeito vinculante, tal como na ADI.", "analise": "As demais alternativas criam/negam requisitos legais.", "ref": "CF/88 art. 102, I, 'a', e §2º; Lei nº 9.868/1999, arts. 14, 16, 21 e 28"}, {"id": "DPC-010", "materia": "DPC", "topico": "Precedentes: IRDR e incidente de assunção de competência", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O incidente de assunção de competência (art. 947 do CPC) é cabível:", "alternativas": ["quando o julgamento de recurso, de remessa necessária ou de processo de competência originária envolver relevante questão de direito, com grande repercussão social, sem repetição em múltiplos processos, admitindo a intervenção de terceiros e do amicus curiae, e o acórdão vincula os juízes e tribunais", "em qualquer processo criminal, apenas", "quando houver repetição de processos idênticos, apenas", "somente em processos administrativos", "é vedada a participação do amicus curiae"], "correta": 0, "comentario": "Art. 947 do CPC: 'É admissível a assunção de competência quando o julgamento de recurso, de remessa necessária ou de processo de competência originária envolver relevante questão de direito, com grande repercussão social, sem repetição em múltiplos processos'. §2º: 'A escolha da turma julgadora competente para o julgamento do incidente é feita pela maioria absoluta da composição do órgão, sendo admitida a participação de terceiros interessados e do amicus curiae'. §4º: o acórdão que resolve o incidente vincula os órgãos julgadores do tribunal e os juízes a ele vinculados. Técnica similar ao IRDR, mas sem repetição de processos.", "analise": "As demais alternativas restringem indevidamente o instituto.", "ref": "CPC, art. 947"}, {"id": "PL-001", "materia": "PL", "topico": "Proposições legislativas: espécies e diferenças", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São espécies normativas previstas no art. 59 da Constituição Federal:", "alternativas": ["emendas à Constituição, leis complementares, leis ordinárias, leis delegadas, medidas provisórias, decretos legislativos e resoluções", "leis ordinárias, decretos regulamentares e portarias", "resoluções, portarias e instruções normativas", "medidas provisórias, decretos e avisos", "emendas, pareceres e indicações"], "correta": 0, "comentario": "Art. 59 da CF/88: 'O processo legislativo compreende a elaboração de: I — emendas à Constituição; II — leis complementares; III — leis ordinárias; IV — leis delegadas; V — medidas provisórias; VI — decretos legislativos; VII — resoluções'. Decreto regulamentar, portaria e instrução normativa são atos do Executivo (não integram o processo legislativo); parecer e indicação são proposições internas, não espécies normativas.", "analise": "As demais alternativas misturam atos administrativos com espécies normativas.", "ref": "CF/88 art. 59"}, {"id": "PL-002", "materia": "PL", "topico": "Espécies normativas: diferenças e hierarquia", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o decreto legislativo e a resolução, é CORRETO afirmar que:", "alternativas": ["ambos decorrem de competência privativa ou exclusiva da Casa Legislativa e NÃO se sujeitam a sanção ou veto do Chefe do Executivo.", "ambos dependem de sanção do Governador para produzir efeitos.", "o decreto legislativo é ato do Executivo e a resolução é ato do Judiciário.", "a resolução é espécie normativa sujeita a veto parcial.", "o decreto legislativo veicula matéria de competência privativa do Senado."], "correta": 0, "comentario": "Decretos legislativos veiculam matérias de competência EXCLUSIVA do Congresso/Assembleia (art. 49 da CF, por exemplo) e resoluções, matérias de competência PRIVATIVA da Câmara, do Senado ou da Mesa (arts. 51 e 52). Como decorrem de atos internos de deliberação legislativa, NÃO se sujeitam a sanção nem a veto, sendo promulgados pelo Presidente da Casa (no caso da Câmara, o Presidente do Senado promulga em alguns casos). A resolução é também o instrumento típico para aprovar o Regimento Interno da Casa.", "analise": "B) não há sanção. C) são atos do Legislativo. D) não há veto. E) o decreto legislativo veicula competência exclusiva da Casa.", "ref": "CF/88 arts. 49, 51 e 52"}, {"id": "PL-003", "materia": "PL", "topico": "Iniciativa no processo legislativo", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São de iniciativa privativa do Chefe do Poder Executivo (reservada), entre outras, as leis que disponham sobre:", "alternativas": ["criação de cargos, funções ou empregos públicos na administração direta e autárquica, fixação e aumento de remuneração de servidores e o regime jurídico único, além da organização administrativa.", "matéria tributária em geral.", "o Regimento Interno da Casa Legislativa.", "a fixação do subsídio dos deputados.", "a criação de comissões parlamentares de inquérito."], "correta": 0, "comentario": "Art. 61, §1º, II, da CF (simetria aplicável aos Estados): são de iniciativa privativa do Presidente da República (e dos Governadores, no âmbito estadual) as leis sobre: criação de cargos, funções ou empregos públicos na administração direta e autárquica ou aumento de sua remuneração (a); organização administrativa e judiciária, matéria tributária e orçamentária, serviços públicos e pessoal da administração dos Territórios (b); servidores públicos da União e Territórios, seu regime jurídico, provimento de cargos, estabilidade e aposentadoria (c); organização do MP e da Defensoria (d); criação e aumento da remuneração de órgãos da administração (e); militares (f). A matéria tributária em geral NÃO é de iniciativa reservada do Executivo — pode ser proposta por parlamentar ou por comissão, ressalvadas as exceções do art. 61, §1º, II, 'b' (matéria tributária dos Territórios) e as leis orçamentárias (arts. 165 e 166).", "analise": "B) matéria tributária geral admite iniciativa parlamentar. C) o Regimento Interno é matéria de resolução, com iniciativa interna. D) fixação de subsídios tem disciplina própria (art. 39, §4º, e leis específicas). E) CPI é criada por requerimento de 1/3 dos membros.", "ref": "CF/88 art. 61, §1º"}, {"id": "PL-004", "materia": "PL", "topico": "Iniciativa popular e iniciativa reservada", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a iniciativa popular no âmbito estadual, a Constituição Federal estabelece que:", "alternativas": ["a lei disporá sobre a iniciativa popular no processo legislativo estadual, atendidos os parâmetros gerais do sistema.", "a iniciativa popular estadual exige assinaturas de 5% do eleitorado nacional.", "não existe iniciativa popular estadual.", "a iniciativa popular é exclusiva de partidos políticos.", "a iniciativa popular estadual depende de autorização do Governador."], "correta": 0, "comentario": "Art. 27, §4º, da CF/88: 'A lei disporá sobre a iniciativa popular no processo legislativo estadual'. No plano federal, o art. 61, §2º, exige a apresentação de projeto por, no mínimo, 1% do eleitorado nacional, distribuído por pelo menos 5 Estados, com não menos de 3 décimos por cento dos eleitores de cada um deles. Nos Estados, a regulamentação é feita por lei estadual, conforme a Constituição Estadual (a Constituição do Pará também trata da iniciativa popular).", "analise": "As demais opções criam requisitos inexistentes ou negam a previsão constitucional.", "ref": "CF/88 art. 27, §4º, e art. 61, §2º"}, {"id": "PL-005", "materia": "PL", "topico": "Fases da elaboração legislativa", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São fases do processo legislativo (elaboração da lei), em sequência:", "alternativas": ["iniciativa, discussão e votação, sanção ou veto, promulgação e publicação.", "discussão, iniciativa, publicação e veto.", "sanção, iniciativa, votação e promulgação.", "promulgação, publicação, votação e sanção.", "publicação, discussão, veto e iniciativa."], "correta": 0, "comentario": "Fases: (1) INICIATIVA (faculdade de apresentar o projeto: parlamentar, Executivo, Judiciário, MP nos temas de sua competência, iniciativa popular, iniciativa reservada); (2) DISCUSSÃO e VOTAÇÃO (nas comissões e no Plenário, em turnos conforme a espécie); (3) SANÇÃO ou VETO (atuação do Executivo); (4) PROMULGAÇÃO (declaração da existência da lei e ordem de execução) e (5) PUBLICAÇÃO (torna a lei conhecida e obrigatória).", "analise": "As demais alternativas embaralham a ordem das fases.", "ref": "CF/88 arts. 59 a 69"}, {"id": "PL-006", "materia": "PL", "topico": "Fases da elaboração legislativa: sanção e veto", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a sanção e o veto no processo legislativo, é CORRETO afirmar que:", "alternativas": ["o Presidente da República (na esfera estadual, o Governador) tem 15 dias úteis para sancionar ou vetar; o silêncio no prazo importa sanção tácita e o veto pode ser total ou parcial.", "o veto pode ser dado em 30 dias corridos, sem possibilidade de rejeição.", "a sanção tácita é vedada pela Constituição.", "o veto parcial pode abranger apenas palavras de um mesmo artigo.", "não há prazo para a sanção."], "correta": 0, "comentario": "Art. 66: aprovado o projeto de lei, o Chefe do Executivo, aquiescendo, SANCIONA. Se considerar o projeto, no todo ou em parte, inconstitucional ou contrário ao interesse público, veta-o total ou parcialmente. O veto será expresso em 15 DIAS ÚTEIS, contados da data do recebimento, e comunicado ao Presidente da Casa em 48 horas (esfera federal, no mesmo prazo ao Presidente da Assembleia, no plano estadual). O silêncio no prazo importa SANÇÃO (sanção tácita). O VETO PARCIAL abrange texto integral de artigo, parágrafo, inciso ou alínea (art. 66, §2º).", "analise": "B) prazo de 15 dias úteis com rejeição em sessão conjunta em 30 dias. C) a sanção tácita é prevista. D) a abrangência é de artigo, parágrafo, inciso ou alínea inteiros. E) há prazo expresso.", "ref": "CF/88 art. 66"}, {"id": "PL-007", "materia": "PL", "topico": "Fases da elaboração legislativa: veto e rejeição", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Apreciado o veto pelo Poder Legislativo, é CORRETO afirmar que:", "alternativas": ["o veto será apreciado em sessão conjunta (no Estado, em sessão da Assembleia) dentro de 30 dias, contados do seu recebimento, só podendo ser rejeitado pelo voto da maioria absoluta dos deputados, em escrutínio secreto.", "o veto é irrecusável.", "a rejeição do veto exige 3/5 dos votos.", "o veto é apreciado apenas pelas comissões.", "a rejeição do veto depende de sanção do Governador."], "correta": 0, "comentario": "Art. 66, §4º e §5º (simetria estadual): o veto será apreciado em sessão conjunta dentro de 30 dias a contar de seu recebimento, podendo ser rejeitado pelo voto da maioria absoluta dos Deputados e Senadores, em escrutínio secreto. Se, esgotado esse prazo, não houver deliberação, o veto será colocado em pauta na sessão imediata como item único até a votação. Rejeitado o veto, o projeto é enviado ao Presidente para PROMULGAÇÃO; se este não o fizer em 48 horas, o Presidente do Senado promulga e, se este não o fizer em igual prazo, o Presidente do Senado promulga (art. 66, §7º — na esfera federal, promulga o Presidente do Senado; no Estado, o Presidente da Assembleia).", "analise": "B) o veto pode ser rejeitado. C) maioria absoluta, não 3/5. D) é apreciado em sessão conjunta/plenário. E) a promulgação decorre da rejeição do veto.", "ref": "CF/88 art. 66, §§4º a 7º"}, {"id": "PL-008", "materia": "PL", "topico": "Fases da elaboração legislativa: promulgação e publicação", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A promulgação da lei consiste em:", "alternativas": ["ato pelo qual o Chefe do Executivo atesta a existência da lei e determina a sua execução, sendo condição para a publicação e entrada em vigor.", "ato de discussão do projeto em plenário.", "ato de apresentação do projeto à Casa.", "ato de veto ao projeto.", "ato de emenda ao projeto originário."], "correta": 0, "comentario": "Promulgação é a declaração solene de que a lei existe, integrando-a ao ordenamento; a PUBLICAÇÃO é a divulgação oficial que dá notícia da lei e marca o início da contagem da vacatio legis. Ordem prática: sanção → promulgação → publicação → vigência (imediata ou após o prazo legal).", "analise": "As demais opções descrevem fases ou atos diversos.", "ref": "Processo legislativo – promulgação e publicação"}, {"id": "PL-009", "materia": "PL", "topico": "Quóruns, turnos, interstícios e regimes de tramitação", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Salvo disposição constitucional em contrário, as deliberações de cada Casa legislativa e de suas comissões serão tomadas:", "alternativas": ["por maioria dos votos, presente a maioria absoluta de seus membros", "por 3/5 dos votos, em dois turnos", "por maioria absoluta dos membros, em qualquer turno", "por unanimidade", "por 2/3 dos membros, em turno único"], "correta": 0, "comentario": "Art. 47 da CF/88: 'Salvo disposição constitucional em contrário, as deliberações de cada Casa e de suas Comissões serão tomadas por maioria dos votos, presente a maioria absoluta de seus membros'. Exceções: emenda constitucional (3/5, dois turnos — art. 60, §2º), lei complementar (maioria absoluta — art. 69), além de quóruns específicos como a rejeição de veto (maioria absoluta), a autorização para processar o Presidente (2/3) e a cassação de mandato.", "analise": "As demais alternativas aplicam quóruns específicos à regra geral.", "ref": "CF/88 arts. 47, 60, §2º, e 69"}, {"id": "PL-010", "materia": "PL", "topico": "Comissões parlamentares permanentes e temporárias", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre as comissões parlamentares, é CORRETO afirmar que:", "alternativas": ["as permanentes integram a estrutura da Casa e subsistem por legislatura; as temporárias são criadas para assunto determinado e se extinguem ao término da legislatura ou da missão, e as comissões podem emitir parecer em caráter terminativo, dispensando a apreciação pelo Plenário nas hipóteses regimentais.", "todas as comissões são obrigatoriamente dispensadas de parecer.", "as comissões temporárias subsistem além do término da legislatura.", "as comissões não podem realizar audiências públicas.", "as comissões não podem arquivar proposições."], "correta": 0, "comentario": "Art. 58, §2º, I, da CF: às comissões, em razão da matéria de sua competência, cabe discutir e votar projeto de lei que dispensar, na forma do regimento, a competência do Plenário, salvo se houver recurso de um décimo dos membros da Casa (apreciação terminativa). As comissões permanentes subsistem por toda a legislatura; temporárias (inclusive CPI e comissões especiais) extinguem-se ao término da legislatura, da missão ou do prazo fixado. Podem realizar audiências públicas (art. 58, §2º, II e III), convocar autoridades, solicitar depoimentos e receber petições e reclamações.", "analise": "As demais alternativas negam competências legais das comissões.", "ref": "CF/88 art. 58, §2º"}, {"id": "PL-011", "materia": "PL", "topico": "Comissões parlamentares de inquérito", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A CPI será criada pela Câmara dos Deputados, pelo Senado Federal ou, em conjunto, pelo Congresso Nacional, mediante requerimento de:", "alternativas": ["um terço de seus membros, para apuração de fato determinado e por prazo certo, com poderes de investigação próprios das autoridades judiciais.", "metade de seus membros, com prazo indeterminado.", "cinco deputados, independentemente do total.", "do Governador do Estado, por decreto.", "maioria simples, com poderes jurisdicionais."], "correta": 0, "comentario": "Art. 58, §3º, da CF: as comissões parlamentares de inquérito, que terão poderes de investigação próprios das autoridades judiciais, além de outros previstos nos regimentos das respectivas Casas, serão criadas pela Câmara, pelo Senado ou, em conjunto, pela Câmara e pelo Senado, mediante requerimento de UM TERÇO de seus membros, para a apuração de FATO DETERMINADO e por PRAZO CERTO, sendo suas conclusões, se for o caso, encaminhadas ao Ministério Público, para que promova a responsabilidade civil ou criminal dos infratores. As CPIs NÃO podem determinar medidas constritivas de competência exclusiva do Judiciário (como busca domiciliar e interceptação) nem julgar — têm poderes instrutórios (requisição de documentos, oitiva, quebra de sigilo bancário/fiscal/telefônico — dados).", "analise": "B) 1/3 e prazo certo. C) o quórum é proporcional ao total de membros. D) não depende do Executivo. E) não têm poder jurisdicional.", "ref": "CF/88 art. 58, §3º"}, {"id": "PL-012", "materia": "PL", "topico": "RIALEPA: comissões, pareceres e tramitação de matérias", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Na Assembleia Legislativa do Pará, a Comissão de Constituição e Justiça e de Redação Final (CCJ) tem, entre outras atribuições:", "alternativas": ["analisar a constitucionalidade, a legalidade, a juridicidade e a técnica legislativa das proposições e elaborar a redação final aprovada, sendo a primeira comissão a se manifestar sobre as matérias em regra.", "julgar as contas do Governador.", "apreciar exclusivamente as emendas orçamentárias.", "exercer a direção dos trabalhos em plenário.", "ter competência privativa para o arquivamento definitivo de proposições."], "correta": 0, "comentario": "A Comissão de Constituição e Justiça e de Redação Final (CCJ), nos regimentos das casas legislativas e no RIALEPA, é a comissão de 'porta de entrada' quanto aos aspectos constitucionais/legais/regimentais (admissibilidade) e ao fornecimento de redação final dos projetos aprovados. A análise orçamentária cabe à Comissão de Fiscalização Financeira e Orçamentária (CCFO); o julgamento de contas do Governador é competência da Assembleia com auxílio do TCE; a direção dos trabalhos em plenário é do Presidente (Mesa).", "analise": "As demais alternativas atribuem à CCJ competências de outros órgãos.", "ref": "Regimento Interno da ALEPA – comissões"}, {"id": "PL-013", "materia": "PL", "topico": "RIALEPA: CCFO e matérias orçamentárias", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Compete à Comissão de Fiscalização Financeira e Orçamentária (CCFO) da Assembleia Legislativa do Pará, em matéria orçamentária:", "alternativas": ["examinar e emitir parecer sobre os projetos de PPA, LDO e LOA, as emendas orçamentárias, os planos e programas de investimento e acompanhar a execução orçamentária, além de fiscalizar a aplicação de recursos públicos.", "promulgar a lei orçamentária.", "exercer o controle de constitucionalidade das leis.", "realizar inspeções em empresas privadas sem vinculação com recursos públicos.", "substituir o Tribunal de Contas em suas competências."], "correta": 0, "comentario": "Nos regimentos internos das casas legislativas, a Comissão de Fiscalização Financeira e Orçamentária (CCFO/CFO) — comissão permanente prevista no art. 166 da CF para o âmbito federal (comissão mista de planos, orçamentos públicos e fiscalização) — aprecia o PPA, a LDO e a LOA, examina emendas orçamentárias, acompanha a execução orçamentária e fiscaliza o uso de recursos públicos, auxiliando o Plenário na função de controle externo, sem substituir as competências do Tribunal de Contas.", "analise": "B) promulgação cabe ao Executivo (ou Presidente da Casa em casos de veto rejeitado). C) controle de constitucionalidade é matéria judicial/CCJ. D) e E) extrapolam competências.", "ref": "CF/88 art. 166; Regimento Interno da ALEPA – CCFO"}, {"id": "PL-014", "materia": "PL", "topico": "RIALEPA: Mesa Diretora e Presidência", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a Mesa Diretora da Assembleia Legislativa, é CORRETO afirmar que:", "alternativas": ["compete-lhe a direção dos trabalhos legislativos e dos serviços administrativos da Casa, com eleição dos seus membros pelos Deputados e vedada a recondução para o mesmo cargo na eleição imediatamente subsequente (art. 57, §4º, da CF, por simetria).", "é composta por membros nomeados pelo Governador do Estado.", "seus membros têm mandato vitalício até o fim da legislatura seguinte.", "não participa da elaboração da proposta orçamentária da Casa.", "suas decisões não podem ser recorridas ao Plenário."], "correta": 0, "comentario": "Art. 57, §4º, da CF: cada Casa do Congresso reunir-se-á em sessões preparatórias, a partir de 1º de fevereiro, no primeiro ano da legislatura, para a posse de seus membros e a eleição das respectivas Mesas, para mandato de 2 anos, VEDADA A RECONDUÇÃO para o mesmo cargo na eleição imediatamente subsequente (regra estendida às Mesas das assembleias legislativas, com base na simetria — aplicando-se, inclusive, a orientação firmada na ADI 7.745). A Mesa dirige os trabalhos legislativos e os serviços administrativos, elabora a proposta orçamentária da Casa (com o Presidente encaminhando após aprovação do Plenário, no caso do Pará) e suas decisões são recorríveis ao Plenário.", "analise": "B) a eleição é interna. C) mandato de 2 anos. D) a Mesa participa da proposta orçamentária. E) cabe recurso ao Plenário conforme o Regimento.", "ref": "CF/88 art. 57, §4º; Constituição do Pará art. 86"}, {"id": "PL-015", "materia": "PL", "topico": "RIALEPA: sessões e deliberações", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre as sessões da Assembleia Legislativa, é CORRETO afirmar que:", "alternativas": ["as sessões ordinárias decorrem de previsão regimental e de calendário; as extraordinárias são convocadas na forma do Regimento; as solenes destinam-se a homenagens e efemérides, sem deliberação de matéria legislativa.", "as sessões solenes são as únicas com deliberação de projetos.", "as sessões extraordinárias não podem deliberar matéria legislativa.", "não existem sessões secretas no Regimento.", "as sessões ordinárias ocorrem apenas uma vez por ano."], "correta": 0, "comentario": "Cada Casa disciplina suas sessões no Regimento Interno: ordinárias (calendário regular para deliberação), extraordinárias (convocadas para matéria específica ou fora do horário regular), solenes (homenagens, efemérides, sem deliberação típica) e secretas (hipóteses excepcionais previstas no Regimento). A sessão legislativa ordinária abrange o período de 2 de fevereiro a 17 de julho e de 1º de agosto a 22 de dezembro (art. 57 da CF), com recessos e a vedação de pagamento de parcela indenizatória em caso de não deliberação.", "analise": "As demais alternativas contrariam a organização regimental das sessões.", "ref": "CF/88 art. 57; Regimento Interno da ALEPA – sessões"}, {"id": "PL-016", "materia": "PL", "topico": "RIALEPA: quóruns, turnos e regimes de tramitação", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre regimes de tramitação e urgência no processo legislativo, é CORRETO afirmar que:", "alternativas": ["o regime de urgência pode ser solicitado pelo Chefe do Executivo para projetos de sua iniciativa; os prazos previstos na Constituição (art. 64, §§1º a 4º, por simetria) são de até 45 dias em cada Casa, com sobrestamento das deliberações se não apreciado, salvo matérias com prazo próprio.", "a urgência depende de aprovação por unanimidade.", "o regime de urgência suprime a apreciação pelas comissões e a possibilidade de emendas.", "a urgência só existe no âmbito federal.", "a urgência transforma a lei ordinária em lei complementar."], "correta": 0, "comentario": "Art. 64 da CF: a discussão e votação dos projetos de lei de iniciativa do Presidente da República, do STF e dos Tribunais Superiores terão início na Câmara dos Deputados. O Presidente pode solicitar URGÊNCIA para a apreciação; se a Casa não se manifestar em até 45 dias, a proposição sobrestará a deliberação legislativa (exceto matérias com prazo constitucional próprio). Na esfera estadual, o Governador exerce a mesma prerrogativa, nos termos da Constituição Estadual e do Regimento Interno. A urgência NÃO elimina pareceres, emendas nem quóruns — apenas altera prazos e prioridades de tramitação.", "analise": "B) não exige unanimidade. C) a urgência não suprime a tramitação nas comissões nem o direito de emenda. D) existe em todos os planos. E) não altera a espécie normativa.", "ref": "CF/88 art. 64"}, {"id": "PL-017", "materia": "PL", "topico": "RIALEPA: urgência, prioridade, preferência, destaque e prejudicialidade", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No jargão do processo legislativo, a 'prejudicialidade' de uma proposição ocorre quando:", "alternativas": ["a matéria perde o objeto ou é superada por outra já aprovada, ou ainda quando já esgotado o prazo, deixando de ser conhecida; pode ser arguida em parecer ou declarada pelo Presidente.", "a proposição é objeto de destaque para votação em separado.", "a proposição recebe substitutivo da comissão.", "a proposição é aprovada em primeiro turno.", "a proposição é objeto de requerimento de retirada de pauta."], "correta": 0, "comentario": "Prejudicialidade: incidente pelo qual a proposição se torna inútil por perda de objeto (aprovação de proposição idêntica, superveniência de legislação, perda de prazo, desaparecimento do fato). Diferentes institutos: DESTAQUE (votação em separado de parte do projeto), SUBSTITUTIVO (nova redação oferecida por comissão), RETIRADA DE PAUTA (requerimento para retirar da ordem do dia), PREFERÊNCIA (prioridade de votação de uma proposição sobre outra), URGÊNCIA (alteração de prazos).", "analise": "As demais opções descrevem institutos distintos.", "ref": "Processo legislativo – incidentes"}, {"id": "PL-018", "materia": "PL", "topico": "Processo de emendas: espécies, titularidade, objeto e momento", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre as emendas parlamentares, é CORRETO afirmar que:", "alternativas": ["as emendas podem ser supressivas, aditivas, modificativas (ou substitutivas), aglutinativas e de redação, e devem guardar pertinência temática com a proposição original.", "a emenda de redação altera substancialmente o mérito da proposição.", "a emenda aglutinativa suprime dispositivos.", "não é admitida emenda em comissões.", "a emenda supressiva acrescenta dispositivos."], "correta": 0, "comentario": "Classificação das emendas: SUPRESSIVA (elimina dispositivo), ADITIVA (acrescenta), MODIFICATIVA (altera o teor), SUBSTITUTIVA (substitui integralmente o texto de parte/artigo), AGLUTINATIVA (resulta da fusão de outras proposições/emendas para apresentar texto comum), de REDAÇÃO (destina-se à correção de erros de forma, não altera o mérito) e de RELATOR/DESTAQUE. É essencial a pertinência temática (admissibilidade), sob pena de emenda estranha ao objeto.", "analise": "B, C, D e E trocam os conceitos (a emenda de redação não altera o mérito; a aglutinativa funde textos; as comissões podem apresentar emendas; a supressiva retira dispositivos).", "ref": "Processo legislativo – emendas"}, {"id": "PL-019", "materia": "PL", "topico": "RIALEPA: discussão, votação, redação final e autógrafos", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre as etapas finais da tramitação de um projeto de lei na Casa Legislativa, é CORRETO afirmar que:", "alternativas": ["aprovada a proposição, elabora-se a redação final (com correção de técnica legislativa), seguindo os autógrafos — o documento oficial assinado pela Mesa que materializa o texto aprovado — para subsequente envio ao Chefe do Executivo para sanção.", "o autógrafo é o texto sancionado pelo Governador.", "a redação final pode alterar o mérito da proposição aprovada.", "a redação final é elaborada pelo Governador.", "os autógrafos são dispensáveis quando a votação é simbólica."], "correta": 0, "comentario": "Após a votação em plenário, o projeto aprovado recebe REDAÇÃO FINAL (normalmente pela comissão de constituição e justiça e redação), com correção de linguagem e técnica legislativa, sem alteração de mérito. Os AUTÓGRAFOS constituem o documento oficial do texto aprovado, assinado pelo Presidente da Casa, que é encaminhado ao Chefe do Executivo para SANÇÃO/VETO. Sancionado, segue a promulgação e a publicação, tornando-se lei.", "analise": "B) autógrafo é o texto APROVADO, pré-sanção. C) a redação final não altera mérito. D) é tarefa interna da Casa. E) os autógrafos são exigíveis.", "ref": "Processo legislativo – autógrafos e redação final"}, {"id": "PL-020", "materia": "PL", "topico": "Técnica legislativa: LC nº 95/1998 – estrutura", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Segundo a LC nº 95/1998, a lei será estruturada em três partes básicas:", "alternativas": ["parte preliminar (epígrafe, ementa, preâmbulo, enunciado do objeto e âmbito de aplicação), parte normativa (normas de conteúdo substantivo) e parte final (medidas de implementação, disposições transitórias e cláusulas finais).", "introdução, desenvolvimento e conclusão.", "exposição de motivos, texto e anexos.", "preâmbulo, articulado e assinaturas.", "ementa, vigência e revogação."], "correta": 0, "comentario": "Art. 3º da LC nº 95/1998: 'A lei será estruturada em três partes básicas: I — parte preliminar, compreendendo a epígrafe, a ementa, o preâmbulo, o enunciado do objeto e a indicação do âmbito de aplicação das disposições normativas; II — parte normativa, compreendendo o texto das normas de conteúdo substantivo relacionadas com a matéria regulada; III — parte final, compreendendo as disposições pertinentes às medidas necessárias à implementação das normas de conteúdo substantivo, às disposições transitórias, se for o caso, e texto das cláusulas finais'.", "analise": "As demais alternativas descrevem estruturas genéricas ou elementos isolados.", "ref": "LC nº 95/1998, art. 3º"}, {"id": "PL-021", "materia": "PL", "topico": "Técnica legislativa: LC nº 95/1998 – redação", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a técnica de elaboração normativa da LC nº 95/1998, é CORRETO afirmar que:", "alternativas": ["a lei não conterá matéria estranha a seu objeto ou a este não vinculada por afinidade, pertinência ou conexão; a vigência será indicada de forma expressa, e a cláusula de revogação deverá enumerar expressamente as leis ou disposições revogadas, vedadas as revogações genéricas.", "a lei pode dispor sobre qualquer matéria, ainda que estranha ao seu objeto.", "a vigência pode ser presumida, dispensando indicação expressa.", "é admissível a cláusula 'revogam-se as disposições em contrário'.", "a numeração dos artigos pode ser alterada livremente nas alterações."], "correta": 0, "comentario": "Art. 7º: 'A lei não conterá matéria estranha a seu objeto ou a este não vinculada por afinidade, pertinência ou conexão'. Art. 8º: a vigência será indicada de forma expressa e de modo a contemplar prazo razoável para que dela se tenha amplo conhecimento, reservando-se a cláusula 'entra em vigor na data de sua publicação' para leis de pequena repercussão. Art. 9º: a cláusula de revogação deverá ENUMERAR, EXPRESSAMENTE, as leis ou disposições legais revogadas — o que veda as revogações genéricas ('revogam-se as disposições em contrário'). Na alteração de leis, a numeração original é mantida, usando-se letras (art. 12, III) e a sigla (NR) para indicar nova redação.", "analise": "As demais alternativas contrariam expressamente a LC nº 95/1998.", "ref": "LC nº 95/1998, arts. 7º a 12"}, {"id": "PL-022", "materia": "PL", "topico": "Técnica legislativa: LC nº 95/1998 – alteração e consolidação", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A alteração de uma lei, segundo a LC nº 95/1998, deve observar:", "alternativas": ["a utilização de nova redação, revogação ou acréscimo de dispositivos, mantida a estrutura e a numeração da lei alterada, com indicação de nova redação por meio da sigla (NR) ao final do dispositivo alterado.", "a renumeração completa dos artigos da lei alterada.", "a revogação integral da lei alterada em todos os casos.", "a substituição da ementa da lei original obrigatoriamente.", "a edição de medida provisória para qualquer alteração."], "correta": 0, "comentario": "Art. 12 da LC nº 95/1998: 'A alteração da lei será feita: I — mediante reprodução integral em novo texto, quando se tratar de alteração considerável; II — mediante revogação parcial; III — nos demais casos, por substituição de dispositivo (nova redação) ou acréscimo'. §1º: 'A numeração das leis será mantida, com o acréscimo de letras maiúsculas (A, B, C) ... nas unidades novas'. §3º: 'Ao dispositivo alterado será acrescida a sigla (NR)' (nova redação). A consolidação (arts. 13 a 17) reúne em um único diploma todas as normas sobre a mesma matéria, com a estrutura e a numeração preservadas quando possível.", "analise": "As demais alternativas contrariam a técnica legal (renumeração, revogação integral, MP).", "ref": "LC nº 95/1998, arts. 12 a 17"}, {"id": "PL-023", "materia": "PL", "topico": "Técnica legislativa: LC nº 95/1998 – vigência", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Segundo a Lei de Introdução às Normas do Direito Brasileiro (LINDB), salvo disposição contrária, a lei começa a vigorar em todo o país:", "alternativas": ["45 dias depois de oficialmente publicada, ficando a cláusula 'entra em vigor na data de sua publicação' reservada, pela técnica legislativa, para leis de pequena repercussão.", "imediatamente, em qualquer hipótese.", "após 1 ano, sempre.", "após aprovação do Tribunal de Contas.", "somente após regulamento do Executivo."], "correta": 0, "comentario": "Art. 1º da LINDB (Decreto-Lei nº 4.657/1942): 'Salvo disposição contrária, a lei começa a vigorar em todo o país quarenta e cinco dias depois de oficialmente publicada'. Nos Estados, o prazo é de 30 dias (para leis estaduais), e, nos Municípios, 15 dias depois de publicadas (art. 1º e §1º, aplicação analógica consolidada). A LC nº 95/1998 (art. 8º) exige que a vigência seja indicada de forma expressa e com prazo razoável de conhecimento, reservando a cláusula de vigência imediata às leis de pequena repercussão.", "analise": "As demais alternativas contrariam o art. 1º da LINDB e a LC nº 95/1998.", "ref": "LINDB art. 1º; LC nº 95/1998, art. 8º"}, {"id": "PL-024", "materia": "PL", "topico": "RIALEPA: PPA, LDO e LOA e emendas orçamentárias", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o processo legislativo orçamentário, é CORRETO afirmar que:", "alternativas": ["o projeto da LOA é de iniciativa privativa do Chefe do Executivo e as emendas parlamentares devem ser compatíveis com o PPA e a LDO, indicar os recursos correspondentes (inclusive provenientes de anulação de despesa) e não podem contrariar o projeto original no que se refere a despesas de pessoal, serviços da dívida, transferências vinculadas e dotação para investimentos plurianuais.", "as emendas parlamentares podem criar despesas sem indicação de recursos.", "a LOA é de iniciativa da Assembleia Legislativa.", "o PPA tem vigência mensal.", "a LDO é dispensável quando há superávit."], "correta": 0, "comentario": "Art. 165, I a III, e art. 166 da CF: o PPA, a LDO e a LOA são de iniciativa do Chefe do Executivo. As emendas parlamentares (art. 166, §3º) devem ser compatíveis com o PPA e a LDO, indicar os recursos necessários (admitidos os provenientes de anulação de despesas, excluídas as que incidem sobre pessoal e encargos, serviços da dívida, transferências constitucionais obrigatórias e dotação para investimentos plurianuais em andamento) e demonstrar pertinência. As emendas de despesa somente podem ser aprovadas com a indicação de recursos. No âmbito estadual, a CCFO exerce o papel de comissão de mérito orçamentário.", "analise": "As demais opções negam requisitos constitucionais expressos.", "ref": "CF/88 arts. 165 e 166"}, {"id": "PL-025", "materia": "PL", "topico": "RIALEPA: prestação de contas e controle financeiro", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a fiscalização financeira e orçamentária exercida pela Assembleia Legislativa, é CORRETO afirmar que:", "alternativas": ["a Assembleia aprecia as contas do Governador mediante parecer prévio do Tribunal de Contas, exercendo o controle externo com o auxílio do TCE, podendo sustar atos normativos e fiscalizar a aplicação de recursos públicos.", "as contas do Governador são julgadas exclusivamente pelo TCE, sem participação da Assembleia.", "a Assembleia julga contas apenas em anos eleitorais.", "o controle externo estadual dispensa o auxílio do TCE.", "a prestação de contas do Governador é facultativa."], "correta": 0, "comentario": "Nos termos dos arts. 70 e 71 da CF (aplicáveis aos Estados por simetria), o controle externo é exercido pelo Poder Legislativo (Assembleia) com o auxílio do Tribunal de Contas. Compete ao Poder Legislativo apreciar as contas do Chefe do Executivo, mediante parecer prévio do TCE, que deve ser elaborado no prazo de 60 dias a contar do recebimento das contas (art. 71, I, e art. 56 da LRF). O julgamento definitivo cabe ao Legislativo, com o registro pelo TCE das contas de gestão dos demais administradores.", "analise": "B) a Assembleia julga, com parecer prévio do TCE. C) obrigação anual. D) o auxílio do TCE é constitucional. E) prestação de contas é obrigatória (art. 70, parágrafo único).", "ref": "CF/88 arts. 70 a 75"}, {"id": "PL-026", "materia": "PL", "topico": "LC nº 95/1998 – ementa, preâmbulo e epígrafe", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Na estrutura da lei, a ementa:", "alternativas": ["é a síntese do conteúdo da lei, grafada de modo a explicitar, de forma concisa, o objeto da norma.", "é o texto que anuncia a promulgação pelo Chefe do Executivo.", "corresponde à numeração da lei.", "é a designação oficial do diploma legal (ex.: Lei nº 14.133).", "é o dispositivo que indica a vigência."], "correta": 0, "comentario": "Na parte preliminar prevista na LC nº 95/1998: EPÍGRAFE é a designação do diploma legal (ex.: 'Lei nº 14.133, de 1º de abril de 2021'); EMENTA é a síntese do objeto, elaborada de forma concisa e sob a forma de título; PREÂMBULO é a parte que enuncia a autoridade que promulga ('O PRESIDENTE DA REPÚBLICA, Faço saber que o Congresso Nacional decreta e eu sanciono a seguinte Lei:'), e o enunciado do objeto e do âmbito de aplicação normalmente aparece no art. 1º.", "analise": "As demais alternativas confundem os elementos da parte preliminar.", "ref": "LC nº 95/1998, arts. 3º e 4º"}, {"id": "PL-027", "materia": "PL", "topico": "Mandato parlamentar", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o mandato parlamentar no Brasil, é CORRETO afirmar que:", "alternativas": ["o mandato de Deputado Federal e de Deputado Estadual é de 4 anos, compatível com a legislatura, e sua perda se dá nas hipóteses do art. 55 da CF (entre elas, infringir as proibições do art. 54 e quebra de decoro), mediante decisão da Casa ou do Supremo Tribunal Federal, conforme o caso.", "o mandato é de 8 anos.", "não há hipóteses de perda de mandato.", "as hipóteses de perda de mandato dependem exclusivamente do Poder Judiciário.", "o mandato parlamentar é vitalício."], "correta": 0, "comentario": "CF/88: art. 45 (mandato de 4 anos para deputados federais), aplicável aos deputados estaduais (art. 27) — a legislatura tem a duração de 4 anos. Perda do mandato (art. 55): infringimento das proibições do art. 54; conduta incompatível com o decoro; falta de comparecimento a 1/3 das sessões por legislatura; perda ou suspensão dos direitos políticos; condenação criminal em sentença transitada em julgado; decretação de medida de segurança — decidido pela Casa, em escrutínio secreto, salvo nos casos de cassação por decisão do STF (art. 55, §2º e §3º, com o §3º após a EC 111/2021: revogação, suspensão ou perda do mandato nas hipóteses de condenação por crimes).", "analise": "B, C, D e E contrariam o regime constitucional.", "ref": "CF/88 arts. 27, 45, 54 e 55"}, {"id": "PL-028", "materia": "PL", "topico": "RIALEPA: assessoramento legislativo e proposições internas", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Entre as proposições e instrumentos internos do processo legislativo, NÃO é espécie normativa:", "alternativas": ["indicação", "decreto legislativo", "resolução", "requerimento", "lei complementar"], "correta": 0, "comentario": "A indicação é proposição interna mediante a qual o parlamentar sugere providência a outro órgão/autoridade (ex.: indicação ao Executivo para realização de obra), sem conteúdo normativo — por isso não é espécie normativa. As demais são espécies ou instrumentos com força normativa: decreto legislativo e resolução são espécies do art. 59 da CF; requerimento é proposição interna destinada a produzir efeitos regimentais (destaques, audiências, licenças) e a lei complementar é espécie normativa (art. 59, II).", "analise": "A pergunta pede o item que NÃO é espécie normativa — a indicação é justamente a única sem caráter normativo.", "ref": "Regimento Interno da ALEPA; CF/88 art. 59"}, {"id": "PL-029", "materia": "PL", "topico": "Fases da elaboração legislativa e deliberação em comissões", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a apreciação terminativa pelas comissões (art. 58, §2º, I, da CF), é CORRETO afirmar que:", "alternativas": ["dispensa a competência do Plenário para votar projeto de lei, salvo se houver recurso de um décimo dos membros da Casa, e a matéria rejeitada nas comissões é arquivada, cabendo recurso ao Plenário na forma regimental.", "impede qualquer recurso ao Plenário.", "só se aplica a projetos de lei complementar.", "depende de autorização expressa do Chefe do Executivo.", "é vedada pela CF em todas as hipóteses."], "correta": 0, "comentario": "Art. 58, §2º, I, 'a' e 'b', da CF: às comissões cabe, em razão da matéria de sua competência, discutir e votar projeto de lei que dispensar, na forma do regimento, a competência do Plenário, salvo se houver recurso de um décimo dos membros da Casa; e, à comissão que tiver terminado seus trabalhos, cabem também a fiscalização, a tomada de contas e a apreciação de relatórios. A EC 32/2001 (art. 58, §5º) disciplinou a apreciação terminativa das medidas provisórias, vedando-as em matérias específicas (nacionalidade, cidadania, direitos políticos, direito eleitoral, direito penal, processual civil e penal, organização do Judiciário e do MP, matéria reservada a lei complementar, planos plurianuais, diretrizes orçamentárias, orçamento e créditos adicionais — a MP não pode versar sobre essas matérias).", "analise": "B) o recurso de 1/10 é garantido. C) aplica-se a variadas matérias. D) não depende do Executivo. E) é prevista expressamente na CF.", "ref": "CF/88 art. 58, §§2º e 5º; art. 62"}, {"id": "PL-030", "materia": "PL", "topico": "Técnica legislativa e processo legislativo: integração", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Um assessor legislativo é incumbido de revisar a técnica legislativa de um projeto que altera a Lei estadual nº 5.810/1994. Conforme a LC nº 95/1998, a alteração deve:", "alternativas": ["indicar expressamente o dispositivo alterado, manter a numeração original da lei alterada, acrescer letras quando criar dispositivos novos e finalizar o dispositivo alterado com a sigla (NR).", "renumerar todos os artigos da lei alterada.", "utilizar a expressão 'revogam-se as disposições em contrário' como cláusula geral.", "inserir a alteração sem indicar o dispositivo de destino.", "ser feita por decreto, dado o caráter administrativo da matéria."], "correta": 0, "comentario": "Aplicação combinada dos arts. 11 e 12 da LC nº 95/1998: as alterações são feitas por substituição de dispositivo, com indicação do dispositivo alterado, preservada a numeração da lei original (acréscimos com letras maiúsculas) e com a sigla (NR) ao final. Revogações devem ser expressas e enumeradas (art. 9º); a renumeração é vedada. Alteração de lei formal exige lei (não cabe decreto).", "analise": "As demais alternativas representam vícios de técnica legislativa expressamente vedados.", "ref": "LC nº 95/1998, arts. 9º, 11 e 12"}, {"id": "DF-001", "materia": "DF", "topico": "Lei Complementar nº 101/2000 (LRF): responsabilidade fiscal", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A Lei de Responsabilidade Fiscal (LC nº 101/2000) estabelece normas de finanças públicas voltadas para:", "alternativas": ["a responsabilidade na gestão fiscal, mediante ação planejada e transparente em que se previnem riscos e corrigem desvios capazes de afetar o equilíbrio das contas públicas.", "a criação de tributos estaduais.", "a organização do Poder Judiciário.", "o regime jurídico dos servidores públicos.", "a licitação de obras públicas."], "correta": 0, "comentario": "Art. 1º, §1º, da LRF: 'A responsabilidade na gestão fiscal pressupõe a ação planejada e transparente, em que se previnem riscos e corrigem desvios capazes de afetar o equilíbrio das contas públicas, mediante o cumprimento de metas de resultados entre receitas e despesas e a obediência a limites e condições no que tange a renúncia de receita, geração de despesas com pessoal, da seguridade social e outras, dívidas consolidada e mobiliária, operações de crédito, inclusive por antecipação de receita, concessão de garantia e inscrição em Restos a Pagar'. Abrange todos os Poderes, incluindo o Legislativo (e o Tribunal de Contas) e as administrações diretas, fundos, autarquias, fundações e empresas dependentes.", "analise": "As demais opções tratam de matérias alheias à LRF.", "ref": "LC nº 101/2000, art. 1º"}, {"id": "DF-002", "materia": "DF", "topico": "LRF – transparência e relatórios", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Segundo a LRF, os relatórios de acompanhamento da gestão fiscal são:", "alternativas": ["o Relatório Resumido da Execução Orçamentária (RREO), publicado a cada bimestre, e o Relatório de Gestão Fiscal (RGF), elaborado ao final de cada quadrimestre (e semestralmente no último ano de mandato).", "apenas o balanço patrimonial anual.", "o relatório de licitações da Casa Legislativa.", "o plano plurianual e a lei de diretrizes orçamentárias.", "apenas o relatório de auditoria do Tribunal de Contas."], "correta": 0, "comentario": "A LRF exige duas peças de transparência: RREO (art. 52 — Relatório Resumido da Execução Orçamentária, publicado a cada bimestre, contendo o balanço orçamentário e demonstrativos da execução de receitas e despesas; prazo de publicação: até 30 dias após o encerramento de cada bimestre) e RGF (art. 54 — Relatório de Gestão Fiscal, ao final de cada QUADRIMESTRE, e, no último ano de mandato, ao final de cada SEMESTRE, contendo comparativos de despesa total com pessoal, dívida consolidada, garantias e operações de crédito; prazo: 30 dias após o encerramento do período). Os dados são divulgados em meio eletrônico de amplo acesso público.", "analise": "As demais opções não correspondem aos relatórios legalmente previstos.", "ref": "LC nº 101/2000, arts. 52 a 55"}, {"id": "DF-003", "materia": "DF", "topico": "LRF – despesa com pessoal", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Na esfera estadual, o limite total de despesa com pessoal é de 60% da Receita Corrente Líquida, distribuído:", "alternativas": ["49% para o Executivo, 3% para o Legislativo (incluído o Tribunal de Contas), 6% para o Judiciário e 2% para o Ministério Público.", "60% integralmente para o Poder Executivo.", "50% para o Legislativo e 10% para o Executivo.", "40% para o Executivo e 20% para o Judiciário.", "35% para o Executivo e 25% para o Legislativo."], "correta": 0, "comentario": "Art. 20, II, da LRF: no âmbito dos Estados e do DF, a repartição do limite de 60% da Receita Corrente Líquida é: 3% para o Poder Legislativo (incluído o Tribunal de Contas), 6% para o Poder Judiciário, 49% para o Poder Executivo e 2% para o Ministério Público. (Na esfera municipal: 6% Legislativo e 54% Executivo. Na União: 2,5% Legislativo, 6% Judiciário, 40,9% Executivo e 0,6% MP.) Excedido o limite, o Poder deve eliminar o excesso em 2 quadrimestres, sendo pelo menos 1/3 no primeiro. O descumprimento gera sanções institucionais (art. 23, §§ 1º a 5º), como suspensão de transferências voluntárias e de operações de crédito.", "analise": "As demais alternativas contrariam os percentuais legais.", "ref": "LC nº 101/2000, arts. 19, 20 e 23"}, {"id": "DF-004", "materia": "DF", "topico": "LRF – renúncia de receita e despesa obrigatória continuada", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a renúncia de receita na LRF, é CORRETO afirmar que:", "alternativas": ["deve estar acompanhada de estimativa do impacto orçamentário-financeiro no exercício em que deva iniciar sua vigência e nos dois seguintes, e atender a pelo menos uma das condições: demonstração de que a renúncia foi considerada na estimativa da receita da LOA e de que não afetará as metas fiscais, ou adoção de medidas de compensação no período.", "pode ser concedida livremente pelo gestor, sem estudo de impacto.", "é vedada em qualquer hipótese.", "depende de autorização do Tribunal de Contas.", "só pode ocorrer no último ano de mandato."], "correta": 0, "comentario": "Art. 14 da LRF: a concessão ou ampliação de incentivo ou benefício de natureza tributária da qual decorra RENÚNCIA DE RECEITA deve estar acompanhada de estimativa do impacto orçamentário-financeiro no exercício em que deva iniciar sua vigência e nos dois seguintes, atender ao disposto na LDO e a pelo menos uma das seguintes condições: I — demonstração pelo proponente de que a renúncia foi considerada na estimativa de receita da LOA e de que não afetará as metas de resultados fiscais; II — estar acompanhada de medidas de compensação, no período mencionado, por meio do aumento de receita (elevação de alíquotas, ampliação da base de cálculo, criação ou majoração de tributo ou contribuição).", "analise": "As demais opções negam os requisitos legais.", "ref": "LC nº 101/2000, art. 14"}, {"id": "DF-005", "materia": "DF", "topico": "LRF – vedações no fim de mandato e restos a pagar", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Nos dois últimos quadrimestres do último ano do mandato, a LRF veda ao titular do Poder:", "alternativas": ["assumir obrigação de despesa que não possa ser cumprida integralmente dentro dele, ou que tenha parcelas a serem pagas no exercício seguinte sem que haja suficiente disponibilidade de caixa (art. 42).", "qualquer nomeação de servidor concursado.", "a realização de licitações.", "o pagamento de precatórios.", "a publicação de balanços."], "correta": 0, "comentario": "Art. 42 da LRF (regra de ouro do fim de mandato): 'É vedado ao titular de Poder ou órgão referido no art. 20, nos últimos dois quadrimestres do seu mandato, contrair obrigação de despesa que não possa ser cumprida integralmente dentro dele, ou que tenha parcelas a serem pagas no exercício seguinte sem que haja suficiente disponibilidade de caixa para este efeito'. Complementam-se: art. 38 (limitação de empenho e movimentação financeira) e a vedação de operações de crédito por antecipação de receita orçamentária (ARO) no último ano de mandato (art. 38, IV, 'b', incluído pela LC 148/2014).", "analise": "As demais opções não correspondem às vedações legalmente previstas.", "ref": "LC nº 101/2000, arts. 38 e 42"}, {"id": "DF-006", "materia": "DF", "topico": "Lei nº 4.320/1964: orçamentos e balanços", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Segundo a Lei nº 4.320/1964, a lei do orçamento conterá a discriminação da receita e da despesa de modo a evidenciar a política econômico-financeira e o programa de trabalho do Governo, obedecidos os princípios de:", "alternativas": ["unidade, universalidade e anualidade.", "legalidade penal e anterioridade.", "competência e prudência.", "autonomia e especialização.", "continuidade e autotutela."], "correta": 0, "comentario": "Art. 2º da Lei nº 4.320/1964: 'A Lei do Orçamento conterá a discriminação da receita e despesa de forma a evidenciar a política econômica financeira e o programa de trabalho do Governo, obedecidos os princípios de UNIDADE, UNIVERSALIDADE e ANUALIDADE'. A doutrina acrescenta: legalidade, exclusividade, especificação/discriminação, não afetação de impostos (art. 167, IV, CF), publicidade, clareza, equilíbrio e orçamento bruto.", "analise": "As demais alternativas trazem princípios de outros ramos (penal, contábil, administrativo).", "ref": "Lei nº 4.320/1964, art. 2º"}, {"id": "DF-007", "materia": "DF", "topico": "Lei nº 4.320/1964: estágios da despesa", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São estágios da despesa pública, na ordem:", "alternativas": ["fixação, empenho, liquidação e pagamento", "previsão, lançamento, arrecadação e recolhimento", "programação, execução e avaliação", "empenho, arrecadação e quitação", "liquidação, empenho e pagamento"], "correta": 0, "comentario": "Estágios da DESPESA: (1) fixação (dotação consignada na lei orçamentária); (2) EMPENHO (art. 58 da Lei nº 4.320/1964): ato emanado de autoridade competente que cria para o Estado obrigação de pagamento pendente ou não de implemento de condição; (3) LIQUIDAÇÃO (art. 63): verificação do direito adquirido pelo credor, com base nos títulos e documentos comprobatórios do respectivo crédito (finalidade, regularidade e liquidação de valores); (4) PAGAMENTO (art. 64): entrega do valor ao credor. Os estágios da RECEITA são: previsão, lançamento, arrecadação e recolhimento — não confundir!", "analise": "A opção B traz os estágios da receita; as demais misturam fases.", "ref": "Lei nº 4.320/1964, arts. 58 a 64"}, {"id": "DF-008", "materia": "DF", "topico": "Lei nº 4.320/1964: créditos adicionais", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São espécies de créditos adicionais previstos na Lei nº 4.320/1964:", "alternativas": ["suplementares (reforço de dotação), especiais (despesa não prevista inicialmente) e extraordinários (despesas imprevisíveis e urgentes, como guerra, comoção interna ou calamidade pública)", "ordinários, extraordinários e permanentes", "iniciais, finais e complementares", "legais, judiciais e convencionais", "correntes, de capital e de custeio"], "correta": 0, "comentario": "Art. 41 da Lei nº 4.320/1964: os créditos adicionais classificam-se em: I — SUPLEMENTARES, os destinados a reforço de dotação orçamentária; II — ESPECIAIS, os destinados a despesas para as quais não haja dotação orçamentária específica; III — EXTRAORDINÁRIOS, os destinados a despesas urgentes e imprevisíveis, em caso de guerra, comoção intestina ou calamidade pública. Os suplementares e especiais dependem de autorização legislativa (abertura por decreto do Executivo, com prévia autorização); os extraordinários são abertos por DECRETO, com imediata comunicação ao Legislativo (art. 167, §3º, CF).", "analise": "As demais alternativas não correspondem às espécies legais.", "ref": "Lei nº 4.320/1964, arts. 40 a 46"}, {"id": "DF-009", "materia": "DF", "topico": "Orçamento público na CF (arts. 165 a 169)", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Compreendem a lei orçamentária anual (LOA), nos termos do art. 165, §5º, da CF:", "alternativas": ["o orçamento fiscal, o orçamento de investimento das empresas estatais e o orçamento da seguridade social", "apenas o orçamento fiscal", "o orçamento fiscal e o orçamento de custeio", "o plano plurianual e a lei de diretrizes orçamentárias", "apenas o orçamento da seguridade social"], "correta": 0, "comentario": "Art. 165, §5º: a LOA compreenderá: I — o orçamento fiscal referente aos Poderes da União, seus fundos, órgãos e entidades da administração direta e indireta, inclusive fundações instituídas e mantidas pelo Poder Público; II — o orçamento de INVESTIMENTO das empresas em que a União, direta ou indiretamente, detenha a maioria do capital social com direito a voto; III — o orçamento da SEGURIDADE SOCIAL, abrangendo todas as entidades e órgãos a ela vinculados, da administração direta ou indireta, bem como os fundos e fundações instituídos e mantidos pelo Poder Público. O PPA e a LDO são leis distintas.", "analise": "As demais alternativas restringem ou confundem os orçamentos que compõem a LOA.", "ref": "CF/88 art. 165, §5º"}, {"id": "DF-010", "materia": "DF", "topico": "PPA, LDO e LOA", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A Lei de Diretrizes Orçamentárias (LDO) compreenderá, entre outros conteúdos:", "alternativas": ["as metas e prioridades da administração pública, a orientação para a elaboração da LOA, as alterações na legislação tributária e o estabelecimento da política de aplicação das agências financeiras oficiais de fomento.", "a previsão de receitas e a fixação de despesas para o exercício.", "o plano de investimentos de 20 anos.", "a estrutura dos cargos em comissão.", "o regime disciplinar dos servidores."], "correta": 0, "comentario": "Art. 165, §2º, da CF: 'A lei de diretrizes orçamentárias compreenderá as metas e prioridades da administração pública federal, estabelecerá as diretrizes de política fiscal e respectivas metas, em consonância com trajetória sustentável da dívida pública, orientará a elaboração da lei orçamentária anual, disporá sobre as alterações na legislação tributária e estabelecerá a política de aplicação das agências financeiras oficiais de fomento'. O PPA (art. 165, §1º) estabelece, de forma regionalizada, diretrizes, objetivos e metas da administração para as despesas de capital e outras delas decorrentes e para as relativas aos programas de duração continuada.", "analise": "B) previsão de receitas e fixação de despesas é a LOA. As demais opções tratam de matérias estranhas ao instrumento.", "ref": "CF/88 art. 165, §§1º e 2º"}, {"id": "DF-011", "materia": "DF", "topico": "Orçamento público na CF – limitações", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "É VEDADO pela Constituição (art. 167):", "alternativas": ["o início de programas ou projetos não incluídos na lei orçamentária anual, a realização de despesas ou assunção de obrigações diretas que excedam os créditos orçamentários e a utilização de recursos dos orçamentos fiscal e da seguridade social para suprir necessidades de empresas com fins lucrativos.", "a abertura de créditos suplementares com autorização legislativa.", "a vinculação de receita de impostos para a educação.", "a realização de operações de crédito para despesas de capital.", "o pagamento de precatórios judiciais."], "correta": 0, "comentario": "Art. 167 da CF veda, entre outras condutas: I — o início de programas ou projetos não incluídos na LOA; II — a realização de despesas ou a assunção de obrigações diretas que excedam os créditos orçamentários ou adicionais; III — a realização de operações de créditos que excedam o montante das despesas de capital (regra de ouro), ressalvadas as autorizadas por créditos suplementares ou especiais com finalidade precisa, aprovados por maioria absoluta; IV — a vinculação de receita de impostos a órgão, fundo ou despesa, ressalvadas as exceções constitucionais (saúde, educação, administração tributária, garantias às operações de crédito por antecipação de receita e prestação de garantias); V — a abertura de crédito suplementar ou especial sem prévia autorização legislativa e sem indicação dos recursos correspondentes; VI — a transposição, o remanejamento ou a transferência de recursos de uma categoria de programação para outra ou de um órgão para outro, sem prévia autorização legislativa; VIII — a utilização, sem autorização legislativa específica, de recursos dos orçamentos fiscal e da seguridade social para suprir necessidades ou cobrir déficits de empresas, inclusive de sociedades de economia mista.", "analise": "As demais opções descrevem condutas permitidas ou previstas na CF.", "ref": "CF/88 art. 167"}, {"id": "DF-012", "materia": "DF", "topico": "PPA, LDO e LOA: ciclo e prazos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o ciclo orçamentário, é CORRETO afirmar que:", "alternativas": ["compreende a elaboração, a discussão/aprovação, a execução e a avaliação/controle, abrangendo o PPA, a LDO e a LOA, com prazos fixados na Constituição e nas constituições estaduais; o PPA tem duração de 4 anos e vigora do segundo ano do mandato até o primeiro do seguinte.", "extingue-se com a sanção da LOA.", "dispensa a fase de avaliação.", "tem duração de 10 anos, sempre.", "depende exclusivamente da União, em qualquer ente federativo."], "correta": 0, "comentario": "O ciclo orçamentário compreende: elaboração (iniciativa do Executivo, com participação dos órgãos setoriais), discussão e aprovação (Poder Legislativo, com parecer da comissão competente e possibilidade de emendas nos termos do art. 166 da CF), execução (empenho, liquidação e pagamento, com programação financeira) e avaliação e controle (interno, externo e social). O PPA vigora por 4 anos, do início do segundo ano de mandato até o fim do primeiro ano do mandato seguinte (art. 35, §2º, do ADCT, na esfera federal). A LDO e a LOA são anuais.", "analise": "As demais opções contrariam o ciclo e as vigências constitucionais.", "ref": "CF/88 arts. 165 a 169; ADCT art. 35"}, {"id": "DPREV-001", "materia": "DPREV", "topico": "Seguridade social: conceito, organização e princípios", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A seguridade social compreende, nos termos do art. 194 da CF/88:", "alternativas": ["a saúde, a previdência social e a assistência social", "apenas a previdência social", "a educação, a saúde e a previdência", "a previdência e o seguro-desemprego", "a assistência social e o sistema único de saúde, apenas"], "correta": 0, "comentario": "Art. 194 da CF: 'A seguridade social compreende um conjunto integrado de ações de iniciativa dos Poderes Públicos e da sociedade, destinadas a assegurar os direitos relativos à SAÚDE, à PREVIDÊNCIA e à ASSISTÊNCIA SOCIAL'. É organizada por objetivos (universalidade da cobertura e do atendimento; uniformidade e equivalência dos benefícios às populações urbanas e rurais; seletividade e distributividade; irredutibilidade do valor dos benefícios; equidade na forma de participação no custeio; diversidade da base de financiamento; gestão quadripartite) e é financiada por toda a sociedade, de forma direta e indireta (art. 195).", "analise": "As demais alternativas restringem ou confundem os ramos da seguridade.", "ref": "CF/88 arts. 194 e 195"}, {"id": "DPREV-002", "materia": "DPREV", "topico": "Seguridade social: princípios e gestão", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "É princípio da seguridade social previsto no art. 194, parágrafo único, da CF/88:", "alternativas": ["uniformidade e equivalência dos benefícios e serviços às populações urbanas e rurais.", "irredutibilidade do valor dos salários de contribuição.", "anterioridade anual para a fixação dos benefícios.", "custeio exclusivo do Estado.", "gestão bipartite entre União e Estados."], "correta": 0, "comentario": "Objetivos/princípios do art. 194, parágrafo único: I — universalidade da cobertura e do atendimento; II — uniformidade e equivalência dos benefícios e serviços às populações urbanas e rurais; III — seletividade e distributividade na prestação dos benefícios e serviços; IV — irredutibilidade do valor dos benefícios; V — equidade na forma de participação no custeio; VI — diversidade da base de financiamento; VII — caráter democrático e descentralizado da administração, mediante gestão quadripartite, com participação dos trabalhadores, dos empregadores, dos aposentados e do Governo nos órgãos colegiados. O RGPS tem gestão quadripartite (e não bipartite) e o custeio é de toda a sociedade, de forma direta e indireta.", "analise": "B) a irredutibilidade é do valor dos benefícios. C) não existe essa regra para benefícios. D) custeio é tripartite/amplo. E) gestão quadripartite.", "ref": "CF/88 art. 194, parágrafo único"}, {"id": "DPREV-003", "materia": "DPREV", "topico": "Custeio da seguridade social: receitas e contribuições", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A seguridade social é financiada por recursos provenientes, entre outros, de:", "alternativas": ["contribuições sociais do empregador (incidentes sobre a folha de salários, a receita ou o faturamento e o lucro) e do trabalhador e demais segurados, além de receitas da União e da contribuição sobre a receita de concursos de prognósticos.", "apenas da contribuição do trabalhador.", "exclusivamente de impostos sobre a renda.", "do Imposto Territorial Rural.", "de doações voluntárias e taxas municipais."], "correta": 0, "comentario": "Art. 195 da CF: a seguridade social será financiada por toda a sociedade, mediante recursos provenientes dos orçamentos da União, dos Estados, do DF e dos Municípios e das contribuições sociais do EMPREGADOR, incidentes sobre a folha de salários e demais rendimentos do trabalho, a receita ou o faturamento e o lucro; do TRABALHADOR e demais segurados (exceto aposentados e pensionistas do RGPS sobre aposentadoria/pensão); da receita de CONCURSOS DE PROGNÓSTICOS; e do importador de bens e serviços do exterior (art. 195, §1º a §4º e art. 149, §1º, combinados).", "analise": "As demais opções restringem as fontes de custeio de forma incompatível com o art. 195.", "ref": "CF/88 art. 195"}, {"id": "DPREV-004", "materia": "DPREV", "topico": "Regime geral de previdência social: segurados e dependentes", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São segurados OBRIGATÓRIOS do Regime Geral de Previdência Social, entre outros:", "alternativas": ["empregado, empregado doméstico, contribuinte individual, trabalhador avulso e segurado especial", "apenas o empregado com carteira assinada", "somente servidores públicos efetivos", "estudantes universitários e desempregados", "apenas os maiores de 18 anos com renda superior a um salário mínimo"], "correta": 0, "comentario": "Art. 11 da Lei nº 8.213/1991: são segurados OBRIGATÓRIOS do RGPS: empregado (incluindo doméstico, temporário e aprendiz); contribuinte individual (autônomos, empresários, sócios, entre outros); trabalhador avulso; e segurado especial (produtor rural, seringueiro, pescador artesanal etc.). O SEGURADO FACULTATIVO é aquele que não exerce atividade remunerada vinculada obrigatoriamente ao RGPS (ex.: estudante, dona/dono de casa, quem deixa de ser obrigatório) e contribui por opção, com inscrição e contribuições próprias.", "analise": "As demais alternativas restringem indevidamente a categoria.", "ref": "Lei nº 8.213/1991, art. 11"}, {"id": "DPREV-005", "materia": "DPREV", "topico": "Dependentes e pensão por morte", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre os dependentes do segurado do RGPS, é CORRETO afirmar que:", "alternativas": ["a classe 1 (cônjuge, companheiro, filho menor de 21 anos ou inválido) tem preferência sobre as demais classes, e a dependência econômica das classes 2 (pais) e 3 (irmão menor de 21 anos ou inválido) deve ser comprovada.", "todos os dependentes concorrem em igualdade, independentemente da classe.", "a dependência do cônjuge precisa ser provada em qualquer caso.", "o filho maior de 21 anos é sempre dependente.", "a classe 3 tem preferência sobre a classe 1."], "correta": 0, "comentario": "Art. 16 da Lei nº 8.213/1991: classe 1 — cônjuge, companheiro(a) e filho (ou equiparado) menor de 21 anos ou inválido ou com deficiência (dependência PRESUMIDA); classe 2 — pais (dependência ECONÔMICA comprovada); classe 3 — irmão menor de 21 anos, inválido ou com deficiência (dependência econômica comprovada). A ordem de classes é excludente: a presença de dependente de classe anterior exclui os das classes posteriores. A pensão por morte (art. 74) exige, em regra, 18 contribuições mensais e 2 anos de casamento/união estável (regras da EC 103/2019 e Lei 13.846/2019), com cota familiar e duração variável conforme a idade do beneficiário.", "analise": "As demais alternativas contrariam a ordem de classes e as presunções legais.", "ref": "Lei nº 8.213/1991, art. 16 e art. 74"}, {"id": "DPREV-006", "materia": "DPREV", "topico": "Filiação, inscrição e carência", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre filiação, inscrição e carência no RGPS, é CORRETO afirmar que:", "alternativas": ["a filiação decorre automaticamente do exercício de atividade remunerada para os segurados obrigatórios; a inscrição é o ato administrativo de identificação do segurado; e a carência é o número mínimo de contribuições mensais necessárias para a concessão do benefício.", "a carência indica o tempo máximo de contribuições.", "a filiação depende de requerimento expresso de todos os segurados.", "a carência é irrelevante para a concessão de benefícios.", "a inscrição ocorre apenas no momento do primeiro benefício."], "correta": 0, "comentario": "Art. 20 do Decreto nº 3.048/1999 (e arts. 11 e seguintes da Lei nº 8.213/1991): FILIAÇÃO é o vínculo jurídico que se estabelece entre o segurado e o RGPS — para o segurado OBRIGATÓRIO decorre AUTOMATICAMENTE do exercício de atividade remunerada (não depende de inscrição); para o FACULTATIVO, decorre da inscrição e do recolhimento da contribuição. INSCRIÇÃO é o ato de identificação do segurado no sistema (cadastro). CARÊNCIA é o número mínimo de contribuições mensais indispensáveis para o gozo de cada benefício (ex.: 12 contribuições para auxílio-doença e aposentadoria por incapacidade permanente; 180 para aposentadoria por idade e por tempo de contribuição; e há benefícios sem carência, como pensão por morte e auxílio-acidente).", "analise": "As demais opções invertem os conceitos ou negam sua relevância.", "ref": "Lei nº 8.213/1991, arts. 11, 18 e 25"}, {"id": "DPREV-007", "materia": "DPREV", "topico": "Espécies de benefícios e prestações", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "NÃO é benefício do Regime Geral de Previdência Social:", "alternativas": ["salário-família pago a todos os trabalhadores, sem limite de renda.", "aposentadoria por idade.", "auxílio-acidente.", "pensão por morte.", "salário-maternidade."], "correta": 0, "comentario": "O salário-família existe no RGPS, mas é pago apenas ao segurado de BAIXA RENDA, nos termos do art. 65 da Lei nº 8.213/1991 ('O salário-família será devido, mensalmente, ao segurado empregado, exceto ao doméstico, e ao segurado trabalhador avulso, na proporção do respectivo número de filhos ou equiparados de qualquer condição até 14 anos de idade ou inválido de qualquer idade'), mediante comprovação e observado o limite de renda fixado. As demais alternativas são benefícios típicos do RGPS (arts. 18 e 65 da Lei nº 8.213/1991): aposentadorias por idade, por tempo de contribuição (regras de transição), por incapacidade permanente; auxílio por incapacidade temporária; auxílio-acidente; salário-maternidade; pensão por morte; auxílio-reclusão (baixa renda).", "analise": "O item A afirma pagamento a TODOS os trabalhadores sem limite de renda, o que contraria a lei — logo é o gabarito da questão que pede o NÃO benefício (como enunciado).", "ref": "Lei nº 8.213/1991, arts. 18 e 65"}, {"id": "DPREV-008", "materia": "DPREV", "topico": "Cálculo dos benefícios: salário de benefício e RMI", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Após a EC nº 103/2019, o cálculo do valor da aposentadoria por idade e por tempo de contribuição no RGPS corresponde a:", "alternativas": ["60% da média de todos os salários de contribuição desde julho de 1994, acrescido de 2 pontos percentuais para cada ano de contribuição que exceder 20 anos (homem) ou 15 anos (mulher).", "100% do último salário de contribuição.", "70% da média, independentemente do tempo de contribuição.", "50% da média mais 1 ponto por ano trabalhado.", "média dos 12 últimos salários, sem redutor."], "correta": 0, "comentario": "Regra do art. 26 da EC nº 103/2019 (cálculo): o valor do benefício de aposentadoria corresponderá a 60% da média aritmética simples de todos os salários de contribuição e remunerações desde julho de 1994 (não mais os 80% maiores salários), com acréscimo de 2 pontos percentuais para cada ano de contribuição que EXCEDER 20 anos de contribuição, se homem, ou 15 anos, se mulher. A média é limitada ao teto do RGPS. Esse percentual incide sobre a média e o resultado é o salário de benefício — sobre ele incidem os redutores/regras específicas do benefício.", "analise": "As demais alternativas descrevem regras antigas ou inexistentes.", "ref": "EC nº 103/2019, art. 26"}, {"id": "DPREV-009", "materia": "DPREV", "topico": "Regime próprio dos servidores públicos (EC nº 103/2019)", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Para o Regime Próprio de Previdência Social (RPPS) dos servidores públicos, a EC nº 103/2019 fixou como regra geral de aposentadoria voluntária, entre outras condições:", "alternativas": ["idade mínima de 65 anos para homens e 62 anos para mulheres, com tempo mínimo de 25 anos de contribuição, 10 anos de efetivo exercício no serviço público e 5 anos no cargo em que se dará a aposentadoria.", "idade mínima de 60 anos, indistintamente, e 15 anos de contribuição.", "idade mínima de 55 anos para ambos os sexos.", "aposentadoria apenas por invalidez.", "tempo de contribuição de 40 anos, sem exigência de idade."], "correta": 0, "comentario": "A EC nº 103/2019, no art. 40, §1º (com redação atualizada), estabeleceu para o RPPS da União: idade mínima de 65 anos (homem) e 62 anos (mulher), tempo de contribuição mínimo de 25 anos, 10 anos de efetivo exercício no serviço público e 5 anos no cargo efetivo em que se dará a aposentadoria, além de cálculo pela regra de 60% da média + 2% por ano excedente. Regras específicas: professores (idade mínima reduzida: 60/57 anos com 25 anos de contribuição e 10 anos de efetivo exercício, para ambos os sexos), aposentadoria compulsória aos 75 anos, servidores policiais (regras próprias) e aposentadoria por incapacidade, com proventos proporcionais ao tempo de contribuição (salvo acidente em serviço, doença grave contagiosa etc.). A EC 103/2019 pode ser aplicada aos Estados, DF e Municípios mediante lei complementar de cada ente (art. 22).", "analise": "As demais alternativas contrariam as idades e os requisitos fixados na reforma.", "ref": "EC nº 103/2019, arts. 1º, 22 e alterações ao art. 40 da CF/88"}, {"id": "DPREV-010", "materia": "DPREV", "topico": "Contagem recíproca e compensação financeira", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a contagem recíproca de tempo de contribuição entre o RGPS e os regimes próprios, é CORRETO afirmar que:", "alternativas": ["é assegurada para efeito de aposentadoria, com compensação financeira entre os regimes, proibida a contagem dupla do mesmo período.", "é vedada pelo ordenamento jurídico brasileiro.", "permite acumular duas aposentadorias pelo mesmo tempo de serviço, sem compensação.", "só é permitida para servidores federais.", "dispensa certidão de tempo de contribuição."], "correta": 0, "comentario": "CF/88, art. 201, §9º: 'Para efeito de aposentadoria, é assegurada a contagem recíproca do tempo de contribuição na administração pública e na atividade privada, rural e urbana, hipótese em que os diversos regimes de previdência social se compensarão financeiramente, segundo critérios estabelecidos em lei'. A compensação é operacionalizada pela emissão de CERTIDÃO DE TEMPO DE CONTRIBUIÇÃO (CTC), com transferência dos valores proporcionais entre os regimes (Lei nº 9.796/1999). É vedada a contagem dupla — o tempo já utilizado em um regime não pode gerar dois benefícios.", "analise": "As demais alternativas negam garantia expressamente prevista na CF.", "ref": "CF/88 art. 201, §9º; Lei nº 9.796/1999"}, {"id": "DPREV-011", "materia": "DPREV", "topico": "Previdência complementar e teto do RGPS", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o regime de previdência complementar (art. 202 da CF/88 e EC nº 103/2019), é CORRETO afirmar que:", "alternativas": ["é autônomo em relação ao RGPS, de caráter facultativo, organizado sob a forma de fundos (fechados) ou planos (abertos), e,
