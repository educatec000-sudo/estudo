com a EC 103/2019, os entes públicos podem estabelecer limite de remuneração e adesão obrigatória ao teto do RGPS para os novos servidores, criando RPC complementar.", "é obrigatório para todos os servidores.", "substitui o RGPS.", "é vedado aos servidores públicos.", "depende de autorização do Ministério da Fazenda para cada adesão individual."], "correta": 0, "comentario": "CF/88, art. 202: 'O regime de previdência privada, de caráter complementar e organizado de forma autônoma em relação ao regime geral de previdência social, será facultativo, baseado na constituição de reservas que garantam o benefício contratado, e regulado por lei complementar'. A EC nº 103/2019 (art. 42) permitiu aos entes instituidores fixar limite máximo de remuneração igual ao teto do RGPS, com adesão automática a regime de previdência complementAR (RPC) para os servidores que ingressarem após a instituição do regime, mantendo a aposentadoria no RPPS até o teto e complementando os proventos pela entidade fechada (Leis Complementares nº 108 e 109/2001).", "analise": "As demais alternativas negam o caráter facultativo e a autonomia do regime complementar.", "ref": "CF/88 art. 202; EC nº 103/2019, art. 42; LC nº 108 e 109/2001"}, {"id": "DPREV-012", "materia": "DPREV", "topico": "Reajustamento, revisão, prescrição e decadência", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre os prazos no RGPS, é CORRETO afirmar que:", "alternativas": ["prescreve em 5 anos o direito de receber parcelas vencidas e a ação de revisão do benefício, contados do vencimento de cada prestação ou da data da decisão administrativa, e o direito de pleitear revisão administrativa deve observar o prazo decadencial de 10 anos.", "o prazo prescricional é de 10 anos para recebimento de parcelas.", "não há prazo decadencial para revisão de benefício.", "a prescrição é de 20 anos, em qualquer caso.", "a decadência é de 30 dias."], "correta": 0, "comentario": "Art. 103 da Lei nº 8.213/1991: é de CINCO ANOS o prazo de decadência do direito ou da ação do segurado ou beneficiário para a revisão do ato de concessão, indeferimento, desconcessão ou revisão de benefício (também 5 anos para o próprio INSS rever o ato, contados do dia 1º do mês seguinte ao do recebimento da primeira prestação ou do prazo de 30 dias da decisão de indeferimento). Art. 103-A (incluído pela Lei nº 13.846/2019): o prazo decadencial para revisão administrativa é de 10 anos. Prescrição: Súmula 85 do STJ e art. 103, parágrafo único — prescrevem em 5 anos as parcelas vencidas e não pagas, contados do vencimento de cada uma.", "analise": "As demais alternativas contrariam os prazos legais e a jurisprudência consolidada.", "ref": "Lei nº 8.213/1991, arts. 103 e 103-A; Súmula 85 do STJ"}, {"id": "DCIV-001", "materia": "DCIV", "topico": "LINDB: vigência, aplicação e integração", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Na ausência de disposição expressa, o juiz, ao decidir, deve aplicar a analogia, os costumes e os princípios gerais do direito, conforme:", "alternativas": ["art. 4º da LINDB, que trata da integração da norma jurídica para os casos omissos.", "art. 2º, que veda a repristinação.", "art. 6º, sobre conflito das leis no tempo.", "art. 7º, sobre eficácia das leis no espaço.", "art. 4º do Código Civil, que trata da filiação."], "correta": 0, "comentario": "Art. 4º da LINDB (Decreto-Lei nº 4.657/1942): 'Quando a lei for omissa, o juiz decidirá o caso de acordo com a analogia, os costumes e os princípios gerais de direito'. Trata-se do processo de INTEGRAÇÃO, e não de interpretação. Cabe observar também os arts. 20 a 24 da LINDB (incluídos pela Lei nº 13.655/2018), que determinam a consideração das consequências práticas das decisões e a validade de orientações gerais para a aplicação de normas de direito público. O art. 3º estabelece que ninguém se escusa de cumprir a lei alegando que não a conhece.", "analise": "As demais opções tratam de outros institutos da LINDB.", "ref": "LINDB, art. 4º"}, {"id": "DCIV-002", "materia": "DCIV", "topico": "Conflito das leis no tempo e repristinação", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A LINDB adota, como regra de conflito das leis no tempo:", "alternativas": ["a lei revogada não se restaura por ter a lei revogadora perdido a vigência, salvo disposição em contrário (vedação da repristinação).", "a repristinação automática.", "a retroatividade absoluta da lei nova.", "a aplicação da lei mais antiga, sempre.", "a vigência simultânea das leis revogadas e revogadoras."], "correta": 0, "comentario": "Art. 2º, §3º, da LINDB: 'Salvo disposição em contrário, a lei revogada não se restaura por ter a lei revogadora perdido a vigência' — é a vedação da REPRISTINAÇÃO automática, que só é admitida se expressa. O art. 6º consagra a proteção do ato jurídico perfeito, do direito adquirido e da coisa julgada. A Lei de Introdução consagrou, entre outras, as regras de vigência (art. 1º), revogação (art. 2º), obrigatoriedade (art. 3º), integração (art. 4º), interpretação (art. 5º), conflito no tempo (art. 6º) e eficácia no espaço (art. 7º) — este dispositivo é o único da LINDB com hierarquia de norma COSTUMEIRA e INCONSTITUCIONALIDADE relativa (art. 3º, 4º, 5º e 6º também são matérias de lei, enquanto os arts. 1º a 6º foram recepcionados com força de norma ordinária).", "analise": "As demais alternativas contrariam o art. 2º, §3º, da LINDB.", "ref": "LINDB, art. 2º, §3º"}, {"id": "DCIV-003", "materia": "DCIV", "topico": "Pessoas naturais: personalidade e capacidade", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Segundo o Código Civil (art. 2º), a personalidade civil da pessoa começa:", "alternativas": ["do nascimento com vida, mas a lei põe a salvo, desde a concepção, os direitos do nascituro.", "aos 18 anos completos.", "com o registro civil do nascimento.", "a partir de 16 anos.", "somente com a capacidade plena."], "correta": 0, "comentario": "Art. 2º do Código Civil: 'A personalidade civil da pessoa começa do nascimento com vida; mas a lei põe a salvo, desde a concepção, os direitos do nascituro'. Trata-se da teoria NATALISTA, temperada pela proteção dos direitos do nascituro. A capacidade de fato (de exercício) plena é adquirida aos 18 anos (art. 5º), cessando a incapacidade pela maioridade, emancipação (voluntária por pais ou judicial), casamento, exercício de emprego público efetivo, colação de grau em curso de ensino superior e estabelecimento com economia própria ou relação de emprego que permita sustento próprio.", "analise": "As demais opções confundem personalidade com capacidade, registro ou maioridade.", "ref": "Código Civil, arts. 2º a 5º"}, {"id": "DCIV-004", "materia": "DCIV", "topico": "Pessoas naturais: incapacidade e direitos da personalidade", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Após o Estatuto da Pessoa com Deficiência (Lei nº 13.146/2015), são ABSOLUTAMENTE INCAPAZES:", "alternativas": ["apenas os menores de 16 anos", "os maiores de 16 e menores de 18 anos", "os ébrios habituais e os viciados em tóxico", "os pródigos", "as pessoas com deficiência intelectual, em qualquer caso"], "correta": 0, "comentario": "Art. 3º do Código Civil, com a redação dada pela Lei nº 13.146/2015: 'São absolutamente incapazes de exercer pessoalmente os atos da vida civil os menores de 16 anos'. Os ébrios habituais, os viciados em tóxico, os que, por causa transitória ou definitiva, não puderem exprimir sua vontade e os pródigos passaram a ser RELATIVAMENTE incapazes (art. 4º), inclusive as pessoas com deficiência, que agora estão sujeitas ao instituto da TOMADA DE DECISÃO APOIADA (arts. 1.783-A e seguintes).", "analise": "B) relativamente incapazes. C) e D) relativamente incapazes. E) não há mais incapacidade automática por deficiência.", "ref": "Código Civil, arts. 3º e 4º, com a Lei nº 13.146/2015"}, {"id": "DCIV-005", "materia": "DCIV", "topico": "Pessoas jurídicas e desconsideração da personalidade", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Segundo o art. 50 do Código Civil, a desconsideração da personalidade jurídica:", "alternativas": ["ocorre em caso de abuso caracterizado por desvio de finalidade ou confusão patrimonial, com o objetivo de estender a responsabilidade aos bens particulares dos administradores ou sócios.", "é automática, sempre que a empresa não pagar suas dívidas.", "exige a extinção da pessoa jurídica.", "só pode ser requerida em processo criminal.", "foi revogada pelo Código Civil de 2002."], "correta": 0, "comentario": "Art. 50 do Código Civil: 'Em caso de abuso da personalidade jurídica, caracterizado pelo desvio de finalidade ou pela confusão patrimonial, pode o juiz, a requerimento da parte, ou do Ministério Público quando lhe couber intervir no processo, desconsiderá-la para que os efeitos de certas e determinadas relações de obrigações sejam estendidos aos bens particulares de administradores ou de sócios da pessoa jurídica beneficiados direta ou indiretamente pelo abuso'. A Lei Complementar nº 129/2007 autoriza a desconsideração quando a personalidade for obstáculo ao ressarcimento de danos (teoria menor). No âmbito do consumidor (art. 28 do CDC) e do Código de Processo Civil (arts. 133 a 137) há regras específicas, inclusive o incidente processual.", "analise": "As demais alternativas contrariam o requisito do abuso e a natureza excepcional do instituto.", "ref": "Código Civil, art. 50; CPC arts. 133 a 137"}, {"id": "DCIV-006", "materia": "DCIV", "topico": "Bens: imóveis, móveis e públicos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Segundo o Código Civil, os bens públicos classificam-se em:", "alternativas": ["bens de uso comum do povo, bens de uso especial e bens dominicais (ou dominiais)", "bens móveis e imóveis", "bens corpóreos e incorpóreos", "bens principais e acessórios", "bens fungíveis e infungíveis"], "correta": 0, "comentario": "Art. 99 do Código Civil: 'São bens públicos: I — os de uso comum do povo, tais como rios, mares, estradas, ruas e praças; II — os de uso especial, tais como edifícios ou terrenos destinados a serviço ou estabelecimento da administração federal, estadual, territorial ou municipal, inclusive os de suas autarquias; III — os dominicais, que constituem o patrimônio das pessoas jurídicas de direito público, como objeto de direito pessoal, ou real, de cada uma dessas entidades'. Os bens de uso comum e de uso especial são ALIENÁVEIS apenas após desafetação e observadas as exigências legais; os dominicais podem ser alienados na forma da lei; todos são IMPENHORÁVEIS (art. 100 da CF — precatórios) e IMPRESCRITÍVEIS quanto à usucapião (art. 102 do CC).", "analise": "As demais alternativas usam classificações do Código Civil para bens em geral, não a classificação dos públicos.", "ref": "Código Civil, arts. 99 a 102"}, {"id": "DCIV-007", "materia": "DCIV", "topico": "Negócio jurídico: defeitos e invalidade", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São defeitos do negócio jurídico:", "alternativas": ["erro ou ignorância, dolo, coação, estado de perigo, lesão e fraude contra credores", "prescrição e decadência", "simulação e nulidade absoluta", "condição, termo e encargo", "vícios de consentimento e vícios sociais, apenas"], "correta": 0, "comentario": "Art. 171 do Código Civil: 'Além dos casos expressamente declarados na lei, é anulável o negócio jurídico: I — por incapacidade relativa do agente; II — por vício resultante de erro, dolo, coação, estado de perigo, lesão ou fraude contra credores'. São os vícios do consentimento (erro, dolo, coação, estado de perigo, lesão) e o vício social (fraude contra credores). A SIMULAÇÃO (art. 167) e a fraude à lei tornam o negócio NULO (art. 166, VI e VII). Condição, termo e encargo são ELEMENTOS ACIDENTAIS do negócio, não defeitos; prescrição e decadência são causas extintivas de pretensões.", "analise": "As demais opções listam institutos diferentes (elementos acidentais, causas de extinção de direitos).", "ref": "Código Civil, arts. 138 a 165 e 166 a 184"}, {"id": "DCIV-008", "materia": "DCIV", "topico": "Prescrição e decadência", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre prescrição e decadência no Código Civil, é CORRETO afirmar que:", "alternativas": ["salvo disposição legal em contrário, o prazo geral de prescrição é de 10 anos, e a prescrição pode ser alegada em qualquer grau de jurisdição pela parte a quem aproveita, sendo vedado ao juiz suprir de ofício a alegação (art. 193 e art. 487, II, do CPC, com a possibilidade de reconhecimento de ofício da prescrição apenas nos casos autorizados pela lei).", "a prescrição e a decadência são idênticas em natureza e efeitos.", "a prescrição pode ser renunciada antes de consumada.", "os prazos de prescrição podem ser alterados por acordo das partes.", "a decadência legal pode ser obstada por qualquer causa suspensiva da prescrição."], "correta": 0, "comentario": "Art. 205 do CC: prazo geral de 10 anos quando a lei não fixa prazo menor; art. 206 estabelece prazos especiais (1, 2, 3, 4 e 5 anos). A prescrição pode ser alegada em qualquer grau de jurisdição e por qualquer interessado (art. 193); os prazos de prescrição NÃO podem ser alterados por acordo das partes nem renunciados ANTES de consumada (arts. 191 e 192) — a renúncia só é válida depois de consumada. A prescrição atinge a pretensão (ação) e é suscetível de suspensão/interrupção (arts. 197 a 204); a DECADÊNCIA atinge o direito potestativo e, em regra, não se suspende nem se interrompe (art. 207), sendo apenas convencional a que admite renúncia pelas partes.", "analise": "B) institutos distintos (pretensão x direito potestativo). C) e D) vedados por lei. E) a decadência não admite causas de impedimento/suspensão/interrupção da prescrição.", "ref": "Código Civil, arts. 189 a 211"}, {"id": "DCIV-009", "materia": "DCIV", "topico": "Obrigações: adimplemento e inadimplemento", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a mora do devedor, é CORRETO afirmar que:", "alternativas": ["a mora do devedor decorre do inadimplemento culposo relativo à falta de pagamento no tempo, lugar e forma convencionados, e depende de interpelação (mora ex persona) quando não houver termo certo, salvo nos casos legais de mora automática.", "a mora independe da culpa.", "a mora extingue automaticamente a obrigação.", "a mora do devedor exime o credor de receber o pagamento.", "a mora não gera juros moratórios."], "correta": 0, "comentario": "Art. 394 do CC: 'Considera-se em mora o devedor que não efetuar o pagamento e o credor que não quiser recebê-lo no tempo, lugar e forma que a lei ou a convenção estabelecer'. Trata-se do inadimplemento RELATIVO (mora), com culpa. Regras: nas obrigações com termo certo, há mora automática (dies interpellat pro homine — art. 397, parágrafo único); sem termo, exige-se interpelação (mora ex persona). Efeitos: responsabilidade por perdas e danos, juros de mora, correção monetária, honorários e cláusula penal moratória; a mora pode ser purgada (arts. 401 e 407 e seguintes). O credor em mora (mora accipiendi) responde pela conservação da coisa.", "analise": "As demais afirmativas contrariam os arts. 394 e 395 do CC.", "ref": "Código Civil, arts. 394 a 407"}, {"id": "DCIV-010", "materia": "DCIV", "topico": "Contratos: princípios e disposições gerais", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Entre os princípios informadores dos contratos no Código Civil de 2002, destacam-se:", "alternativas": ["autonomia privada, força obrigatória (pacta sunt servanda), relatividade dos efeitos, boa-fé objetiva e função social do contrato", "legalidade estrita, supremacia do interesse público e autotutela", "impessoalidade, publicidade e eficiência", "livre concorrência e defesa do consumidor, apenas", "irretroatividade e anterioridade"], "correta": 0, "comentario": "Princípios contratuais: autonomia privada (liberdade de contratar e de contratar), consensualismo, força obrigatória (pacta sunt servanda), relatividade dos efeitos (o contrato vincula as partes, ressalvadas as hipóteses de extensão), BOA-FÉ OBJETIVA (art. 422) e FUNÇÃO SOCIAL DO CONTRATO (art. 421: 'A liberdade de contratar será exercida em razão e nos limites da função social do contrato') — além da revisão por onerosidade excessiva (arts. 478 a 480) e da vedação ao abuso. No âmbito das relações de consumo, aplica-se também o CDC (art. 51 e seguintes: cláusulas abusivas).", "analise": "As demais alternativas trazem princípios de outros ramos do Direito.", "ref": "Código Civil, arts. 421, 422 e 478 a 480"}, {"id": "DCIV-011", "materia": "DCIV", "topico": "Responsabilidade civil objetiva e subjetiva", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Segundo o art. 927, parágrafo único, do Código Civil, haverá obrigação de reparar o dano, independentemente de culpa, quando:", "alternativas": ["a atividade normalmente desenvolvida pelo autor do dano implicar, por sua natureza, risco para os direitos de outrem (responsabilidade objetiva pelo risco da atividade).", "o dano decorrer de caso fortuito.", "o autor do dano for pessoa incapaz.", "o dano for causado por fato exclusivo de terceiro.", "não houver nexo causal."], "correta": 0, "comentario": "Art. 927, parágrafo único, do CC: 'Haverá obrigação de reparar o dano, independentemente de culpa, nos casos especificados em lei, ou quando a atividade normalmente desenvolvida pelo autor do dano implicar, por sua natureza, risco para os direitos de outrem'. É a CLÁUSULA GERAL DE RESPONSABILIDADE OBJETIVA por risco da atividade. A responsabilidade subjetiva (art. 186: ação ou omissão voluntária, negligência ou imprudência, com violação de direito e dano) exige culpa. Causas excludentes do nexo causal (caso fortuito/força maior, fato de terceiro, culpa exclusiva da vítima) afastam a responsabilidade em qualquer hipótese.", "analise": "As demais opções descrevem situações que afastam a responsabilidade.", "ref": "Código Civil, arts. 186, 187 e 927"}, {"id": "DCIV-012", "materia": "DCIV", "topico": "Lei nº 8.078/1990: consumidor e fornecedor", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Para o Código de Defesa do Consumidor, considera-se:", "alternativas": ["consumidor toda pessoa física ou jurídica que adquire ou utiliza produto ou serviço como destinatário final, e fornecedor toda pessoa física ou jurídica, pública ou privada, nacional ou estrangeira, que desenvolve atividade de produção, montagem, criação, construção, transformação, importação, exportação, distribuição ou comercialização de produtos ou prestação de serviços", "consumidor apenas a pessoa física, e fornecedor apenas pessoa jurídica", "consumidor apenas a pessoa jurídica e fornecedor apenas o comércio", "consumidor o comerciante intermediário e fornecedor o fabricante, apenas", "consumidor qualquer pessoa que compra para revenda"], "correta": 0, "comentario": "Art. 2º do CDC: 'Consumidor é toda pessoa física ou jurídica que adquire ou utiliza produto ou serviço como destinatário final'. Art. 3º: 'Fornecedor é toda pessoa física ou jurídica, pública ou privada, nacional ou estrangeira, bem como os entes despersonalizados, que desenvolvem atividade de produção, montagem, criação, construção, transformação, importação, exportação, distribuição ou comercialização de produtos ou prestação de serviços'. A lei equipara a consumidor a coletividade de pessoas (art. 2º, parágrafo único e art. 17 e 29). A responsabilidade do fornecedor por defeitos do produto ou do serviço é OBJETIVA (arts. 12 e 14), com inversão do ônus da prova (art. 6º, VIII) quando verossímil a alegação ou hipossuficiente o consumidor.", "analise": "As demais alternativas restringem indevidamente os conceitos legais.", "ref": "CDC, arts. 2º, 3º, 12 e 14"}, {"id": "DCIV-013", "materia": "DCIV", "topico": "Estatuto da Pessoa Idosa (Lei nº 10.741/2003)", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Segundo o Estatuto da Pessoa Idosa, é CORRETO afirmar que:", "alternativas": ["considera-se idosa a pessoa com 60 anos ou mais, e é dever de todos assegurar seus direitos, como vida, saúde, alimentação, dignidade, respeito e convivência familiar e comunitária, sob pena de responsabilização.", "considera-se idosa a pessoa com 55 anos ou mais.", "o Estatuto só se aplica a pessoas com 75 anos ou mais.", "os direitos dos idosos não incluem atendimento prioritário.", "a violência contra a pessoa idosa não gera dever de comunicação."], "correta": 0, "comentario": "Lei nº 10.741/2003 (Estatuto da Pessoa Idosa, denominação dada pela Lei nº 14.423/2022): considera pessoa idosa quem tem 60 ANOS ou mais; assegura direitos fundamentais (vida, saúde, alimentação, educação, cultura, esporte, lazer, profissionalização, moradia, transporte, entre outros), atendimento preferencial, prioridade na tramitação processual e na formulação de políticas públicas, além de medidas de proteção e tipificação de crimes (arts. 96 e seguintes). A violência contra a pessoa idosa caracteriza violação de direitos e gera dever de notificação compulsória e responsabilização.", "analise": "As demais alternativas contrariam o texto legal (idade, âmbito e garantias).", "ref": "Lei nº 10.741/2003, arts. 1º, 2º e 3º"}, {"id": "DCIV-014", "materia": "DCIV", "topico": "Pessoas jurídicas: constituição e extinção", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Segundo o Código Civil, a existência legal das pessoas jurídicas de direito privado começa:", "alternativas": ["com a inscrição do ato constitutivo no respectivo registro, precedida, quando necessário, de autorização ou aprovação do Poder Executivo, averbando-se no registro todas as alterações por que passar o ato constitutivo", "com a assinatura do contrato social pelos sócios", "com a obtenção da inscrição estadual", "com a emissão da nota fiscal", "com a autorização do Poder Judiciário"], "correta": 0, "comentario": "Art. 45 do Código Civil: 'Começa a existência legal das pessoas jurídicas de direito privado com a inscrição do ato constitutivo no respectivo registro, precedida, quando necessário, de autorização ou aprovação do Poder Executivo, averbando-se no registro todas as alterações por que passar o ato constitutivo. Parágrafo único: Decairá no prazo de 3 anos, contados da data da sua constituição, a decisão administrativa que denegar a apuração de lucros, ou a que determinar o arquivamento do ato constitutivo, ou a modificação do contrato social'. A extinção decorre de deliberação dos membros, porém, se houver, o patrimônio remanescente terá destinação conforme o art. 61 (associações) e art. 55 (disposições gerais).", "analise": "As demais opções confundem formalidades acessórias ou de terceiros com o marco legal de início da existência da pessoa jurídica.", "ref": "Código Civil, arts. 45, 55 e 61"}, {"id": "DCIV-015", "materia": "DCIV", "topico": "Domicílio e direitos da personalidade", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Para o Código Civil, o domicílio da pessoa natural é:", "alternativas": ["o lugar onde ela estabelece a sua residência com ânimo definitivo; se a pessoa exercitar profissão em lugares diversos, cada um deles constituirá domicílio para as relações correspondentes", "sempre o local de nascimento, de forma imutável", "apenas o local de trabalho, independentemente da residência", "o endereço declarado à Receita Federal, sempre, sem exceções", "um conceito inexistente no direito civil brasileiro"], "correta": 0, "comentario": "Art. 70 do CC: 'O domicílio da pessoa natural é o lugar onde ela estabelece a sua residência com ânimo definitivo'. Art. 71: 'Se, porém, a pessoa natural tiver diversas residências, onde, alternadamente, viva, considerar-se-á domicílio seu qualquer delas'. Art. 72: 'É também domicílio da pessoa natural, quanto às relações concernentes à profissão, o lugar onde esta é exercida'. Parágrafo único: 'Se a pessoa exercitar profissão em lugares diversos, cada um deles constituirá domicílio para as relações que lhe corresponderem'. A pessoa jurídica tem domicílio no lugar de sua sede (art. 75).", "analise": "As demais alternativas contrariam os dispositivos legais.", "ref": "Código Civil, arts. 70 a 78"}, {"id": "DCIV-016", "materia": "DCIV", "topico": "Fato jurídico e sua classificação", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre os fatos jurídicos, é CORRETO afirmar que:", "alternativas": ["fato jurídico em sentido amplo abrange os fatos naturais (extraordinários e ordinários) e os fatos humanos (atos jurídicos em sentido amplo, lícitos e ilícitos), sendo os negócios jurídicos a principal espécie de ato jurídico lícito, caracterizado pela autonomia privada e pela regulamentação de interesses pelas próprias partes", "os fatos jurídicos se limitam aos acontecimentos naturais", "o ato ilícito não produz efeitos jurídicos", "o negócio jurídico não admite autonomia privada", "o decurso do tempo não pode ser considerado fato jurídico"], "correta": 0, "comentario": "Classificação doutrinária: FATO JURÍDICO em sentido amplo = acontecimento que produz efeitos jurídicos, dividido em: (i) fatos NATURAIS (ordinários: nascimento, morte, decurso do tempo; extraordinários: caso fortuito, força maior) e (ii) fatos HUMANOS/atos jurídicos em sentido amplo, que se subdividem em atos LÍCITOS (negócios jurídicos, atos jurídicos em sentido estrito, atos-fatos jurídicos) e ILÍCITOS (que geram o dever de reparar, art. 186). O ato ilícito produz efeitos (obrigação de indenizar), ainda que contrário ao direito.", "analise": "As demais alternativas restringem ou negam a classificação legal/doutrinária.", "ref": "Código Civil, arts. 104, 185 e 186; doutrina – fato jurídico"}, {"id": "DPCIV-001", "materia": "DPCIV", "topico": "Normas fundamentais do processo civil", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O art. 3º do CPC/2015 assegura que a lei não excluirá da apreciação jurisdicional ameaça ou lesão a direito, dispondo que a conciliação, a mediação e outros métodos de solução consensual deverão ser estimulados. Isso expressa os princípios da:", "alternativas": ["inafastabilidade da jurisdição e da promoção da autocomposição", "legalidade e impessoalidade administrativa", "oralidade e imediatidade", "eventualidade e concentração", "estabilidade e preclusão"], "correta": 0, "comentario": "Art. 3º do CPC: '§1º Não se excluirá da apreciação jurisdicional ameaça ou lesão a direito (inafastabilidade da jurisdição / acesso à justiça). §2º O Estado promoverá, sempre que possível, a solução consensual dos conflitos. §3º A conciliação, a mediação e outros métodos de solução consensual de conflitos deverão ser estimulados por juízes, advogados, defensores públicos e membros do Ministério Público, inclusive no curso do processo judicial'. Normas fundamentais do processo (arts. 1º a 12) incluem também contraditório (art. 7º), boa-fé objetiva (art. 5º), cooperação (art. 6º), paridade de tratamento, duração razoável e ordem cronológica de conclusão (art. 12).", "analise": "As demais alternativas indicam princípios de outros ramos ou de etapas específicas do processo.", "ref": "CPC, arts. 1º a 12"}, {"id": "DPCIV-002", "materia": "DPCIV", "topico": "Ação: condições e pressupostos processuais", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São condições da ação, conforme o CPC/2015 e a doutrina:", "alternativas": ["legitimidade e interesse processual (a possibilidade jurídica do pedido passou a ser tratada no julgamento do mérito)", "capacidade processual e competência do juízo", "petição inicial apta e citação válida", "litispendência e coisa julgada", "preclusão e decadência"], "correta": 0, "comentario": "O CPC/2015 (art. 17) exige, para postular em juízo, INTERESSE e LEGITIMIDADE. A possibilidade jurídica do pedido deixou de ser considerada uma condição da ação autônoma, integrando-se ao julgamento do mérito (art. 485, II e III, tratam da legitimidade e do interesse como causas de indeferimento da petição inicial; e o art. 485, VI, trata da falta de legitimidade e interesse). PRESSUPOSTOS PROCESSUAIS: subjetivos (juiz competente e imparcial, partes capazes e legitimadas, capacidade postulatória) e objetivos (petição inicial apta, citação válida, ausência de litispendência e coisa julgada, ausência de perempção, caução etc.).", "analise": "As demais opções listam pressupostos processuais ou requisitos de admissibilidade de recursos.", "ref": "CPC, arts. 17, 330 e 485"}, {"id": "DPCIV-003", "materia": "DPCIV", "topico": "Sujeitos do processo: partes, deveres e capacidade", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a capacidade processual e a postulatória, é CORRETO afirmar que:", "alternativas": ["a capacidade processual é a aptidão para estar em juízo por si próprio; a capacidade postulatória é a aptidão para requerer em juízo, privativa do advogado, salvo as exceções legais (como a postulação em causa própria e a impetração de habeas corpus)", "qualquer pessoa pode postular em juízo sem advogado, em qualquer causa", "a capacidade postulatória é atributo de todas as pessoas naturais capazes", "o incapaz não pode ser representado ou assistido em juízo", "o advogado é dispensável em qualquer processo"], "correta": 0, "comentario": "Capacidade processual (capacidade de ser parte/de estar em juízo): aptidão para praticar atos processuais por si; os incapazes são representados (absolutamente) ou assistidos (relativamente) — arts. 71 a 73 do CPC. Capacidade postulatória: aptidão para postular em juízo, privativa de advogado regularmente inscrito na OAB (Lei nº 8.906/1994, art. 1º), com exceções: habeas corpus, revisão criminal, ação em causa própria, atuação em causas próprias nos Juizados Especiais até 20 salários mínimos (art. 9º da Lei nº 9.099/1995), recurso administrativo e postulação em alguns procedimentos especiais.", "analise": "As demais alternativas negam regras legais e constitucionais (advogado é indispensável à administração da justiça — art. 133 da CF).", "ref": "CPC, arts. 70 a 76; CF/88 art. 133"}, {"id": "DPCIV-004", "materia": "DPCIV", "topico": "Litisconsórcio e intervenção de terceiros", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o litisconsórcio necessário, é CORRETO afirmar que:", "alternativas": ["é aquele imposto por lei ou pela natureza da relação jurídica, sendo que, nos casos de litisconsórcio necessário simples (facultativo), não havendo citação de todos os litisconsortes, o juiz no prazo assinalado pela lei pode mandar citar o terceiro, sob pena de extinção do processo", "é aquele em que as partes se reúnem apenas por economia processual", "é vedado pelo CPC/2015", "impede a formação de litisconsórcio ativo", "só pode ocorrer no polo passivo"], "correta": 0, "comentario": "Art. 114 do CPC: 'O litisconsórcio será necessário por disposição de lei ou quando, pela natureza da relação jurídica controvertida, a eficácia da sentença depender da citação de todos que devam ser litisconsortes'. Art. 115: 'O juiz ordenará ao autor que promova a citação de todos os litisconsortes necessários, dentro de prazo que assinalar, sob pena de extinção do processo' (a chamada extinção é relativizada na prática: o art. 115, parágrafo único, admite que o juiz limite o litígio aos litisconsortes citados em determinados casos). O litisconsórcio pode ser ativo, passivo ou misto; unitário ou simples; e, quando facultativo, há verdadeira opção das partes.", "analise": "As demais opções restringem indevidamente o instituto ou contrariam a lei.", "ref": "CPC, arts. 113 a 118"}, {"id": "DPCIV-005", "materia": "DPCIV", "topico": "Tutela provisória: tutela de urgência", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A tutela provisória de urgência requer, nos termos do CPC:", "alternativas": ["probabilidade do direito e perigo de dano ou risco ao resultado útil do processo (periculum in mora), podendo ser cautelar ou antecipada, satisfativa ou conservativa, em caráter antecedente ou incidental", "apenas a probabilidade do direito", "apenas o perigo de dano", "prova do dolo do réu", "sentença transitada em julgado"], "correta": 0, "comentario": "Art. 300 do CPC: 'A tutela de urgência será concedida quando houver elementos que evidenciem a probabilidade do direito e o perigo de dano ou o risco ao resultado útil do processo'. §3º: 'A tutela de urgência de natureza antecipada não será concedida quando houver perigo de irreversibilidade dos efeitos da decisão (salvo quando a irreversibilidade for da própria situação da parte que requer a tutela)'. A tutela pode ser ANTECEDENTE (requerida antes da propositura da ação — arts. 303 e 304) ou INCIDENTAL. A tutela de EVIDÊNCIA (art. 311) dispensa o perigo de dano nas hipóteses legais (ex.: prova documental suficiente, tese firmada em julgamento de casos repetitivos).", "analise": "As demais alternativas trazem requisitos incompletos ou estranhos ao instituto.", "ref": "CPC, arts. 294 a 311"}, {"id": "DPCIV-006", "materia": "DPCIV", "topico": "Petição inicial, improcedência liminar e audiência de conciliação", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a petição inicial no procedimento comum, é CORRETO afirmar que:", "alternativas": ["deve conter, entre outros requisitos, a indicação do juízo, a qualificação das partes, os fatos e fundamentos jurídicos do pedido, o pedido com suas especificações e o valor da causa; o juiz pode indeferi-la quando for inepta, faltar legitimidade ou interesse, e pode julgar liminarmente improcedente o pedido quando contrariar súmula do STF ou de tribunal superior, enunciado de súmula vinculante, acórdão em IRDR/IAC ou decisão do STF em recursos repetitivos", "não precisa indicar o pedido, bastando os fatos", "o indeferimento liminar é vedado pelo CPC", "a audiência de conciliação é vedada antes da contestação", "o valor da causa é irrelevante"], "correta": 0, "comentario": "Art. 319 do CPC (requisitos da petição inicial): juízo, qualificação das partes, fato e fundamentos jurídicos, pedido com especificações, valor da causa, provas, opção pela audiência de conciliação ou mediação. Art. 330 (indeferimento): inépcia, falta de legitimidade, falta de interesse, pedido indeterminado (ressalvadas as hipóteses legais). Art. 332 (improcedência liminar do pedido): contrariedade a súmula do STF ou de tribunal superior, súmula vinculante, acórdão em IRDR, IAC, recursos repetitivos, ou quando a matéria já estiver pacificada. Art. 334: audiência de conciliação ou mediação, em regra designada antes da contestação, manifestada a recusa por ambas as partes.", "analise": "As demais alternativas contrariam os dispositivos legais.", "ref": "CPC, arts. 319 a 334"}, {"id": "DPCIV-007", "materia": "DPCIV", "topico": "Contestação, revelia e providências preliminares", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a revelia, é CORRETO afirmar que:", "alternativas": ["a ausência de contestação gera presunção relativa de veracidade dos fatos alegados pelo autor, produzindo o efeito material de presunção e o efeito processual de não impugnação; havendo pluralidade de réus, o efeito da revelia não atinge aquele que contestou, e não se aplica quando houver vários réus e algum contestar, quando o litígio versar sobre direitos indisponíveis, quando a petição inicial não estiver acompanhada de instrumento público essencial ou quando as alegações de fato não forem verossímeis", "o revel perde automaticamente a causa, em qualquer hipótese", "a revelia depende de requerimento do autor", "não se admite a contestação após a revelia, em qualquer hipótese, quanto ao direito patrimonial disponível", "o revel não pode intervir no processo"], "correta": 0, "comentario": "Arts. 344 a 346 do CPC: 'Art. 344. Se o réu não contestar a ação, será considerado revel e presumir-se-ão verdadeiras as alegações de fato formuladas pelo autor'. Art. 345: 'A revelia NÃO produz o efeito mencionado no artigo anterior: I — se, havendo pluralidade de réus, algum deles contestar a ação; II — se o litígio versar sobre direitos indisponíveis; III — se a petição inicial não estiver acompanhada de instrumento que a lei considere indispensável à prova do ato; IV — se as alegações de fato formuladas pelo autor forem inverossímeis ou estiverem em contradição com prova constante dos autos'. O revel pode intervir no processo em qualquer fase, recebendo-o no estado em que se encontrar (art. 346).", "analise": "As demais alternativas contrariam o caráter relativo da presunção.", "ref": "CPC, arts. 344 a 346"}, {"id": "DPCIV-008", "materia": "DPCIV", "topico": "Provas e ônus da prova", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o ônus da prova no CPC/2015, é CORRETO afirmar que:", "alternativas": ["o ônus da prova incumbe ao autor quanto ao fato constitutivo de seu direito e ao réu quanto à existência de fato impeditivo, modificativo ou extintivo do direito do autor, podendo o juiz, por decisão fundamentada, distribuir de modo diverso o ônus, inclusive de ofício, quando houver impossibilidade ou excessiva dificuldade de cumprir o encargo ou maior facilidade de obtenção da prova do fato contrário", "o ônus da prova é sempre do autor", "o ônus da prova é sempre do réu", "a distribuição dinâmica é vedada pelo CPC", "a prova testemunhal é sempre inadmissível"], "correta": 0, "comentario": "Art. 373 do CPC: 'O ônus da prova incumbe: I — ao autor, quanto ao fato constitutivo de seu direito; II — ao réu, quanto à existência de fato impeditivo, modificativo ou extintivo do direito do autor. §1º Nos casos previstos em lei ou diante de peculiaridades da causa relacionadas à impossibilidade ou à excessiva dificuldade de cumprir o encargo nos termos do caput ou à maior facilidade de obtenção da prova do fato contrário, poderá o juiz atribuir o ônus da prova de modo diverso, desde que o faça por decisão fundamentada, caso em que deverá dar à parte a oportunidade de se desincumbir do ônus que lhe foi atribuído'. §2º: a decisão deve ser precedida de oportunidade de manifestação. Art. 371: o juiz apreciará a prova independentemente do ônus.", "analise": "As demais alternativas negam o sistema legal probatório.", "ref": "CPC, arts. 369 a 373"}, {"id": "DPCIV-009", "materia": "DPCIV", "topico": "Sentença, coisa julgada e cumprimento de sentença", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a sentença e a coisa julgada, é CORRETO afirmar que:", "alternativas": ["a sentença deve conter relatório, fundamentação e dispositivo, sendo que a coisa julgada material torna imutável e indiscutível a decisão de mérito não mais sujeita a recurso, enquanto a coisa julgada formal decorre do esgotamento das vias recursais", "a coisa julgada material é dispensável em qualquer decisão", "a sentença não precisa ser fundamentada", "a coisa julgada só ocorre em processos de execução", "a decisão interlocutória sempre faz coisa julgada material"], "correta": 0, "comentario": "Art. 489 do CPC: elementos da sentença: relatório, fundamentação e dispositivo (não se considera fundamentada qualquer decisão que se limite à indicação de ato normativo, que reproduza o parecer etc. — deve enfrentar os argumentos capazes de infirmar a conclusão). Art. 502: 'Denomina-se coisa julgada material a autoridade que torna imutável e indiscutível a decisão de mérito não mais sujeita a recurso'. A COISA JULGADA FORMAL é a preclusão das vias recursais (a decisão não pode mais ser atacada naquele processo). O cumprimento de sentença (arts. 513 e seguintes) dispensa nova citação, com multa de 10% e honorários de 10% em caso de não pagamento voluntário em 15 dias.", "analise": "As demais alternativas contrariam os arts. 489, 502 e 513 do CPC.", "ref": "CPC, arts. 489, 502 e 513"}, {"id": "DPCIV-010", "materia": "DPCIV", "topico": "Cumprimento de sentença e execução contra a Fazenda Pública", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Na execução contra a Fazenda Pública, é CORRETO afirmar que:", "alternativas": ["não há penhora de bens públicos; o pagamento se dá por precatório ou requisição de pequeno valor (RPV), na ordem cronológica, com regras específicas para créditos de natureza alimentar e a possibilidade de impugnação no prazo de 30 dias", "o pagamento ocorre por penhora de bens públicos", "a Fazenda Pública pode ser executada sem qualquer procedimento especial", "não há previsão de pequena obrigação de pequeno valor no texto constitucional", "o precatório não admite ordem cronológica"], "correta": 0, "comentario": "CF/88, art. 100: os pagamentos devidos pela Fazenda Pública em virtude de sentença judiciária far-se-ão exclusivamente na ordem cronológica de apresentação dos precatórios e à conta dos créditos respectivos, proibida a designação de casos ou de pessoas nas dotações orçamentárias (com exceção da superpreferência para créditos alimentares de pessoas com 60+ anos, ou portadoras de doença grave ou pessoas com deficiência, e das obrigações de pequeno valor — art. 100, §§ 2º e 3º). O CPC/2015 disciplina o cumprimento de sentença contra a Fazenda Pública nos arts. 534 e 535, com impugnação em 30 dias, sem efeito suspensivo necessariamente.", "analise": "As demais alternativas contrariam o regime constitucional dos precatórios.", "ref": "CF/88 art. 100; CPC arts. 534 e 535"}, {"id": "DPCIV-011", "materia": "DPCIV", "topico": "Processos nos tribunais e meios de impugnação", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o incidente de resolução de demandas repetitivas (IRDR), é CORRETO afirmar que:", "alternativas": ["é instaurado quando houver efetiva repetição de processos que contenham controvérsia sobre a mesma questão unicamente de direito e risco de ofensa à isonomia e à segurança jurídica, competindo ao tribunal julgar o incidente, com suspensão dos processos pendentes, no âmbito de sua jurisdição, quando admitido", "depende de autorização do Poder Executivo", "é instaurado apenas em processos criminais", "impede a prolação de sentença em qualquer caso, no país inteiro", "é vedado pelo CPC"], "correta": 0, "comentario": "Art. 976 do CPC: 'É cabível a instauração do incidente de resolução de demandas repetitivas quando houver, simultaneamente: I — efetiva repetição de processos que contenham controvérsia sobre a mesma questão unicamente de direito; II — risco de ofensa à isonomia e à segurança jurídica'. O IRDR é julgado pelo TRIBUNAL (competente para julgar o recurso correspondente) e admite suspensão dos processos pendentes no âmbito da jurisdição do tribunal. A tese fixada vincula os juízes e tribunais (art. 985). Distinguir do INCIDENTE DE ASSUNÇÃO DE COMPETÊNCIA (art. 947), aplicável quando a matéria tem relevante questão de direito com grande repercussão social e risco de divergência entre órgãos julgadores.", "analise": "As demais alternativas criam requisitos inexistentes ou negam o instituto.", "ref": "CPC, arts. 947, 976 e 985"}, {"id": "DPCIV-012", "materia": "DPCIV", "topico": "Lei nº 8.245/1991 (Locação de imóveis urbanos) e ação de improbidade", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre as ações previstas na Lei nº 8.245/1991 (Lei do Inquilinato), é CORRETO afirmar que:", "alternativas": ["a ação de despejo pode ser proposta com base nas hipóteses legais (falta de pagamento, descumprimento do contrato, denúncia vazia nas locações com prazo indeterminado), e a ação renovatória exige contrato escrito com prazo determinado de pelo menos 5 anos, exploração do mesmo ramo por pelo menos 3 anos e prazo de propositura entre 1 ano e 6 meses antes do término do contrato", "o despejo só é admitido por falta de pagamento", "a ação renovatória pode ser proposta a qualquer tempo", "a lei não prevê ação revisional de aluguel", "não existem procedimentos especiais na locação urbana"], "correta": 0, "comentario": "A Lei nº 8.245/1991 prevê procedimentos especiais: AÇÃO DE DESPEJO (falta de pagamento, descumprimento de obrigações, denúncia vazia nos contratos por prazo indeterminado, saída do locador da vacância, etc.); AÇÃO RENOVATÓRIA (requisitos do art. 51: contrato escrito com prazo determinado mínimo de 5 anos, exploração do mesmo ramo comercial por pelo menos 3 anos ininterruptos e propositura entre 1 ano e 6 meses antes do término do prazo); AÇÃO REVISIONAL DE ALUGUEL (após 3 anos de vigência do contrato, art. 19, §1º); CONSIGNATÓRIA; EXECUÇÃO DE ALUGUÉIS. Em improbidade administrativa (também cobrada no edital), a ação segue rito próprio (Lei nº 8.429/1992, arts. 17 e seguintes), com legitimidade do Ministério Público e a possibilidade de acordo de não persecução civil.", "analise": "As demais alternativas negam as hipóteses e prazos legais das ações locatícias.", "ref": "Lei nº 8.245/1991, arts. 5º, 9º, 19 e 51"}, {"id": "DH-001", "materia": "DH", "topico": "Afirmação histórica dos direitos humanos", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a afirmação histórica dos direitos humanos, é CORRETO afirmar que:", "alternativas": ["resulta de um processo histórico de lutas sociais e de conquistas progressivas, com marcos como a Magna Carta (1215), o Bill of Rights (1689), a Declaração de Independência dos EUA (1776), a Declaração dos Direitos do Homem e do Cidadão (1789) e a Declaração Universal dos Direitos Humanos (1948)", "ocorreu de uma só vez, em 1948, sem antecedentes", "é uma criação exclusiva do século XXI", "surgiu antes da Magna Carta, na antiguidade grega, sem qualquer evolução posterior", "não possui relação com processos revolucionários"], "correta": 0, "comentario": "A afirmação histórica dos direitos humanos é produto de um processo cumulativo: Magna Carta (1215, limitação do poder real), Petition of Rights (1628), Habeas Corpus Act (1679), Bill of Rights (1689), Declarações das Revoluções Americana (1776) e Francesa (1789), Constituições liberais do século XIX, Constituição de Weimar (1919, direitos sociais), Declaração Universal dos Direitos Humanos (1948) e o sistema internacional de proteção. O Anexo II cobra expressamente essa historicidade.", "analise": "As demais alternativas negam o caráter processual, histórico e cumulativo dos direitos humanos.", "ref": "Afirmação histórica dos direitos humanos"}, {"id": "DH-002", "materia": "DH", "topico": "O problema da fundamentação dos direitos humanos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O problema da fundamentação dos direitos humanos refere-se:", "alternativas": ["à necessidade de justificar racional e moralmente por que todos os seres humanos são titulares de direitos, diante de posições jusnaturalistas, positivistas e historicistas/culturalistas", "à inexistência de qualquer justificação teórica possível", "exclusivamente à definição de tratados internacionais", "ao modo de aplicar a lei ordinária", "à organização do Poder Judiciário"], "correta": 0, "comentario": "O problema da fundamentação busca justificar a validade universal dos direitos humanos. As correntes clássicas incluem: JUSNATURALISMO (direitos inerentes à natureza humana, anteriores ao Estado), POSITIVISMO (direitos válidos por serem previstos em normas jurídicas — Declaração de 1948, tratados e constituições) e as críticas HISTORICISTAS/CULTURALISTAS, que apontam o relativismo cultural e a origem ocidental do discurso. A resposta contemporânea tende ao consenso sobre a DIGNIDADE DA PESSOA HUMANA como fundamento, com cláusulas de abertura e diálogo intercultural.", "analise": "As demais opções negam ou deslocam o problema.", "ref": "Fundamentação dos direitos humanos"}, {"id": "DH-003", "materia": "DH", "topico": "Genealogia: direitos naturais, revoluções e declarações", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Constituem marcos da genealogia dos direitos humanos, na linha das revoluções e declarações:", "alternativas": ["o Bill of Rights de 1689 e a Declaração dos Direitos do Homem e do Cidadão de 1789", "a Encíclica Rerum Novarum e o Tratado de Versalhes", "a Constituição de Weimar e a Carta de Teerã", "a Declaração de Viena de 1993 e o Pacto de San José da Costa Rica", "a Magna Carta de 1215 e a Bula Áurea de 1222"], "correta": 0, "comentario": "A genealogia clássica inclui: origens clássicas (filosofia grega e estoicismo, direito natural); direitos naturais (Grotius, Locke); revoluções e declarações (Revolução Inglesa — Bill of Rights de 1689; Independência dos EUA — 1776; Revolução Francesa — Declaração dos Direitos do Homem e do Cidadão de 1789). Os demais documentos citados (Rerum Novarum, Versalhes, Weimar, Declaração de Viena de 1993, Pacto de San José) existem e pertencem à história da proteção social e do sistema internacional de direitos humanos, mas não estão no núcleo 'revoluções e declarações' clássico.", "analise": "A questão pede o par típico da genealogia clássica.", "ref": "Genealogia dos direitos humanos"}, {"id": "DH-004", "materia": "DH", "topico": "Universalismo x multiculturalismo", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O debate entre universalismo e multiculturalismo nos direitos humanos envolve:", "alternativas": ["de um lado, a pretensão de validade universal dos direitos humanos, fundada na dignidade humana; de outro, as críticas ao caráter culturalmente situado desses direitos e as demandas de reconhecimento das diferenças culturais, com respostas contemporâneas baseadas no diálogo intercultural e no mínimo ético universal", "a defesa de que os direitos humanos devem ser aplicados apenas em alguns países", "a ideia de que a cultura não influencia a interpretação de direitos", "a tese de que só existe uma cultura legítima no mundo", "a exclusão dos tratados internacionais do debate"], "correta": 0, "comentario": "Universalistas (e a própria Declaração Universal de 1948) sustentam a validade para todos os seres humanos; multiculturalistas/culturalistas denunciam o viés ocidental e reivindicam respeito às diferenças e à autodeterminação cultural. A síntese contemporânea admite a INTERPRETAÇÃO INTERCULTURAL e um núcleo mínimo (dignidade, vedação à tortura, proibição do genocídio), mantendo a universalidade dos direitos como horizonte, como fez a Declaração de Viena de 1993.", "analise": "As demais opções simplificam ou negam o debate.", "ref": "Universalismo x culturalismo"}, {"id": "DH-005", "materia": "DH", "topico": "Direitos humanos e direitos fundamentais: diferenças", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A diferença entre direitos humanos e direitos fundamentais consiste, classicamente, em que:", "alternativas": ["direitos humanos são os reconhecidos no plano internacional (tratados e declarações) e direitos fundamentais são os positivados e protegidos na ordem constitucional interna de cada Estado", "são conceitos absolutamente idênticos", "os direitos humanos são previstos apenas na Constituição e os fundamentais apenas em tratados", "os direitos fundamentais não admitem proteção judicial", "os direitos humanos são exclusivos dos brasileiros"], "correta": 0, "comentario": "Direitos HUMANOS: previstos em declarações e tratados internacionais, com pretensão universal, voltados à proteção da dignidade em âmbito global (Declaração Universal, Pacto de San José da Costa Rica, Pacto de Direitos Civis e Políticos etc.). Direitos FUNDAMENTAIS: previstos e protegidos na Constituição de cada Estado, no plano interno (CF/88, Título II). O conteúdo é em grande medida coincidente, mas a dimensão (internacional x constitucional) e o regime de proteção diferem — no Brasil, o art. 5º, §§2º e 3º, articula as duas dimensões (bloco de constitucionalidade e status dos tratados de direitos humanos).", "analise": "As demais alternativas confundem os planos ou negam categorias jurídicas.", "ref": "Direitos humanos x direitos fundamentais"}, {"id": "DH-006", "materia": "DH", "topico": "Dimensões (gerações) dos direitos humanos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Quanto às dimensões (gerações) dos direitos humanos, é CORRETO afirmar que:", "alternativas": ["os direitos de primeira dimensão são os civis e políticos (liberdades, com viés de abstenção estatal); os de segunda dimensão são os sociais, econômicos e culturais (prestações positivas); e os de terceira dimensão são os difusos e coletivos, como o meio ambiente, o desenvolvimento e a paz", "os direitos de primeira dimensão são os sociais e econômicos", "os direitos de terceira dimensão são direitos individuais de defesa", "as dimensões são incompatíveis entre si e não se acumulam", "não existem dimensões de direitos humanos no Brasil"], "correta": 0, "comentario": "Classificação clássica (Karel Vasak): 1ª dimensão — direitos civis e políticos (liberdades, direitos de defesa, exigem abstenção do Estado: vida, liberdade, propriedade, participação política); 2ª dimensão — direitos sociais, econômicos e culturais (prestações positivas, igualdade material: saúde, educação, trabalho, previdência); 3ª dimensão — direitos difusos e coletivos (solidariedade: meio ambiente, desenvolvimento, paz, comunicação, patrimônio comum da humanidade). Alguns autores acrescentam 4ª (bioética, engenharia genética, direitos da informação) e 5ª (paz, ética universal). As dimensões são COMPLEMENTARES e CUMULATIVAS, não sucessivas excludentes.", "analise": "As demais alternativas trocam ou negam os conteúdos das dimensões.", "ref": "Dimensões dos direitos humanos"}, {"id": "DH-007", "materia": "DH", "topico": "Características dos direitos humanos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São características dos direitos humanos:", "alternativas": ["imprescritibilidade, irrenunciabilidade, inalienabilidade, universalidade e complementaridade (ou interdependência), além da indisponibilidade e da vedação do retrocesso", "prescritibilidade e renunciabilidade", "alienabilidade e divisibilidade", "restrição a grupos específicos e subordinação ao interesse do Estado", "possibilidade de supressão por lei ordinária"], "correta": 0, "comentario": "Características dos direitos humanos (cobradas literalmente no Anexo II): IMPRESCRITIBILIDADE (não se perdem pelo tempo), IRRENUNCIABILIDADE (não podem ser renunciados pelo titular, embora haja a possibilidade de não exercício), INALIENABILIDADE (não são transferíveis), COMPLEMENTARIDADE/INTERDEPENDÊNCIA e INTER-RELATEDNESS (não há hierarquia entre eles; integram um sistema), UNIVERSALIDADE (devidos a todos os seres humanos), além da INDIVISIBILIDADE, da EFETIVIDADE e da VEDAÇÃO DE RETROCESSO.", "analise": "As demais alternativas descrevem o oposto das características reconhecidas.", "ref": "Características dos direitos humanos"}, {"id": "DH-008", "materia": "DH", "topico": "O paradoxo dos direitos humanos", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O 'paradoxo dos direitos humanos' expressa a contradição entre:", "alternativas": ["a afirmação da igualdade e da dignidade de todos os seres humanos e as práticas históricas de exclusão e violação de direitos, que exigem permanente defesa e ampliação das garantias", "a existência de direitos e a inexistência de normas jurídicas", "a separação entre Direito e moral", "a supremacia do interesse público e a legalidade", "a soberania e a federação"], "correta": 0, "comentario": "O paradoxo (tratado por autores como Boaventura de Sousa Santos em 'Se Deus fosse um ativista dos direitos humanos' e por autores do cosmopolitismo) reside em que, ao mesmo tempo que os direitos humanos se apresentam como universais, a prática histórica demonstra violações sistemáticas, exclusões e usos hegemônicos do discurso. A tensão exige a CONSTANTE reconstrução e a luta pela efetividade das garantias — e o recurso à dignidade humana como fundamento crítico.", "analise": "As demais opções tratam de questões dogmáticas que não expressam o paradoxo.", "ref": "O paradoxo dos direitos humanos"}, {"id": "DH-009", "materia": "DH", "topico": "Direitos humanos no plano interno e internacional", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a proteção internacional dos direitos humanos, é CORRETO afirmar que:", "alternativas": ["existem sistemas regionais (interamericano, europeu e africano) e o sistema universal (ONU), sendo o Brasil parte do Sistema Interamericano, que se soma à proteção constitucional interna, com prerrogativa de 'quatro instâncias' em alguns temas", "não existem sistemas regionais de proteção", "a proteção internacional substitui a proteção interna", "o Brasil não ratificou nenhum tratado de direitos humanos", "a proteção é exclusiva do Conselho de Segurança da ONU"], "correta": 0, "comentario": "O sistema internacional de proteção compreende o SISTEMA UNIVERSAL (ONU: Declaração Universal de 1948, Pactos de 1966, comitês de tratados, Conselho de Direitos Humanos, procedimentos especiais) e os sistemas REGIONAIS: Interamericano (OEA — Declaração Americana, Convenção Americana/Pacto de San José de Costa Rica, Comissão e Corte Interamericanas), Europeu (Conselho da Europa / Tribunal Europeu de Direitos Humanos) e Africano (Carta de Banjul / Corte Africana). No Brasil, a proteção internacional atua em conjunto com a interna (os tratados se incorporam ao direito interno, com o rito do art. 5º, §3º, valendo como emenda constitucional; há ainda previsão jurisprudencial das 'quatro instâncias', permitindo recorrer à Comissão Interamericana após esgotados os recursos internos).", "analise": "As demais alternativas negam a existência ou o papel dos sistemas de proteção.", "ref": "Sistema internacional de proteção dos direitos humanos"}, {"id": "DH-010", "materia": "DH", "topico": "Dignidade da pessoa humana como fundamento", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Na ordem constitucional brasileira, o fundamento dos direitos humanos e fundamentais é:", "alternativas": ["a dignidade da pessoa humana, prevista como fundamento da República Federativa do Brasil no art. 1º, III, da CF/88", "a vontade do legislador ordinário", "o interesse exclusivo do Estado", "a soberania nacional, apenas", "a propriedade privada, apenas"], "correta": 0, "comentario": "A dignidade da pessoa humana (art. 1º, III, da CF/88) é fundamento da República e valor-fonte dos direitos fundamentais, servindo de parâmetro para a interpretação e para o controle de constitucionalidade. Surgiu com força na DUDH de 1948 (preâmbulo) e no art. 1º da Lei Fundamental de Bonn de 1949, e serve como critério para a ponderação de direitos e para a proibição de tratamento degradante.", "analise": "As demais alternativas apresentam fundamentos não constitucionais ou incompatíveis com o texto.", "ref": "CF/88 art. 1º, III"}];
window.__TEORIA__ = {"LP": {"Crase – quando usar (e quando não)": "USA-SE: antes de palavra feminina determinada (entregar à comissão); antes de horas (às 14h); em 'à moda de', 'à medida que', 'à custa de'; antes de 'aquele/aquela/aquilo' quando caberia 'a a' (referiu-se àquele projeto). NÃO SE USA: antes de verbo; antes de palavra masculina; antes de pronome de tratamento (Vossa Excelência); antes de pronomes indefinidos/relativos (a qualquer, a quem); antes de nome de cidade sem determinante (foi a Belém, mas foi à Belém dos meus sonhos). FACULTATIVA: após 'até' (até a/até à), antes de pronome possessivo feminino (a minha/à minha) e antes de nome de pessoa feminina (a Ana/à Ana).", "Uso dos porquês – resumo de bolso": "PORQUE (junto, sem acento) = conjunção causal/explicativa (saiu porque chovia). POR QUÊ (separado, com acento) = fim de frase ou antes de pausa (você saiu por quê?). POR QUÊ? em início de interrogativa direta: 'Por que você saiu?'. POR QUE (separado, sem acento) = interrogativa indireta, ou 'pelo qual/pela qual' (não sei por que saiu; os motivos por que saiu). PORQUÊ (junto, com acento) = substantivo (= motivo), após artigo (não sei o porquê).", "Concordância – armadilhas da banca": "Fazer (tempo)/haver (existir) = impessoais, ficam no SINGULAR: faz dois anos, havia requerimentos, houve discussões, deve haver vagas. Existir é pessoal: existem requerimentos. Com 'um e outro' o verbo admite plural (um e outro servidor apresentaram). 'Mais de um' pede singular, salvo reciprocidade. 'É proibido entrada' (sem artigo) é invariável; 'É proibida a entrada' (com artigo) concorda. 'Meio' (advérbio = um pouco) é invariável: meio cansada. Anexo, incluso, quite e leso concordam com o substantivo.", "Regência – os verbos que mais caem": "Assistir (ver) = a (assistir ao vídeo). Aspirar (desejar) = a (aspirar ao cargo). Visar (pretender) = a (visar ao resultado). Preferir = a (preferir A a B — nunca 'do que'). Obedecer/desobedecer = a. Implicar (acarretar) = sem preposição. Esquecer/lembrar: com pronome exige 'de' (esqueci-me de, lembrei-me de). Chegar/ir = a (chegar a Belém, ir ao plenário).", "Pontuação – as cinco regras que decidem questão": "1) Não se separa sujeito de predicado nem verbo de objeto por vírgula. 2) Oração adjetiva EXPLICATIVA entre vírgulas generaliza; RESTRITIVA (sem vírgulas) restringe. 3) Aposto explicativo, vocativo e expressões intercaladas (isto é, ou seja, por exemplo) entre vírgulas. 4) Oração deslocada (adverbial antecipada) usa vírgula quando extensa. 5) Ponto e vírgula separa itens longos de enumeração e orações de sentido oposto.", "Colocação pronominal – hierarquia das regras": "1º Próclise obrigatória com palavras atrativas: negação (não se sabe), advérbio (aqui se vota), conjunção subordinativa (que se cumpra), pronome relativo/indefinido, infinitivo com 'em' (em se tratando). 2º Nunca iniciar frase com pronome átono (Informaram-me, e não 'Me informaram'). 3º Futuro do presente e futuro do pretérito pedem mesóclise (informar-te-ei, informar-te-ia). 4º Caso contrário, ênclise (apresentou-se, disse-lhe).", "Redação oficial – o que o Manual cobra": "Atributos: clareza e precisão, objetividade, concisão, coesão e coerência, impessoalidade, formalidade e padronização, uso da norma culta. Fechos: 'Respeitosamente' para autoridade SUPERIOR; 'Atenciosamente' para mesma hierarquia ou inferior. Aboliram-se: 'Digníssimo (DD.)', 'Vimos por meio desta', 'Tenho a honra de'. Pronomes de tratamento: Vossa Excelência (autoridades, parlamentares), Vossa Senhoria (cargo de nível intermediário), Vossa Magnificência (reitores). No padrão ofício: cabeçalho, identificação do expediente, endereçamento, assunto, texto, fecho e identificação do signatário.", "Coesão e coerência – conectivos por sentido": "ADVERSIDADE: mas, porém, contudo, todavia, entretanto, no entanto. CAUSA: porque, pois, já que, visto que, uma vez que. CONCESSÃO: embora, ainda que, mesmo que, apesar de. CONCLUSÃO: portanto, logo, assim, por conseguinte. CONDIÇÃO: se, caso, desde que, contanto que. FINALIDADE: para que, a fim de que. EXPLICAÇÃO: pois, porquanto, que. Trocar o conectivo = trocar o sentido: a banca explora exatamente isso."}, "LE": {"LGPD – mapa mental essencial": "Lei nº 13.709/2018. DADO PESSOAL: informação relacionada a pessoa natural identificada ou identificável. DADO SENSÍVEL (art. 5º, II): origem racial/étnica, convicção religiosa, opinião política, filiação a sindicato ou organização religiosa/filosófica/política, saúde, vida sexual, dado genético ou biométrico. BASES LEGAIS (art. 7º): consentimento, cumprimento de obrigação legal, execução de políticas públicas, estudos, execução de contrato, exercício regular de direitos, proteção da vida, tutela da saúde, interesse legítimo, proteção do crédito. DIREITOS DO TITULAR (art. 18): confirmação, acesso, correção, anonimização/bloqueio/eliminação de dados desnecessários, portabilidade, eliminação dos dados tratados com consentimento, informação sobre compartilhamento e sobre a possibilidade de não consentir, revogação. INCIDENTE (art. 48): comunicação à ANPD e ao titular em prazo razoável (Resolução CD/ANPD nº 15/2024: 3 dias úteis). SANÇÕES (art. 52): advertência, multa de até 2% do faturamento do grupo limitada a R$ 50 milhões por infração, publicização, bloqueio e eliminação dos dados, suspensão parcial ou total do banco de dados. Poder público: tratamento para finalidade pública (art. 23). ANPD: autarquia de natureza especial (arts. 55-A a 55-J).", "Lei Anticorrupção (Lei nº 12.846/2013) – números que caem": "Responsabilidade OBJETIVA (administrativa e civil) das pessoas jurídicas (art. 1º e 2º); responsabilidade individual exige dolo/culpa (art. 3º). Sanções (art. 6º): MULTA de 0,1% a 20% do faturamento bruto do último exercício anterior ao da instauração do processo (excluídos tributos) ou, se não for possível mensurar, de R$ 6.000 a R$ 60.000.000; e PUBLICAÇÃO EXTRAORDINÁRIA da decisão condenatória. ACORDO DE LENIÊNCIA (art. 16): redução de até 2/3 da multa, isenção da publicação extraordinária e das sanções de licitação; NÃO isenta do ressarcimento do dano. DESCONSIDERAÇÃO DA PERSONALIDADE (art. 19). Programa de integridade = atenuante (regulamento federal: Decreto nº 11.129/2022, que disciplina o PAR no âmbito federal).", "Improbidade administrativa pós-Lei 14.230/2021": "1) Exige DOLO + finalidade específica (art. 1º, §§1º e 2º): acabou a improbidade culposa. 2) Condutas TAXATIVAS nos arts. 9º (enriquecimento ilícito), 10 (prejuízo ao erário) e 11 (violação de princípios — rol taxativo, exige dolo e finalidade de obtenção de proveito). 3) PRESCRIÇÃO: 8 anos do fato ou, nas infrações permanentes, do dia em que cessou (art. 23); prescrição intercorrente quando o processo ficar paralisado por mais de 3 anos (§8º). 4) Sanções do art. 12: enriquecimento ilícito — suspensão dos direitos políticos até 14 anos; dano ao erário — até 12 anos; multa pode ser aumentada até o dobro (§2º). 5) Legitimidade: Ministério Público (art. 14 e 17). 6) ACORDO DE NÃO PERSEGUIÇÃO CIVIL (art. 17-B): exige ressarcimento integral, confissão e cumprimento das condições, com homologação judicial; não impede o ressarcimento. 7) TJs e STF exigem para as ações a comprovação do dolo específico.", "Ética: conceitos que a banca adora": "MORAL = conjunto de valores, normas e costumes efetivamente praticados por um grupo (histórica e culturalmente situada). ÉTICA = reflexão crítica/filosófica sobre os fundamentos da moral (teoria da moral). Princípios expressos da Administração (art. 37, caput, CF): LEGALIDADE, IMPESSOALIDADE, MORALIDADE, PUBLICIDADE, EFICIÊNCIA (LIMPE). Implícitos: razoabilidade, proporcionalidade, motivação, autotutela, segurança jurídica, continuidade, supremacia do interesse público. Ética e democracia: accountability, transparência, participação e controle social como condição de legitimidade do poder.", "Constituição do Pará – Poder Legislativo (dados-chave)": "Art. 86: o Poder Legislativo é exercido pela Assembleia Legislativa, com autonomia administrativa e financeira; proposta orçamentária elaborada pela Casa nos limites da LDO, encaminhada pelo Presidente após aprovação do Plenário; legislatura de 4 anos. Art. 87: Deputados eleitos pelo sistema proporcional; o número corresponde ao triplo da representação federal e, atingidos 36, acresce-se um por deputado federal acima de 12 → ALEPA = 41 DEPUTADOS. Mesa e comissões: representação proporcional dos partidos/blocos e, em qualquer caso, pelo menos um Deputado da OPOSIÇÃO. Fiscalização: controle externo pela Assembleia com auxílio do TCE-PA. Imunidades: os Deputados Estaduais têm as mesmas imunidades dos Deputados Federais (CF, art. 27, §1º, e art. 53)."}, "INFO": {"Windows 10/11 – atalhos e ferramentas": "Ctrl+Shift+Esc = Gerenciador de Tarefas · Win+E = Explorador · Win+L = bloquear · Win+D = área de trabalho · Win+R = Executar · Win+Tab = Visão de Tarefas (áreas de trabalho virtuais; Win+Ctrl+D cria nova) · Alt+Tab = alternar janelas · F2 = renomear · Shift+Delete = excluir sem passar pela Lixeira. Gerenciador de Dispositivos = drivers; Gerenciador de Tarefas = processos, desempenho, inicialização.", "Segurança da informação – o essencial": "TRÍADE CID: confidencialidade, integridade, disponibilidade. Malwares: vírus, worm, trojan, ransomware (sequestra dados), spyware, keylogger, rootkit, adware. Phishing (e-mail/site falso) tem variações: smishing (SMS) e vishing (voz). FIREWALL = filtra tráfego por regras (não remove vírus). ANTIMALWARE = detecta/remove. HARDENING = reduzir superfície de ataque (desativar serviços/portas, patch management, controle de USB). AUTENTICAÇÃO: fatores = conhecimento (senha), posse (token), biometria; MFA combina fatores. BACKUP 3-2-1: 3 cópias, 2 mídias, 1 fora do local. Princípio do menor privilégio: só as permissões necessárias.", "Excel/Calc – fórmulas e referências": "SOMA, MÉDIA, MÁXIMO, MÍNIMO, CONT.VALORES; condicionais: SOMASE(intervalo;critério;intervalo_soma), CONT.SE, CONT.SES, SOMASES, MÉDIASE; lógicas: SE(teste;verdadeiro;falso), SEERRO, E, OU; busca: PROCV/PROCH (XLOOKUP em versões novas); F4 alterna referência relativa → absoluta ($A$1) → mistas ($A1 / A$1). No LibreOffice Calc o separador de argumentos é ponto e vírgula e o formato padrão é ODF (.ods/.odt/.odp), com compatibilidade a .xlsx/.docx/.pptx.", "Redes e navegadores – mapa rápido": "DNS resolve nome em IP; DHCP distribui IPs; SMTP envia e-mail; POP3 baixa (geralmente remove do servidor); IMAP sincroniza (mantém no servidor); FTP transfere arquivos; HTTP/HTTPS web; SNMP gerencia dispositivos. Equipamentos: hub (camada 1, repete para todos), switch (camada 2, MAC, VLAN), roteador (camada 3, IP), repetidor (regenera sinal), gateway (converte entre redes). Intranet = rede privada da instituição com tecnologias da Internet; Extranet = extensão para parceiros. Busca: \"expressão exata\", -excluir, site:, filetype:, OR. Navegação anônima (Ctrl+Shift+N no Chrome/Edge; Ctrl+Shift+P no Firefox) não registra histórico local, mas não oculta o acesso do provedor/rede.", "EAD e colaboração – o que cai": "Moodle = AVA/LMS de código aberto (fóruns, tarefas, questionários, trilhas). SharePoint = colaboração e gestão documental. Google Drive = armazenamento e edição em nuvem. Teams, Webex e Google Meet = reuniões com chat, compartilhamento de tela e gravação. Formatos: MP3/WAV/OGG (áudio), MP4/AVI/MKV (vídeo), JPG/PNG/GIF/WEBP (imagem), DOCX/XLSX/PPTX (Office), PDF (portátil)."}, "RL": {"Matemática básica – fórmulas de prova": "Porcentagem: x% de N = (x/100)·N; variações sucessivas MULTIPLICAM (aumento de 10% e 20% = ×1,10×1,20 = ×1,32, total de 32% — não 30%). Desconto de p% = ×(1−p/100). Juros simples: J = C·i·t; M = C + J. Média: soma ÷ quantidade; média ponderada: Σ(peso×valor)/Σpesos. Regra de três composta: monte as grandezas e verifique se são direta (multiplica em cruz) ou inversamente proporcionais (inverte a razão). Divisão proporcional inversa: use os inversos (1/2, 1/3, 1/6 → 3:2:1).", "Lógica proposicional – tabelas e equivalências": "Conjunção (∧) só é V se ambas V. Disjunção (∨) só é F se ambas F. Condicional (P→Q) só é F quando P é V e Q é F. Bicondicional (↔) é V quando iguais. NEGAÇÕES: ¬(P∧Q) = ¬P∨¬Q; ¬(P∨Q) = ¬P∧¬Q (De Morgan); ¬(P→Q) = P∧¬Q. EQUIVALÊNCIAS: P→Q = ¬P∨Q = contrapositiva ¬Q→¬P (a recíproca Q→P NÃO é equivalente). Quantificadores: negar 'todo' = 'algum não'; negar 'nenhum' = 'algum'.", "Sequências e padrões – como atacar": "Teste as diferenças entre termos (PA), as razões (PG), a soma dos dois anteriores (Fibonacci), os quadrados/cubos, e padrões alternados de duas sequências intercaladas (posições ímpares e pares). Em sequências com potências, lembre 2^n − 1, n², n³ e n!.", "Raciocínio lógico-verbal – método infalível": "1) Desenhe a 'fila'/ordem das relações (A > B > C). 2) Em questões de associação (pessoa × setor × cargo), monte a tabela de exclusão e vá eliminando: 'A não é X', 'B é Y' → riscar e completar. 3) Em questões de verdade/mentira, TESTE a hipótese dada no enunciado em todas as declarações e conte quantos mentem. 4) Cuidado com 'todo/algum/nenhum': de 'todo A é B' e 'algum B é C' NADA se conclui sobre A e C."}, "SEC": {"Arquivologia – três idades e métodos": "IDADE CORRENTE: uso frequente, no órgão produtor. INTERMEDIÁRIO: uso pouco frequente, aguardando destinação. PERMANENTE: guarda definitiva (valor histórico/informativo) — não pode ser eliminado. Instrumentos: PLANO DE CLASSIFICAÇÃO (organiza por função/atividade) e TABELA DE TEMPORALIDADE (prazos de guarda + destinação final). Métodos de arquivamento: alfabético (nome), numérico, geográfico, cronológico e IDEOGRÁFICO/por assunto (dicionário ou enciclopédico). Protocolo: recebe, registra, autua, distribui e controla a tramitação.", "5W2H e PDCA – planejamento na prática": "5W2H: What (o quê), Why (por quê), Who (quem), Where (onde), When (quando), How (como) e How much (quanto custa). PDCA: Plan (planejar metas e métodos) → Do (executar) → Check (verificar resultados vs. meta) → Act (agir corretivamente e padronizar) — base da melhoria contínua. Planejamento: ESTRATÉGICO (longo prazo, institucional), TÁTICO (médio prazo, setorial), OPERACIONAL (curto prazo, tarefas).", "Gerenciamento de projetos – PMBOK em uma página": "PROJETO: esforço temporário, produto/resultado único, com escopo, prazo e custo. PROCESSO: contínuo, repetitivo e permanente. Grupos de processos: INICIAÇÃO → PLANEJAMENTO → EXECUÇÃO → MONITORAMENTO E CONTROLE → ENCERRAMENTO. TAP (termo de abertura/project charter) autoriza o projeto e confere autoridade ao gerente. STAKEHOLDERS: todos que afetam ou são afetados. Áreas de conhecimento incluem escopo, tempo, custo, qualidade, riscos, comunicações, aquisições, recursos e partes interessadas. Benefícios podem ser tangíveis e intangíveis.", "Atendimento ao público – base legal": "Lei nº 13.460/2017 (Código de Defesa do Usuário): informação clara, atendimento sem discriminação, ouvidoria, participação e resposta às manifestações em até 30 dias, prorrogáveis por igual período com justificativa. Escuta ativa: ouvir com atenção, parafrasear, confirmar entendimento e registrar. LGPD: cuidado com dados pessoais no atendimento (não expor, ter finalidade, limitar o acesso)."}, "DA": {"Princípios e poderes – mnemônicos": "LIMPE (art. 37, caput): Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência. Implícitos: SUP (supremacia do interesse público), indisponibilidade, autotutela (Súmulas 346 e 473 do STF), motivação, razoabilidade, proporcionalidade, segurança jurídica, continuidade, especialidade. PODERES: hierárquico (organizar a Administração), disciplinar (punir servidores/particulares com vínculo), regulamentar (decreto para fiel execução da lei, privativo do Chefe do Executivo), de polícia (condicionar direitos em favor do interesse público — art. 78 do CTN) + deveres de agir, eficiência e probidade. ABUSO DE PODER = excesso (vício de competência) ou desvio (vício de finalidade).", "Atos administrativos – tudo em um quadro": "ELEMENTOS: CO-FI-FO-FOR-MO (Competência, Finalidade, Forma, Motivo, Objeto). ATRIBUTOS: PATI (Presunção de legitimidade, Autoexecutoriedade, Tipicidade, Imperatividade). EXTINÇÃO: REVOGAÇÃO = conveniência e oportunidade, efeitos EX NUNC, só atos discricionários, pela própria Administração; ANULAÇÃO = ilegalidade, efeitos EX TUNC, cabe autotutela e Judiciário (prazo decadencial de 5 anos, salvo má-fé — art. 54 da Lei 9.784/1999); CASSAÇÃO = descumprimento de condição pelo destinatário; CONVALIDAÇÃO = vícios sanáveis (competência não exclusiva e forma não essencial), efeitos retroativos (art. 55 da Lei 9.784/1999). SILÊNCIO ADMINISTRATIVO: não é ato, é fato; efeitos só quando a lei prevê.", "Organização administrativa – centralizado x descentralizado": "CENTRALIZAÇÃO: Estado executa por si (administração direta). DESCENTRALIZAÇÃO por SERVIÇOS/outorga: cria entidade (autarquia, fundação, empresa pública, SEM) e transfere a titularidade. DESCENTRALIZAÇÃO por COLABORAÇÃO: concessão/permissão (só a execução). DESCONCENTRAÇÃO: distribuição interna de competências na mesma pessoa jurídica (órgãos). CRIAÇÃO: autarquia é CRIADA por lei; empresa pública, SEM e fundação têm instituição AUTORIZADA por lei (art. 37, XIX, CF). Administração indireta: autarquias (regime público; agências reguladoras = autarquias em regime especial, dirigentes com mandato — Lei 9.986/2000), fundações públicas, empresas públicas (capital 100% público, qualquer forma), sociedades de economia mista (sociedade anônima, capital misto com controle público), sujeitas à Lei nº 13.303/2016. Consórcios públicos: Lei nº 11.107/2005.", "Licitações (Lei nº 14.133/2021) – o que decorar": "MODALIDADES (art. 28): pregão, concorrência, concurso, leilão, diálogo competitivo (acabaram convite e tomada de preços). FASES (art. 17): preparatória → divulgação do edital → apresentação de propostas e lances → julgamento → HABILITAÇÃO (depois do julgamento!) → recursal → homologação. CRITÉRIOS DE JULGAMENTO (art. 33): menor preço, maior desconto, melhor técnica ou conteúdo artístico, técnica e preço, maior lance (leilão), maior retorno econômico. CONTRATAÇÃO DIRETA: INEXIGIBILIDADE (art. 74: inviabilidade de competição — fornecedor exclusivo, artista consagrado, notória especialização, credenciamento) x DISPENSA (art. 75: pequeno valor, urgência/emergência, licitação deserta etc.). CONTRATOS: cláusulas exorbitantes (alteração e rescisão unilaterais, fiscalização, sanções), gestor e fiscal designados, sanções do art. 155 e seguintes (advertência, multa, impedimento de licitar e contratar, declaração de inidoneidade).", "Controle e responsabilidade do Estado": "CONTROLE: administrativo (autotutela, recursos), legislativo (fiscalização, sustação de atos, CPI), judicial (legalidade, art. 5º, XXXV), TRIBUNAL DE CONTAS (arts. 70 a 75: julgar contas de gestão, apreciar admissões e aposentadorias, aplicar sanções, emitir PARECER PRÉVIO sobre as contas do Chefe do Executivo) e SOCIAL (audiências públicas, conselhos, ouvidoria, LAI, ação popular). RESPONSABILIDADE CIVIL (art. 37, §6º): OBJETIVA (risco administrativo) por atos COMISSIVOS — conduta, dano e nexo; regresso contra o agente exige dolo ou culpa; excludentes: culpa exclusiva da vítima, fato de terceiro, caso fortuito/força maior. Por OMISSÃO: em regra subjetiva (culpa do serviço), salvo omissão específica/custódia.", "Serviços públicos, PPP e parcerias": "Lei nº 8.987/1995: CONCESSÃO (contrato, licitação na modalidade concorrência, prazo determinado, tarifa) x PERMISSÃO (contrato de adesão, precária) x AUTORIZAÇÃO (ato unilateral, precário). PPP (Lei nº 11.079/2004): modalidades PATROCINADA (tarifa + contraprestação do parceiro público) e ADMINISTRATIVA (Administração usuária; sem tarifa de usuário); exige prazo mínimo de 5 anos e repartição de riscos. MROSC (Lei nº 13.019/2014): termo de fomento (iniciativa da OSC), termo de colaboração (iniciativa da Administração) e acordo de cooperação (sem recu
