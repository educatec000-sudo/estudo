inistrativo é ramo do direito público que estuda o conjunto de princípios e normas que regem a Administração Pública — sua organização, seus agentes, seus atos, poderes, serviços, contratos e responsabilidade — e as relações jurídicas com os administrados. Fontes: lei (primária), jurisprudência, doutrina, costumes e princípios gerais. Crime de agente público é matéria penal (ainda que haja intersecção com o Direito Administrativo disciplinar).", "analise": "As demais opções reduzem indevidamente o objeto do ramo.", "ref": "Direito administrativo – conceito e objeto"}, {"id": "DA-002", "materia": "DA", "topico": "Princípios constitucionais do direito administrativo", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O princípio da autotutela permite que a Administração Pública:", "alternativas": ["revise seus próprios atos, anulando os ilegais e revogando os inconvenientes e inoportunos, respeitados os direitos adquiridos e a Súmula 473 do STF.", "deixe de cumprir decisão judicial transitada em julgado.", "revogue atos vinculados que já geraram direito adquirido.", "instaure tributo sem lei.", "pratique atos com dispensa de motivação."], "correta": 0, "comentario": "Autotutela (Súmulas 346 e 473 do STF): a Administração pode anular seus atos ilegais (controle de legalidade, efeitos ex tunc; prazo decadencial de 5 anos, salvo má-fé, na esfera federal — art. 54 da Lei nº 9.784/1999) e revogar os que se revelarem inconvenientes ou inoportunos (juízo de conveniência e oportunidade, efeitos ex nunc), respeitando direitos adquiridos e a apreciação judicial.", "analise": "B) a autotutela não afasta o controle judicial. C) ato vinculado não é revogável (apenas anulável, se ilegal). D) legalidade tributária. E) a motivação é exigida.", "ref": "Súmulas 346 e 473 do STF; art. 53 da Lei nº 9.784/1999"}, {"id": "DA-003", "materia": "DA", "topico": "Princípios constitucionais do direito administrativo", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O princípio da impessoalidade impõe, entre outras consequências:", "alternativas": ["a vedação de promoção pessoal de autoridades em publicidade de atos, obras e serviços públicos.", "a obrigatoriedade de vantagens a determinados grupos de interesse.", "a possibilidade de tratamento diferenciado por conveniência política.", "a dispensa de isonomia em licitações.", "que os atos administrativos sejam praticados conforme a vontade pessoal do gestor."], "correta": 0, "comentario": "A impessoalidade (art. 37, caput) tem dupla face: (i) dever de tratamento igualitário aos administrados (vetor para a isonomia e para a licitação), e (ii) vedação de promoção pessoal de autoridades em publicidade pública, conforme art. 37, §1º, da CF/88: 'A publicidade dos atos, programas, obras, serviços e campanhas dos órgãos públicos deverá ter caráter educativo, informativo ou de orientação social, dela não podendo constar nomes, símbolos ou imagens que caracterizem promoção pessoal de autoridades ou servidores públicos'.", "analise": "As demais opções contrariam o princípio.", "ref": "CF/88 art. 37, caput e §1º"}, {"id": "DA-004", "materia": "DA", "topico": "Organização administrativa", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A criação de uma entidade da administração indireta, como uma autarquia, depende de:", "alternativas": ["decreto autônomo do Poder Executivo.", "lei específica, sendo que, no caso das autarquias, a criação é feita diretamente por lei.", "resolução interna do órgão.", "portaria ministerial.", "autorização verbal do Chefe do Executivo."], "correta": 1, "comentario": "Art. 37, XIX, da CF/88: 'somente por lei específica poderá ser criada autarquia e autorizada a instituição de empresa pública, de sociedade de economia mista e de fundação, cabendo à lei complementar, neste último caso, definir as áreas de sua atuação'. Note-se a diferença: autarquia é CRIADA por lei; empresa pública e SEM têm instituição AUTORIZADA por lei (a criação efetiva se dá pelo registro dos atos constitutivos no órgão competente).", "analise": "A) decreto não cria autarquias. C, D e E) instrumentos insuficientes.", "ref": "CF/88 art. 37, XIX"}, {"id": "DA-005", "materia": "DA", "topico": "Administração indireta", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre as agências reguladoras, é CORRETO afirmar que:", "alternativas": ["são autarquias em regime especial, com dirigentes investidos de mandato fixo, e têm a função de regular, normatizar e fiscalizar serviços públicos e atividades econômicas.", "são empresas públicas de capital misto.", "são órgãos da administração direta sem personalidade jurídica.", "não possuem poder normativo.", "dependem de aprovação prévia do Congresso para cada ato de regulação."], "correta": 0, "comentario": "Agências reguladoras são autarquias em regime especial (autarquias sob regime especial), com estabilidade diferenciada dos dirigentes (mandato fixo, conforme a Lei nº 9.986/2000), competência normativa técnica, poder de fiscalização e de sanção, além de autonomia administrativa e financeira. Distinguem-se das agências executivas, que são entidades já existentes qualificadas por decreto após celebração de contrato de gestão (Lei nº 9.649/1998, art. 51).", "analise": "B) são autarquias, não empresas. C) têm personalidade jurídica. D) possuem poder normativo técnico. E) não há tal exigência.", "ref": "Agências reguladoras – Lei nº 9.986/2000"}, {"id": "DA-006", "materia": "DA", "topico": "Administração indireta", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Empresas públicas e sociedades de economia mista diferem, basicamente, quanto:", "alternativas": ["à forma jurídica: a empresa pública pode adotar qualquer forma societária admitida em direito, enquanto a sociedade de economia mista deve constituir-se como sociedade anônima.", "à natureza do serviço prestado.", "à subordinação ao Ministério.", "à necessidade de lei para instituição.", "ao regime de pessoal, que é de direito público em ambas."], "correta": 0, "comentario": "Empresa pública: capital social integralmente público (100%), qualquer forma jurídica admitida em direito (inclusive SA, inclusive EIRELI/limitada). Sociedade de economia mista: capital público com participação privada, sempre constituída como SOCIEDADE ANÔNIMA com ações com direito a voto controladas majoritariamente pela União/entidade pública. Ambas são pessoas jurídicas de direito privado, com regime de pessoal trabalhista (CLT), sujeitas à Lei nº 13.303/2016 (Lei das Estatais) e aos controles respectivos.", "analise": "As demais alternativas não expressam a distinção legal.", "ref": "Decreto-Lei nº 200/1967, art. 5º; Lei nº 13.303/2016"}, {"id": "DA-007", "materia": "DA", "topico": "Atos administrativos: conceito, elementos, atributos e classificação", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São elementos (requisitos) do ato administrativo:", "alternativas": ["competência, finalidade, forma, motivo e objeto", "legalidade, impessoalidade, moralidade, publicidade e eficiência", "presunção de legitimidade, autoexecutoriedade, tipicidade e imperatividade", "sujeito, objeto, forma e tempo", "mérito, oportunidade, conveniência e interesse público"], "correta": 0, "comentario": "Elementos/requisitos: CO-FI-FO-FOR-MO (competência, finalidade, forma, motivo, objeto). Destes, competência, finalidade e forma são sempre vinculados; motivo e objeto admitem juízo de mérito (discricionariedade) quando a lei deixa margem. Os atributos dos atos administrativos são a presunção de legitimidade, a autoexecutoriedade, a tipicidade e a imperatividade (mnemônico PATI).", "analise": "A opção B traz princípios; C, atributos; E, elementos do mérito administrativo.", "ref": "Atos administrativos – elementos"}, {"id": "DA-008", "materia": "DA", "topico": "Atos administrativos: extinção, revogação, anulação e convalidação", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A convalidação de ato administrativo:", "alternativas": ["é cabível para sanar vícios de competência (quando não exclusiva, ou seja, quando o ato puder ser ratificado por autoridade competente) e de forma (quando não essencial), produzindo efeitos retroativos.", "é cabível para corrigir vício de motivo, desde que o ato seja vinculado.", "é vedada em qualquer hipótese no ordenamento brasileiro.", "implica a renovação do ato para o futuro, com efeitos ex nunc.", "só pode ocorrer por decisão judicial."], "correta": 0, "comentario": "Convalidação (art. 55 da Lei nº 9.784/1999): 'Em decisão na qual se evidencie não acarretarem lesão ao interesse público nem prejuízo a terceiros, os atos que apresentarem defeitos sanáveis poderão ser convalidados pela própria Administração'. Vícios sanáveis: competência (não exclusiva) e forma (não essencial). A convalidação tem efeitos retroativos (ex tunc). Vícios de finalidade e de motivo (quando vinculado) não admitem convalidação; neste caso, cabe anulação.", "analise": "B) vício de motivo vinculado impõe anulação. C) a convalidação é admitida. D) seus efeitos são retroativos. E) é decisão da própria Administração.", "ref": "Lei nº 9.784/1999, art. 55"}, {"id": "DA-009", "materia": "DA", "topico": "Poderes e deveres da Administração Pública", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O poder de polícia administrativa caracteriza-se por:", "alternativas": ["ser atividade de condicionamento e restrição do exercício de direitos e de atividades em favor do interesse público, podendo ser preventivo (licenças, autorizações) ou repressivo (fiscalização, interdição, multa).", "decorrer do poder hierárquico e ser exercido apenas sobre servidores públicos.", "limitar-se à aplicação de sanções disciplinares.", "ser sempre discricionário e imotivado.", "ter natureza jurisdicional."], "correta": 0, "comentario": "Poder de polícia (art. 78 do CTN): atividade da Administração que, limitando ou disciplinando direito, interesse ou liberdade, regula a prática de ato ou abstenção de fato em razão de interesse público, podendo ser preventivo (ordens, licenças, autorizações, vistorias) e repressivo (fiscalização, multas, interdições, apreensões). Seus atributos incluem discricionariedade (relativa, pois há atos vinculados), autoexecutoriedade, coercibilidade e presunção de legitimidade. Não é função jurisdicional — a Administração não faz coisa julgada.", "analise": "B) aplicar poder de polícia sobre servidores é poder disciplinar. C) confunde com disciplinar. D) exige motivação. E) não é jurisdição.", "ref": "CTN art. 78; doutrina administrativista"}, {"id": "DA-010", "materia": "DA", "topico": "Abuso de poder: Lei nº 13.869/2019", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a Lei nº 13.869/2019 (Lei de Abuso de Autoridade), é CORRETO afirmar que:", "alternativas": ["a lei pune o agente público que, no exercício da função ou a pretexto de exercê-la, abuse do poder que lhe foi atribuído, exigindo dolo com finalidade específica, e prevê como efeitos da condenação a inabilitação para o exercício de cargo, mandato ou função pública pelo período de 1 a 5 anos, condicionada à reincidência e declarada motivadamente na sentença.", "pune qualquer pessoa, inclusive o particular que não exerça função pública.", "admite a modalidade culposa, dispensando finalidade específica.", "não prevê efeitos extrapenais na condenação.", "a pena prevista é de reclusão de 5 a 10 anos para todas as condutas."], "correta": 0, "comentario": "Lei nº 13.869/2019: reputa-se agente público todo aquele que exerce, ainda que transitoriamente ou sem remuneração, por eleição, nomeação, designação, contratação ou qualquer outra forma de investidura ou vínculo, mandato, cargo, emprego ou função em órgão ou entidade públicos (art. 1º, parágrafo único). O art. 1º, §1º exige DOLO com finalidade específica ('prejudicar outrem, beneficiar a si mesmo ou a terceiro, ou, ainda, por mero capricho ou satisfação pessoal'). Efeitos da condenação (art. 4º): tornar certa a obrigação de indenizar (I), inabilitação para o exercício de cargo, mandato ou função pública por 1 a 5 anos (II) e perda do cargo, mandato ou função pública (III) — os efeitos dos incisos II e III são condicionados à REINCIDÊNCIA em crime de abuso de autoridade e não são automáticos, devendo ser declarados motivadamente na sentença (art. 4º, parágrafo único). As penas são, em regra, de detenção (de 6 meses a 4 anos) e multa, além das penas restritivas de direitos do art. 5º.", "analise": "B) restringe-se ao agente público. C) não se admite culpa. D) os efeitos extrapenais estão expressamente previstos no art. 4º. E) as penas são de detenção (6 meses a 4 anos), em regra — não de reclusão de 5 a 10 anos.", "ref": "Lei nº 13.869/2019, arts. 1º, 4º e 5º"}, {"id": "DA-011", "materia": "DA", "topico": "Agentes públicos: espécies, cargo, emprego e função", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Cargo, emprego e função pública distinguem-se porque:", "alternativas": ["o cargo público é conjunto de atribuições criado por lei com denominação própria e vencimento pago pelos cofres públicos; o emprego público é regido pela CLT; e a função pública, em sentido amplo, é a atividade exercida por qualquer agente investido em ordem pública.", "cargo e emprego são sinônimos perfeitos.", "a função pública só pode ser exercida por servidores estatutários.", "o emprego público é criado apenas para cargos de direção.", "não há qualquer distinção relevante entre eles."], "correta": 0, "comentario": "Cargo público: criado por lei, com denominação própria, vencimento pago pelos cofres públicos, titulado por servidor estatutário (efetivo ou em comissão — art. 37, II e V, da CF). Emprego público: relação trabalhista (CLT), típica de empregados públicos das entidades da administração indireta e, excepcionalmente, no âmbito da administração direta (caso de funções contratadas sob regime celetista). Função pública em sentido amplo abrange as funções temporárias (art. 37, IX) e as funções de confiança. O STF firmou que o cargo em comissão também é cargo público, de livre nomeação e exoneração, mas de atribuições de direção, chefia e assessoramento.", "analise": "As demais opções negam ou confundem a distinção clássica.", "ref": "CF/88 art. 37, II, V e IX"}, {"id": "DA-012", "materia": "DA", "topico": "Lei nº 5.810/1994 (RJÚ dos servidores do Estado do Pará)", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A Lei estadual nº 5.810/1994, aplicável no âmbito do Estado do Pará, dispõe sobre:", "alternativas": ["o regime jurídico único dos servidores públicos civis da administração direta, das autarquias e das fundações públicas estaduais.", "o estatuto dos deputados estaduais.", "as normas de licitação do Estado.", "a organização do Tribunal de Contas do Estado.", "o plano de cargos do Poder Judiciário estadual."], "correta": 0, "comentario": "A Lei nº 5.810/1994 instituiu o Regime Jurídico Único dos servidores públicos civis da Administração Direta, das Autarquias e das Fundações Públicas do Estado do Pará, tratando, entre outros temas, de provimento, vacância, direitos e vantagens, licenças, regime disciplinar (deveres, proibições e penalidades) e processo administrativo disciplinar. É conteúdo cobrado diretamente no Anexo II.", "analise": "B) estatuto dos deputados é matéria do Regimento Interno e da CF; C) licitações seguem a Lei federal nº 14.133/2021; D) TCE tem lei orgânica própria; E) plano do Judiciário é matéria diversa.", "ref": "Lei estadual nº 5.810/1994 (Pará)"}, {"id": "DA-013", "materia": "DA", "topico": "Serviços públicos: concessão, permissão e autorização", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Segundo a Lei nº 8.987/1995, a concessão de serviço público caracteriza-se por:", "alternativas": ["delegação de serviço público mediante licitação, com formalização por contrato administrativo e remuneração do concessionário por tarifa cobrada dos usuários.", "ato unilateral precário, sem contrato.", "contrato de trabalho com o poder público.", "delegação por comodato.", "título de propriedade sobre o serviço público."], "correta": 0, "comentario": "Concessão (Lei nº 8.987/1995): delegação da prestação de serviço público, por licitação na modalidade concorrência, mediante contrato administrativo com prazo determinado, remuneração por tarifa (e outras receitas), com responsabilidade do concessionário pelo serviço. Permissão: delegação a título precário, mediante licitação, formalizada por contrato de adesão. Autorização: ato unilateral e precário, normalmente para serviços de interesse do próprio autorizatário (ex.: serviços individuais).", "analise": "As demais opções não correspondem às definições legais (arts. 2º e 40 da Lei nº 8.987/1995).", "ref": "Lei nº 8.987/1995, arts. 2º e 40"}, {"id": "DA-014", "materia": "DA", "topico": "Serviços públicos: Parcerias Público-Privadas (Lei nº 11.079/2004)", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São modalidades de parceria público-privada previstas na Lei nº 11.079/2004:", "alternativas": ["patrocinada e administrativa", "gerencial e operacional", "simples e composta", "ordinária e extraordinária", "direta e indireta"], "correta": 0, "comentario": "PPP patrocinada: concessão de serviços públicos em que, além da tarifa cobrada dos usuários, há contraprestação pecuniária do parceiro público (ex.: concessões com aporte do Estado). PPP administrativa: contrato de prestação de serviços de que a Administração Pública seja usuária direta ou indireta, sem cobrança de tarifa dos usuários. A lei veda PPP cujo objeto seja a contratação de serviços que não envolvam... e exige, entre outros requisitos, prazo mínimo de prestação de serviço superior a 5 anos e repartição objetiva de riscos.", "analise": "As demais opções são inexistentes na lei.", "ref": "Lei nº 11.079/2004, art. 2º"}, {"id": "DA-015", "materia": "DA", "topico": "Serviços públicos: Lei nº 13.460/2017 e Lei nº 13.019/2014", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A Lei nº 13.019/2014 (MROSC) disciplina:", "alternativas": ["as parcerias entre a Administração Pública e organizações da sociedade civil, como termos de fomento e de colaboração, precedidas de chamamento público.", "os contratos de concessão de serviços públicos.", "as licitações de obras públicas.", "a previdência complementar dos servidores.", "a responsabilidade fiscal dos entes federativos."], "correta": 0, "comentario": "A Lei nº 13.019/2014 estabelece o regime jurídico das parcerias voluntárias entre a administração pública e as organizações da sociedade civil (OSCs), com instrumentos como termo de fomento (iniciativas idealizadas pela OSC, com recursos públicos), termo de colaboração (ações propostas pela administração) e acordo de cooperação (sem transferência de recursos). A seleção ocorre, em regra, por chamamento público.", "analise": "B) Lei nº 8.987/1995; C) Lei nº 14.133/2021; D) LC nº 109/2001 e leis complementares; E) LC nº 101/2000.", "ref": "Lei nº 13.019/2014"}, {"id": "DA-016", "materia": "DA", "topico": "Licitações: Lei nº 14.133/2021", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São modalidades de licitação previstas na Lei nº 14.133/2021:", "alternativas": ["pregão, concorrência, concurso, leilão e diálogo competitivo", "tomada de preços, convite e tomada de decisão", "pregão, convite, concurso e leilão", "concorrência, tomada de preços, convite e leilão", "apenas pregão e concorrência"], "correta": 0, "comentario": "Art. 28 da Lei nº 14.133/2021: são modalidades de licitação o pregão, a concorrência, o concurso, o leilão e o diálogo competitivo. Foram extintas as antigas tomada de preços e convite (da Lei nº 8.666/1993). Pregão: bens e serviços comuns (obrigatório nessas hipóteses). Concorrência: obras e serviços de engenharia, além de bens e serviços especiais. Concurso: trabalho técnico, científico ou artístico. Leilão: alienação de bens. Diálogo competitivo: inovação, tecnologia, contratações de grande complexidade técnica.", "analise": "B, C e D incluem modalidades revogadas; E restringe indevidamente.", "ref": "Lei nº 14.133/2021, art. 28"}, {"id": "DA-017", "materia": "DA", "topico": "Licitações: Lei nº 14.133/2021", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre as fases do processo licitatório na Lei nº 14.133/2021, a sequência correta é:", "alternativas": ["preparatória, divulgação do edital, apresentação de propostas e lances, julgamento, habilitação, recursal e homologação", "habilitação, julgamento, divulgação, recursal e homologação", "divulgação, habilitação, apresentação, julgamento e encerramento", "apresentação, homologação, julgamento e recursal", "recursal, preparatória, julgamento e habilitação"], "correta": 0, "comentario": "Art. 17 da Lei nº 14.133/2021: as fases do processo licitatório são: I — fase preparatória; II — divulgação do edital de licitação; III — apresentação de propostas e de lances; IV — julgamento; V — habilitação; VI — fase recursal; VII — homologação. Regra geral: a habilitação ocorre DEPOIS do julgamento das propostas (inversão de fases), salvo hipóteses legais específicas (ex.: arts. 63 e 64 para pré-qualificação e procedimento de manifestação de interesse).", "analise": "A ordem invertida (habilitação antes do julgamento) correspondia ao modelo da Lei nº 8.666/1993.", "ref": "Lei nº 14.133/2021, art. 17"}, {"id": "DA-018", "materia": "DA", "topico": "Licitações: Lei nº 14.133/2021", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A contratação direta por INEXIGIBILIDADE de licitação ocorre, por exemplo, quando:", "alternativas": ["houver inviabilidade de competição, como na contratação de profissional do setor artístico consagrado pela crítica especializada ou pela opinião pública.", "os preços forem inferiores ao mercado.", "o objeto for de pequeno valor, dentro dos limites legais de dispensa.", "houver urgência decorrente de desastre.", "houver apenas um fornecedor cadastrado no órgão."], "correta": 0, "comentario": "Inexigibilidade (art. 74 da Lei nº 14.133/2021): hipóteses em que há inviabilidade de competição — fornecedor exclusivo (II), profissional do setor artístico consagrado (III), serviços técnicos especializados de natureza predominantemente intelectual com profissionais ou empresas de notória especialização (IV), objetos específicos de credenciamento (V). Já a DISPENSA (art. 75) decorre de razões objetivas previstas em lei: valores abaixo dos limites, urgência, situações emergenciais etc. Portanto, urgência por desastre e pequeno valor são hipóteses de DISPENSA, não de inexigibilidade.", "analise": "B) preço baixo não afasta a licitação. C) e D) são hipóteses de dispensa. E) a exclusividade deve ser comprovada (fornecedor exclusivo), não basta haver apenas um cadastrado.", "ref": "Lei nº 14.133/2021, arts. 74 e 75"}, {"id": "DA-019", "materia": "DA", "topico": "Contratos administrativos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "As cláusulas exorbitantes nos contratos administrativos incluem:", "alternativas": ["a alteração unilateral do contrato pela Administração, a rescisão unilateral, a fiscalização, a aplicação de sanções e a retomada do objeto.", "a impossibilidade de alteração do objeto.", "a renúncia à fiscalização.", "a vedação de aplicar sanções ao contratado.", "a suspensão do pagamento sem qualquer justificativa."], "correta": 0, "comentario": "Cláusulas exorbitantes (art. 104 e seguintes da Lei nº 14.133/2021) decorrem da supremacia do interesse público: alteração unilateral quantitativa/qualitativa, rescisão unilateral nas hipóteses legais, fiscalização da execução, aplicação direta de penalidades, ocupação temporária de bens, exigência de garantia, restrições à oposição da exceção do contrato não cumprido. Determinam também a duração e a extinção do contrato, a retomada do objeto e o equilíbrio econômico-financeiro (reajuste, revisão e repactuação).", "analise": "As demais opções negam atributos legais dessas cláusulas.", "ref": "Lei nº 14.133/2021, arts. 104 e ss."}, {"id": "DA-020", "materia": "DA", "topico": "Contratos administrativos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a execução e a fiscalização dos contratos administrativos, é CORRETO afirmar que:", "alternativas": ["cabe à Administração designar fiscal e gestor do contrato, registrar ocorrências e adotar as medidas necessárias à regularização, com anotação no processo de contratação.", "a fiscalização é facultativa e pode ser dispensada por conveniência.", "o contratado é responsável apenas pelos danos diretos causados.", "a Administração não pode rejeitar o objeto contratado.", "não há sanções previstas para o descumprimento contratual."], "correta": 0, "comentario": "A Lei nº 14.133/2021 (art. 117 e seguintes) exige a fiscalização técnica e administrativa: agente ou comissão fiscal designada, gestor do contrato, registro de ocorrências e comunicação formal de falhas. O contratado é responsável por danos causados a terceiros decorrentes da execução (art. 121) e sofre sanções (advertência, multa, impedimento de licitar e contratar, declaração de inidoneidade — arts. 155 a 163).", "analise": "As opções B a E contrariam os deveres legais de fiscalização e as responsabilidades do contratado.", "ref": "Lei nº 14.133/2021, arts. 117 a 121 e 155 a 163"}, {"id": "DA-021", "materia": "DA", "topico": "Controle da administração pública", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o controle exercido pelo Tribunal de Contas, é CORRETO afirmar que:", "alternativas": ["o Tribunal de Contas é órgão de controle externo que auxilia o Poder Legislativo, com competência para julgar as contas dos administradores, apreciar a legalidade dos atos de admissão de pessoal e de concessão de aposentadorias, aplicar sanções e emitir parecer prévio sobre as contas do Chefe do Executivo.", "o Tribunal de Contas integra o Poder Judiciário, exercendo jurisdição.", "o Tribunal de Contas julga criminalmente os agentes públicos.", "suas decisões são meramente opinativas, sem força coativa.", "só pode atuar mediante provocação do Ministério Público."], "correta": 0, "comentario": "Nos termos dos arts. 70 a 71, 73 e 75 da CF/88, o controle externo é exercido pelo Congresso Nacional (e assembleias estaduais) com auxílio dos Tribunais de Contas, que possuem competência para julgar contas, apreciar a legalidade dos atos de admissão e das aposentadorias e pensões (para registro), realizar inspeções e auditorias, aplicar sanções previstas em lei e emitir parecer prévio sobre as contas prestadas pelo Chefe do Executivo. Não integram o Judiciário e suas decisões têm natureza administrativa, com força coativa (títulos executivos extrajudiciais, conforme o art. 71, §3º).", "analise": "B) não é Judiciário. C) competência criminal é da Justiça. D) as decisões têm eficácia coercitiva. E) atua também de ofício.", "ref": "CF/88 arts. 70 a 75"}, {"id": "DA-022", "materia": "DA", "topico": "Controle da administração pública", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O controle social da administração pública manifesta-se, entre outros meios, por:", "alternativas": ["audiências públicas, conselhos de políticas públicas, ouvidorias, direito de petição e acesso à informação (LAI).", "decisões judiciais de mérito administrativo.", "pareceres prévios do Tribunal de Contas.", "representação de inconstitucionalidade perante o Tribunal de Justiça.", "avocação unilateral de competência por outro Poder."], "correta": 0, "comentario": "Controle social: participação e fiscalização direta pela sociedade — audiências e consultas públicas, conselhos gestores, ouvidorias, ação popular, denúncias, direito de petição (art. 5º, XXXIV, 'a', CF) e acesso à informação (Lei nº 12.527/2011). As demais opções descrevem controles judicial, exercido pelo TCE ou controle de constitucionalidade.", "analise": "B) e D) são controles judicial e de constitucionalidade; C) controle externo institucional; E) não é controle social.", "ref": "CF/88 art. 5º, XXXIII, XXXIV e LXXIII"}, {"id": "DA-023", "materia": "DA", "topico": "Responsabilidade civil do Estado", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Segundo o art. 37, §6º, da CF/88, a responsabilidade civil do Estado por atos comissivos de seus agentes é:", "alternativas": ["objetiva, fundada na teoria do risco administrativo, exigindo conduta, dano e nexo de causalidade, e admite causas excludentes como culpa exclusiva da vítima, fato de terceiro e caso fortuito ou força maior.", "subjetiva, exigindo prova de dolo ou culpa do agente em qualquer caso.", "absoluta, sem qualquer causa excludente.", "inexistente no ordenamento brasileiro.", "limitada à culpa exclusiva do agente, sem possibilidade de regresso."], "correta": 0, "comentario": "Art. 37, §6º, CF/88: 'As pessoas jurídicas de direito público e as de direito privado prestadoras de serviços públicos responderão pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado o direito de regresso contra o responsável nos casos de dolo ou culpa'. Adota-se a teoria da responsabilidade objetiva (risco administrativo): dispensa prova de culpa do Estado, exigindo conduta (comissiva), dano e nexo causal. Excludentes: culpa exclusiva da vítima, fato exclusivo de terceiro e caso fortuito/força maior. Em omissões, em regra aplica-se a teoria subjetiva (culpa do serviço), salvo omissões específicas em situações de custódia e risco.", "analise": "B) a culpa é dispensada. C) existem excludentes. E) o regresso é expressamente assegurado.", "ref": "CF/88 art. 37, §6º"}, {"id": "DA-024", "materia": "DA", "topico": "Responsabilidade civil do Estado", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o direito de regresso do Estado contra o agente causador do dano, é CORRETO afirmar que:", "alternativas": ["depende da comprovação de dolo ou culpa do agente, sendo a ação de regresso prescritível (em regra, 5 anos, na órbita civil, conforme a jurisprudência aplicável à Fazenda Pública).", "é automático, independentemente de dolo ou culpa.", "é vedado pelo ordenamento jurídico.", "extingue a responsabilidade do Estado perante a vítima.", "prescreve apenas em 20 anos."], "correta": 0, "comentario": "Art. 37, §6º, parte final: o direito de regresso é assegurado nos casos de DOLO OU CULPA do agente. A responsabilidade do Estado perante a vítima é objetiva, mas a ação regressiva é subjetiva. Quanto ao prazo, a jurisprudência do STJ aplica o prazo prescricional de 5 anos (Decreto nº 20.910/1932, que rege as ações contra a Fazenda) também às ações regressivas, discutindo-se a aplicação do prazo civil de 3 anos.", "analise": "B) exige dolo ou culpa. C) é expressamente previsto. D) a relação com a vítima é autônoma. E) 20 anos seria o prazo geral do Código Civil, não aplicável à Fazenda.", "ref": "CF/88 art. 37, §6º; Decreto nº 20.910/1932"}, {"id": "DA-025", "materia": "DA", "topico": "Organização administrativa: centralização, descentralização, concentração e desconcentração", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A criação de uma autarquia pelo Estado corresponde a um caso de:", "alternativas": ["descentralização administrativa por serviços, com transferência de titularidade da atividade a pessoa jurídica distinta.", "desconcentração, pois pressupõe apenas distribuição de competências dentro da mesma pessoa jurídica.", "centralização, pois o Estado permanece como titular exclusivo.", "delegação de serviço público por contrato.", "descentralização política, própria da federação."], "correta": 0, "comentario": "Descentralização administrativa por serviços (outorga): o Estado cria ou autoriza a criação de pessoa jurídica (autarquia, empresa pública, SEM, fundação) e transfere a titularidade da atividade — diferencia-se da descentralização por colaboração (contrato de concessão/permissão, que transfere apenas a execução). Desconcentração é a mera distribuição interna de competências dentro da mesma pessoa jurídica (criação de órgãos). Descentralização política é a que ocorre entre os entes federativos (União, Estados, DF e Municípios).", "analise": "B) não é desconcentração (há nova pessoa jurídica). C) não é centralização. D) não há contrato de concessão. E) não é descentralização política.", "ref": "Organização administrativa – descentralização e desconcentração"}, {"id": "DA-026", "materia": "DA", "topico": "Administração direta e órgão público", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre os órgãos públicos, é CORRETO afirmar que:", "alternativas": ["são centros de competência instituídos para o desempenho de funções estatais, desprovidos de personalidade jurídica, cuja criação e extinção dependem de lei.", "possuem personalidade jurídica própria.", "são criados por simples portaria do dirigente.", "respondem judicialmente em nome próprio pelos atos praticados por seus agentes.", "não integram a estrutura da Administração Pública."], "correta": 0, "comentario": "Órgão público é unidade de atuação integrante da estrutura da Administração, sem personalidade jurídica (teoria do órgão, de Otto Gierke — a vontade do órgão é imputada à pessoa jurídica a que pertence). Sua criação, organização e extinção dependem de lei (art. 48, X, da CF: compete ao Congresso dispor sobre criação, transformação e extinção de órgãos da administração pública; no âmbito estadual, competência análoga das assembleias legislativas). Capacidade processual: em regra, órgão não tem — embora a jurisprudência reconheça capacidade postulatória a certos órgãos de cúpula para defesa de suas prerrogativas.", "analise": "B) não têm personalidade jurídica. C) dependem de lei. D) quem responde é a pessoa jurídica. E) integram plenamente a estrutura.", "ref": "Teoria do órgão; CF/88 art. 48, X"}, {"id": "DA-027", "materia": "DA", "topico": "Processo administrativo no Estado do Pará: Lei nº 8.972/2020", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a disciplina do processo administrativo no âmbito da Administração Pública do Estado do Pará, é CORRETO afirmar que:", "alternativas": ["deve observar, entre outros parâmetros, os princípios da legalidade, finalidade, motivação, razoabilidade, proporcionalidade, ampla defesa, contraditório, segurança jurídica e interesse público, assegurando a participação e a defesa dos administrados.", "o processo administrativo estadual dispensa motivação das decisões.", "a ampla defesa é dispensável quando o ato é discricionário.", "o prazo para recurso administrativo é sempre de 3 dias.", "as decisões administrativas não admitem reconsideração."], "correta": 0, "comentario": "A Lei estadual nº 8.972/2020 disciplina o processo administrativo no âmbito da Administração Pública do Estado do Pará, seguindo a lógica da Lei federal nº 9.784/1999: princípios do processo administrativo, dever de motivação, ampla defesa e contraditório, participação do administrado, prazos para decisão e recursos administrativos, possibilidade de reconsideração e de revisão de ofício. As demais alternativas contrariam esses princípios, que decorrem diretamente do art. 5º, LIV e LV, da CF/88 (devido processo legal, contraditório e ampla defesa também nos processos administrativos).", "analise": "A ampla defesa é obrigatória inclusive em atos discricionários; a motivação é dever; prazos e recursos seguem a lei, não regras fixas inventadas.", "ref": "Lei estadual nº 8.972/2020 (Pará); CF/88 art. 5º, LIV e LV"}, {"id": "DA-028", "materia": "DA", "topico": "Atos administrativos em espécie e o silêncio administrativo", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o silêncio da Administração diante de requerimento do administrado, é CORRETO afirmar que:", "alternativas": ["não constitui ato administrativo, mas fato jurídico cujos efeitos dependem da lei; em regra, não representa deferimento tácito, salvo previsão legal expressa.", "é sempre ato administrativo tácito de deferimento.", "equivale sempre à negativa, com efeitos imediatos.", "impede o administrado de buscar a via judicial.", "só produz efeitos se notificado o interessado."], "correta": 0, "comentario": "O silêncio administrativo é fato jurídico (omissão da Administração), e não ato administrativo. Seus efeitos dependem do que dispõe a lei: em determinados casos, a lei atribui ao silêncio efeito de deferimento ou de indeferimento tácito; fora dessas hipóteses, o silêncio não produz efeitos automáticos, facultando ao administrado o uso das vias administrativas (recurso, eis que a omissão pode configurar denegação) e judiciais (mandado de segurança por omissão, ações ordinárias, inclusive contra a demora excessiva).", "analise": "B) o deferimento tácito exige previsão legal. C) a negativa tácita também depende de lei. D) o acesso ao Judiciário é assegurado (art. 5º, XXXV). E) a produção de efeitos não depende de notificação.", "ref": "Doutrina – silêncio administrativo"}, {"id": "DC-001", "materia": "DC", "topico": "Constituição: conceito, objeto, elementos e classificações", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Quanto à sua classificação, a Constituição Brasileira de 1988 é:", "alternativas": ["promulgada (democrática), rígida, escrita, analítica e formal", "outorgada, flexível, consuetudinária e sintética", "promulgada, semirrígida e não escrita", "outorgada, rígida e costumeira", "promulgada, superflexível, esquemática e substantiva"], "correta": 0, "comentario": "CF/88: PROMULGADA (elaborada por assembleia constituinte, fruto do poder constituinte originário com participação popular), RÍGIDA (alteração por processo especial: 3/5, dois turnos, dois turnos nas duas Casas — art. 60, §2º), ESCRITA (documento solene codificado), ANALÍTICA (extensa, com muitos dispositivos de detalhe) e FORMAL (considera-se constitucional o que está na Constituição, independentemente do conteúdo).", "analise": "As demais alternativas erram ao menos uma classificação (outorgada, flexível, semirrígida, não escrita, costumeira, superflexível, sintética).", "ref": "Classificação das constituições"}, {"id": "DC-002", "materia": "DC", "topico": "Aplicabilidade das normas constitucionais", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "As normas constitucionais de eficácia LIMITADA:", "alternativas": ["possuem aplicabilidade indireta, mediata ou reduzida, dependendo de lei regulamentadora; subdividem-se em normas de princípio institutivo (organizativo) e de princípio programático.", "têm aplicabilidade imediata e integral desde a promulgação.", "têm eficácia plena e podem ser restringidas pela lei.", "não existem no ordenamento brasileiro.", "são normas exclusivamente programáticas, sem qualquer efetividade."], "correta": 0, "comentario": "Classificação clássica de José Afonso da Silva: eficácia PLENA (aplicabilidade imediata e integral, não exige regulamentação); eficácia CONTIDA (aplicabilidade imediata, mas sujeita a restrição por lei — ex.: art. 5º, XIII, livre exercício profissional); eficácia LIMITADA (aplicabilidade mediata/indireta — princípio institutivo, que exige lei para criar órgãos/estruturas, e princípio programático, que fixa programas/objetivos, ex.: art. 3º e normas de direitos sociais).", "analise": "B) aplicabilidade mediata. C) normas contidas é que admitem restrição legal. D) existem. E) as programáticas produzem efeitos (mínimo existencial).", "ref": "Aplicabilidade das normas constitucionais"}, {"id": "DC-003", "materia": "DC", "topico": "Poder constituinte originário e derivado", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São características do poder constituinte originário:", "alternativas": ["ilimitado, incondicionado, autônomo e soberano", "subordinado aos poderes constituídos e condicionado às cláusulas pétreas", "deriva da Constituição anterior e segue o processo do art. 60", "permanente e reformável por lei ordinária", "delegado aos Estados membros"], "correta": 0, "comentario": "Poder constituinte originário: inicial (não deriva de outro poder), autônomo (estrutura livremente o Estado), ilimitado (não se submete a limites da ordem anterior) e incondicionado (não observa forma preestabelecida). Já o poder constituinte derivado reformador é secundário, limitado e condicionado (art. 60 da CF, incluindo cláusulas pétreas).", "analise": "As demais opções descrevem o poder derivado reformador/revisor ou o decorrente.", "ref": "Poder constituinte"}, {"id": "DC-004", "materia": "DC", "topico": "Cláusulas pétreas e limites ao poder de reforma", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "NÃO constitui cláusula pétrea expressa do art. 60, §4º, da CF/88:", "alternativas": ["a separação dos Poderes", "a forma federativa de Estado", "a forma republicana de governo", "os direitos e garantias individuais", "o voto direto, secreto, universal e periódico"], "correta": 2, "comentario": "Art. 60, §4º: não será objeto de deliberação a proposta tendente a abolir: I — a forma federativa de Estado; II — o voto direto, secreto, universal e periódico; III — a separação dos Poderes; IV — os direitos e garantias individuais. A FORMA REPUBLICANA de governo é cláusula pétrea IMPLÍCITA (decorrente do princípio republicano, art. 1º, e ligada à periodicidade do mandato), não expressa — esta é a pegadinha clássica.", "analise": "A, B, D e E são cláusulas pétreas expressas.", "ref": "CF/88 art. 60, §4º"}, {"id": "DC-005", "materia": "DC", "topico": "Direitos e garantias fundamentais", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São direitos previstos no art. 5º da CF/88, EXCETO:", "alternativas": ["direito de resposta proporcional ao agravo.", "livre manifestação do pensamento, vedado o anonimato.", "sigilo da fonte quando necessário ao exercício profissional.", "inviolabilidade da liberdade de consciência e de crença.", "remuneração do trabalho noturno superior à do diurno, prevista no rol de direitos sociais."], "correta": 4, "comentario": "A remuneração do trabalho noturno superior à do diurno é direito social (art. 7º, IX), não direito individual do art. 5º. Todos os demais itens estão expressamente no art. 5º: V (direito de resposta), IV (livre manifestação, vedado anonimato), XIV (sigilo da fonte), VI (liberdade de consciência e crença).", "analise": "Questão de literalidade — dominar a divisão entre art. 5º (individuais e coletivos), art. 6º (sociais), art. 7º (trabalhistas) e art. 14 (políticos) evita erros.", "ref": "CF/88 arts. 5º a 7º"}, {"id": "DC-006", "materia": "DC", "topico": "Remédios constitucionais: HC, MS, MI e HD", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O mandado de segurança é cabível para:", "alternativas": ["proteger direito líquido e certo, não amparado por habeas corpus ou habeas data, contra ato ilegal ou abusivo de autoridade pública ou agente de pessoa jurídica no exercício de atribuições do Poder Público.", "proteger a liberdade de locomoção.", "garantir o conhecimento de informações relativas à pessoa do impetrante constantes de registros públicos.", "supor a falta de norma regulamentadora que torne inviável o exercício de direitos.", "obter certidões de óbito em qualquer hipótese."], "correta": 0, "comentario": "Art. 5º, LXIX, CF: conceder-se-á mandado de segurança para proteger direito líquido e certo, não amparado por HC ou HD, quando o responsável pela ilegalidade ou abuso de poder for autoridade pública ou agente de pessoa jurídica no exercício de atribuições do Poder Público. O CABIMENTO exige direito líquido e certo (comprovável de plano por prova documental) e a existência de ato de autoridade.", "analise": "A) HC protege locomoção. B) HD cuida de conhecimento/retificação de dados pessoais. C) MI supre omissão normativa. E) certidões têm remédio próprio.", "ref": "CF/88 art. 5º, LXIX e LXX"}, {"id": "DC-007", "materia": "DC", "topico": "Organização do Estado: competências", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No federalismo brasileiro, a competência para legislar sobre direito civil é:", "alternativas": ["privativa da União, podendo ser delegada aos Estados por lei complementar.", "comum à União, aos Estados, ao DF e aos Municípios.", "concorrente entre União, Estados e DF, cabendo à União as normas gerais.", "exclusiva dos Municípios.", "suplementar dos Estados, com base em normas gerais dos Municípios."], "correta": 0, "comentario": "Art. 22, I, da CF: compete privativamente à União legislar sobre direito civil, comercial, penal, processual, eleitoral, agrário, marítimo, aeronáutico, espacial e do trabalho. A competência privativa admite DELEGAÇÃO aos Estados e ao DF por LEI COMPLEMENTAR (art. 22, parágrafo único). Note: a competência é privativa (delegável); a exclusiva (art. 21 — matérias administrativas da União) é indelegável.", "analise": "B) competência comum é material (art. 23). C) concorrente (art. 24) abrange matérias como direito tributário, financeiro, urbanístico, ambiental. D) e E) não corresponde ao sistema.", "ref": "CF/88 arts. 21, 22, 23 e 24"}, {"id": "DC-008", "materia": "DC", "topico": "Organização do Estado: intervenção", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A intervenção federal nos Estados pode ocorrer, entre outras hipóteses, para:", "alternativas": ["manter a integridade nacional, repelir invasão estrangeira, pôr termo a grave comprometimento da ordem pública e garantir o livre exercício de qualquer dos Poderes nas unidades da Federação.", "substituir a autonomia municipal por decisão do Prefeito.", "decretar a falência de empresas estatais.", "alterar a Constituição estadual por decreto.", "revogar leis municipais por conveniência política."], "correta": 0, "comentario": "Art. 34 da CF/88: a União não intervirá nos Estados nem no DF, exceto para: manter a integridade nacional; repelir invasão estrangeira ou de uma unidade da Federação em outra; pôr termo a grave comprometimento da ordem pública; garantir o livre exercício de qualquer dos Poderes nas unidades da Federação; reorganizar as finanças da unidade (socorro financeiro, garantia de dívida, ordem de execução de obrigações); prover a execução de lei federal, ordem ou decisão judicial; assegurar a observância do princípio constitucional da autonomia municipal, do princípio Republicano/forma federativa e da prestação contínua de contas. O decreto deve indicar prazo e condições (art. 36) e o controle é político-jurisdicional (art. 36, §§1º a 3º).", "analise": "As demais opções não estão no rol do art. 34.", "ref": "CF/88 arts. 34 a 36"}, {"id": "DC-009", "materia": "DC", "topico": "Dos Municípios e autonomia", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A autonomia municipal no Brasil compreende:", "alternativas": ["capacidade de auto-organização (lei orgânica), autogoverno (eleição de prefeito e vereadores), autoadministração e autolegislação sobre assuntos de interesse local.", "apenas a competência para legislar sobre direito civil.", "subordinação hierárquica ao Governo do Estado.", "a capacidade de celebrar tratados internacionais.", "a competência para editar medidas provisórias estaduais."], "correta": 0, "comentario": "A autonomia municipal (arts. 18 e 29 a 31 da CF) compreende: auto-organização por lei orgânica votada em dois turnos por 2/3 dos vereadores; autogoverno (eleição direta de prefeito, vice e vereadores); autoadministração (competência material de interesse local — art. 30, I e VIII); autolegislação (suplementar a legislação federal e estadual). O Município é ente federativo, sem subordinação hierárquica aos Estados, mas sujeito ao controle de constitucionalidade estadual (ADI estadual contra lei municipal, no STF por simetria).", "analise": "B) competência da União. C) não há hierarquia federativa. D) tratados são da União. E) medida provisória é do Chefe do Executivo federal (os Estados admitem medida provisória apenas se prevista na Constituição estadual — o que não é o caso da competência municipal).", "ref": "CF/88 arts. 18, 29 a 31"}, {"id": "DC-010", "materia": "DC", "topico": "Administração Pública na CF (disposições gerais)", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o regime constitucional dos servidores públicos, é CORRETO afirmar que:", "alternativas": ["a investidura em cargo ou emprego público depende de aprovação prévia em concurso público, ressalvadas as nomeações para cargo em comissão declarado em lei de livre nomeação e exoneração.", "o concurso público é dispensável para qualquer cargo efetivo.", "a estabilidade é adquirida após 5 anos de efetivo exercício.", "é permitida a acumulação remunerada de consultoria com cargo público efetivo, em qualquer hipótese.", "servidores não respondem por infrações disciplinares após a aposentadoria."], "correta": 0, "comentario": "Art. 37, II: a investidura em cargo ou emprego público depende de aprovação prévia em concurso público de provas ou de provas e títulos, ressalvadas as nomeações para cargo em comissão. Art. 41: estabilidade após 3 anos de efetivo exercício (para concursados), com avaliação especial de desempenho. Art. 37, X e XVI: acumulação remunerada vedada, salvo quando houver compatibilidade de horários e as hipóteses do art. 37, XVI (dois cargos de professor; professor + técnico/científico; duas funções de saúde com profissão regulamentada).", "analise": "B) concurso é regra. C) 3 anos. D) a acumulação é excepcional. E) as infrações disciplinares e responsabilidades podem alcançar fatos anteriores à aposentadoria (cassação de aposentadoria admite previsão legal).", "ref": "CF/88 arts. 37, 41"}, {"id": "DC-011", "materia": "DC", "topico": "Organização dos Poderes e freios e contrapesos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Compete privativamente à Câmara dos Deputados (e, por simetria, às assembleias legislativas em relação às matérias locais):", "alternativas": ["autorizar, por 2/3 dos membros, a instauração de processo contra o Presidente e o Vice-Presidente da República e os Ministros de Estado.", "processar e julgar o Presidente da República nos crimes de responsabilidade.", "promulgar emendas à Constituição.", "nomear os Ministros do Supremo Tribunal Federal.", "conceder anistia."], "correta": 0, "comentario": "Art. 51, I, CF (competência privativa da Câmara): autorizar, por 2/3 dos seus membros, a instauração de processo contra o Presidente, o Vice e os Ministros de Estado. Compete ao Senado (art. 52, I) processar e julgar nos crimes de responsabilidade; promulgar emendas constitucionais é das Mesas (art. 60, §3º); nomear Ministros do STF é do Presidente da República com aprovação do Senado (art. 101); conceder anistia é competência exclusiva do Congresso (art. 48, VIII).", "analise": "As demais opções atribuem as competências a órgãos diversos.", "ref": "CF/88 arts. 48, 51, 52, 101"}, {"id": "DC-012", "materia": "DC", "topico": "Atribuições do Congresso e competência exclusiva", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "É competência EXCLUSIVA do Congresso Nacional (art. 49 da CF), exercida sem sanção do Presidente da República:", "alternativas": ["sustar os atos normativos do Poder Executivo que exorbitem do poder regulamentar ou dos limites de delegação legislativa.", "legislar sobre direito tributário.", "editar medidas provisórias.", "decretar o estado de defesa.", "nomear Ministros de Estado."], "correta": 0, "comentario": "Art. 49, V, CF: é competência exclusiva do Congresso Nacional sustar os atos normativos do Poder Executivo que exorbitem do poder regulamentar ou dos limites de delegação legislativa — por DECRETO LEGISLATIVO, sem sanção presidencial. Esse é um dos principais mecanismos de freios e contrapesos entre Legislativo e Executivo e aparece no Anexo II da ALEPA (controle e fiscalização).", "analise": "B) competência legislativa da União (art. 22/24). C) medida provisória é do Presidente. D) estado de defesa é decretado pelo Presidente, com posterior apreciação do Congresso. E) Ministros de Estado são nomeados pelo Presidente (observados requisitos legais).", "ref": "CF/88 art. 49, V"}, {"id": "DC-013", "materia": "DC", "topico": "Funções essenciais à Justiça", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São funções essenciais à Justiça previstas na CF/88:", "alternativas": ["Ministério Público, Advocacia Pública, Advocacia e Defensoria Pública", "apenas o Poder Judiciário", "somente o Ministério Público e a Polícia Federal", "Tribunal de Contas e Ministério da Justiça", "Defensoria Pública e Conselhos Profissionais"], "correta": 0, "comentario": "Capítulo IV do Título IV da CF/88: Funções Essenciais à Justiça — Ministério Público (arts. 127 a 130), Advocacia Pública (arts. 131 e 132: Advocacia-Geral da União e Procuradorias dos Estados/DF, que representam os entes judicial e extrajudicialmente), Advocacia (art. 133: advogado é indispensável à administração da justiça) e Defensoria Pública (arts. 134 e 135: orientação jurídica e defesa dos necessitados).", "analise": "As demais alternativas não correspondem ao rol constitucional.", "ref": "CF/88 arts. 127 a 135"}, {"id": "DC-014", "materia": "DC", "topico": "Direitos sociais e direitos políticos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O voto é obrigatório no Brasil para:", "alternativas": ["maiores de 18 anos, sendo facultativo para os maiores de 70 anos, os analfabetos e os maiores de 16 e menores de 18 anos.", "todos os brasileiros, inclusive menores de 16 anos.", "apenas para os maiores de 21 anos.", "somente para quem tem ensino superior.", "apenas para filiados a partidos políticos."], "correta": 0, "comentario": "Art. 14, §1º, CF: o alistamento eleitoral e o voto são obrigatórios para os maiores de 18 anos e FACULTATIVOS para: I — os analfabetos; II — os maiores de 70 anos; III — os maiores de 16 e menores de 18 anos. O alistamento e o voto são vedados aos estrangeiros e, durante o serviço militar obrigatório, aos conscritos (art. 14, §2º). Direitos políticos negativos: perda e suspensão (art. 15).", "analise": "As demais alternativas contrariam o texto constitucional.", "ref": "CF/88 art. 14, §§1º e 2º"}, {"id": "DC-015", "materia": "DC", "topico": "Direitos e garantias fundamentais", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a aplicabilidade das normas de direitos e garantias fundamentais, é CORRETO afirmar que:", "alternativas": ["as normas definidoras dos direitos e garantias fundamentais têm aplicação imediata (art. 5º, §1º), e os direitos e garantias expressos na CF não excluem outros decorrentes do regime e dos princípios adotados, ou dos tratados internacionais em que o Brasil seja parte.", "apenas os direitos expressos no art. 5º são fundamentais.", "os tratados internacionais de direitos humanos têm hierarquia de lei ordinária, em qualquer caso.", "os direitos sociais não são fundamentais.", "não existe cláusula de abertura material na Constituição de 1988."], "correta": 0, "comentario": "Art. 5º, §1º: as normas definidoras dos direitos e garantias fundamentais têm APLICAÇÃO IMEDIATA. Art. 5º, §2º: os direitos e garantias expressos na Constituição não excluem outros decorrentes do regime e dos princípios por ela adotados, ou dos tratados internacionais em que a República Federativa do Brasil seja parte (cláusula de abertura material). Art. 5º, §3º: tratados de direitos humanos aprovados em cada Casa, em dois turnos, por 3/5, equivalem a EMENDAS CONSTITUCIONAIS; os não aprovados por esse rito equiparam-se a normas SUPRALEGAIS (STF, REx 466.343).", "analise": "As demais opções negam os §§1º a 3º do art. 5º.", "ref": "CF/88 art. 5º, §§1º a 4º"}, {"id": "DC-016", "materia": "DC", "topico": "Controle de constitucionalidade", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o controle de constitucionalidade brasileiro, é CORRETO afirmar que:", "alternativas": ["convivem o controle difuso (incidental, concreto, via exceção) e o concentrado (abstrato, via ação direta), cabendo ao STF o papel central no controle abstrato e no julgamento do recurso extraordinário.", "o Brasil adota exclusivamente o controle concentrado.", "o controle difuso é exercido apenas pelo STF.", "a ADI admite desistência após o ajuizamento.", "as decisões em ADI têm efeitos apenas entre as partes do processo."], "correta": 0, "comentario": "O Brasil adota sistema misto (híbrido): controle DIFUSO (qualquer juiz ou tribunal, incidentalmente, no caso concreto; o STF atua no recurso extraordinário; efeitos inter partes em regra, com possibilidade de ampliação pelo Senado — art. 52, X) e controle CONCENTRADO (ações diretas no STF: ADI, ADC, ADO e ADPF, com efeitos erga omnes e vinculantes). Na ADI não se admite desistência nem intervenção de terceiros (salvo o amicus curiae), e a decisão tem efeito vinculante e eficácia contra todos.", "analise": "B) sistema misto. C) difuso é de todos os órgãos judiciais. D) vedada a desistência. E) efeitos erga omnes.", "ref": "Controle de constitucionalidade – sistema brasileiro"}, {"id": "DC-017", "materia": "DC", "topico": "Interpretação das normas constitucionais", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O princípio interpretativo segundo o qual a norma constitucional deve ser interpretada de modo a preservar, na maior medida possível, a sua eficácia é o da:", "alternativas": ["máxima efetividade (ou da eficiência)", "unidade da Constituição", "concordância prática", "força normativa da Constituição", "interpretação conforme a Constituição"], "correta": 0, "comentario": "Princípios de interpretação constitucional: UNIDADE (a Constituição é um todo coerente, deve ser interpretada como um sistema), MÁXIMA EFETIVIDADE/EFICIÊNCIA (busca extrair o máximo de eficácia das normas), CONCORDÂNCIA PRÁTICA/HARMONIZAÇÃO (ponderação para que bens jurídicos em tensão coexistam), FORÇA NORMATIVA (a Constituição vincula efetivamente), INTERPRETAÇÃO CONFORME (deve-se buscar o sentido que a compatibilize com a Constituição), EXATIDÃO/PRESUNÇÃO DE CONSTITUCIONALIDADE das leis.", "analise": "As demais opções descrevem outros princípios interpretativos.", "ref": "Hermenêutica constitucional"}, {"id": "DC-018", "materia": "DC", "topico": "Princípios fundamentais", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São fundamentos da República Federativa do Brasil (art. 1º da CF/88):", "alternativas": ["soberania, cidadania, dignidade da pessoa humana, valores sociais do trabalho e da livre iniciativa e pluralismo político", "independência e harmonia entre os Poderes", "não intervenção e autodeterminação dos povos", "construir uma sociedade livre, justa e solidária", "erradicar a pobreza e a marginalização"], "correta": 0, "comentario": "Art. 1º: fundamentos — soberania, cidadania, dignidade da pessoa humana, valores sociais do trabalho e da livre iniciativa, pluralismo político (mnemônico SO-CI-DI-VA-PLU). Art. 3º: OBJETIVOS fundamentais — construir sociedade livre, justa e solidária; garantir o desenvolvimento nacional; erradicar a pobreza e reduzir as desigualdades; promover o bem de todos sem discriminações. Art. 4º: princípios nas RELAÇÕES INTERNACIONAIS — independência nacional, prevalência dos direitos humanos, autodeterminação dos povos, não intervenção, igualdade entre Estados, defesa da paz, solução pacífica dos conflitos, repúdio ao terrorismo e ao racismo, cooperação entre os povos, concessão de asilo político e integração latino-americana.", "analise": "B) art. 2º (Poderes). C) e E) relações internacionais e objetivos. D) objetivos fundamentais.", "ref": "CF/88 arts. 1º a 4º"}, {"id": "DC-019", "materia": "DC", "topico": "Garantias da magistratura e do Ministério Público", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São garantias dos membros do Ministério Público (art. 128, §5º, I, da CF/88):", "alternativas": ["vitaliciedade, inamovibilidade e irredutibilidade de subsídio — as mesmas garantias asseguradas aos magistrados.", "estabilidade após 3 anos e aposentadoria especial.", "mandato de 5 anos e recondução automática.", "livre demissão pelo Procurador-Geral.", "apenas a independência funcional."], "correta": 0, "comentario": "Art. 128, §5º, I: as garantias dos membros do MP são a vitaliciedade (após 2 anos de exercício, não podendo perder o cargo senão por sentença judicial transitada em julgado), a inamovibilidade (salvo por interesse público, mediante decisão administrativa com quorum e direito de defesa) e a irredutibilidade de subsídio (com observância do teto). A independência funcional é princípio institucional (art. 127, §1º). O MP é uno e indivisível e tem como chefe o Procurador-Geral (nomeado pelo Presidente, após aprovação da maioria absoluta do Senado, para mandato de 2 anos, permitida a recondução).", "analise": "As demais alternativas não correspondem às garantias constitucionais.", "ref": "CF/88 arts. 127 e 128"}, {"id": "DC-020", "materia": "DC", "topico": "Direitos e garantias fundamentais – remédios", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A ação popular (art. 5º, LXXIII, da CF/88) pode ser proposta por:", "alternativas": ["qualquer cidadão, para anular ato lesivo ao patrimônio público, à moralidade administrativa, ao meio ambiente e ao patrimônio histórico e cultural, ficando o autor, salvo comprovada má-fé, isento de custas judiciais e do ônus da sucumbência.", "qualquer pessoa, física ou jurídica.", "apenas pelo Ministério Público.", "apenas por partidos políticos com representação no Congresso.", "apenas por associações com mais de 5 anos de constituição."], "correta": 0, "comentario": "A ação popular exige a condição de CIDADÃO (eleitor no pleno gozo dos direitos políticos — capacidade eleitoral ativa), sendo vedado o ajuizamento por pessoa jurídica, estrangeiro ou quem esteja com direitos políticos suspensos. Objeto: atos lesivos ao patrimônio público ou de entidade de que o Estado participe, à moralidade administrativa, ao meio ambiente e ao patrimônio histórico e cultural (com a Lei nº 4.717/1965).", "analise": "B) exige cidadão (pessoa física + direito político ativo). C) MP pode atuar como parte pública autônoma, não impede o cidadão. D) e E) não são requisitos da ação popular.", "ref": "CF/88 art. 5º, LXXIII; Lei nº 4.717/1965"}, {"id": "DC-021", "materia": "DC", "topico": "Organização do Estado: repartição de receitas", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a repartição de receitas tributárias, é CORRETO afirmar que:", "alternativas": ["pertencem aos Estados e ao DF o produto da arrecadação do IR retido na fonte sobre rendimentos pagos por eles, suas autarquias e fundações, e 25% do ICMS arrecadado pelos Municípios.", "toda arrecadação do ICMS pertence à União.", "os Municípios não têm direito a qualquer parcela do ICMS.", "o ITR pertence integralmente aos Estados.", "a repartição de receitas é vedada pela Constituição."], "correta": 0, "comentario": "Art. 158, I e IV da CF: pertencem aos MUNICÍPIOS 100% do IRRF sobre rendimentos pagos por eles e suas autarquias e fundações, 50% do ITR, 50% do IPVA e 25% do ICMS (competência estadual). Art. 157: pertencem aos ESTADOS e ao DF o IRRF pago por eles e 20% do IR de competência da União (com repasse ao FPM). Art. 159 prevê os fundos de participação (FPE — 21,5%, FPM — 24,5% e Fundos de desenvolvimento).", "analise": "B, C e D contrariam o texto constitucional; E) a repartição é o coração do federalismo fiscal (arts. 157 a 162).", "ref": "CF/88 arts. 157 a 162"}, {"id": "DC-022", "materia": "DC", "topico": "Administração Pública na CF – responsabilidade", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A responsabilidade dos agentes públicos por improbidade administrativa decorre de previsão constitucional e acarreta, conforme o art. 37, §4º, da CF:", "alternativas": ["a suspensão dos direitos políticos, a perda da função pública, a indisponibilidade dos bens e o ressarcimento ao erário, sem prejuízo da ação penal cabível.", "apenas sanção pecuniária.", "somente a pena criminal.", "a demissão automática, independentemente de processo.", "a perda da cidadania."], "correta": 0, "comentario": "Art. 37, §4º: 'Os atos de improbidade administrativa importarão a suspensão dos direitos políticos, a perda da função pública, a indisponibilidade dos bens e o ressarcimento ao erário, na forma e gradação previstas em lei, sem prejuízo da ação penal cabível'. As sanções concretas, o dolo exigido e os prazos estão na Lei nº 8.429/1992, com as alterações da Lei nº 14.230/2021.", "analise": "As demais alternativas restringem ou inventam efeitos não previstos.", "ref": "CF/88 art. 37, §4º"}, {"id": "DC-023", "materia": "DC", "topico": "Poder Judiciário e precedentes", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a súmula vinculante (art. 103-A da CF/88), é CORRETO afirmar que:", "alternativas": ["o STF pode, de ofício ou por provocação, mediante decisão de 2/3 dos seus membros, após reiteradas decisões sobre matéria constitucional, editar enunciado que terá efeito vinculante em relação aos demais órgãos do Poder Judiciário e à administração pública direta e indireta, nas esferas federal, estadual e municipal.", "a súmula vinculante é editada pelo Congresso Nacional.", "o quorum para aprovação é de maioria simples.", "a súmula vinculante vincula apenas os juízes de primeiro grau.", "não cabe reclamação por seu descumprimento."], "correta": 0, "comentario": "Art. 103-A: o STF poderá, de ofício ou por provocação, mediante decisão de 2/3 dos seus membros, após reiteradas decisões sobre matéria constitucional, aprovar súmula que, a partir de sua publicação na imprensa oficial, terá efeito vinculante em relação aos demais órgãos do Poder Judiciário e à administração pública direta e indireta, nas esferas federal, estadual e municipal, bem como proceder à sua revisão ou cancelamento, na forma estabelecida em lei (Lei nº 11.417/2006). O descumprimento autoriza RECLAMAÇÃO ao STF, que pode anular o ato e determinar a adoção da providência cabível.", "analise": "B) competência do STF. C) 2/3. D) vincula todo o Judiciário e a administração. E) a reclamação é o instrumento previsto.", "ref": "CF/88 art. 103-A; Lei nº 11.417/2006"}, {"id": "DC-024", "materia": "DC", "topico": "Direitos fundamentais aplicados ao servidor", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A vedação de ingresso no serviço público sem concurso, a proibição de nomear cônjuge ou parente para cargo em comissão (Súmula Vinculante nº 13) e o teto remuneratório são manifestações dos princípios de:", "alternativas": ["legalidade, impessoalidade e moralidade administrativa", "autotutela e continuidade", "supremacia do interesse público sobre o privado e da autotutela", "eficiência, economicidade e publicidade", "hierarquia, disciplina e tutela"], "correta": 0, "comentario": "Concurso público = legalidade e impessoalidade (seleção objetiva, sem favorecimentos); nepotismo vedado = moralidade e impessoalidade (SV 13: 'A nomeação de cônjuge, companheiro ou parente em linha reta, colateral ou por afinidade, até o terceiro grau, inclusive, da autoridade nomeante ou de servidor da mesma pessoa jurídica investido em cargo de direção, chefia ou assessoramento para o exercício de cargo em comissão ou de confiança, ou, ainda, de função gratificada na administração pública direta e indireta, em qualquer dos Poderes da União, dos Estados, do DF e dos Municípios, compreendido o ajuste mediante designações recíprocas, viola a Constituição'); teto remuneratório = moralidade e igualdade.", "analise": "As demais opções reúnem princípios que não guardam relação direta com os três institutos citados.", "ref": "CF/88 art. 37, II, XI e §§; Súmula Vinculante 13"}, {"id": "DPC-001", "materia": "DPC", "topico": "Jurisdição constitucional: controle difuso e concentrado", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No controle difuso (incidental) de constitucionalidade, é CORRETO afirmar que:", "alternativas": ["a questão constitucional é decidida como prejudicial no caso concreto, por qualquer juiz ou tribunal, com efeitos em regra inter partes, cabendo ao Senado Federal suspender a execução do ato declarado inconstitucional pelo STF no recurso extraordinário (art. 52, X, da CF)", "somente o STF pode exercê-lo", "a decisão tem efeitos erga omnes automáticos", "é vedada a apreciação em primeiro grau", "só pode ser arguido por meio de ADI"], "correta": 0, "comentario": "Controle DIFUSO: qualquer juiz ou tribunal pode deixar de aplicar lei inconstitucional ao caso concreto (via incidental, como questão prejudicial), sendo o STF o órgão de cúpula via recurso extraordinário. A eficácia é, em regra, INTER PARTES e ex tunc. O art. 52, X, da CF atribui ao SENADO FEDERAL a competência para suspender a execução, no todo ou em parte, de lei declarada inconstitucional por decisão definitiva do STF — o que amplia os efeitos para erga omnes (não automático, depende de resolução do Senado), sendo esse o ponto mais cobrado em prova.", "analise": "B) qualquer juiz pode, incidentalmente. C) efeitos erga omnes exigem a suspensão pelo Senado (ou a técnica de ampliação). D) cabe em primeiro grau. E) ADI é instrumento do controle concentrado.", "ref": "CF/88 art. 52, X; controle difuso"}, {"id": "DPC-002", "materia": "DPC", "topico": "ADI, ADC e ADO (Lei nº 9.868/1999)", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a Ação Direta de Inconstitucionalidade (ADI), é CORRETO afirmar que:", "alternativas": ["tem legitimidade ativa restrita aos órgãos e entidades do art. 103 da CF, não admite desistência nem intervenção de terceiros (salvo o amicus curiae) e sua procedência gera efeitos erga omnes e vinculantes, com eficácia retroativa, ressalvada a modulação de efeitos (art. 27 da Lei nº 9.868/1999)", "qualquer cidadão tem legitimidade para propô-la", "admite desistência após o ajuizamento", "produz efeitos apenas entre as partes", "não admite pedido de liminar"], "correta": 0, "comentario": "A legitimidade para ADI está taxativamente no art. 103 da CF (Presidente, Mesa do Senado, Mesa da Câmara, Mesa de Assembleia Legislativa, Governador de Estado, PGR, Conselho Federal da OAB, partido político com representação no Congresso, confederação sindical ou entidade de classe de âmbito nacional). A ADI não admite desistência nem intervenção de terceiros, ressalvada a atuação do amicus curiae (Lei nº 9.868/1999, art. 7º, §2º). A decisão de mérito tem eficácia contra todos e efeito vinculante, e, em razão disso, a lei prevê a modulação de efeitos temporais (art. 27) por decisão de 2/3 dos membros do STF. A ADC exige demonstração de controvérsia judicial relevante e também admite modulação; a ADO tem por objeto omissão de medida para tornar efetiva norma constitucional.", "analise": "As demais alternativas contrariam o regime legal da ADI.", "ref": "CF/88 art. 103; Lei nº 9.868/1999"}, {"id": "DPC-003", "materia": "DPC", "topico": "ADPF (Lei nº 9.882/1999)", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A Arguição de Descumprimento de Preceito Fundamental (ADPF) é cabível:", "alternativas": ["quando for relevante o fundamento da controvérsia constitucional sobre lei ou ato normativo federal, estadual ou municipal, incluídos os anteriores à Constituição (caráter subsidiário)", "somente contra lei federal posterior à Constituição", "para discutir apenas questões de fato", "em substituição a qualquer recurso ordinário", "apenas para leis municipais"], "correta": 0, "comentario": "Lei nº 9.882/1999, art. 1º: 'A arguição prevista no §1º do art. 102 da Constituição Federal será proposta perante o Supremo Tribunal Federal, e terá por objeto evitar ou reparar lesão a preceito fundamental, resultado de ato do Poder Público'. Parágrafo único: 'Caberá também arguição de descumprimento de preceito fundamental: I — quando for relevante o fundamento da controvérsia constitucional sobre lei ou ato normativo federal, estadual ou municipal, incluídos os anteriores à Constituição'. Trata-se de instrumento de caráter SUBSIDIÁRIO (não cabível quando houver outro meio eficaz de sanar a lesão — §1º) e admite pedido de liminar e decisão com efeitos erga omnes e vinculantes.", "analise": "As demais alternativas restringem o objeto ou o caráter subsidiário do instituto.", "ref": "Lei nº 9.882/1999, art. 1º"}, {"id": "DPC-004", "materia": "DPC", "topico": "Controle de constitucionalidade estadual", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No âmbito estadual, o controle concentrado de constitucionalidade é exercido por meio de", "alternativas": ["representação de inconstitucionalidade (ADI estadual) perante o Tribunal de Justiça, tendo por parâmetro a Constituição Estadual, admitido o cabimento de recurso extraordinário ao STF e a possibilidade de a lei municipal ser questionada perante o TJ quando confrontada com a Constituição Estadual (competência do TJ, ressalvada a hipótese de a questão envolver apenas a Constituição Federal, quando cabe ao STF)", "ação direta perante o Tribunal de Contas", "ação popular", "mandado de segurança perante o STJ", "reclamação ao Conselho Nacional de Justiça"], "correta": 0, "comentario": "O art. 125, §2º, da CF prevê que os Estados podem instituir a REPRESENTAÇÃO DE INCONSTITUCIONALIDADE de leis ou atos normativos estaduais ou municipais em face da Constituição Estadual, com competência do TRIBUNAL DE JUSTIÇA para julgá-la, sendo vedada a legitimação a um único órgão (o rol deve observar o princípio da paridade). Quanto a leis municipais em face da Constituição Estadual, a competência é do TJ (STF, RE 220.912 e tema 560).", "analise": "As demais opções não correspondem ao desenho constitucional do controle estadual.", "ref": "CF/88 art. 125, §2º"}, {"id": "DPC-005", "materia": "DPC", "topico": "Súmulas vinculantes (Lei nº 11.417/2006) e reclamação", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a reclamação constitucional, é CORRETO afirmar que:", "alternativas": ["é a via processual para preservar a competência do tribunal, garantir a autoridade das suas decisões e a observância de enunciado de súmula vinculante e de decisão do STF em controle concentrado de constitucionalidade (art. 102, I, 'l', e art. 103-A, §3º, da CF), podendo, no âmbito estadual, ser admitida por simetria para preservar a eficácia das decisões do TJ no controle concentrado estadual", "é instrumento de recurso contra sentença", "substitui o mandado de segurança", "só é cabível no STF, em qualquer hipótese", "veda a anulação do ato reclamado"], "correta": 0, "comentario": "CF/88, art. 102, I, 'l': compete ao STF processar e julgar originariamente a RECLAMAÇÃO para a preservação de sua competência e garantia da autoridade de suas decisões. O art. 103-A, §3º, prevê a reclamação no caso de descumprimento de súmula vinculante. A jurisprudência (e o CPC, art. 988) disciplinam a reclamação para garantir a observância de acórdão proferido em julgamento de casos repetitivos ou de enunciado de súmula vinculante. No âmbito estadual, há previsão regimental/consolidada de reclamação para preservar decisões do TJ no controle concentrado estadual (art. 125, §2º, e simetria). A reclamação NÃO é recurso, mas ação de competência originária, e o STF pode anular o ato reclamado.", "analise": "B, C e D contrariam a natureza e o alcance do instituto.", "ref": "CF/88 arts. 102, I, 'l', e 103-A, §3º; CPC art. 988"}, {"id": "DPC-006", "materia": "DPC", "topico": "Remédios constitucionais: habeas data e mandado de injunção", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o habeas data e o mandado de injunção, é CORRETO afirmar que:", "alternativas": ["o habeas data destina-se a assegurar o conhecimento de informações relativas à pessoa do impetrante constantes de registros ou bancos de dados de entidades governamentais ou de caráter público, bem como a retificação de dados; o mandado de injunção é cabível para suprir a falta de norma regulamentadora que torne inviável o exercício dos direitos e liberdades constitucionais e das prerrogativas inerentes à nacionalidade, à soberania e à cidadania", "o habeas data serve para obter informações de terceiros, em qualquer hipótese", "o mandado de injunção exige o trânsito em julgado prévio de ação direta", "o mandado de injunção é instrumento de controle concentrado", "o habeas data não admite custas, salvo em caso de má-fé, o que também se aplica ao mandado de injunção"], "correta": 0, "comentario": "HABEAS DATA (art. 5º, LXXII, CF; Lei nº 9.507/1997): assegura o conhecimento de informações relativas à pessoa do impetrante constantes de registros ou bancos de dados de entidades governamentais ou de caráter público, a retificação de dados e a anotação de contestação. Também é assegurado o acesso a registros públicos ou privados quando o impetrante quiser conhecer ou retificar dados seus (a jurisprudência admite o HD de terceiro falecido para fins de partilha/seguro). MANDADO DE INJUNÇÃO (art. 5º, LXXI, CF; Lei nº 13.300/2016): cabível sempre que a falta de norma regulamentadora torne inviável o exercício de direitos e liberdades constitucionais e das prerrogativas inerentes à nacionalidade, à soberania e à cidadania; a decisão pode ter efeitos inter partes ou, excepcionalmente, efeitos erga omnes e ultrativos (quando o STF assim decidir, em favor de todos que se encontrem na mesma situação). O HD tem custas pelo impetrante vencido (art. 15 da Lei 9.507/1997), e o MI é isento de custas.", "analise": "As demais alternativas invertem conceitos (MI é instrumento do controle difuso da omissão, não do controle concentrado).", "ref": "CF/88 art. 5º, LXXI e LXXII; Leis nº 9.507/1997 e 13.300/2016"}, {"id": "DPC-007", "materia": "DPC", "topico": "Mandado de segurança individual e coletivo (Lei nº 12.016/2009)", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o mandado de segurança, é CORRETO afirmar que:", "alternativas": ["o prazo para impetrar é de 120 dias contados da ciência do fato pela parte, e a decisão que concede a segurança será recorrível por apelação, devendo o juiz, ainda que sem requerimento, determinar que se suspenda o ato imediatamente e que se cumpra a decisão enquanto não houver recurso (art. 12, §1º, e art. 14 da Lei nº 12.016/2009)", "o prazo para impetrar é de 30 dias", "o mandado de segurança não admite liminar", "a sentença que concede a segurança produz efeitos imediatos apenas com o trânsito em julgado", "o mandado de segurança coletivo pode ser impetrado por pessoa física isolada, em qualquer hipótese"], "correta": 0, "comentario": "Lei nº 12.016/2009: prazo DECADENCIAL de 120 DIAS contados da ciência do ato impugnado (art. 23); a decisão que concede a segurança produz efeitos imediatos, sendo vedado ao juiz negar a ordem por falta de recolhimento de custas ou por razões de ordem financeira (art. 12, §1º: 'o juiz determinará que se suspenda o ato que deu motivo ao pedido, quando necessário...', e a coisa julgada na sentença é prevista no art. 14, §1º: 'Da sentença, denegando ou concedendo o mandado, cabe apelação', com a sentença sujeita ao duplo grau obrigatório). O MS COLETIVO pode ser impetrado por partido político com representação no Congresso, organização sindical, entidade de classe ou associação legalmente const
