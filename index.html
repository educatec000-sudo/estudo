rsos); seleção por chamamento público. LGPD e ética se aplicam também aos serviços concedidos."}, "DC": {"Classificação da CF/88 e aplicabilidade": "CF/88 = promulgada, rígida (3/5 em dois turnos nas duas Casas), escrita, analítica e formal. Eficácia das normas (José Afonso da Silva): PLENA (aplicação imediata e integral), CONTIDA (imediata, mas restringível por lei — ex.: livre exercício profissional) e LIMITADA (mediata/indireta: princípio institutivo e princípio programático). Interpretação: unidade, máxima efetividade, concordância prática, força normativa, interpretação conforme, presunção de constitucionalidade.", "Cláusulas pétreas e poder constituinte": "Art. 60, §4º — não pode ser abolido por PEC: FORMA FEDERATIVA; VOTO DIRETO, SECRETO, UNIVERSAL E PERIÓDICO; SEPARAÇÃO DOS PODERES; DIREITOS E GARANTIAS INDIVIDUAIS (+ FORMA REPUBLICANA, implícita). Originário: inicial, autônomo, ilimitado e incondicionado. Derivado: reformador (art. 60, limitado e condicionado), revisor e decorrente (Estados, art. 25). Controle: ADI, ADC, ADO, ADPF e controle difuso.", "Direitos: art. 5º x art. 6º x art. 7º x art. 14": "Art. 5º = direitos e deveres individuais e coletivos (vida, igualdade, legalidade, liberdade, intimidade, propriedade, HC, HD, MS, MI, ação popular) + §§ (aplicação imediata, cláusula de abertura, tratados). Art. 6º = direitos sociais (educação, saúde, alimentação, trabalho, moradia, transporte, lazer, segurança, previdência, proteção à maternidade e à infância, assistência aos desamparados). Art. 7º = direitos dos trabalhadores urbanos e rurais. Art. 14 = direitos políticos: voto obrigatório a partir de 18 anos; FACULTATIVO para 16–18 anos, maiores de 70 e analfabetos; vedado a estrangeiros e conscritos. Art. 15: perda (cassação, incapacidade civil absoluta, condenação criminal transitada em julgado, recusa de deveres) e suspensão (incapacidade civil relativa, improbidade administrativa).", "Organização do Estado – competências": "Art. 21 = competências ADMINISTRATIVAS EXCLUSIVAS da União (indelegáveis). Art. 22 = competências LEGISLATIVAS PRIVATIVAS da União (delegáveis por LEI COMPLEMENTAR: direito civil, comercial, penal, processual etc.). Art. 23 = competência MATERIAL COMUM (União, Estados, DF e Municípios). Art. 24 = competência LEGISLATIVA CONCORRENTE (União: normas gerais; Estados: suplementar; se a União não edita normas gerais, o Estado exerce competência plena — superveniência da lei federal suspende o que lhe for contrário). Art. 30 = competências municipais (interesse local, suplementar). Art. 25, §2º: lei complementar estadual para assuntos de interesse regional.", "Remédios constitucionais – quadro comparativo": "HABEAS CORPUS: liberdade de locomoção (gratuito, qualquer pessoa, dispensada formalidade). HABEAS DATA: conhecer/retificar dados relativos ao impetrante (Lei nº 9.507/1997 — prazo de 40 dias para resposta da autoridade). MANDADO DE SEGURANÇA: direito líquido e certo não amparado por HC/HD (Lei nº 12.016/2009 — prazo de 120 dias, liminar, MS coletivo por partido/sindicato/entidade de classe/associação com 1 ano). MANDADO DE INJUNÇÃO: falta de norma regulamentadora (Lei nº 13.300/2016 — pode ter efeitos erga omnes). AÇÃO POPULAR: cidadão, atos lesivos ao patrimônio público/moralidade/ambiente/patrimônio cultural (Lei nº 4.717/1965). AÇÃO CIVIL PÚBLICA: MP e outros legitimados (Lei nº 7.347/1985).", "Controle de constitucionalidade – regras de ouro": "Sistema MISTO: difuso (qualquer juiz/tribunal, incidental, efeitos inter partes; o STF julga por recurso extraordinário; suspensão pelo Senado — art. 52, X) e concentrado (STF: ADI, ADC, ADO e ADPF, efeitos erga omnes e vinculantes). ADI: legitimados do art. 103 (rol taxativo), não admite desistência nem intervenção de terceiros (salvo amicus), admite modulação de efeitos por 2/3 (Lei nº 9.868/1999, art. 27). ADC: objeto = lei/ato FEDERAL, exige controvérsia judicial relevante. ADO: omissão de norma de eficácia limitada. ADPF: caráter SUBSIDIÁRIO, alcança direito pré-constitucional. Estadual: representação de inconstitucionalidade no TJ (art. 125, §2º), inclusive de lei municipal frente à Constituição Estadual."}, "PL": {"Espécies normativas e processo legislativo – visão geral": "Art. 59, CF: emendas à Constituição, leis complementares, leis ordinárias, leis delegadas, medidas provisórias, decretos legislativos e resoluções. FASES: iniciativa → discussão/votação → sanção ou veto → promulgação → publicação. QUÓRUNS: regra = maioria dos votos, presente a maioria absoluta dos membros (art. 47); lei complementar = maioria absoluta (art. 69); emenda constitucional = 3/5 em dois turnos (art. 60, §2º); rejeição de veto = maioria absoluta em escrutínio secreto (art. 66, §4º); CPI = requerimento de 1/3 (art. 58, §3º). DECRETO LEGISLATIVO e RESOLUÇÃO não vão à sanção (competências exclusivas/privativas da Casa).", "Sanção, veto, promulgação e publicação": "Prazo do Chefe do Executivo: 15 DIAS ÚTEIS para sancionar ou vetar, comunicando o Presidente da Casa em 48 horas. VETO: total ou parcial; parcial abrange TEXTO INTEGRAL de artigo, parágrafo, inciso ou alínea (art. 66, §2º); o veto é apreciado em sessão conjunta (no Estado, sessão da Assembleia) em até 30 dias, rejeitado por MAIORIA ABSOLUTA em escrutínio secreto; rejeitado o veto, o projeto é promulgado (se o Executivo não o fizer em 48 horas, promulga o Presidente da Casa). SANÇÃO TÁCITA: silêncio no prazo. PROMULGAÇÃO = atesta a existência da lei; PUBLICAÇÃO = dá publicidade e inicia a vacatio legis.", "Iniciativa – quem pode propor": "PARLAMENTAR, COMISSÕES, Executivo, Judiciário, MP (nas matérias de sua competência) e POPULAR (federal: 1% do eleitorado nacional, distribuído por 5 Estados, com 0,3% em cada — art. 61, §2º; nos Estados: 'a lei disporá' — art. 27, §4º). PRIVATIVA/RESERVADA do Chefe do Executivo (art. 61, §1º, II, por simetria nos Estados): criação de cargos e aumento de remuneração, organização administrativa, regime jurídico dos servidores, PPA/LDO/LOA e matérias orçamentárias. Vício de iniciativa = inconstitucionalidade formal (o STF admite o saneamento quando a lei já existe e não há aumento de despesa).", "Comissões – permanentes, temporárias e CPI": "PERMANENTES: subsistem por toda a legislatura; podem concluir pela APRECIAÇÃO TERMINATIVA (dispensa o Plenário salvo recurso de 1/10 dos membros — art. 58, §2º, I); podem realizar audiências públicas, convocar autoridades, receber petições. TEMPORÁRIAS: extinguem-se ao fim da legislatura, da missão ou do prazo. CPI: requerimento de 1/3, fato determinado, prazo certo; poderes instrutórios próprios de autoridade judicial (requisição de documentos, oitiva, quebra de sigilo bancário/fiscal/telefônico em dados, busca e apreensão), vedadas medidas de competência exclusiva do Judiciário (busca domiciliar, interceptação telefônica) e o indiciamento; conclusões vão ao MP. Na ALEPA: CCJ (constitucionalidade, legalidade, juridicidade, técnica legislativa e REDACÃO FINAL) e CCFO (PPA/LDO/LOA, emendas orçamentárias e fiscalização financeira).", "Técnica legislativa – LC 95/1998 (o que mais cai)": "ESTRUTURA (art. 3º): parte PRELIMINAR (epígrafe, ementa, preâmbulo, enunciado do objeto e âmbito de aplicação) + parte NORMATIVA + parte FINAL (medidas de implementação, disposições transitórias e cláusulas finais). ART. 7º: a lei não conterá matéria estranha ao objeto. ART. 8º: vigência expressa e com prazo razoável de conhecimento. ART. 9º: a cláusula de revogação deve ENUMERAR expressamente (vedada 'revogam-se as disposições em contrário'). ART. 11: clareza, precisão e ordem lógica (art. 1º = objeto/âmbito; art. 2º = definições; dispositivos substantivos; últimos dispositivos = vigência/revogações). ART. 12: alteração por substituição de dispositivo, revogação parcial ou reprodução integral, MANTIDA A NUMERAÇÃO (acréscimos com letras A, B, C) e com a sigla (NR) nos dispositivos alterados. LINDB, art. 1º: sem previsão, a lei vigora após 45 dias (União), 30 (Estados) e 15 (Municípios).", "Orçamento no processo legislativo": "PPA (4 anos, do 2º ano do mandato ao 1º do seguinte), LDO (anual: metas e prioridades, orientação para a LOA, alterações tributárias, política das agências de fomento) e LOA (anual: orçamento fiscal, de investimento das estatais e da seguridade social). Emendas parlamentares (art. 166, §3º): compatíveis com PPA e LDO, com indicação de recursos (inclusive por anulação de despesa, vedado anular pessoal, dívida, transferências constitucionais e investimentos plurianuais em andamento) e pertinentes. Vedação do art. 167: iniciar programa sem previsão na LOA, exceder créditos, vincular receita de impostos (com exceções), transpor/remanejar sem autorização. Créditos adicionais: suplementares, especiais e extraordinários (Lei nº 4.320/1964, arts. 40 a 46); extraordinários por decreto, com comunicação imediata ao Legislativo."}, "DF": {"LRF – números e prazos essenciais": "Abrangência: todos os Poderes e entes, administração direta, autarquias, fundações, fundos e empresas dependentes. RELATÓRIOS: RREO = a cada BIMESTRE (publicação em até 30 dias após o bimestre); RGF = a cada QUADRIMESTRE (e SEMESTRALMENTE no último ano de mandato), publicação em até 30 dias. LIMITE DE PESSOAL: União 50% da RCL (0,6% MP, 2,5% Legislativo, 6% Judiciário, 40,9% Executivo); ESTADOS 60% (3% Legislativo, 6% Judiciário, 2% MP, 49% Executivo); Municípios 60% (6% Legislativo, 54% Executivo). Excesso deve ser eliminado em 2 quadrimestres, com pelo menos 1/3 no primeiro. RENÚNCIA DE RECEITA (art. 14): estimativa de impacto no exercício e nos 2 seguintes + compensação ou previsão na LOA. FIM DE MANDATO (art. 42): vedado assumir obrigação sem disponibilidade de caixa nos 2 últimos quadrimestres. Operações de crédito e ARO têm vedações próprias (art. 38).", "Lei nº 4.320/1964 e princípios orçamentários": "Princípios do art. 2º: UNIDADE, UNIVERSALIDADE e ANUALIDADE — somados aos da doutrina/CF: legalidade, exclusividade, especificação (discriminação), não afetação de impostos, equilíbrio, publicidade, clareza e orçamento bruto. ESTÁGIOS DA DESPESA: FIXAÇÃO → EMPENHO (cria a obrigação de pagamento — art. 58) → LIQUIDAÇÃO (verifica o direito do credor — art. 63) → PAGAMENTO (art. 64). ESTÁGIOS DA RECEITA: PREVISÃO → LANÇAMENTO → ARRECADAÇÃO → RECOLHIMENTO (art. 35 e seguintes). Créditos adicionais: suplementares, especiais e extraordinários (art. 41).", "CF arts. 165 a 169 – ciclo orçamentário": "CICLO: elaboração (Executivo) → discussão/aprovação (Legislativo, com parecer da comissão competente — na ALEPA, a CCFO) → execução → avaliação e controle. Prazos federais: o Executivo envia PPA e LOA até 31 de agosto e a LDO até 15 de abril (ADCT art. 35, com a redação da EC 109/2021 para a LDO), com prazos próprios fixados nas constituições estaduais. Vedação de estorno: não se pode transpor/remanejar recursos sem autorização legislativa. Sessão legislativa não termina sem a aprovação da LOA (art. 57, §3º, II, da CF — a sessão não será encerrada sem a votação do projeto de LOA)."}, "DPREV": {"Seguridade social – estrutura e princípios": "CF, arts. 194 a 204: SEGURIDADE = saúde + previdência + assistência social. Objetivos (art. 194, parágrafo único): universalidade da cobertura e do atendimento; uniformidade e equivalência dos benefícios às populações urbanas e rurais; seletividade e distributividade; irredutibilidade do valor dos benefícios; equidade na participação no custeio; diversidade da base de financiamento; gestão quadripartite (trabalhadores, empregadores, aposentados e Governo). CUSTEIO (art. 195): empregador (folha, receita/faturamento, lucro), trabalhador e demais segurados, receita de concursos de prognósticos, importadores e recursos dos orçamentos públicos. Origem histórica: Lei Eloy Chaves (1923).", "RGPS – segurados, dependentes e carência": "SEGURADOS OBRIGATÓRIOS (art. 11 da Lei nº 8.213/1991): empregado (inclui doméstico, temporário e aprendiz), contribuinte individual, trabalhador avulso e segurado especial. FACULTATIVO: contribui por opção (sem atividade obrigatória). DEPENDENTES (art. 16): Classe 1 — cônjuge/companheiro, filho menor de 21 anos ou inválido/deficiente (dependência presumida); Classe 2 — pais (dependência econômica comprovada); Classe 3 — irmão menor de 21 anos ou inválido (dependência comprovada). Classes anteriores excluem as posteriores. FILIAÇÃO: automática para o obrigatório (não depende de inscrição). CARÊNCIA: 12 contribuições (auxílio por incapacidade); 180 (aposentadoria por idade e por tempo de contribuição); sem carência: pensão por morte, salário-família, auxílio-acidente e auxílio por incapacidade por acidente do trabalho.", "EC 103/2019 – o que mudou": "RGPS: idade mínima de 65 anos (homem) e 62 (mulher) na aposentadoria por idade (regra geral), com 15 anos de carência (mulher) e 20 anos (homem, se filiado após a reforma); CÁLCULO: 60% da média de TODOS os salários de contribuição desde 07/1994 + 2 pontos percentuais por ano que exceder 20 (homem) ou 15 (mulher) — art. 26 da EC. RPPS: idade mínima de 65/62 anos, 25 anos de contribuição, 10 anos de serviço público e 5 anos no cargo (art. 40, §1º); professores 60/57 anos com 25 anos de contribuição; aposentadoria compulsória aos 75 anos; os entes podem fixar o teto do RGPS com previdência complementar obrigatória para os novos servidores (RPC).", "Prazos e ações previdenciárias": "DECADÊNCIA: 5 anos para revisão do ato de concessão/indeferimento (art. 103 da Lei nº 8.213/1991); 10 anos para a revisão administrativa (art. 103-A). PRESCRIÇÃO: 5 anos das parcelas vencidas (Súmula 85 do STJ). CONTAGEM RECÍPROCA: assegurada (art. 201, §9º, da CF) entre RGPS e RPPS, com compensação financeira e Certidão de Tempo de Contribuição (Lei nº 9.796/1999); vedada a dupla contagem. PREVIDÊNCIA COMPLEMENTAR (art. 202): facultativa, autônoma, organizada em fundos/planos. Ações: JEF (até 60 salários mínimos), Justiça Estadual/Federal conforme o caso, com reexame necessário nas ações contra o INSS."}, "DCIV": {"LINDB – regras de aplicação": "Art. 1º: vigência após 45 dias da publicação (salvo disposição contrária); no exterior, 3 meses após. Art. 2º: revogação por lei posterior; §3º: vedada a REPRISTINAÇÃO automática (só se expressa). Art. 3º: ninguém se escusa de cumprir a lei alegando desconhecimento. Art. 4º: INTEGRAÇÃO por analogia, costumes e princípios gerais do direito. Art. 5º: interpretação quanto ao fim social e às exigências do bem comum. Art. 6º: proteção do ato jurídico perfeito, direito adquirido e coisa julgada. Arts. 20 a 24 (Lei nº 13.655/2018): consideração das consequências práticas, transição para mudança de entendimento e segurança jurídica no direito público.", "Pessoas naturais – personalidade e incapacidade": "Art. 2º: personalidade começa do NASCIMENTO COM VIDA (teoria natalista), salvo direitos do nascituro desde a concepção. CAPACIDADE PLENA: 18 anos (art. 5º) — cessação da incapacidade também por emancipação (voluntária/judicial), casamento, emprego público efetivo, colação de grau superior e estabelecimento próprio. ABSOLUTAMENTE INCAPAZES (art. 3º, após a Lei nº 13.146/2015): apenas MENORES DE 16 ANOS. RELATIVAMENTE INCAPAZES (art. 4º): maiores de 16 e menores de 18; ébrios habituais e viciados em tóxico; aqueles que, por causa transitória ou definitiva, não puderem exprimir sua vontade; pródigos. Pessoas com deficiência: não são automaticamente incapazes (tomada de decisão apoiada — art. 1.783-A).", "Bens e negócios jurídicos": "BENS PÚBLICOS (art. 99): uso comum do povo, uso especial e dominicais — impenhoráveis (precatório) e imprescritíveis (art. 102). NEGÓCIO JURÍDICO: requisitos de validade (art. 104): agente capaz, objeto lícito/possível/determinável e forma prescrita ou não defesa em lei. DEFEITOS: erro, dolo, coação, estado de perigo, lesão e fraude contra credores (anuláveis — art. 171); simulação e fraude à lei (NULOS — arts. 166 e 167). PRESCRIÇÃO: geral de 10 anos (art. 205); especiais de 1, 2, 3, 4 e 5 anos (art. 206); pode ser alegada em qualquer grau, vedada a renúncia antecipada e alteração por acordo das partes. DECADÊNCIA: não se suspende nem se interrompe, em regra."}, "DPCIV": {"Normas fundamentais e ação": "Arts. 1º a 12 do CPC: devido processo legal, inafastabilidade da jurisdição (art. 3º: não se excluirá da apreciação jurisdicional ameaça ou lesão a direito), autocomposição estimulada, contraditório (art. 7º e art. 10: vedada decisão surpresa), primazia do mérito (art. 4º), cooperação (art. 6º), paridade, duração razoável, ordem cronológica (art. 12). CONDIÇÕES DA AÇÃO: legitimidade e interesse (possibilidade jurídica migrou para o mérito). PRESSUPOSTOS PROCESSUAIS: subjetivos (juiz competente/imparcial, capacidade das partes e postulatória) e objetivos (petição inicial apta, citação válida, ausência de litispendência/coisa julgada).", "Tutelas provisórias e provas": "TUTELA DE URGÊNCIA (art. 300): probabilidade do direito + perigo de dano ou risco ao resultado útil; vedada a antecipada quando houver perigo de irreversibilidade (salvo a irreversibilidade da própria situação). Tutela de EVIDÊNCIA (art. 311): dispensa o perigo. Tutela ANTECEDENTE (arts. 303 e 304: estabilização se não houver recurso) e INCIDENTAL. PROVAS: ônus do autor quanto ao fato constitutivo e do réu quanto a fato impeditivo/modificativo/extintivo (art. 373), com possibilidade de DISTRIBUIÇÃO DINÂMICA (art. 373, §1º); o juiz aprecia a prova livremente, mas deve fundamentar.", "Petição inicial, revelia e sentença": "PETIÇÃO INICIAL (art. 319): juízo, partes, fatos e fundamentos, pedido, valor da causa. INDEFERIMENTO (art. 330): inépcia, ilegitimidade, falta de interesse, pedido indeterminado. IMPROCEDÊNCIA LIMINAR (art. 332): súmula do STF/tribunal superior, SV, IRDR, IAC, repetitivos. AUDIÊNCIA DE CONCILIAÇÃO (art. 334): em regra antes da contestação. REVELIA (arts. 344 a 346): presunção RELATIVA de veracidade, afastada se houver pluralidade com contestação de algum réu, direitos indisponíveis, instrumento essencial ausente ou fatos inverossímeis. SENTENÇA (art. 489): relatório + fundamentação (que enfrente os argumentos) + dispositivo. COISA JULGADA MATERIAL (art. 502): imutabilidade da decisão de mérito não mais sujeita a recurso."}, "DPC": {"Controle difuso x concentrado – quadro de prova": "DIFUSO (incidental/concreto): qualquer juiz ou tribunal; efeitos inter partes; no STF via recurso extraordinário; suspensão da execução pelo SENADO (art. 52, X) para efeitos gerais; cláusula de reserva de plenário para declaração de inconstitucionalidade por tribunais (art. 97 da CF e Súmula Vinculante 10). CONCENTRADO (abstrato, via ação): STF — ADI, ADC, ADO e ADPF; efeitos erga omnes e vinculantes; modulação de efeitos (2/3; Lei nº 9.868/1999, art. 27). ESTADUAL: representação de inconstitucionalidade no TJ (art. 125, §2º), competente também para lei municipal frente à Constituição Estadual.", "Ações de controle – requisitos que decidem questão": "ADI: legitimados do art. 103 (rol taxativo); objeto = lei/ato normativo federal ou estadual; não admite desistência nem intervenção de terceiros (salvo amicus curiae); liminar por maioria absoluta com efeito erga omnes. ADC: objeto = lei/ato FEDERAL; exige CONTROVÉRSIA JUDICIAL RELEVANTE. ADO: omissão de medida para tornar efetiva norma constitucional (ciência ao órgão omisso, prazo de 30 dias). ADPF: caráter SUBSIDIÁRIO; alcança atos municipais e o direito pré-constitucional. RECLAMAÇÃO: preserva competência, garante autoridade das decisões e a observância de súmula vinculante (art. 102, I, 'l', e art. 103-A, §3º).", "Remédios e tutela contra o Poder Público": "HD (Lei nº 9.507/1997): conhecer/retificar dados do impetrante; prazo de 40 dias para resposta; 15 dias para o impetrante complementar. MS (Lei nº 12.016/2009): prazo DECADENCIAL de 120 dias; liminar; MS coletivo (partido, sindicato, entidade de classe, associação com 1 ano); não cabe MS contra lei em tese nem contra decisão judicial transitada em julgado (salvo ato de juiz absolutamente contrário a texto expresso de lei). MI (Lei nº 13.300/2016): pode ter efeitos erga omnes. TUTELA PROVISÓRIA CONTRA O PODER PÚBLICO (Lei nº 8.437/1992): vedada liminar que esgote o objeto; suspensão pelo presidente do tribunal; exceções jurisprudenciais (saúde — Súmulas 729 e 730 do STF)."}, "DH": {"Genealogia e marcos históricos": "Magna Carta (1215) → Petition of Rights (1628) → Habeas Corpus Act (1679) → Bill of Rights (1689) → Declaração de Independência dos EUA (1776) → Declaração dos Direitos do Homem e do Cidadão (1789) → Constituição de Weimar (1919, direitos sociais) → Declaração Universal dos Direitos Humanos (1948) → Pactos Internacionais de 1966 → sistemas regionais (interamericano, europeu e africano). A afirmação histórica é processual, cumulativa e marcada por lutas sociais.", "Dimensões (gerações) dos direitos humanos": "1ª DIMENSÃO: civis e políticos (liberdades, direitos de defesa — exige abstenção estatal). 2ª DIMENSÃO: sociais, econômicos e culturais (prestações positivas, igualdade material). 3ª DIMENSÃO: difusos e coletivos — solidariedade/fraternidade (meio ambiente, desenvolvimento, paz, patrimônio comum da humanidade). 4ª DIMENSÃO: bioética, engenharia genética, informação. As dimensões são COMPLEMENTARES e CUMULATIVAS (não há hierarquia entre direitos).", "Características, fundamentação e paradoxo": "CARACTERÍSTICAS: imprescritibilidade, irrenunciabilidade, inalienabilidade, universalidade, complementaridade/interdependência, indivisibilidade, indisponibilidade e vedação do retrocesso. FUNDAMENTAÇÃO: jusnaturalismo (inerentes à natureza humana), positivismo (normas jurídicas — DUDH e tratados) e críticas culturalistas; a DIGNIDADE HUMANA funciona como fundamento contemporâneo (CF, art. 1º, III). UNIVERSALISMO x MULTICULTURALISMO: debate sobre a validade universal frente às diferenças culturais; a resposta contemporânea valoriza o diálogo intercultural com um núcleo mínimo (Declaração de Viena, 1993). PARADOXO: a contradição entre a proclamação da igualdade/dignidade universal e as práticas históricas de exclusão e violação, que exigem permanente luta pela efetividade."}};
</script>
<script>/* ==========================================================================
   ARENA ESTUDOS — ALEPA 002/2026 (Fundação CETAP) — Cargo 15
   Núcleo: estado, painel, treino, simulado, geradores infinitos
   ========================================================================== */
'use strict';

/* --------------------------- 1. UTILITÁRIOS ------------------------------ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const LSKEY = 'alepa_estudos_v1';
const hojeISO = () => new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD local
const dia = (d = new Date()) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const nf = (n, d = 1) => Number(n).toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LETRAS = ['A', 'B', 'C', 'D', 'E'];
const uniq = a => [...new Set(a)];
function toast(msg, ms = 2100) {
  $$('.toast').forEach(t => t.remove());
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg;
  document.body.appendChild(d); setTimeout(() => d.remove(), ms);
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const diffDias = (a, b) => Math.round((dia(a) - dia(b)) / 86400000);
const fmtData = d => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;

/* ------------------------------ 2. ESTADO -------------------------------- */
const EDITAL = window.__EDITAL__;
const BANCO = window.__BANCO__;
const TEORIA = window.__TEORIA__ || {};
const MATERIAS = EDITAL.materias;
const MATBYID = Object.fromEntries(MATERIAS.map(m => [m.id, m]));

function estadoInicial() {
  return {
    v: 1, criado: Date.now(),
    config: {
      metaDia: 41, metaTotal: 3000, dataProva: EDITAL.data_prova,
      tempoProvaMin: 240, nome: '', modeloIA: 'openai/gpt-oss-120b', tokenIA: ''
    },
    resp: {},        // qid -> {t,a,ok,ult,cx,prox}
    hist: {},        // 'YYYY-MM-DD' -> {q,a,min}
    fav: {}, notas: {}, teoria: {},
    geradas: [],     // questões criadas pela IA
    provas: [],      // simulados concluídos
    ia: { msgs: [], comparar: false, gerarParalelo: false }
  };
}
let S = (() => {
  try { const raw = localStorage.getItem(LSKEY); if (raw) return Object.assign(estadoInicial(), JSON.parse(raw)); } catch (e) { }
  return estadoInicial();
})();
let AVISO_STORAGE = false;
function storageOk() { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; } }
function salvar() {
  try { localStorage.setItem(LSKEY, JSON.stringify(S)); }
  catch (e) {
    if (!AVISO_STORAGE) { AVISO_STORAGE = true; toast('⚠️ Este navegador/preview não permite salvar o progresso. Baixe o arquivo HTML e abra no seu navegador para gravar seus dados.', 6000); }
  }
}

/* índice de questões: banco curado + geradas pela IA */
function bancoCompleto() { return BANCO.concat(S.geradas.map(g => Object.assign({ ia: true }, g))); }
let QIDX = {};
function reindexar() { QIDX = {}; bancoCompleto().forEach(q => QIDX[q.id] = q); }
reindexar();
const Q_ALL = () => bancoCompleto().filter(q => MATBYID[q.materia]);
const porMateria = mid => Q_ALL().filter(q => q.materia === mid);
const statQ = qid => S.resp[qid] || null;

/* ------------------------- 3. REGISTRO DE RESPOSTA ----------------------- */
const CAIXAS = [0, 1, 2, 4, 9, 20]; // dias entre revisões (Leitner)
function registrarResposta(qid, acertou, opts = {}) {
  const nome = qid;
  let r = S.resp[qid] || { t: 0, a: 0, ok: 0, ult: 0, cx: 0, prox: 0 };
  r.t++; if (acertou) r.ok++;
  r.ult = Date.now();
  r.cx = acertou ? Math.min((r.cx || 0) + 1, CAIXAS.length - 1) : 0;
  r.prox = Date.now() + CAIXAS[r.cx] * 86400000;
  S.resp[qid] = r;
  const h = S.hist[hojeISO()] || { q: 0, a: 0, min: 0 };
  h.q++; if (acertou) h.a++;
  S.hist[hojeISO()] = h;
  if (opts.tempo) h.min = (h.min || 0) + opts.tempo;
  salvar(); atualizarBadges();
  if (typeof agendarPush === 'function') agendarPush();
}
function marcarTempo(seg) {
  const h = S.hist[hojeISO()] || { q: 0, a: 0, min: 0 };
  h.min = (h.min || 0) + seg / 60; S.hist[hojeISO()] = h; salvar();
}

/* ------------------------------ 4. MÉTRICAS ------------------------------ */
function metricas() {
  const ids = Object.keys(S.resp);
  const resp = ids.length ? ids.map(i => S.resp[i]) : [];
  /* "questões feitas" = soma do que foi respondido em cada dia (inclui repetições);
     "acertos" vem do mesmo histórico. Antes daqui saía a soma dos *timestamps*. */
  const tot = Object.keys(S.hist).reduce((s, d) => s + (S.hist[d] && S.hist[d].q || 0), 0);
  const ok = Object.keys(S.hist).reduce((s, d) => s + (S.hist[d] && S.hist[d].a || 0), 0);
  const hoje = S.hist[hojeISO()] || { q: 0, a: 0, min: 0 };
  const dias = Object.keys(S.hist).filter(d => S.hist[d].q > 0).sort();
  // streak
  let streak = 0;
  if (dias.length) {
    let d = dia(new Date());
    if (!(hoje.q > 0)) d = new Date(d.getTime() - 86400000);
    for (; ;) {
      const k = d.toLocaleDateString('sv-SE');
      if (S.hist[k] && S.hist[k].q > 0) { streak++; d = new Date(d.getTime() - 86400000); } else break;
    }
  }
  const prova = dia(new Date(S.config.dataProva + 'T12:00:00'));
  const restam = diffDias(prova, dia(new Date()));
  const metaTotal = S.config.metaTotal || 3000;
  const faltam = Math.max(0, metaTotal - tot);
  const metaDia = restam > 0 ? Math.ceil(faltam / restam) : faltam;
  return { tot, ok, pct: tot ? ok / tot * 100 : 0, hoje, streak, dias: dias.length, restam, faltam, metaTotal, metaDia, unicas: ids.length, provas: S.provas.length };
}
function statsMateria(mid) {
  const qs = porMateria(mid); let t = 0, ok = 0, vistas = 0;
  qs.forEach(q => { const r = statQ(q.id); if (r) { t++; ok += r.ok ? 1 : 0; vistas++; } });
  return { banco: qs.length, vistas, t, ok, pct: t ? ok / t * 100 : 0, cobertura: qs.length ? vistas / qs.length * 100 : 0 };
}
function emRevisao(qid) { const r = statQ(qid); return !!r && r.prox <= Date.now(); }

/* --------------------------- 5. NAVEGAÇÃO (TABS) ------------------------- */
/* As funções de render estão em dois arquivos; usamos wrappers para resolver
   cada uma apenas no momento da renderização (evita erro de ordem de carga). */
const TABS = [
  { id: 'painel', nome: '🎯 Painel', render: r => renderPainel(r) },
  { id: 'treinar', nome: '✍️ Treinar', render: r => renderTreinar(r) },
  { id: 'simulado', nome: '⏱️ Simulado', render: r => renderSimulado(r) },
  { id: 'ia', nome: '🤖 IA / Hugging Face', render: r => renderIA(r) },
  { id: 'teoria', nome: '📚 Teoria', render: r => renderTeoria(r) },
  { id: 'progresso', nome: '📈 Progresso', render: r => renderProgresso(r) },
  { id: 'plano', nome: '🗓️ Plano até a prova', render: r => renderPlano(r) }
];
let TAB = 'painel';
function atualizarBadges() {
  const m = metricas();
  const el = $('#badge-hoje'); if (el) el.textContent = `${m.hoje.q}/${S.config.metaDia} hoje`;
  const up = $('#badge-up'); if (up) up.textContent = `${m.restam} dias`;
}
function irPara(tab) {
  TAB = tab; location.hash = tab;
  const t = TABS.find(x => x.id === tab) || TABS[0];
  $$('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === t.id));
  const app = $('#app'); app.innerHTML = ''; t.render(app);
  atualizarBadges(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
function montarTabs() {
  const nav = $('nav.tabs');
  nav.innerHTML = TABS.map(t => `<button data-tab="${t.id}"${t.id === TAB ? ' class="active"' : ''}>${t.nome}</button>`).join('');
  nav.onclick = e => { const b = e.target.closest('button[data-tab]'); if (b) irPara(b.dataset.tab); };
}

/* ------------------------------- 6. PAINEL ------------------------------- */
/* Largura de barra em %: numero simples entre 0 e 100 (nunca notacao cientifica,
   que o navegador ignora silenciosamente). */
function larguraPct(x) { const v = Number(x); if (!isFinite(v)) return 0; return Math.max(0, Math.min(100, +v.toFixed(1))); }

function renderPainel(root) {
  const m = metricas();
  const pctMeta = Math.min(100, m.hoje.q / Math.max(1, S.config.metaDia) * 100);
  const ultimos = [];
  for (let i = 34; i >= 0; i--) { const d = new Date(Date.now() - i * 86400000); const k = d.toLocaleDateString('sv-SE'); const h = S.hist[k] || { q: 0 }; ultimos.push({ k, d, q: h.q }); }
  const max = Math.max(1, ...ultimos.map(u => u.q));

  root.innerHTML = `
  ${typeof cartaoIA === 'function' ? cartaoIA() : ''}
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div>
        <h2 style="margin-bottom:2px">Olá${S.config.nome ? ', ' + esc(S.config.nome) : ''}! Bora bater a meta de hoje? 🚀</h2>
        <div class="muted small">${EDITAL.orgao} · ${EDITAL.banca} · Cargo 15 (Assistência Legislativa) · Prova em ${fmtData(new Date(S.config.dataProva + 'T12:00:00'))}/${new Date(S.config.dataProva + 'T12:00:00').getFullYear()}</div>
      </div>
      <div style="text-align:right">
        <div class="timer" style="font-size:34px;color:var(--gold)">${m.restam}</div>
        <div class="muted tiny">dias para a prova</div>
      </div>
    </div>
    <div style="margin-top:14px">

/* ------------------------------ 7. TREINO -------------------------------- */
let FILTRO = { materia: 'todas', topico: 'todos', dif: 'todas', modo: 'todas', n: 20 };
let SESSAO = null;

function filaRevisao() { return Q_ALL().filter(q => { const r = statQ(q.id); return r && (r.prox <= Date.now() || (r.t > 0 && r.ok / r.t < 0.6)); }); }

function selecionarQuestoes(f = FILTRO) {
  let qs = Q_ALL();
  if (f.materia !== 'todas') qs = qs.filter(q => q.materia === f.materia);
  if (f.topico !== 'todos') qs = qs.filter(q => q.topico === f.topico);
  if (f.dif !== 'todas') qs = qs.filter(q => q.dif === f.dif);
  if (f.modo === 'novas') qs = qs.filter(q => !statQ(q.id));
  if (f.modo === 'erradas') qs = qs.filter(q => { const r = statQ(q.id); return r && r.ok < r.t; });
  if (f.modo === 'pendentes') qs = qs.filter(q => emRevisao(q.id));
  if (f.modo === 'favoritas') qs = qs.filter(q => S.fav[q.id]);
  return qs;
}
function iniciarTreinoRapido() {
  FILTRO = Object.assign({}, FILTRO, { modo: 'todas', materia: 'todas', topico: 'todos', dif: 'todas' });
  const n = Math.min(20, S.config.metaDia);
  abrirSessao(selecionarQuestoes(), n, 'Treino');
}
function iniciarRevisao() { abrirSessao(filaRevisao(), 30, 'Revisão de erros'); }

function iniciarPorMateria(mid) { FILTRO = { materia: mid, topico: 'todos', dif: 'todas', modo: 'todas', n: 20 }; irPara('treinar'); }

/* --------- Sessão de questões (treino / geradores) --------- */
function abrirSessao(qs, n, titulo, fbFinal = false) {
  qs = shuffle(qs); if (n > 0) qs = qs.slice(0, n);
  SESSAO = { tipo: 'treino', titulo, qs, i: 0, respostas: {}, fbFinal, fbDado: {}, inicio: Date.now(), geradas: ['GER'] };
  renderSessao($('#app'));
}
function iniciarGeradores(ids, n) {
  const qs = []; for (let i = 0; i < n; i++) qs.push(GERADORES[ids[i % ids.length]].gerar());
  SESSAO = { tipo: 'gerador', titulo: 'Gerador infinito', qs, i: 0, respostas: {}, fbFinal: false, fbDado: {}, inicio: Date.now() };
  renderSessao($('#app'));
}
function renderSessao(root) {
  const s = SESSAO, q = s.qs[s.i];
  if (!q) return finalizarSessao();
  const ja = s.respostas[s.i];
  const mostrarFB = ja !== undefined && !s.fbFinal;
  const mat = MATBYID[q.materia], gen = q.materia === 'GEN';
  root.innerHTML = `
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <span class="badge pri">${esc(s.titulo)}</span>
        <span class="badge">${gen ? '⚡ gerador infinito' : esc(mat ? mat.nome : '')}</span>
        ${q.topico ? `<span class="badge">${esc(q.topico)}</span>` : ''}
        ${q.dif ? `<span class="badge ${q.dif === 'dificil' ? 'err' : q.dif === 'media' ? 'warn' : 'ok'}">${q.dif === 'facil' ? 'fácil' : q.dif === 'media' ? 'média' : 'difícil'}</span>` : ''}
        ${q.ia ? '<span class="badge warn">gerada por IA 🤖</span>' : ''}
      </div>
      <div class="row">
        <span class="muted small">Questão <b style="color:#fff">${s.i + 1}</b>/${s.qs.length}</span>
        <button class="btn sm" id="btn-sair">✖ Sair</button>
      </div>
    </div>
    <div class="bar" style="margin:10px 0 16px"><i style="width:${larguraPct((s.i) / s.qs.length * 100)}%"></i></div>
    <div class="qhead">
      <span class="badge">${q.banca || 'CETAP'} ${q.ano || ''}</span>
      ${q.ref ? `<span class="tiny muted">${esc(q.ref)}</span>` : ''}
    </div>
    <div class="qtext">${fmtTxt(q.enunciado)}</div>
    <div id="alts" style="margin-top:14px">
      ${q.alternativas.map((a, i) => `<button class="alt" data-i="${i}" ${mostrarFB ? 'disabled' : ''}>
        <span class="ltr">${LETRAS[i]}</span><span class="tx">${fmtTxt(a)}</span></button>`).join('')}
    </div>
    <div id="fb"></div>
    <div class="row" style="margin-top:16px;justify-content:space-between">
      <div class="row">
        <button class="btn sm" id="btn-prev" ${s.i === 0 ? 'disabled' : ''}>◀ Anterior</button>
        <button class="btn sm" id="btn-fav">${S.fav[q.id] ? '⭐ Favorita' : '☆ Favoritar'}</button>
        ${!gen && q.ia ? '' : ''}
        <button class="btn sm" id="btn-nota">📝 Anotação</button>
      </div>
      <div class="row">
        ${ja !== undefined && s.fbFinal ? '<span class="badge pri">respondida — correção no final</span>' : ''}
        <button class="btn pri" id="btn-next">${s.i === s.qs.length - 1 ? 'Finalizar ✔' : 'Próxima ▶'}</button>
      </div>
    </div>
    <div id="nota-area"></div>
  </div>`;

  if (ja !== undefined && !s.fbFinal) pintarFeedback(q, ja, true);
  else if (ja !== undefined) { const b = root.querySelector(`.alt[data-i="${ja}"]`); if (b) b.classList.add('sel'); }

  $$('#alts .alt').forEach(b => b.onclick = () => responder(+b.dataset.i));
  $('#btn-next').onclick = () => { if (s.respostas[s.i] === undefined) return toast('Escolha uma alternativa 🙂'); if (s.i === s.qs.length - 1) finalizarSessao(); else { s.i++; renderSessao($('#app')); } };
  $('#btn-prev').onclick = () => { s.i--; renderSessao($('#app')); };
  $('#btn-sair').onclick = () => { if (confirm('Encerrar a sessão?')) finalizarSessao(true); };
  $('#btn-fav').onclick = () => { S.fav[q.id] = !S.fav[q.id]; if (!S.fav[q.id]) delete S.fav[q.id]; salvar(); renderSessao($('#app')); };
  $('#btn-nota').onclick = () => {
    $('#nota-area').innerHTML = `<label class="f">Sua anotação sobre esta questão</label>
      <textarea id="ta-nota" rows="3">${esc(S.notas[q.id] || '')}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn sm pri" id="ok-nota">Salvar</button></div>`;
    $('#ok-nota').onclick = () => { S.notas[q.id] = $('#ta-nota').value; salvar(); toast('Anotação salva 📝'); $('#nota-area').innerHTML = ''; };
  };
  function responder(i) {
    if (s.respostas[s.i] !== undefined) return;
    s.respostas[s.i] = i;
    const acertou = i === q.correta;
    if (q.materia !== 'GEN') registrarResposta(q.id, acertou);
    else { const h = S.hist[hojeISO()] || { q: 0, a: 0, min: 0 }; h.q++; if (acertou) h.a++; S.hist[hojeISO()] = h; salvar(); atualizarBadges(); }
    pintarFeedback(q, i);
  }
  function pintarFeedback(q, i, silencioso) {
    const acertou = i === q.correta;
    $$('#alts .alt').forEach((b, k) => {
      b.disabled = true;
      if (k === q.correta) b.classList.add('right');
      if (k === i && !acertou) b.classList.add('wrong');
    });
    $('#fb').innerHTML = `
      <div class="fb ${acertou ? 'right' : 'wrong'}">
        <div class="tt">${acertou ? '✅ Você acertou!' : `❌ Errou. Gabarito: <span style="color:#6ee7b7">${LETRAS[q.correta]}</span>`}</div>
        <div class="com">${fmtTxt(q.comentario || 'Sem comentário.')}</div>
        ${q.analise ? `<div class="explica"><b>Análise das alternativas:</b><div class="com">${fmtTxt(q.analise)}</div></div>` : ''}
        ${!acertou && q.materia !== 'GEN' ? `<div class="row" style="margin-top:10px"><button class="btn sm gold" id="btn-ia-expl">🤖 Pedir explicação detalhada à IA</button></div>` : ''}
      </div>`;
    const be = $('#btn-ia-expl');
    if (be) be.onclick = () => explicarComIA(q, i);
  }
}
function finalizarSessao(sair) {
  if (!SESSAO) return irPara('painel');
  const s = SESSAO;
  const itens = Object.keys(s.respostas);
  const acertos = itens.filter(k => s.respostas[k] === s.qs[k].correta).length;
  const total = itens.length;
  const min = Math.round((Date.now() - s.inicio) / 60000);
  marcarTempo((Date.now() - s.inicio) / 1000);
  SESSAO = null;
  const app = $('#app');
  const porMat = {};
  itens.forEach(k => { const q = s.qs[k]; const mm = q.materia === 'GEN' ? 'GER' : q.materia; porMat[mm] = porMat[mm] || { t: 0, ok: 0 }; porMat[mm].t++; if (s.respostas[k] === q.correta) porMat[mm].ok++; });
  app.innerHTML = `
  <div class="card">
    <h2>${total ? '📋 Resultado da sessão' : 'Sessão encerrada'}</h2>
    <div class="grid c4">
      <div class="kpi"><b>${total}</b><span>respondidas</span></div>
      <div class="kpi"><b style="color:var(--ok)">${acertos}</b><span>acertos</span></div>
      <div class="kpi"><b style="color:${total && acertos / total >= .6 ? 'var(--ok)' : 'var(--warn)'}">${total ? nf(acertos / total * 100, 0) : 0}%</b><span>aproveitamento</span></div>
      <div class="kpi"><b>${min}</b><span>minutos</span></div>
    </div>
    <table style="margin-top:12px">
      <tr><th>Matéria</th><th>Acertos</th><th>%</th></tr>
      ${Object.entries(porMat).map(([k, v]) => `<tr><td>${k === 'GER' ? '⚡ Geradores' : esc(MATBYID[k] ? MATBYID[k].nome : k)}</td><td>${v.ok}/${v.t}</td><td>${nf(v.ok / v.t * 100, 0)}%</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Nada respondido.</td></tr>'}
    </table>
    <div class="row" style="margin-top:14px">
      <button class="btn pri" onclick="iniciarTreinoRapido()">▶ Mais 20 questões</button>
      <button class="btn" onclick="iniciarRevisao()">🔁 Revisar erros</button>
      <button class="btn" onclick="irPara('painel')">🎯 Painel</button>
    </div>
  </div>`;
  atualizarBadges(); salvar();
}
function fmtTxt(t) { return esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '\n'); }

    if (!S.config.iaPrincipal) S.config.iaPrincipal = 'hf';
    if (typeof S.config.iaReserva !== 'boolean') S.config.iaReserva = true;
    if (!Array.isArray(S.config.iaParalelo)) S.config.iaParalelo = [];   /* vazio = todas as ligadas */
    if (typeof S.config.iaMostrarTodas !== 'boolean') S.config.iaMostrarTodas = false;  /* padrao: so HF, Gemini e Groq */
  } catch (e) { console.warn('migrarIA:', e); }

  /* o modelo sugerido pode ser preenchido sozinho; o endereço/chave NÃO —

  if (!c.modelo && PROVEDORES[id] && PROVEDORES[id].modelos[0]) c.modelo = PROVEDORES[id].modelos[0];

  const todas = provedoresConfigurados();
  if (!todas.length) return [];
  const escolhidas = (Array.isArray(S.config.iaParalelo) && S.config.iaParalelo.length)
    ? todas.filter(id => S.config.iaParalelo.indexOf(id) >= 0)
    : todas;
  const lista = escolhidas.length ? escolhidas : todas;
  const principal = provAtualId();
  const ordenado = ([principal].indexOf(principal) >= 0 && lista.indexOf(principal) >= 0 ? [principal] : []).concat(lista.filter(id => id !== principal));
  return ordenado.slice(0, 4);
}

/* Chamada pelo intermediário (server.py local ou função da Vercel). */
async function chamarViaServidor(id, mensagens, opts) {
  const cfg = cfgProv(id);
  const r = await fetchTimeout('api/ia', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ provedor: id, modelo: cfg.modelo, baseUrl: cfg.baseUrl, token: cfg.token, mensagens, max_tokens: (opts && opts.max_tokens) || 1200, temperature: (opts && opts.temperature) === undefined ? 0.6 : opts.temperature }),
  }, (opts && opts.timeout) || 90000);
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.content) { const x = new Error(j.error || ('HTTP ' + r.status)); x.__http = r.status; throw x; }
  return j.content;
}

/* Faz a MESMA pergunta para várias IAs AO MESMO TEMPO e devolve todas as respostas.
   Se o intermediário estiver ativo, as chaves não passam pelo navegador. */
async function chamarVariasIA(mensagens, opts = {}, idsEscolhidos) {
  migrarIA();
  const ids = (idsEscolhidos && idsEscolhidos.length) ? idsEscolhidos.filter(iaConfigurada) : iasParalelo();
  if (!ids.length) throw new Error('Nenhuma IA ligada. Toque no botão 🔑 no topo e ligue pelo menos uma.');
  const tarefas = ids.map(async (id) => {
    const t0 = Date.now();
    try {
      /* cada IA enxerga a conversa e as PRÓPRIAS respostas anteriores (não as das outras) */
      const hist = mensagens.filter(m => m.role !== 'assistant' || !m.de || m.de === id).map(m => ({ role: m.role, content: m.content }));
      const resposta = IA_STATUS.servidor ? await chamarViaServidor(id, hist, opts) : await chamarIAProvedor(id, hist, opts);
      return { id, nome: PROVEDORES[id].nome, emoji: PROVEDORES[id].emoji, ok: true, resposta, ms: Date.now() - t0 };
    } catch (e) {
      return { id, nome: PROVEDORES[id].nome, emoji: PROVEDORES[id].emoji, ok: false, erro: explicarErroIA(e, id), ms: Date.now() - t0 };
    }
  });
  return Promise.all(tarefas);
}

/* ---------- montagem e leitura das requisições ---------- */
function urlDoProvedor(id, cfg) {
  const p = PROVEDORES[id];
  if (p.urlLivre) return String(cfg.baseUrl || '').trim();
  if (p.tipo === 'gemini') return p.urlBase + encodeURIComponent(cfg.modelo || p.modelos[0]) + ':generateContent?key=' + encodeURIComponent(cfg.token || '');
  if (p.semChave) return String(cfg.baseUrl || p.urlPadrao || '').trim();   /* IA no próprio computador */
  return p.url;
}
function cabecalhosDoProvedor(id, cfg) {
  const p = PROVEDORES[id], h = {};
  if (p.tipo === 'gemini') {
    /* truque para o navegador não bloquear com "Failed to fetch":
       tipo de conteúdo "simples" dispensa o preflight (o Google aceita o JSON normalmente) */
    h['Content-Type'] = 'text/plain;charset=UTF-8';
  } else {
    h['Content-Type'] = 'application/json';
  }
  if (p.tipo === 'anthropic') {
    h['x-api-key'] = cfg.token || '';
    h['anthropic-version'] = '2023-06-01';
    h['anthropic-dangerous-direct-browser-access'] = 'true';
  } else if (!p.semChave && cfg.token) {
    h['Authorization'] = 'Bearer ' + cfg.token;
  }
  if (id === 'openrouter') { try { h['HTTP-Referer'] = location.origin; h['X-Title'] = 'Arena Estudos ALEPA'; } catch (e) { } }
  return h;
}
function corpoDoProvedor(id, cfg, mensagens, opts) {
  const p = PROVEDORES[id];
  const maxT = opts.max_tokens || 1200;
  const temp = opts.temperature ?? 0.6;
  if (p.tipo === 'gemini') {
    const sistema = mensagens.filter(m => m.role === 'system').map(m => m.content).join('\n');
    const conversa = mensagens.filter(m => m.role !== 'system').map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));
    const b = { contents: conversa, generationConfig: { maxOutputTokens: maxT, temperature: temp } };
    if (sistema) b.systemInstruction = { parts: [{ text: sistema }] };
    return b;
  }
  if (p.tipo === 'anthropic') {
    const sistema = mensagens.filter(m => m.role === 'system').map(m => m.content).join('\n');
    const conversa = mensagens.filter(m => m.role !== 'system').map(m => ({ role: m.role === 'assistant' ? 'assistant' : 'user', content: m.content }));
    const b = { model: cfg.modelo, max_tokens: maxT, temperature: temp, messages: conversa };
    if (sistema) b.system = sistema;
    return b;
  }
  return { model: cfg.modelo, messages: mensagens, max_tokens: maxT, temperature: temp };
}
function lerResposta(id, j) {
  const p = PROVEDORES[id];
  if (p.tipo === 'gemini') {
    const c = j && j.candidates && j.candidates[0];
    const partes = c && c.content && c.content.parts;
    if (partes && partes.length) return partes.map(x => x.text || '').join('').trim();
    if (j && j.promptFeedback && j.promptFeedback.blockReason) throw new Error('O Gemini bloqueou esta resposta (' + j.promptFeedback.blockReason + '). Tente reformular a pergunta.');
    return '';
  }
  if (p.tipo === 'anthropic') {
    const bloco = j && j.content && j.content.find(x => x.type === 'text');
    return bloco ? bloco.text : '';
  }
  return (j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
}
function mensagemDeErro(id, status, txt, j) {
  const p = PROVEDORES[id];
  let msg = (j && j.error && (j.error.message || j.error)) || (j && j.message) || (txt || '').slice(0, 200);
  if (!msg && status) msg = 'HTTP ' + status;
  return String(msg).slice(0, 300);
}

/* ---------- erros explicados em português ---------- */
/* A chave é realmente aceita? Olha o conteúdo da resposta (algumas APIs devolvem
   200 com um erro dentro). Devolve {ok, motivo, conta}. */
async function conferirChaveHF(tok) {
  try {
    const r = await fetchTimeout('https://huggingface.co/api/whoami-v2', { headers: { Authorization: 'Bearer ' + tok } }, 20000);
    const txt = await r.text();
    let j = {}; try { j = JSON.parse(txt); } catch (e) { }
    if (j && j.error) return { ok: false, motivo: String(j.error) };
    if (j && j.name) return { ok: true, conta: j.name, tipo: j.type || '', perfil: ((j.auth || {}).accessToken || {}).role || '' };
    if (!r.ok) return { ok: false, motivo: 'HTTP ' + r.status };
    return { ok: false, motivo: 'resposta inesperada: ' + txt.slice(0, 80) };
  } catch (e) { return { ok: false, motivo: 'sem conexão: ' + ((e && e.message) || e) }; }
}

function ambienteRestrito() {
  try { return location.origin === 'null' || !/^https?:$/.test(location.protocol); } catch (e) { return true; }
}
function errRede(e) { const x = new Error((e && e.message) || String(e)); x.__rede = true; x.__abort = !!(e && e.name === 'AbortError'); return x; }
function errHTTP(status, msg) { const x = new Error(msg || ('HTTP ' + status)); x.__http = status; return x; }
function fetchTimeout(url, opts, ms) {
  if (typeof AbortController === 'undefined') return fetch(url, opts);
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms || 60000);
  return fetch(url, Object.assign({}, opts, { signal: ctl.signal })).finally(() => clearTimeout(t));
}
function explicarErroIA(e, provedorId) {
  const p = PROVEDORES[provedorId] || { nome: 'IA' };
  const m = String((e && e.message) || e || 'erro desconhecido');
  if (e && e.__rede) {
    if (e.__abort) return 'A resposta demorou demais e foi cancelada (60 s). Tente de novo ou escolha um modelo mais leve no botão 🔑.';
    if (ambienteRestrito()) return 'O navegador bloqueou a conversa com a IA porque o app está aberto como ARQUIVO LOCAL (file://) ou dentro de um visualizador restrito.\n\nComo resolver (qualquer uma serve):\n1) PUBLIQUE o app e abra pelo link https:// (Opção A do LEIA-ME);\n2) ou rode: python3 app/server.py e acesse http://localhost:8000';
    return 'Não consegui falar com o serviço da ' + p.nome + '. Verifique sua internet (ou VPN, antivírus, DNS/firewall bloqueando). Detalhe: ' + m;
  }
  if (e && e.__http) {
    const s = e.__http;
    /* modelo aposentado/indisponível: mensagem específica, com o caminho da solução */
    if (ERRO_MODELO.test(m)) return 'O modelo “' + (modeloDe(provedorId) || 'escolhido') + '” NÃO está mais disponível na ' + p.nome + ' — os provedores aposentam modelos de tempos em tempos.\n\nComo resolver: toque em ✨ “escolher por mim” (na janela 🔑): o app consulta a lista da sua conta, escolhe um modelo de conversa que funciona e já testa. O app também tenta isso automaticamente.'
      + (provedorId === 'groq' ? '\n\nNa Groq, os modelos de hoje são: openai/gpt-oss-120b, openai/gpt-oss-20b e qwen/qwen3.6-27b (os llama-3.3 e llama-3.1 saíram do ar em 16/08/2026).' : '')
      + (provedorId === 'gemini' ? '\n\nNo Gemini, os modelos atuais são gemini-3.8-flash, gemini-3.5-flash e gemini-3.5-flash-lite (os 2.5 estão sendo aposentados).' : '');
    if (s === 401 || s === 403) return 'A ' + p.nome + ' RECUSOU a chave (erro ' + s + '). Isso acontece quando o token foi copiado incompleto, expirou, foi revogado ou não tem a permissão necessária.\n\nComo resolver: crie outra chave em ' + (p.criar || '') + ' e cole de novo.';
    if (s === 404) return 'O modelo “' + (modeloDe(provedorId) || 'escolhido') + '” não existe ou não está disponível na ' + p.nome + ' (404). Toque em 🔄 “buscar modelos disponíveis” na janela 🔑 e escolha um da lista.';
    if (s === 429) return 'A ' + p.nome + ' recusou por LIMITE DE USO (429). Espere um minuto e tente de novo — a cota gratuita renova sozinha.' + (p.custo.indexOf('grátis') === 0 ? '' : '');
    if (s === 402) return 'Créditos insuficientes na ' + p.nome + ' (erro 402). Recarregue a conta ou troque para uma IA gratuita (Hugging Face, Groq, Gemini ou OpenRouter com modelos “:free”).';
    if (s === 400 && /credit|balance|quota|billing/i.test(m)) return 'A conta da ' + p.nome + ' está sem créditos (400): ' + m;
    if (s === 503) return 'O serviço da ' + p.nome + ' está sobrecarregado (503). Tente de novo em uns 20 segundos.';
    return 'A ' + p.nome + ' respondeu ' + s + ': ' + m;
  }
  return m;
}

/* Pega a lista real do provedor (com a chave do usuário) e escolhe um modelo de conversa. */
async function descobrirModeloQueFunciona(id) {
  const lista = (await listarModelos(id)).filter(ehModeloDeConversa);
  if (!lista.length) throw new Error('não encontrei nenhum modelo de conversa disponível na sua conta');
  return escolherModeloBom(lista);
}

/* ---------- chamada unificada, com reserva automática ---------- */
/* modelos que não servem para conversar */
function ehModeloDeConversa(m) { return !/whisper|tts|guard|prompt-guard|embed|moderation|vision-only|rerank|audio|image/i.test(String(m)); }

/* escolhe, na lista do provedor, o modelo mais adequado para o tutor */
function escolherModeloBom(lista) {
  const preferencia = [/gpt-oss-120b/i, /gpt-oss/i, /versatile/i, /qwen3?[.-]?\d/i, /(sonnet|opus|pro|large|70b|120b|405b)/i, /flash|mini|small|instant|8b|7b/i];
  for (const re of preferencia) { const achado = lista.find(m => re.test(m)); if (achado) return achado; }
  return lista[0];
}

/* o erro é "esse modelo não existe mais / não tenho acesso"? */
const ERRO_MODELO = /does not exist|no access|not found|decommission|deprecat|invalid model|model_not_found|unsupported model|model.*not.*available|no longer/i;

async function chamarIAProvedor(id, mensagens, opts) {
  const p = PROVEDORES[id], cfg = cfgProv(id);
  if (!p) throw new Error('Provedor de IA desconhecido: ' + id);
  if (opts && opts.modelo) cfg.modelo = opts.modelo;
  const url = urlDoProvedor(id, cfg);
  if (!url) throw new Error('Falta o endereço da API na configuração da ' + p.nome + ' (janela 🔑).');
  const r = await fetchTimeout(url, {
    method: 'POST',
    headers: cabecalhosDoProvedor(id, cfg),
    body: JSON.stringify(corpoDoProvedor(id, cfg, mensagens, opts || {})),
  }, (opts && opts.timeout) || 60000);
  const txt = await r.text();
  let j = {}; try { j = JSON.parse(txt); } catch (e) { }
  if (!r.ok) {
    const msgErro = mensagemDeErro(id, r.status, txt, j);
    /* AUTOCORREÇÃO: modelo aposentado/indisponível → descobre um modelo válido e tenta de novo */
    if (ERRO_MODELO.test(msgErro) && !(opts && opts.__semAutocorrecao)) {
      const novo = await descobrirModeloQueFunciona(id).catch(() => '');
      if (novo && novo !== cfg.modelo) {
        try {
          const conteudo = await chamarIAProvedor(id, mensagens, Object.assign({}, opts, { modelo: novo, __semAutocorrecao: true }));
          cfg.modelo = novo; try { salvar(); } catch (e) { }
          if (typeof toast === 'function') toast('O modelo anterior saiu do ar — passei a usar ' + novo);
          return conteudo;
        } catch (e2) { /* se o novo também falhar, mostra o erro original */ }
      }
    }
    throw errHTTP(r.status, msgErro);
  }
  const conteudo = lerResposta(id, j);
  if (!conteudo) {
    /* algumas APIs devolvem 200 com um erro dentro do corpo — trata como erro de verdade */
    if (/invalid username or password|unauthorized|token.*invalid|invalid.*token/i.test(txt)) {
      throw errHTTP(401, 'Invalid username or password.');
    }
    if (/quota|rate limit|too many requests/i.test(txt)) throw errHTTP(429, txt.slice(0, 160));
    throw new Error('A ' + p.nome + ' respondeu sem texto. Resposta recebida: ' + String(txt || '(vazia)').slice(0, 180));
  }
  return conteudo;
}

async function chamarIA(mensagens, opts = {}) {
  migrarIA();
  const ordem = ordemProvedores();
  if (!ordem.some(iaConfigurada)) {
    throw new Error('Nenhuma IA configurada ainda. Toque no botão 🔑 no topo da tela: escolha uma IA (Hugging Face, Gemini, Groq…) e cole a sua chave. É grátis e leva 1 minuto.');
  }
  /* 1) servidor local/published com proxy: a chave não viaja no navegador */
  if (IA_STATUS.servidor) {
    try { return await chamarViaServidor(provAtualId(), mensagens, opts); }
    catch (e) {
      IA_STATUS.erro = String((e && e.message) || e);
      if (e && e.__http && e.__http !== 404 && e.__http !== 502) throw new Error(explicarErroIA(e, provAtualId()));
      /* 404/502 = intermediário sem suporte a essa IA: segue pela chamada direta */
    }
  }
  /* 2) chamada direta do navegador, tentando a principal e depois as reservas */
  let ultimoErro = null, ultimoProv = provAtualId();
  for (const id of ordem) {
    ultimoProv = id;
    try {
      const conteudo = await chamarIAProvedor(id, mensagens, opts);
      if (id !== provAtualId()) {                     /* a principal falhou: passa a usar a que funcionou */
        const antigo = provAtualId();
        S.config.iaPrincipal = id;
        try { salvar(); } catch (e) { }
        if (typeof toast === 'function') toast('Usei a ' + PROVEDORES[id].nome + ' (a ' + PROVEDORES[antigo].nome + ' não respondeu)');
      }
      return conteudo;
    } catch (e) {
      /* marca se foi falha de rede (o TypeError seco do navegador) para explicar direito */
      ultimoErro = (e && e.__http) ? e : errRede(e);
      if (ultimoErro.__http && (ultimoErro.__http === 401 || ultimoErro.__http === 403)) {
        /* chave inválida: se houver outra IA configurada, segue para ela; senão, explica */
        if (ordem.filter(iaConfigurada).length > 1) continue;
        throw new Error(explicarErroIA(e, id));
      }
    }
  }
  throw new Error(explicarErroIA(ultimoErro, ultimoProv));
}

/* ---------- listar os modelos que a chave realmente enxerga ---------- */
async function listarModelos(id) {
  const p = PROVEDORES[id], cfg = cfgProv(id);
  if (!p) return [];
  let url = p.urlModelos;
  const cab = {};
  if (p.tipo === 'gemini') { if (!cfg.token) throw new Error('Informe a chave primeiro.'); url = p.urlModelos + '?key=' + encodeURIComponent(cfg.token); }
  else {
    if (p.semChave) url = (cfg.baseUrl || p.urlPadrao || '').replace(/\/chat\/completions\/?$/, '/models');
    else {
      if (!cfg.token) throw new Error('Informe a chave primeiro.');
      cab['Authorization'] = 'Bearer ' + cfg.token;
    }
    if (p.tipo === 'anthropic') { delete cab['Authorization']; cab['x-api-key'] = cfg.token; cab['anthropic-version'] = '2023-06-01'; cab['anthropic-dangerous-direct-browser-access'] = 'true'; }
  }
  if (!url) throw new Error('Falta o endereço da API.');
  const r = await fetchTimeout(url, { method: 'GET', headers: cab }, 25000);
  const txt = await r.text();
  let j = {}; try { j = JSON.parse(txt); } catch (e) { }
  if (!r.ok) throw new Error(mensagemDeErro(id, r.status, txt, j));
  let ids = [];
  if (p.tipo === 'gemini') ids = (j.models || []).filter(m => (m.supportedGenerationMethods || []).indexOf('generateContent') >= 0).map(m => String(m.name || '').replace(/^models\//, ''));
  else ids = (j.data || j.models || []).map(m => m.id || m.name || m.model).filter(Boolean).map(String);
  ids = Array.from(new Set(ids));
  const peso = m => (/(flash|mini|small|instant|8b|7b|nemo|free)/i.test(m) ? 0 : 1);
  return ids.sort((a, b) => peso(a) - peso(b) || a.localeCompare(b)).slice(0, 300);
}

/* ---------- diagnóstico de todas as IAs ---------- */
async function diagnosticarIA() {
  migrarIA();
  const L = [];
  const add = (i, t) => L.push(i + ' ' + t);
  add('•', 'Endereço do app: ' + ((typeof location !== 'undefined' && location.href) || '').slice(0, 70));
  if (ambienteRestrito()) add('❌', 'O app está aberto como arquivo local (file://) ou em visualizador restrito: o navegador BLOQUEIA a IA nesse modo. Publique o app (Opção A do LEIA-ME) ou rode: python3 app/server.py');
  else add('✅', 'O app está aberto por um endereço http(s) — modo correto.');
  if (IA_STATUS.servidor) add('✅', 'Existe um servidor/proxy ativo — as chaves são usadas por trás, sem exposição.');
  const configurados = provedoresConfigurados();
  if (!configurados.length) { add('❌', 'Nenhuma IA configurada. Toque no botão 🔑 e cole a chave de uma das IAs.'); return L.join('\n'); }
  add('•', 'IA principal: ' + PROVEDORES[provAtualId()].nome + ' · modelo ' + (modeloDe(provAtualId()) || '(padrão)'));
  add('•', 'Reserva automática: ' + (S.config.iaReserva === false ? 'desligada' : 'ligada'));
  /* quem já está configurado */
  configurados.forEach(id => {
    const c = cfgProv(id), p = PROVEDORES[id];
    if (p.semChave) add('✅', p.nome + ': endereço ' + (c.baseUrl || p.urlPadrao));
    else add('✅', p.nome + ': chave ' + String(c.token).slice(0, 7) + '…' + String(c.token).slice(-4) + ' (' + String(c.token).length + ' caracteres)');
    const pref = p.prefixo;
    if (pref && c.token && String(c.token).indexOf(pref) !== 0) add('⚠️', 'A chave do ' + p.nome + ' normalmente começa com “' + pref + '” — confira se copiou o campo certo.');
  });
  /* teste real de cada uma (menos no modo arquivo local) */
  for (const id of configurados) {
    if (ambienteRestrito() && !IA_STATUS.servidor) { add('⚠️', PROVEDORES[id].nome + ': não testado (app em modo arquivo local).'); continue; }
    try {
      const t0 = Date.now();
      let resposta;
      if (IA_STATUS.servidor) {
        const cfg = cfgProv(id);
        const r = await fetchTimeout('api/ia', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ provedor: id, modelo: cfg.modelo, baseUrl: cfg.baseUrl, token: cfg.token, mensagens: [{ role: 'user', content: 'Responda apenas: OK' }], max_tokens: 128, temperature: 0 }) }, 30000);
        const j = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        resposta = j.content;
      } else {
        resposta = await chamarIAProvedor(id, [{ role: 'user', content: 'Responda apenas: OK' }], { max_tokens: 128, temperature: 0, timeout: 30000 });
      }
      add('✅', PROVEDORES[id].nome + ' respondeu em ' + ((Date.now() - t0) / 1000).toFixed(1) + 's (“' + String(resposta).trim().slice(0, 20) + '”) — esta IA está funcionando.');
    } catch (e) {
      add('❌', PROVEDORES[id].nome + ' falhou: ' + explicarErroIA(e, id).split('\n')[0]);
      if (id === 'hf') {
        const c = await conferirChaveHF(cfgProv('hf').token);
        if (c.ok) add('✅', 'Hugging Face: a chave é VÁLIDA (conta: ' + c.conta + (c.perfil ? ', perfil ' + c.perfil : '') + ').');
        else {
          add('❌', 'Hugging Face: a chave NÃO é aceita — ' + c.motivo);
          add('👉', 'Como resolver: abra ' + PROVEDORES.hf.criar + ' → “New token” → tipo Fine-grained → marque “Make calls to Inference Providers” → copie o código hf_… e cole no campo acima. A chave mostrada agora tem ' + String(cfgProv('hf').token).length + ' caracteres.');
          add('💡', 'Se você já tem uma chave de outra IA (Gemini, Groq…), pode usá-la enquanto isso: escolha na lista “Qual IA usar como principal?”.');
        }
      }
    }
  }
  add('•', 'Se pelo menos uma apareceu ✅, o tutor de IA vai funcionar. Você pode deixar várias configuradas: o app usa a principal e passa para as outras sozinho se alguma falhar.');
  return L.join('\n');
}

/* as três gratuitas, para textos de ajuda */

async function gerarQuestoesIA() {
  const mid = $('#g-mat').value, top = $('#g-top').value, n = +$('#g-n').value;
  const mat = MATBYID[mid];
  const varias = $('#g-paralelo') && $('#g-paralelo').checked && iasParalelo().length > 1;
  const ides = varias ? iasParalelo() : [provAtualId()];
  const out = $('#g-out');
  out.innerHTML = varias
    ? `<span class="spin"></span> gerando ${n} questões com CADA uma das ${ides.length} IAs ligadas (${ides.map(id => PROVEDORES[id].emoji).join(' ')}) — até ${n * ides.length} de uma vez…`
    : `<span class="spin"></span> gerando ${n} questões sobre "${esc(top)}"… (pode levar até 1 minuto)`;
  const prompt = `Gere ${n} questões de múltipla escolha INÉDITAS, no estilo da banca Fundação CETAP (5 alternativas A–E, apenas uma correta), sobre o tópico "${top}" da matéria ${mat.nome}, no nível de concurso para Analista Legislativo da ALEPA.
Responda SOMENTE com um JSON válido (sem texto antes ou depois, sem markdown), no formato:
[{"enunciado":"...","alternativas":["...","...","...","...","..."],"correta":0,"comentario":"explicação fundamentada com base legal e o motivo de cada distrator estar errado","dif":"facil|media|dificil","topico":"${top}"}]
Regras: use `+ '`'+`...`+'`'+ ` para destacar termos; "correta" é o índice (0 a 4) da alternativa certa; comentários devem citar a base normativa quando houver (ex.: CF art. 59; Lei 14.133/2021 art. 28; LC 95/1998 art. 3º); não repita a mesma pergunta; evite afirmativas ambíguas.`;
  try {
    /* pede o MESMO lote para cada IA em paralelo e junta tudo, sem repetir questões */
    let arr = [], falhas = [];
    if (varias) {
      const respostas = await chamarVariasIA([{ role: 'system', content: IAPERSONA }, { role: 'user', content: prompt }], { max_tokens: 3000, temperature: 0.8 }, ides);
      respostas.forEach(r => {
        if (!r.ok) { falhas.push(r.emoji + ' ' + r.nome); return; }
        const lista = parseJSONArr(r.resposta) || [];
        lista.forEach(q => { if (q) arr.push(Object.assign({}, q, { __ia: r.nome })); });
      });
    } else {
      const txt = await chamarIA([{ role: 'system', content: IAPERSONA }, { role: 'user', content: prompt }], { max_tokens: 3000, temperature: 0.8 });
      arr = parseJSONArr(txt) || [];
    }
    /* remove questões repetidas (entre IAs diferentes ou dentro do mesmo lote) */
    const vistos = {};
    arr = arr.filter(q => {
      if (!q || !q.enunciado) return false;
      const chave = normalizarParaComparar(q.enunciado).slice(0, 90);
      if (vistos[chave]) return false;
      vistos[chave] = true; return true;
    });
    if (!arr.length) throw new Error('a IA não devolveu JSON válido — tente de novo');
    let ok = 0;
    arr.forEach(q => {
      if (!q || !q.enunciado || !Array.isArray(q.alternativas) || q.alternativas.length < 3) return;
      const idx = Number(q.correta);
      if (!(idx >= 0 && idx < q.alternativas.length)) return;
      S.geradas.push({
        id: 'IA-' + Date.now().toString(36) + '-' + (ok + 1), materia: mid, topico: q.topico || top, dif: q.dif || 'media',
        banca: 'IA' + (q.__ia ? ' (' + q.__ia + ')' : '') + ' · Fundação CETAP', ano: new Date().getFullYear(),
        enunciado: q.enunciado, alternativas: q.alternativas.slice(0, 5), correta: idx, comentario: q.comentario || '', analise: '', ia: true
      }); ok++;
    });
    salvar(); reindexar();
    out.innerHTML = ok
      ? `✅ ${ok} questões adicionadas ao seu banco${varias ? ` (geradas por ${ides.length - falhas.length} IA(s))` : ''}! Já valem no treino, no simulado e nas estatísticas.${falhas.length ? ' Não responderam: ' + esc(falhas.join(', ')) + '.' : ''}`
      : '⚠️ Nenhuma questão válida retornada. Tente novamente.';
    if (ok) { toast(`${ok} questões novas 🤖`); setTimeout(() => iniciarSessaoGeradasIA(ok), 400); }
  } catch (e) { out.innerHTML = `⚠️ ${esc(e.message)}`; }
}

/* texto normalizado, para comparar questões e achar repetidas (ignora acentos/pontuação) */
function normalizarParaComparar(t) {
  return String(t || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9 ]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function parseJSONArr(txt) {
  if (!txt) return null;
  let t = String(txt).trim();
  t = t.replace(/```json/gi, '```').split('```').filter((s, i) => i % 2 === 1).join('\n') || t;
  const i = t.indexOf('['), j = t.lastIndexOf(']');
  if (i < 0 || j < 0) return null;
  let raw = t.slice(i, j + 1);
  const tenta = s => { try { return JSON.parse(s); } catch (e) { return null; } };
  return tenta(raw) || tenta(raw.replace(/,\s*([\]}])/g, '$1').replace(/[\u201c\u201d]/g, '"')) || null;
}

  </div>`;
  if (typeof ligarSync === 'function') ligarSync();
  $('#p-salvar').onclick = () => { S.config.nome = $('#p-nome').value; S.config.metaDia = +$('#p-meta').value || 41; S.config.metaTotal = +$('#p-metatotal').value || 3000; S.config.dataProva = $('#p-prova').value; salvar(); atualizarBadges(); toast('Configurações salvas ✅'); $('#app-nome') && ($('#app-nome').value = S.config.nome); };
  $('#p-export').onclick = () => {

  };

  $('#p-reset').onclick = () => { if (confirm('Isso apaga TODO o seu progresso. Continuar?') && confirm('Tem certeza? Não dá para desfazer.')) { S = estadoInicial(); salvar(); reindexar(); toast('Progresso zerado'); irPara('painel'); } };
}

/* ------------------------------ 14. PLANO -------------------------------- */
function renderPlano(root) {
  const m = metricas();
  const pesos = { LP: 12, LE: 8, INFO: 8, RL: 10, SEC: 5, DA: 12, DC: 9, DPC: 4, PL: 14, DF: 4, DPREV: 3, DCIV: 6, DPCIV: 4, DH: 3 };
  const totalPeso = MATERIAS.reduce((s, x) => s + (pesos[x.id] || 5), 0);
  // cronograma: blocos de matérias por dia, priorizando o que está mais fraco
  const dias = Math.max(1, m.restam);
  const plano7 = [];
  for (let d = 0; d < 7; d++) {
    const data = new Date(Date.now() + d * 86400000);
    const ordem = MATERIAS.slice().sort((a, b) => (statsMateria(a.id).pct || 50) - (statsMateria(b.id).pct || 50));
    const picks = [ordem[d % ordem.length], ordem[(d + 5) % ordem.length], ordem[(d + 9) % ordem.length]];
    plano7.push({ data, itens: picks });
  }
  root.innerHTML = `
  <div class="card">
    <h2>🗓️ Plano até 13/12/2026 — ${m.restam} dias</h2>
    <div class="grid c3">
      <div class="kpi"><b>${m.metaDia}</b><span>questões/dia para chegar a ${m.metaTotal}</span></div>
      <div class="kpi"><b>${m.faltam}</b><span>questões faltando</span></div>
      <div class="kpi"><b>${nf(m.tot / m.metaTotal * 100, 1)}%</b><span>da meta concluída</span></div>
    </div>
    <h3>Como o peso do edital se distribui</h3>
    ${MATERIAS.map(x => `<div style="margin:6px 0"><div class="row" style="justify-content:space-between"><span class="small">${esc(x.nome)}</span><span class="tiny muted">~${nf((pesos[x.id] || 5) / totalPeso * 100, 0)}% da prova</span></div>
      <div class="bar"><i style="width:${larguraPct((pesos[x.id] || 5) / Math.max(...Object.values(pesos)) * 100)}%"></i></div></div>`).join('')}
    <div class="tiny muted" style="margin-top:6px">Pesos estimados a partir da relevância dos blocos do Anexo II (o edital não divulga o número de questões por matéria — ajuste conforme o seu desempenho).</div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">📅 Seus próximos 7 dias</h3>
    ${plano7.map(p => `<div style="border-left:3px solid var(--pri);padding:2px 0 2px 10px;margin:10px 0">
      <b>${DIAS[p.data.getDay()]}, ${fmtData(p.data)}</b>
      <div class="small muted">Meta: ${m.metaDia} questões · ~50 min de teoria</div>
      <div>${p.itens.map(it => `<button class="btn sm" style="margin:4px 4px 0 0" onclick="irPara('teoria');setTimeout(()=>{},0)">${esc(it.nome)}</button>`).join('')}</div>
    </div>`).join('')}
    <div class="row" style="margin-top:12px">
      <button class="btn pri" onclick="iniciarTreinoRapido()">▶ Fazer as ${Math.min(20, m.metaDia)} questões de agora</button>
      <button class="btn" onclick="iniciarRevisao()">🔁 Revisar erros</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">🧭 Estratégia recomendada (CETAP / ALEPA – cargo 15)</h3>
    <div class="small" style="white-space:pre-wrap;color:#dfe6ff">${esc(ESTRATEGIA)}</div>
  </div>`;
}
const ESTRATEGIA = `1) PROCESSO LEGISLATIVO E RIALEPA é o coração da prova deste cargo: é o bloco mais extenso do Anexo II (proposições, comissões, quóruns, regimes de tramitação, PPA/LDO/LOA, decretos legislativos e resoluções). Estude com o Regimento Interno aberto ao lado e treine questões todos os dias.
2) TÉCNICA LEGISLATIVA (LC 95/1998): decore a estrutura da lei (parte preliminar, normativa, final), a ordem dos artigos (art. 1º = objeto; últimos artigos = vigência) e as regras de alteração/revogação. É conteúdo de altíssimo retorno.
3) DIREITO ADMINISTRATIVO + CONSTITUCIONAL: a banca cobra literalidade da lei e da CF. Leia a Lei 14.133/2021 (licitações) pelo menos nas partes mais cobradas: modalidades, prazos, dispensas e inexigibilidade.
4) LÍNGUA PORTUGUESA: treine interpretação com textos oficiais e revise crase, concordância, regência e pontuação. Redação oficial (Manual da Presidência) cai junto de "comunicação assertiva".
5) LEGISLAÇÃO E ÉTICA: LGPD, Lei Anticorrupção e improbidade (Lei 8.429/1992 com a 14.230/2021) são presença garantida. Decore prazos de prescrição e sanções.
6) RLM: não é decoreba — é treino. Use os geradores infinitos aqui do app todo dia por 15 minutos; ganho rápido de pontos.
7) Ritmo: 40 questões/dia + 1 simulado de 60 questões por semana. Corrija o simulado no mesmo dia e mande as erradas para a revisão espaçada.
8) Na reta final (últimos 15 dias): diminua teoria, aumente simulados e revisão de erros. Releia os resumos de bolso deste app.`;

function salvarConfigIA() {

  try { salvar(); } catch (e) { }

/* Um clique para resolver "esse modelo não existe mais": consulta a lista da

}

async function rodarDiagnostico() {
  const out = $('#ia-teste-out');
  out.innerHTML = '<span class="badge"><span class="spin"></span> testando endereço, chave e modelos… (pode levar ~30s)</span>';
  let rel;
  try { rel = await diagnosticarIA(); } catch (e) { rel = 'Erro ao diagnosticar: ' + ((e && e.message) || e); }
  out.innerHTML = `<div class="fb" style="background:rgba(79,125,251,.08);border:1px solid rgba(79,125,251,.35)"><div class="tt">🔍 Diagnóstico do tutor de IA</div>
    <pre style="white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;margin:0;color:#dbe3f7">${esc(rel)}</pre>

      <button class="btn sm ghost" id="ia-fechar-diag">Fechar</button>
    </div></div>`;
  const b = $('#ia-copiar-diag'); if (b) b.onclick = () => { navigator.clipboard && navigator.clipboard.writeText(rel).then(() => toast('Relatório copiado ✅')).catch(() => { }); };
  const f = $('#ia-fechar-diag'); if (f) f.onclick = () => { out.innerHTML = ''; };
}
