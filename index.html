<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b13">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estudos ALEPA">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Arena Estudos — ALEPA 002/2026 (Fundação CETAP) — Cargo 15</title>
<style>/* ============================================================================
   Arena Estudos ALEPA — folha de estilo
   Direção visual: painel profissional sóbrio (navy/slate), uma cor de destaque,
   tipografia com hierarquia clara, superfícies planas com bordas de 1px e
   microinterações discretas. Nenhum efeito "chamativo": o conteúdo é o herói.
   ========================================================================== */

:root{
  /* superfícies */
  --bg:#080b13; --bg2:#0d1220; --card:#0f1523; --card2:#141b2d; --line:#232c47;
  --line2:#2e3860;                       /* borda em hover/destaque */
  /* texto */
  --txt:#e9edf8; --txt2:#98a4c2; --txt3:#6f7b9c;
  /* cores funcionais */
  --pri:#4f7dfb; --pri2:#7fa0ff; --ok:#34d399; --err:#fb7185; --warn:#fbbf24; --gold:#f5c451;
  /* formas */
  --r:14px; --r-sm:10px; --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.55);
  --ring:0 0 0 3px rgba(79,125,251,.28);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
    radial-gradient(1100px 520px at 12% -8%,rgba(79,125,251,.16) 0%,transparent 62%),
    radial-gradient(760px 420px at 104% 4%,rgba(56,189,248,.10) 0%,transparent 60%),
    var(--bg);
  color:var(--txt);
  font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-feature-settings:"cv05","ss01";
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
a{color:var(--pri2);text-decoration:none;border-bottom:1px solid rgba(127,160,255,.35)}
a:hover{border-bottom-color:var(--pri2)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
::selection{background:rgba(79,125,251,.35)}
.hidden{display:none !important}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:8px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#232c47;border:3px solid transparent;background-clip:content-box;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#39456e;background-clip:content-box}

/* ---------------------------------- Layout ------------------------------- */
.wrap{max-width:1060px;margin:0 auto;padding:20px 16px 96px}
header.top{
  position:sticky;top:0;z-index:50;
  background:rgba(8,11,19,.86);
  -webkit-backdrop-filter:saturate(160%) blur(14px);backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1060px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:15px}
.logo .dot{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;
  background:linear-gradient(150deg,#1d3a7a,#0f1c3d);border:1px solid #2c4a8f;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.10)
}
.logo small{display:block;font-weight:500;color:var(--txt2);font-size:11px;line-height:1.35;letter-spacing:0}
.spacer{flex:1}

/* abas: controle segmentado */
nav.tabs{display:flex;gap:2px;overflow-x:auto;max-width:100%;padding:6px 12px 8px;scrollbar-width:none;box-shadow:inset 0 -1px 0 var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  white-space:nowrap;padding:7px 13px;border-radius:9px;color:var(--txt2);
  border:1px solid transparent;font-weight:600;font-size:13.5px;letter-spacing:-.005em;
  transition:background .16s ease,color .16s ease,border-color .16s ease
}
nav.tabs button:hover{color:var(--txt);background:rgba(255,255,255,.04)}
nav.tabs button.active{background:var(--card2);color:#fff;border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}

/* ----------------------------------- Cards -------------------------------- */
.card{
  background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:18px;
  box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden
}
.card::before{ /* fio de luz superior: dá profundidade sem parecer "brinquedo" */
  content:"";position:absolute;inset:0 0 auto;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.10) 22%,rgba(255,255,255,.10) 78%,transparent)
}
.card h2{margin:0 0 10px;font-size:18px;font-weight:700;letter-spacing:-.02em}
.card h3{margin:16px 0 8px;font-size:15px;font-weight:650;color:#fff;letter-spacing:-.01em}
.card h3:first-child{margin-top:0}
h4{font-size:14px;font-weight:650;letter-spacing:-.005em}
.muted{color:var(--txt2)}
.small{font-size:12.5px}
.tiny{font-size:11.5px;line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(235px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.grid.c4{grid-template-columns:repeat(auto-fit,minmax(145px,1fr))}

/* ---------------------------------- Badges -------------------------------- */
.badge{
  display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--txt2);
  padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;
  font-variant-numeric:tabular-nums;white-space:nowrap
}
.badge.ok{color:#6ee7b7;border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.09)}
.badge.err{color:#fda4af;border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.10)}
.badge.warn{color:#fcd34d;border-color:rgba(251,191,36,.32);background:rgba(251,191,36,.09)}
.badge.pri{color:#bfd4ff;border-color:rgba(79,125,251,.38);background:rgba(79,125,251,.12)}

/* ---------------------------------- Botões -------------------------------- */
.btn{
  background:var(--card2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px 15px;font-weight:600;font-size:14px;letter-spacing:-.005em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  transition:transform .12s ease,border-color .16s ease,background .16s ease,box-shadow .16s ease
}
.btn:hover{border-color:var(--line2);background:#182136;transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.pri{background:linear-gradient(180deg,#5b86ff,#3f6ae8);border-color:#3f6ae8;color:#fff;box-shadow:0 6px 16px -8px rgba(79,125,251,.9),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.pri:hover{background:linear-gradient(180deg,#6b93ff,#4a75f0);border-color:#4a75f0}
.btn.ok{background:linear-gradient(180deg,#2fbf7d,#1e9c62);border-color:#1e9c62;color:#04150e;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.btn.gold{background:linear-gradient(180deg,#f7cf63,#e0ad2f);border-color:#d9a527;color:#241a02;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.045)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}

/* ---------------------------------- Campos -------------------------------- */
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  background:#0b1020;border:1px solid var(--line);border-radius:var(--r-sm);
  padding:10px 12px;width:100%;outline:none;color:var(--txt);
  transition:border-color .16s ease,box-shadow .16s ease,background .16s ease
}
input::placeholder,textarea::placeholder{color:var(--txt3)}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:var(--ring);background:#0c1226}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--txt2) 50%),linear-gradient(135deg,var(--txt2) 50%,transparent 50%);background-position:calc(100% - 17px) calc(50% + 1px),calc(100% - 12px) calc(50% + 1px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
label.f{display:block;font-size:12px;color:var(--txt2);margin:10px 0 5px;font-weight:600;letter-spacing:.01em}
input[type=checkbox]{accent-color:var(--pri)}

/* --------------------------------- Progresso ------------------------------ */
.bar{height:8px;background:#0b1020;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,#4f7dfb,#7fa0ff);transition:width .45s cubic-bezier(.4,0,.2,1)}
.bar.ok > i{background:linear-gradient(90deg,#1e9c62,#34d399)}
.bar.gold > i{background:linear-gradient(90deg,#d9a527,#f5c451)}
.kpi{
  background:linear-gradient(180deg,var(--card2),#111827);
  border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:center
}
.kpi b{display:block;font-size:24px;line-height:1.15;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

/* ---------------------------------- Questão ------------------------------- */
.qhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.qtext{font-size:16.5px;line-height:1.68;white-space:pre-wrap;letter-spacing:-.005em}
.qtext code{background:#0b1020;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:14px;font-family:var(--mono)}
.alt{
  display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:#0d1324;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin:8px 0;
  transition:border-color .16s ease,background .16s ease,transform .12s ease
}
.alt:hover{border-color:var(--line2);background:#101731;transform:translateY(-1px)}
.alt .ltr{
  flex:0 0 27px;height:27px;border-radius:8px;background:var(--card2);border:1px solid var(--line);
  display:grid;place-items:center;font-weight:700;font-size:12.5px;color:var(--txt2)
}
.alt .tx{flex:1;white-space:pre-wrap;font-size:14.5px;line-height:1.6}
.alt.sel{border-color:var(--pri);background:rgba(79,125,251,.12)}
.alt.sel .ltr{background:var(--pri);border-color:var(--pri);color:#fff}
.alt.right{border-color:rgba(52,211,153,.6);background:rgba(52,211,153,.10)}
.alt.right .ltr{background:#1e9c62;border-color:#1e9c62;color:#fff}
.alt.wrong{border-color:rgba(251,113,133,.6);background:rgba(251,113,133,.10)}
.alt.wrong .ltr{background:#c73b52;border-color:#c73b52;color:#fff}
.alt[disabled]{cursor:default}
.alt[disabled]:hover{transform:none}

.fb{border-radius:12px;padding:14px;border:1px solid var(--line);background:var(--card2);margin-top:12px;border-left-width:3px}
.fb.right{border-color:rgba(52,211,153,.35);border-left-color:var(--ok);background:rgba(52,211,153,.07)}
.fb.wrong{border-color:rgba(251,113,133,.35);border-left-color:var(--err);background:rgba(251,113,133,.07)}
.fb .tt{font-weight:700;margin-bottom:6px;letter-spacing:-.01em;font-size:14.5px}
.fb .com{white-space:pre-wrap;font-size:14.5px;color:#dbe3f7;line-height:1.65}
.explica{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px}
.explica b{color:#fff}

/* --------------------------------- Simulado ------------------------------- */
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:21px;letter-spacing:-.01em}
.qnav{display:flex;flex-wrap:wrap;gap:6px}
.qnav button{
  width:34px;height:34px;border-radius:9px;background:#0d1324;border:1px solid var(--line);
  font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;transition:.14s
}
.qnav button:hover{border-color:var(--line2)}
.qnav button.done{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.5);color:#6ee7b7}
.qnav button.cur{box-shadow:var(--ring);border-color:var(--pri)}
.qnav button.flag{border-color:rgba(251,191,36,.6);color:#fcd34d}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--txt2);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
tbody tr:hover{background:rgba(255,255,255,.025)}
tr:last-child td{border-bottom:none}
td b{font-variant-numeric:tabular-nums}

/* ----------------------------------- Chat --------------------------------- */
.chat{display:flex;flex-direction:column;gap:10px;max-height:62vh;overflow-y:auto;padding:6px}
.msg{
  max-width:88%;padding:12px 14px;border-radius:14px;white-space:pre-wrap;
  font-size:14.5px;line-height:1.65;border:1px solid var(--line);box-shadow:0 8px 20px -14px rgba(0,0,0,.8)
}
.msg.user{align-self:flex-end;background:linear-gradient(180deg,#1b3163,#16264c);border-color:#294b8f}
.msg.bot{align-self:flex-start;background:var(--card2)}
.msg.sys{align-self:center;background:transparent;border:none;box-shadow:none;color:var(--txt2);font-size:12.5px;text-align:center;max-width:96%}
.chatbar{display:flex;gap:8px;margin-top:10px;align-items:flex-end}
.chatbar textarea{resize:none;height:46px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.25);border-top-color:var(--pri2);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.qgen{border-left:3px solid var(--pri);padding-left:12px;margin:10px 0}

/* ------------------------------------ Misc -------------------------------- */
.streak{display:flex;gap:4px;flex-wrap:wrap}
.streak i{width:15px;height:15px;border-radius:4px;background:#0d1324;border:1px solid var(--line);display:block}
.streak i.on{background:linear-gradient(135deg,#e0ad2f,#f7cf63);border-color:#b45309}
.topic-pill{
  display:inline-block;background:rgba(255,255,255,.035);border:1px solid var(--line);
  border-radius:999px;padding:4px 11px;margin:3px 3px 0 0;font-size:12px;color:var(--txt2)
}
details{border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin:8px 0;background:#0c1222}
details summary{cursor:pointer;font-weight:650;letter-spacing:-.005em}
details[open] summary{margin-bottom:9px}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:#16203a;border:1px solid var(--line2);padding:11px 17px;border-radius:12px;
  z-index:99;box-shadow:0 20px 40px -18px rgba(0,0,0,.9);font-size:13.5px;max-width:92vw
}
.fab{position:fixed;right:18px;bottom:18px;z-index:60;display:flex;flex-direction:column;gap:8px}
.fab button{
  width:46px;height:46px;border-radius:50%;font-size:18px;
  background:var(--card2);border:1px solid var(--line2);color:var(--txt);
  box-shadow:0 12px 26px -12px rgba(0,0,0,.9);transition:.16s
}
.fab button:hover{background:#1b2540;transform:translateY(-2px)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:#0d1324;border:1px solid var(--line);display:block}
.heat i.l1{background:#1b3a7d;border-color:#22458c}
.heat i.l2{background:#2c5bd0;border-color:#3c6ee0}
.heat i.l3{background:#5b86ff;border-color:#7fa0ff}
.heat i.l4{background:#e0ad2f;border-color:#f5c451}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.seg button{
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#0c1222;
  font-size:13px;color:var(--txt2);font-weight:600;transition:.16s
}
.seg button:hover{color:var(--txt);border-color:var(--line2)}
.seg button.active{background:var(--pri);color:#fff;border-color:transparent}

/* acessibilidade: respeita quem pediu menos animação */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  html{scroll-behavior:auto}
}
@media print{header.top,.fab,nav.tabs{display:none}.card{break-inside:avoid;box-shadow:none}}
@media (max-width:620px){
  body{font-size:14.5px}
  .wrap{padding:14px 12px 88px}
  .card{padding:14px;border-radius:13px}
  .qtext{font-size:16px}
  .msg{max-width:94%}
  .top-in{padding:9px 12px;gap:7px}
  .logo small{display:none}
  .logo{font-size:14px}
  .kpi b{font-size:21px}
  nav.tabs{padding:6px 10px 8px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="logo"><span class="dot">📘</span><span>Arena Estudos ALEPA<small>Concurso 002/2026 · Fundação CETAP · Cargo 15 – Assistência Legislativa</small></span></div>
    <span class="spacer"></span>
    <span class="badge pri" id="badge-hoje">0/0 hoje</span>
    <span class="badge warn" id="badge-up">— dias</span>
    <button class="btn sm" id="badge-ia" title="Configurar a chave do Hugging Face">🔑 IA desligada</button>
    <button class="btn sm" id="btn-instalar" title="Instalar no celular">📲</button>
    <button class="btn sm" id="btn-config" title="Configurações rápidas">⚙️</button>
  </div>
  <nav class="tabs"></nav>
  <div id="cfgbar" class="hidden" style="max-width:1080px;margin:0 auto;padding:0 14px 12px">
    <div class="grid c4">
      <div><label class="f">Seu nome</label><input id="app-nome" placeholder="Como quer ser chamado?"></div>
      <div><label class="f">Meta diária</label><input type="number" id="app-meta" value="41"></div>
      <div><label class="f">Meta total</label><input type="number" id="app-meta-total" value="3000"></div>
      <div><label class="f">Data da prova</label><input type="date" id="app-prova" value="2026-12-13"></div>
    </div>
    <div class="row" style="margin-top:8px"><button class="btn sm pri" id="cfg-salvar">Salvar</button><span class="tiny muted">Fica salvo no seu aparelho.</span></div>
  </div>
</header>

<main class="wrap" id="app"></main>

<div class="fab">
  <button id="fab-topo" title="Voltar ao topo">↑</button>
</div>

window.__BANCO__ = [{"id": "LP-001", "materia": "LP", "topico": "Crase", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Assinale a alternativa em que o emprego da crase está CORRETO.", "alternativas": ["Entreguei o requerimento à Sua Excelência o Senhor Presidente.", "O deputado fez referência à Vossa Excelência durante o discurso.", "Chegamos à Belém no início da manhã para a audiência pública.", "O servidor começou a trabalhar às 8 horas, mas terminou as 18 horas.", "Dirigiu-se à Sua Senhoria a fim de protocolar o ofício."], "correta": 0, "comentario": "Usa-se crase antes de pronomes de tratamento apenas nos casos de 'Senhora', 'Senhorita' e 'Dona' e nas expressões 'Sua Excelência' quando empregadas com valor possessivo/ao se referir a ela com o artigo: a banca costuma cobrar o contraste básico — NÃO se usa crase antes de pronomes de tratamento que não admitem artigo (Vossa Excelência, Sua Senhoria, Vossa Senhoria, Vossa Magnificência). Em 'A' o uso é aceito porque 'à Sua Excelência o Senhor Presidente' funciona como locução com artigo. Nas demais: 'a Belém' (nome de cidade sem determinante), 'as 18 horas' (não há preposição antes, é hora de chegada/partida sem crase? — atenção: o correto é 'às 18 horas'; aqui a banca explora justamente o par correto/incorreto), e 'a Sua Senhoria' (pronome de tratamento sem artigo).", "analise": "B) 'à Vossa Excelência' — errado: pronome de tratamento não admite artigo, logo não há crase. C) 'à Belém' — errado: nome de cidade não determinado não recebe artigo. D) 'terminou as 18 horas' — errado: deveria ser 'às 18 horas' (crase obrigatória em horas). E) 'à Sua Senhoria' — errado pelo mesmo motivo de B.", "ref": "Emprego do sinal indicativo de crase"}, {"id": "LP-002", "materia": "LP", "topico": "Uso dos porquês", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Assinale a alternativa em que todas as formas dos porquês estão empregadas corretamente.", "alternativas": ["Não compareci à sessão por que estava doente; explique por quê faltou.", "Não sei o porquê de tanta discussão; ele saiu porque quis.", "Porque você não protocolou o requerimento ontem?", "Ele não explicou o porque da ausência.", "Faltou à reunião, porquê estava de licença."], "correta": 1, "comentario": "'Porquê' (junto e com acento) é substantivo sinônimo de motivo/razão, normalmente após artigo: 'o porquê'. 'Porque' (junto e sem acento) é conjunção causal/explicativa. 'Por que' (separado sem acento) inicia interrogativa ou equivale a 'pelo qual'. 'Por quê' (separado e acentuado) aparece em fim de frase ou antes de pausa.", "analise": "A) primeiro uso correto, mas 'explique por quê faltou' erra: em início de interrogativa indireta usa-se 'por que'. C) início de interrogativa direta exige 'Por que'. D) 'o porque' deveria ser 'o porquê'. E) conjunção causal é 'porque', sem acento.", "ref": "Uso dos porquês"}, {"id": "LP-003", "materia": "LP", "topico": "Ortografia", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Assinale a alternativa em que TODAS as palavras estão grafadas corretamente.", "alternativas": ["previlégio, excessão, beneficiente", "privilégio, exceção, beneficente", "privilégio, excessão, beneficente", "previlégio, exceção, beneficiente", "privilégio, eceção, beneficiente"], "correta": 1, "comentario": "Grafias corretas: privilégio (com i depois do p... na verdade com 'vi'), exceção (com 'ç' e sem 'ss'), beneficente (sem 'i' após o 'c'). Essas três palavras estão entre as mais cobradas em provas: memorize o trio privilégio / exceção / beneficente.", "analise": "'Previlégio' e 'beneficiente' são formas inexistentes; 'excessão' grafa-se com 'ç' e um único 's' (exceção).", "ref": "Ortografia"}, {"id": "LP-004", "materia": "LP", "topico": "Acentuação gráfica", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A palavra 'saúde' é acentuada pela mesma regra que:", "alternativas": ["juiz", "país", "café", "hífen", "órgão"], "correta": 1, "comentario": "Regra do hiato: acentuam-se o 'i' e o 'u' tônicos quando formam hiato com a vogal anterior, sozinhos na sílaba (ou seguidos de s): sa-ú-de, pa-ís, ba-ú, Lu-ís. É a segunda vogal do hiato que recebe acento.", "analise": "A) 'juiz' não é acentuado (monossílabo tônico com i seguido de z, regra do hiato não se aplica). C) 'café' é oxítona terminada em e. D) 'hífen' é paroxítona terminada em n. E) 'órgão' é paroxítona terminada em ditongo seguido de o (acentuam-se as paroxítonas terminadas em ditongo).", "ref": "Acentuação gráfica"}, {"id": "LP-005", "materia": "LP", "topico": "Classes de palavras", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No trecho 'Conforme determina o Regimento Interno, o parecer será encaminhado mediante requerimento do líder', as palavras destacadas 'conforme' e 'mediante' classificam-se, respectivamente, como:", "alternativas": ["conjunção conformativa e preposição", "preposição e conjunção", "advérbio e conjunção", "conjunção causal e advérbio", "preposição e preposição"], "correta": 0, "comentario": "'Conforme' com valor de 'segundo, de acordo com' é conjunção subordinativa conformativa (liga orações introduzindo conformidade). 'Mediante' é preposição acidental, equivalente a 'por meio de'.", "analise": "As demais alternativas invertem ou trocam as classes: 'mediante' nunca é advérbio (não modifica verbo isoladamente) e 'conforme' não expressa causa.", "ref": "Classes de palavras: conjunção e preposição"}, {"id": "LP-006", "materia": "LP", "topico": "Concordância verbal", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Assinale a alternativa em que a concordância verbal está CORRETA.", "alternativas": ["Fazem dois anos que o projeto foi aprovado.", "Haviam muitos requerimentos na pauta da sessão.", "Existe, na Assembleia, servidores aprovados em concurso.", "Faz dois anos que o projeto foi aprovado.", "Houveram muitas discussões sobre o orçamento."], "correta": 3, "comentario": "Os verbos impessoais 'fazer' (indicando tempo decorrido) e 'haver' (no sentido de existir) ficam obrigatoriamente na 3ª pessoa do singular: faz dois anos, havia muitos requerimentos, houve discussões. Já 'existir' é pessoal e concorda com o sujeito: existem servidores.", "analise": "A) 'Fazem dois anos' → correto é 'Faz dois anos'. B) 'Haviam' → 'Havia'. C) 'Existe... servidores' → 'Existem servidores' (existir concorda com o sujeito). E) 'Houveram' → 'Houve'.", "ref": "Concordância verbal"}, {"id": "LP-007", "materia": "LP", "topico": "Concordância nominal", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Assinale a alternativa em que a concordância nominal está CORRETA.", "alternativas": ["É proibido a entrada de pessoas estranhas no plenário.", "Seguem anexo os documentos solicitados pela comissão.", "É proibida entrada de pessoas estranhas no plenário.", "Os documentos seguem anexas ao ofício.", "Estavam meia cansadas as servidoras após a sessão."], "correta": 3, "comentario": "'Anexo' é adjetivo e concorda com o substantivo: 'Seguem anexas as planilhas', 'Os documentos seguem anexos'. Em D, o correto seria 'anexos' (documentos = masculino plural). 'Meia' com valor de advérbio (= um pouco) é invariável: 'meio cansadas'. A expressão 'é proibido entrada' (sem artigo) é invariável.", "analise": "A) e C) com artigo ('a entrada') a concordância é obrigatória — 'É proibida a entrada'; sem artigo (C) e com 'entrada' sem determinante, 'É proibido entrada'. B) 'Seguem anexo' → 'anexos'. D) 'anexas' → 'anexos'. E) 'meia cansadas' → 'meio cansadas'.", "ref": "Concordância nominal"}, {"id": "LP-008", "materia": "LP", "topico": "Regência verbal", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Assinale a alternativa em que a regência verbal está CORRETA.", "alternativas": ["Prefiro negociar do que romper o acordo.", "Assistimos o vídeo institucional da Assembleia.", "O servidor aspirava ao cargo de chefia da seção.", "Os deputados implicaram com o novo regimento, ou seja, acarretaram mudanças.", "Obedeça o Regimento Interno sem discussão."], "correta": 2, "comentario": "'Aspirar' no sentido de desejar/almejar é transitivo indireto e exige a preposição a: aspirar a algo. 'Preferir' exige 'a' (prefiro A a B), não 'do que'. 'Assistir' como verbo de ver é transitivo indireto (assistir a). 'Implicar' no sentido de acarretar é transitivo direto. 'Obedecer' é transitivo indireto (obedecer a).", "analise": "A) 'Prefiro negociar do que' → 'Prefiro negociar a romper'. B) 'Assistimos o vídeo' → 'Assistimos ao vídeo'. D) 'implicaram com o novo regimento' muda o sentido (implicar = embirrar); para 'acarretar' seria 'implicaram mudanças'. E) 'Obedeça o Regimento' → 'Obedeça ao Regimento'.", "ref": "Regência verbal"}, {"id": "LP-009", "materia": "LP", "topico": "Colocação dos pronomes oblíquos átonos", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Assinale a alternativa em que a colocação pronominal está CORRETA.", "alternativas": ["Me informaram que o prazo foi prorrogado.", "Nunca soube-se do teor do parecer.", "Todos afirmaram que se lembrariam da leitura.", "O servidor que apresentou-se voluntariamente foi elogiado.", "Informarei-te sobre o resultado da votação."], "correta": 2, "comentario": "Há próclise obrigatória quando o verbo é antecedido de conjunção subordinativa ('que se lembrariam'), de advérbio de negação ('nunca se soube'), de pronome relativo ('o servidor que se apresentou') e em orações iniciadas por palavra atrativa. Não se inicia frase com pronome átono (não existe 'Me informaram' na norma padrão), salvo casos especiais como 'Em se tratando de'.", "analise": "A) próclise em início de frase é vedada → correto: 'Informaram-me'. B) 'Nunca soube-se' contraria a próclise obrigatória → correto: 'Nunca se soube'. D) o pronome relativo 'que' atrai o pronome → correto: 'que se apresentou'. E) é vedada a ênclise com verbo no futuro do presente → correto: 'Informar-te-ei' (mesóclise). Por isso só a alternativa C está correta.", "ref": "Colocação dos pronomes oblíquos átonos"}, {"id": "LP-010", "materia": "LP", "topico": "Figuras de linguagem", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Na frase 'Li Machado de Assis durante as férias', ocorre a figura de linguagem denominada:", "alternativas": ["metáfora", "metonímia", "hipérbole", "eufemismo", "antítese"], "correta": 1, "comentario": "Metonímia é a substituição de um termo por outro com relação de proximidade/sentido (autor pela obra, parte pelo todo, marca pelo produto). Ao dizer 'li Machado de Assis', entende-se que foi lida a obra do autor.", "analise": "A) metáfora seria comparação implícita. C) hipérbole é exagero. D) eufemismo é suavização de ideia desagradável. E) antítese é aproximação de ideias opostas.", "ref": "Figuras de linguagem"}, {"id": "LP-011", "materia": "LP", "topico": "Pontuação", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Em 'Os deputados, que votaram a favor do projeto, deixaram o plenário', o uso das vírgulas:", "alternativas": ["está incorreto, pois não se separam orações adjetivas.", "indica que TODOS os deputados votaram a favor e depois saíram.", "indica que apenas alguns deputados votaram a favor.", "transforma a oração em substantiva.", "é obrigatório sempre que houver pronome relativo."], "correta": 1, "comentario": "Oração subordinada adjetiva EXPLICATIVA (entre vírgulas) generaliza: todos os deputados votaram a favor. Sem as vírgulas (restritiva), o sentido se restringe a apenas parte deles.", "analise": "A) as explicativas são separadas por vírgulas. C) e D) invertem o valor da oração. E) o uso das vírgulas depende do caráter explicativo, não da simples presença do relativo.", "ref": "Pontuação e período composto"}, {"id": "LP-012", "materia": "LP", "topico": "Coesão e coerência", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No período 'A sessão foi longa; ____, os deputados permaneceram atentos até o fim', o conectivo que mantém a coerência é:", "alternativas": ["portanto", "no entanto", "porque", "ou seja", "assim como"], "correta": 1, "comentario": "Há oposição de sentido (sessão longa x atenção até o fim), o que exige conectivo adversativo/contrastivo: 'no entanto', 'entretanto', 'contudo', 'todavia'.", "analise": "A) 'portanto' e E) 'assim como' não expressam contraste. C) 'porque' é causal (poderia até ser adequado em outra leitura, mas não marca a oposição pretendida). D) 'ou seja' indica reformulação.", "ref": "Coesão e coerência"}, {"id": "LP-013", "materia": "LP", "topico": "Significação das palavras", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Assinale a alternativa em que o par de palavras foi empregado corretamente.", "alternativas": ["O diretor vai ratificar o ofício, corrigindo o erro material.", "O diretor vai retificar o acordo, confirmando o seu teor.", "O diretor vai ratificar o acordo, confirmando o seu teor.", "A sessão foi infligida pelo novo regimento.", "O prazo foi infringido pelo servidor, causando prejuízo ao erário, ou seja, violado."], "correta": 2, "comentario": "'Ratificar' = confirmar; 'retificar' = corrigir. São parônimos clássicos de prova. 'Infligir' = aplicar (pena); 'infringir' = violar. Portanto confirmar o teor de um acordo é ratificar.", "analise": "A) corrigir é retificar. B) confirmar é ratificar. D) 'infligida' significa aplicar pena — o correto seria 'imposta'. E) mistura os dois: violar = infringir, mas a frase usa 'infringido' e depois explica como violado, gerando incoerência interna na própria alternativa quando comparada ao gabarito.", "ref": "Sinônimos, antônimos, homônimos e parônimos"}, {"id": "LP-014", "materia": "LP", "topico": "Redação oficial: Manual de Redação da Presidência da República", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Segundo o Manual de Redação da Presidência da República, o fecho 'Respeitosamente' é utilizado:", "alternativas": ["em qualquer comunicação oficial, indistintamente.", "apenas para autoridades de hierarquia superior à do signatário.", "apenas para autoridades de mesma hierarquia.", "apenas em comunicações internas.", "em substituição ao vocativo."], "correta": 1, "comentario": "O Manual prevê dois fechos: 'Respeitosamente' para autoridades de hierarquia SUPERIOR e 'Atenciosamente' para autoridades de mesma hierarquia ou de hierarquia inferior. Não há mais o uso de 'Digníssimo' (DD.) nos endereçamentos, salvo em casos protocolares específicos (diplomatas).", "analise": "A) não é indistinto. C) para mesma hierarquia usa-se 'Atenciosamente'. D) o Manual não restringe a comunicações internas. E) fecho e vocativo são elementos distintos do padrão ofício.", "ref": "Manual de Redação da Presidência da República"}, {"id": "LP-015", "materia": "LP", "topico": "Redação oficial: escrita de textos formais", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São atributos da redação oficial, além da formalidade e da padronização:", "alternativas": ["clareza e precisão, concisão, impessoalidade e formalidade", "ambiguidade, pessoalidade e informalidade", "subjetividade, ornamento e prolixidade", "clareza, pessoalidade e redundância", "informalidade, uniformidade e rigor estilístico"], "correta": 0, "comentario": "Os atributos da redação oficial são: clareza e precisão, objetividade, concisão, coesão e coerência, impessoalidade, formalidade e padronização, além do uso da norma culta. Impessoalidade significa ausência de marcas pessoais e de opinião do redator.", "analise": "As demais alternativas trazem vícios que contrariam o Manual (pessoalidade, ambiguidade, prolixidade, informalidade).", "ref": "Redação oficial"}, {"id": "LP-016", "materia": "LP", "topico": "Compreensão e Interpretação de Textos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Texto: 'A técnica legislativa não é ornamento: é a condição de possibilidade de que a lei seja compreendida por quem deve cumpri-la. Uma norma redigida com ambiguidade transfere ao intérprete um poder que não lhe pertence.'\nInfere-se do texto que:", "alternativas": ["a ambiguidade normativa amplia indevidamente o poder do intérprete.", "o ornamento é essencial à técnica legislativa.", "a lei deve ser compreendida apenas pelos juristas.", "o intérprete deve criar o sentido da norma sempre que puder.", "a técnica legislativa é irrelevante para o cumprimento da lei."], "correta": 0, "comentario": "O texto afirma que a ambiguidade 'transfere ao intérprete um poder que não lhe pertence' — ou seja, amplia indevidamente a margem de decisão do aplicador da norma. As demais alternativas contrariam as ideias do texto.", "analise": "B) o texto nega que seja ornamento. C) o texto diz 'por quem deve cumpri-la', isto é, o destinatário geral. D) contraria o sentido. E) contraria o sentido.", "ref": "Compreensão e Interpretação de Textos"}, {"id": "LP-017", "materia": "LP", "topico": "Comunicação assertiva", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A comunicação assertiva no serviço público caracteriza-se por:", "alternativas": ["linguagem rebuscada que demonstre erudição do servidor.", "linguagem simples, concisa e objetiva, com foco na mensagem e no respeito ao interlocutor.", "uso de gírias e informalidade para aproximar-se do cidadão.", "omissão de informações desfavoráveis.", "respostas genéricas para evitar conflitos."], "correta": 1, "comentario": "Assertividade é a capacidade de se comunicar de forma direta, clara e respeitosa, dizendo o que precisa ser dito sem agressividade nem omissão. No serviço público, soma-se o dever de transparência (Lei nº 13.460/2017 e Lei de Acesso à Informação).", "analise": "As demais opções descrevem vícios de comunicação: prolixidade, informalidade inadequada, omissão e evasão.", "ref": "Comunicação assertiva"}, {"id": "LP-018", "materia": "LP", "topico": "Ortografia", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "De acordo com o Acordo Ortográfico vigente, a grafia CORRETA é:", "alternativas": ["micro-ondas, auto-estima, anti-inflamatório", "micro-ondas, autoestima, anti-inflamatório", "microondas, auto-estima, antinflamatório", "micro-ondas, autoestima, antiinflamatório", "microondas, autoestima, anti-inflamatório"], "correta": 1, "comentario": "Regras: (1) mantém-se o hífen quando o prefixo termina em vogal ou consoante igual à vogal/consoante que inicia o segundo elemento nas palavras compostas que designam espécies (micro-ondas) e quando o segundo elemento começa por h, r, s ou vogal igual ao prefixo (anti-inflamatório, anti-higiênico, inter-regional). (2) Não se usa hífen quando o prefixo termina em vogal e o segundo elemento começa com consoante diferente, nem quando as vogais são diferentes: autoestima, autoescola, socioeconômico.", "analise": "A) 'auto-estima' perdeu o hífen. C) 'microondas' está errado (mantém-se o hífen por serem vogais iguais) e 'antinflamatório' perdeu o hífen indevidamente. D) e E) erram anti-inflamatório.", "ref": "Ortografia: emprego do hífen"}, {"id": "LP-019", "materia": "LP", "topico": "Período composto", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Em 'Caso o parecer não seja apresentado no prazo, a matéria será retirada de pauta', a oração destacada classifica-se como subordinada adverbial:", "alternativas": ["causal", "condicional", "concessiva", "temporal", "consecutiva"], "correta": 1, "comentario": "'Caso' introduz hipótese/condição — subordinada adverbial condicional (equivalentes: se, caso, desde que, contanto que, sem que).", "analise": "A) causa: porque, já que, visto que. C) concessão: embora, ainda que. D) tempo: quando, enquanto. E) consequência: que (precedido de tão/tanto).", "ref": "Período composto por subordinação"}, {"id": "LP-020", "materia": "LP", "topico": "Regência nominal", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Assinale a alternativa em que a regência nominal está CORRETA.", "alternativas": ["O servidor está apto de exercer o cargo.", "Ele é obediente as normas regimentais.", "A comissão mostrou-se favorável a proposta apresentada.", "Mostraram-se contrários de qualquer alteração regimental.", "O candidato está apto para o exercício do cargo."], "correta": 4, "comentario": "Regências: 'apto para' / 'apto a'; 'obediente a'; 'favorável a'; 'contrário a'. A construção 'apto ao exercício do cargo' (ou 'para o exercício') é a forma consagrada.", "analise": "A) 'apto de' não existe. B) 'obediente as' deveria ser 'obediente às'. C) e D) faltou a crase/preposição em 'à proposta' e 'a qualquer alteração'.", "ref": "Regência nominal"}, {"id": "LP-021", "materia": "LP", "topico": "Crase", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Assinale a alternativa em que o uso da crase é facultativo.", "alternativas": ["Referi-me à candidata aprovada.", "Chegamos às 14 horas.", "Entreguei o ofício à Senhora Deputada.", "Fui até à Assembleia Legislativa.", "Dedicou-se à causa ambiental."], "correta": 3, "comentario": "O emprego da crase é FACULTATIVO após a preposição 'até' (até a / até à), antes de pronomes possessivos femininos (a minha / à minha) e antes de nomes próprios femininos de pessoa (a Maria / à Maria). Nas demais hipóteses é obrigatório.", "analise": "A) antes de 'candidata' (substantivo comum feminino) é obrigatório. B) horas: obrigatório. C) 'Senhora' admite artigo: obrigatório. E) 'causa' determinada: obrigatório.", "ref": "Emprego do sinal indicativo de crase"}, {"id": "LP-022", "materia": "LP", "topico": "Interpretação e coesão", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Texto: 'O Regimento Interno é a lei interna da Casa. Como toda lei, envelhece. A diferença é que, no Parlamento, quem o atualiza são os próprios destinatários das regras.'\nA expressão 'os próprios destinatários das regras' refere-se a:", "alternativas": ["aos técnicos de informática da Casa.", "aos deputados, que elaboram e seguem as normas regimentais.", "aos servidores administrativos.", "ao público externo.", "aos Ministros do Supremo Tribunal Federal."], "correta": 1, "comentario": "O texto trata do Regimento Interno do Parlamento: quem atualiza as regras são os parlamentares — os destinatários das normas e também seus elaboradores. A coesão referencial é obtida por expressão lexical (não por pronome), recurso muito cobrado em interpretação.", "analise": "As demais opções não preenchem o critério lógico (elaborar e cumprir o Regimento).", "ref": "Compreensão e Interpretação de Textos"}, {"id": "LP-023", "materia": "LP", "topico": "Pontuação", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Assinale a alternativa corretamente pontuada.", "alternativas": ["O projeto, foi aprovado em primeiro turno.", "O projeto foi aprovado em primeiro turno, e segue para a segunda votação.", "O projeto foi aprovado, em primeiro turno.", "O projeto foi aprovado em primeiro turno; e segue para a segunda votação.", "O projeto foi aprovado em primeiro turno segue para a segunda votação."], "correta": 1, "comentario": "Não se separa sujeito de predicado por vírgula (A e C), nem se usa ponto e vírgula antes de 'e' quando as orações coordenadas são curtas e ligadas por conjunção (D). O uso da vírgula antes de 'e' com sujeitos diferentes ou orações de extensão considerável é aceito (B).", "analise": "E) falta pontuação entre as orações, gerando frase agramatical.", "ref": "Pontuação"}, {"id": "LP-024", "materia": "LP", "topico": "Classes de palavras", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Em 'Venderam-se todos os ingressos para a sessão solene', o 'se' classifica-se como:", "alternativas": ["índice de indeterminação do sujeito", "partícula apassivadora (pronome apassivador)", "pronome reflexivo", "parte integrante do verbo", "conjunção subordinativa"], "correta": 1, "comentario": "Com verbo transitivo direto na 3ª pessoa (vender) e sujeito expresso/paciente (todos os ingressos), o 'se' é partícula apassivadora — a oração equivale a 'Todos os ingressos foram vendidos'. O índice de indeterminação ocorre com verbos transitivos indiretos, de ligação ou intransitivos (ex.: 'Precisa-se de servidores').", "analise": "C) reflexivo exigiria o sujeito praticando e recebendo a ação. D) parte integrante ocorre em verbos pronominais (arrepender-se). E) não há valor conjuntivo.", "ref": "Classes de palavras: pronome"}, {"id": "LP-025", "materia": "LP", "topico": "Argumentação e persuasão", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Um texto argumentativo que apresenta dados estatísticos, cita dispositivo legal e menciona exemplo concreto está empregando, respectivamente, argumentos de:", "alternativas": ["autoridade, exemplificação e senso comum", "dados/provas, autoridade e exemplificação", "senso comum, provas e emoção", "analogia, causa e consequência", "emoção, autoridade e dados"], "correta": 1, "comentario": "Tipos de argumento mais cobrados: dados/estatísticas (provas), autoridade (citação de lei, doutrinador, órgão), exemplificação (caso concreto), analogia (comparação), senso comum, causa e consequência, e argumento emocional.", "analise": "As demais alternativas baralham os tipos (senso comum, emoção, analogia não correspondem aos elementos citados).", "ref": "Argumentação e persuasão"}, {"id": "LP-026", "materia": "LP", "topico": "Concordância verbal", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Assinale a alternativa CORRETA quanto à concordância.", "alternativas": ["Mais de um deputado se abstiveram na votação.", "Um e outro servidor apresentaram o requerimento.", "Houveram reclamações sobre o prazo regimental.", "Basta os documentos exigidos para a posse.", "Devem haver muitas emendas ao orçamento."], "correta": 1, "comentario": "'Um e outro' admite o verbo no plural (apresentaram) — construção correta. 'Mais de um' pede verbo no singular, salvo reciprocidade. 'Haver' impessoal fica no singular. 'Bastar' concorda com o sujeito: 'Bastam os documentos'. 'Devem haver' é errado porque haver impessoal não se flexiona (correto: 'Deve haver').", "analise": "A) 'Mais de um... se abstiveram' → correto 'se absteve'. C) 'Houveram' → 'Houve'. D) 'Basta os documentos' → 'Bastam os documentos'. E) 'Devem haver' → 'Deve haver'.", "ref": "Concordância verbal e nominal"}, {"id": "LP-027", "materia": "LP", "topico": "Redação oficial: escrita de textos formais", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Assinale a alternativa que apresenta linguagem ADEQUADA à redação oficial.", "alternativas": ["Vimos por meio desta informar que o pedido tá em análise.", "Informamos que o pedido encontra-se em análise nesta Comissão.", "Informamos que a gente vai analisar o pedido oportunamente.", "Vimos, respeitosamente, informar que o pedido ainda não foi olhado.", "Informamos que o pedido não deu certo ainda."], "correta": 1, "comentario": "Redação oficial exige norma culta, impessoalidade, concisão e precisão. 'Tá', 'a gente', 'olhado' (sentido impróprio) e 'não deu certo' são inadequados. Além disso, 'Vimos por meio desta' é expressão condenada por prolixidade — o Manual recomenda ir direto ao assunto.", "analise": "A) informalidade e vício de 'por meio desta'. C) informalidade ('a gente'). D) informalidade e imprecisão ('não foi olhado'). E) imprecisão e coloquialismo.", "ref": "Redação oficial / comunicação assertiva"}, {"id": "LP-028", "materia": "LP", "topico": "Significação das palavras", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Em 'A Comissão deliberou pela prejudicialidade do projeto', a palavra 'prejudicialidade' significa, no jargão legislativo, que o projeto:", "alternativas": ["perdeu seu objeto ou foi superado por outro, não devendo ser conhecido.", "recebeu parecer favorável.", "foi encaminhado à sanção.", "sofreu apenas emendas de redação.", "foi aprovado em regime de urgência."], "correta": 0, "comentario": "Prejudicialidade é o incidente pelo qual a proposição perde o objeto (por já ter sido aprovada matéria idêntica, por perda de prazo ou por superação dos fatos), deixando de ser conhecida. O vocabulário técnico-legislativo é exigência direta do Anexo II (proposições, prejudicialidade).", "analise": "As demais opções descrevem situações diversas (parecer, sanção, emendas, urgência) sem relação com o conceito.", "ref": "Significação das palavras / vocabulário técnico"}, {"id": "LP-029", "materia": "LP", "topico": "Compreensão e Interpretação de Textos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Texto: 'A publicidade dos atos legislativos não é concessão: é pressuposto de legitimidade. Onde o cidadão não pode ver o que se decide, a decisão perde a força de obrigar.'\nDe acordo com o texto, a publicidade é:", "alternativas": ["uma benesse da Administração.", "pressuposto de legitimidade da decisão.", "dispensável em matérias orçamentárias.", "substituível pela votação nominal.", "facultativa, conforme o Regimento."], "correta": 1, "comentario": "A tese é explícita: publicidade é 'pressuposto de legitimidade', não concessão. Interpretação literal/análise de tese é o tipo de questão mais comum em provas de português da CETAP.", "analise": "A) o texto nega ('não é concessão'). C) o texto não abre exceção. D) e E) não são afirmadas no texto.", "ref": "Compreensão e Interpretação de Textos"}, {"id": "LP-030", "materia": "LP", "topico": "Acentuação gráfica", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Todas as palavras estão corretamente acentuadas em:", "alternativas": ["ítem, rúbrica, gratúito", "item, rubrica, gratuito", "ítem, rubrica, gratuito", "item, rúbrica, gratúito", "item, rubrica, gratúito"], "correta": 1, "comentario": "'Item' é paroxítona terminada em 'n' — não recebe acento (não é 'ítem'). 'Rubrica' e 'gratuito' são paroxítonas graves sem acento gráfico (a tonicidade cai em 'bri' e 'tui', respectivamente; são erros clássicos de prosódia: 'rúbrica' e 'gratúito' não existem na norma culta).", "analise": "As demais alternativas incluem ao menos uma forma incorreta de pronúncia/acentuação.", "ref": "Acentuação gráfica e prosódia"}, {"id": "LE-001", "materia": "LE", "topico": "Assédio moral e sexual: conceitos e medidas de enfrentamento", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o assédio moral no serviço público, assinale a alternativa CORRETA.", "alternativas": ["Configura-se com um único ato isolado de advertência do superior hierárquico.", "Caracteriza-se por conduta abusiva repetitiva e prolongada que expõe o servidor a situações humilhantes, degradantes ou de constrangimento.", "Confunde-se com a exigência legítima de cumprimento de metas de trabalho.", "Só ocorre entre servidores de hierarquias distintas.", "Não pode ocorrer entre colegas de mesmo nível hierárquico."], "correta": 1, "comentario": "Os elementos essenciais do assédio moral são a REPETIÇÃO (habitualidade), a PROLONGAMENTO no tempo, a intenção de humilhar/excluir e o desequilíbrio de poder. Ato isolado é, no mais das vezes, exercício regular do poder hierárquico ou do poder disciplinar. Pode haver assédio vertical (chefe x subordinado), horizontal (entre pares) e misto.", "analise": "A) ato isolado não configura assédio. C) exigência de metas é poder diretivo quando razoável e impessoal. D) e E) o assédio pode ser horizontal e ascendente.", "ref": "Assédio moral"}, {"id": "LE-002", "materia": "LE", "topico": "Assédio moral e sexual: conceitos e medidas de enfrentamento", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o assédio sexual, assinale a alternativa CORRETA.", "alternativas": ["Está tipificado no art. 216-A do Código Penal e exige que o agente se prevaleça de sua condição de superior hierárquico ou ascendência.", "Configura crime apenas se houver contato físico.", "Pode ser praticado apenas por homens contra mulheres.", "É crime de ação penal pública condicionada apenas quando a vítima é menor de 14 anos.", "Não pode ocorrer no ambiente de trabalho, mas apenas em ambiente doméstico."], "correta": 0, "comentario": "Art. 216-A do CP (Lei nº 10.224/2001): 'Constranger alguém com o intuito de obter vantagem ou favorecimento sexual, prevalecendo-se o agente da sua condição de superior hierárquico ou ascendência inerentes ao exercício de emprego, cargo ou função'. Pena: detenção de 1 a 2 anos. Não exige contato físico — o constrangimento com finalidade sexual já tipifica.", "analise": "B) não exige contato físico. C) qualquer gênero pode ser agente ou vítima. D) a ação é pública condicionada à representação (art. 225 do CP) — e se a vítima é menor de 18 anos é pública incondicionada, conforme a Súmula 608 do STF. E) é justamente crime do ambiente de trabalho.", "ref": "Assédio sexual – art. 216-A do CP"}, {"id": "LE-003", "materia": "LE", "topico": "Assédio moral e sexual: conceitos e medidas de enfrentamento", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A Lei nº 14.457/2022, que institui o Programa Emprega + Mulheres, trouxe como medida de enfrentamento ao assédio:", "alternativas": ["a extinção das CIPAs.", "a obrigatoriedade de adoção de medidas de prevenção e combate ao assédio sexual e a outras formas de violência no trabalho, inclusive com previsão em normas internas.", "a vedação de denúncias anônimas.", "a limitação do assédio ao âmbito do trabalho remoto.", "a criação de um crime novo de assédio moral no Código Penal."], "correta": 1, "comentario": "A Lei nº 14.457/2022 (alterando a CLT) determinou que as empresas e órgãos adotem medidas de prevenção e combate ao assédio sexual e à violência no trabalho, incluindo regras de conduta, canais de denúncia e ações de capacitação; nos órgãos com CIPA, as normas passam a integrar as atribuições da comissão.", "analise": "A) a CIPA foi reforçada, não extinta. C) canais de denúncia foram estimulados. D) a lei não limita o assédio ao teletrabalho. E) o assédio moral não foi tipificado como crime pelo Código Penal.", "ref": "Lei nº 14.457/2022"}, {"id": "LE-004", "materia": "LE", "topico": "LGPD – Lei nº 13.709/2018", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Segundo a LGPD, considera-se dado pessoal sensível:", "alternativas": ["nome completo e endereço residencial do titular.", "dado sobre origem racial ou étnica, convicção religiosa, opinião política, filiação a sindicato, dado referente à saúde ou à vida sexual, dado genético ou biométrico.", "número de matrícula funcional do servidor.", "endereço de e-mail institucional.", "histórico de acessos ao sistema interno."], "correta": 1, "comentario": "Art. 5º, II, da Lei nº 13.709/2018 (LGPD): dado pessoal sensível é todo dado sobre origem racial ou étnica, convicção religiosa, opinião política, filiação a sindicato ou a organização de caráter religioso, filosófico ou político, dado referente à saúde ou à vida sexual, dado genético ou biométrico, quando vinculado a pessoa natural.", "analise": "As demais opções são dados pessoais comuns (art. 5º, I), que também merecem proteção, mas em regime menos restritivo.", "ref": "LGPD art. 5º, II"}, {"id": "LE-005", "materia": "LE", "topico": "LGPD – Lei nº 13.709/2018", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o tratamento de dados pessoais pela Administração Pública, a LGPD estabelece que:", "alternativas": ["o poder público pode tratar dados sem finalidade específica, desde que haja interesse público genérico.", "o poder público deve realizar o tratamento para o atendimento de sua finalidade pública, na persecução do interesse público, com o objetivo de executar as competências legais.", "depende sempre de consentimento do titular, ainda que o tratamento decorra de obrigação legal.", "é vedado ao poder público compartilhar dados com outros órgãos.", "a LGPD não se aplica aos órgãos públicos."], "correta": 1, "comentario": "Art. 23 da LGPD: 'O tratamento de dados pessoais pelas pessoas jurídicas de direito público referidas no parágrafo único do art. 1º da Lei nº 12.527/2011 (LAI) deverá ser realizado para o atendimento de sua finalidade pública, na persecução do interesse público, com o objetivo de executar as competências legais ou cumprir as atribuições legais do serviço público'. O consentimento é apenas uma das bases legais do art. 7º — obrigação legal dispensa consentimento.", "analise": "A) exige finalidade específica e informada. C) bases legais são alternativas, não cumulativas. D) o compartilhamento é possível nas hipóteses legais. E) a LGPD se aplica expressamente ao setor público.", "ref": "LGPD art. 23 e art. 7º"}, {"id": "LE-006", "materia": "LE", "topico": "LGPD – Lei nº 13.709/2018", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "De acordo com a LGPD, NÃO é direito do titular dos dados pessoais:", "alternativas": ["confirmação da existência de tratamento.", "acesso aos dados.", "correção de dados incompletos, inexatos ou desatualizados.", "eliminação de dados tratados com base em obrigação legal que exija a conservação.", "portabilidade dos dados a outro fornecedor."], "correta": 3, "comentario": "A eliminação é direito do titular, mas a própria LGPD ressalva a hipótese de conservação obrigatória por lei (art. 18, VI e art. 16). Logo, quando o tratamento decorre de obrigação legal — como ocorre com registros funcionais, fiscais e de controle —, o dado não pode ser eliminado.", "analise": "A, B, C e E são direitos expressamente previstos no art. 18 da LGPD (confirmação, acesso, correção, anonimização/eliminação, portabilidade, eliminação, informação sobre compartilhamento e sobre a não realização do consentimento, revogação).", "ref": "LGPD arts. 16 e 18"}, {"id": "LE-007", "materia": "LE", "topico": "LGPD – Lei nº 13.709/2018", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a Autoridade Nacional de Proteção de Dados (ANPD), assinale a CORRETA.", "alternativas": ["É órgão jurisdicional, com competência para julgar ações de indenização.", "É órgão da administração pública federal, integrante do Poder Executivo, com atribuições de zelar pela proteção de dados pessoais, editar normas complementares e aplicar sanções administrativas.", "Foi extinta pela própria LGPD.", "Suas decisões são imutáveis, não cabendo recurso.", "Não pode aplicar multa às entidades públicas."], "correta": 1, "comentario": "A ANPD é autarquia de natureza especial vinculada ao Ministério da Justiça (hoje, órgão da administração pública federal), criada pela Lei nº 13.709/2018 e estruturada pela Medida Provisória nº 1.124/2022. Compete-lhe zelar pela proteção de dados, editar normas orientativas, fiscalizar e aplicar sanções (arts. 55-A a 55-J da LGPD).", "analise": "A) não exerce jurisdição — não julga ações entre particulares. C) a ANPD foi criada pela LGPD e hoje é autarquia de natureza especial. D) suas decisões são passíveis de recurso administrativo. E) pode aplicar sanções a entidades públicas, com regras específicas de prazo para adequação.", "ref": "LGPD arts. 55-A a 55-J"}, {"id": "LE-008", "materia": "LE", "topico": "Segurança da informação: fundamentos, conceitos e mecanismos", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Os três pilares clássicos da segurança da informação são:", "alternativas": ["confidencialidade, integridade e disponibilidade", "legalidade, impessoalidade e eficiência", "autenticidade, moralidade e publicidade", "disponibilidade, publicidade e razoabilidade", "integridade, motivação e congruência"], "correta": 0, "comentario": "A tríade CID (confidencialidade, integridade e disponibilidade) é a base da segurança da informação. A ISO/IEC 27001 acrescenta propriedades como autenticidade, responsabilidade (accountability), não repúdio e confiabilidade. Confidencialidade = acesso só por autorizados; integridade = dado não alterado indevidamente; disponibilidade = acesso quando necessário.", "analise": "As demais alternativas misturam princípios constitucionais da Administração com conceitos de controle.", "ref": "Segurança da informação – tríade CID"}, {"id": "LE-009", "materia": "LE", "topico": "Segurança da informação: fundamentos, conceitos e mecanismos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O golpe em que o criminoso simula comunicar-se com a vítima por e-mail, SMS ou telefone, fingindo ser instituição conhecida, para obter dados pessoais e senhas, é denominado:", "alternativas": ["ransomware", "phishing (pesca de dados), do qual o smishing e o vishing são variações", "ataque de força bruta", "sniffing de rede", "pharming de DNS"], "correta": 1, "comentario": "Phishing é a tentativa de obter dados sensíveis por meio de mensagens que imitam pessoas ou instituições confiáveis (engenharia social). Variações: smishing (SMS), vishing (voz/telefone) e spear phishing (ataque direcionado e personalizado).", "analise": "A) ransomware sequestra dados mediante criptografia e pede resgate. C) força bruta testa combinações de senha. D) sniffing captura tráfego. E) pharming redireciona o usuário a um falso site por manipulação de DNS.", "ref": "Segurança da informação – engenharia social"}, {"id": "LE-010", "materia": "LE", "topico": "Lei Anticorrupção – Lei nº 12.846/2013", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A Lei nº 12.846/2013 (Lei Anticorrupção) estabelece a responsabilização:", "alternativas": ["subjetiva das pessoas jurídicas, dependendo da comprovação de dolo ou culpa.", "objetiva, nas esferas administrativa e civil, das pessoas jurídicas que pratiquem atos lesivos contra a administração pública.", "apenas penal, restrita a dirigentes da empresa.", "exclusivamente dos agentes públicos envolvidos.", "apenas em âmbito administrativo, vedada a reparação de danos."], "correta": 1, "comentario": "Art. 1º: a lei dispõe sobre a responsabilização objetiva administrativa e civil de pessoas jurídicas pela prática de atos contra a administração pública, nacional ou estrangeira. Art. 2º reforça: as pessoas jurídicas são responsabilizadas objetivamente (independe de dolo ou culpa), nos âmbitos administrativo e civil. A responsabilização individual dos dirigentes exige dolo ou culpa (art. 3º).", "analise": "A) responsabilidade objetiva, não subjetiva. C) não é responsabilização penal de dirigentes (a lei não criminaliza pessoas jurídicas). D) além do agente público, a pessoa jurídica responde. E) há reparação integral do dano (art. 6º §3º e art. 19).", "ref": "Lei nº 12.846/2013, arts. 1º a 3º"}, {"id": "LE-011", "materia": "LE", "topico": "Lei Anticorrupção – Lei nº 12.846/2013", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A multa prevista na Lei nº 12.846/2013, quando for possível mensurar o faturamento bruto da pessoa jurídica, corresponde a:", "alternativas": ["0,1% a 20% do faturamento bruto do último exercício anterior ao da instauração do processo administrativo.", "0,5% a 10% do lucro líquido do exercício.", "até 30% do patrimônio líquido.", "valor fixo de R$ 100.000,00.", "1% do capital social, independentemente da infração."], "correta": 0, "comentario": "Art. 6º, I: multa no valor de 0,1% a 20% do faturamento bruto do último exercício anterior ao da instauração do processo administrativo, excluídos os tributos. Não sendo possível essa mensuração, aplica-se de R$ 6.000,00 a R$ 60.000.000,00 (art. 6º, I, segunda parte). A lei prevê ainda a publicação extraordinária da decisão condenatória (art. 6º, II).", "analise": "As alternativas trazem percentuais e bases de cálculo inexistentes na lei.", "ref": "Lei nº 12.846/2013, art. 6º"}, {"id": "LE-012", "materia": "LE", "topico": "Lei Anticorrupção – Lei nº 12.846/2013", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O acordo de leniência previsto na Lei Anticorrupção:", "alternativas": ["isenta automaticamente a empresa de qualquer obrigação de ressarcimento.", "pode ser celebrado com as pessoas jurídicas que colaborem efetivamente com as investigações, resultando em benefícios como redução da multa e isenção da publicação extraordinária da decisão condenatória.", "depende da identificação prévia e do cumprimento integral da pena pelos dirigentes.", "extingue a possibilidade de responsabilização de agentes públicos.", "é vedado quando houver dano ao erário."], "correta": 1, "comentario": "Art. 16 da Lei nº 12.846/2013: a autoridade máxima do órgão pode celebrar acordo de leniência com pessoas jurídicas que colaborem efetivamente com a investigação e o processo administrativo, desde que seja a primeira a se manifestar sobre o interesse em cooperar. Efeitos (art. 16, §2º e §3º): redução de até 2/3 da multa, isenção da publicação extraordinária da decisão condenatória, isenção de sanções administrativas relacionadas ao processo de licitação e vedação de aplicação de penalidades administrativas por parte de órgãos/entidades públicos. O acordo NÃO isenta do ressarcimento do dano e não impede a responsabilização dos agentes públicos.", "analise": "A) o dever de reparar permanece. C) não há essa condição. D) não extingue responsabilidade de pessoas físicas. E) é possível mesmo havendo dano, mantido o dever de reparação.", "ref": "Lei nº 12.846/2013, art. 16"}, {"id": "LE-013", "materia": "LE", "topico": "Decreto nº 11.129/2022", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O Decreto nº 11.129/2022 dispõe sobre a responsabilização administrativa de pessoas jurídicas pela prática de atos contra a administração pública e, entre outros pontos:", "alternativas": ["revogou a Lei nº 12.846/2013.", "regulamenta o processo administrativo de responsabilização (PAR) no âmbito federal, detalhando a apuração, o termo de compromisso e a valoração do programa de integridade.", "criou novos crimes de corrupção no Código Penal.", "aplica-se apenas a empresas estrangeiras.", "dispensa a obrigatoriedade de defesa prévia dos investigados."], "correta": 1, "comentario": "O Decreto nº 11.129/2022 regulamenta, no âmbito federal, a Lei nº 12.846/2013: disciplina o PAR, a comissão de apuração, o acordo de leniência, o termo de compromisso e a avaliação do programa de integridade (que pode gerar redução percentual na multa). Decretos regulamentares não podem revogar lei nem criar crimes.", "analise": "A) lei só se revoga por lei. C) criação de crimes é matéria de lei (reserva legal). D) aplica-se à administração pública federal. E) o contraditório e a ampla defesa são assegurados.", "ref": "Decreto nº 11.129/2022"}, {"id": "LE-014", "materia": "LE", "topico": "Lei nº 8.429/1992 e alterações (Lei nº 14.230/2021)", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Após a Lei nº 14.230/2021, os atos de improbidade administrativa:", "alternativas": ["admitem modalidade culposa em qualquer hipótese.", "exigem dolo específico para sua configuração, sendo taxativamente previstos em lei.", "passaram a ser de competência exclusiva do Tribunal de Contas.", "deixaram de exigir prejuízo ao erário em qualquer caso.", "prescrevem em 3 anos."], "correta": 1, "comentario": "A Lei nº 14.230/2021 alterou o art. 1º da Lei nº 8.429/1992 para exigir dolo: '§ 1º: Consideram-se atos de improbidade administrativa as condutas dolosas tipificadas nos arts. 9º, 10 e 11 desta Lei'. Além disso, o art. 1º, §2º exige a finalidade de obter proveito ou benefício indevido, e o art. 11 passou a ter rol taxativo (não mais exemplificativo).", "analise": "A) improbidade culposa deixou de existir. C) a competência é do Poder Judiciário, com atuação do MP. D) nos arts. 9º e 10 há exigência de vantagem indevida/dano. E) a prescrição é de 8 anos (art. 23).", "ref": "Lei nº 8.429/1992, art. 1º (redação da Lei nº 14.230/2021)"}, {"id": "LE-015", "materia": "LE", "topico": "Lei nº 8.429/1992 e alterações (Lei nº 14.230/2021)", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Quanto à prescrição da ação para aplicação das sanções da Lei de Improbidade Administrativa, a regra vigente é:", "alternativas": ["5 anos contados do término do mandato ou do cargo em comissão.", "8 anos contados a partir da ocorrência do fato ou, nas infrações permanentes, do dia em que cessou a permanência.", "10 anos contados do trânsito em julgado.", "imprescritível, em qualquer hipótese.", "3 anos contados da ciência pelo Ministério Público."], "correta": 1, "comentario": "Art. 23, caput, com redação da Lei nº 14.230/2021: 'A ação para a aplicação das sanções previstas nesta Lei prescreve em 8 (oito) anos, contados a partir da ocorrência do fato ou, no caso de infrações permanentes, do dia em que cessou a permanência'. A lei ainda prevê a prescrição intercorrente (§8º) quando o processo ficar paralisado por mais de 3 anos.", "analise": "A) era a regra antiga (5 anos), revogada pela Lei nº 14.230/2021. C) e E) prazos inexistentes. D) a ação de ressarcimento pode ser imprescritível (STF, tema 897), mas a ação para APLICAÇÃO DAS SANÇÕES tem prazo de 8 anos.", "ref": "Lei nº 8.429/1992, art. 23"}, {"id": "LE-016", "materia": "LE", "topico": "Lei nº 8.429/1992 e alterações (Lei nº 14.230/2021)", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Configura ato de improbidade administrativa que importa enriquecimento ilícito e sujeita o agente, entre outras sanções, a suspensão dos direitos políticos:", "alternativas": ["até 4 anos", "até 8 anos", "até 12 anos", "até 14 anos", "de 4 a 12 anos"], "correta": 3, "comentario": "Art. 12, I, da Lei nº 8.429/1992 (com as alterações da Lei nº 14.230/2021): na hipótese do art. 9º (enriquecimento ilícito) as sanções são perda dos bens ou valores acrescidos ilicitamente, perda da função pública, suspensão dos direitos políticos ATÉ 14 ANOS, multa civil equivalente ao valor do acréscimo patrimonial e proibição de contratar com o poder público ou receber benefícios por prazo não superior a 14 anos. Para os atos do art. 10 (prejuízo ao erário), a suspensão é de até 12 anos.", "analise": "As demais opções não correspondem ao art. 12, I, que é o mais gravoso do sistema. A multa pode ser aumentada até o dobro (art. 12, §2º) e a suspensão não tem mais pena mínima obrigatória.", "ref": "Lei nº 8.429/1992, art. 12, I"}, {"id": "LE-017", "materia": "LE", "topico": "Ética e moral; ética, princípios, valores e a lei", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A diferença clássica entre ética e moral é que:", "alternativas": ["ética é o conjunto de normas de um grupo e moral é a reflexão filosófica.", "ética é a reflexão crítica e filosófica sobre os costumes e valores; moral é o conjunto de normas, valores e costumes vigentes em determinado grupo social.", "ambas são sinônimos perfeitos, sem distinção técnica.", "ética depende de lei e moral depende de religião.", "moral é universal e imutável; ética é sempre individual."], "correta": 1, "comentario": "Etimologicamente 'ética' (ethos) e 'moral' (mos/moris) têm origem semelhante, mas a distinção consagrada é: moral = conjunto de normas e valores efetivamente praticados por um grupo (caráter prescritivo e histórico-cultural); ética = a filosofia que reflete sobre esses fundamentos, ou seja, a teoria da moral (caráter reflexivo e crítico).", "analise": "A) inverte os conceitos. C) não são sinônimos na acepção técnica. D) e E) reduzem indevidamente os conceitos.", "ref": "Ética e moral"}, {"id": "LE-018", "materia": "LE", "topico": "Conduta ética e ética profissional", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Os princípios constitucionais expressos da Administração Pública, cobrados em conjunto com a ética no serviço público, são:", "alternativas": ["legalidade, impessoalidade, moralidade, publicidade e eficiência", "razoabilidade, proporcionalidade, motivação, ampla defesa e contraditório", "legalidade, isonomia, moralidade, transparência e economicidade", "supremacia do interesse público, autoexecutoriedade, presunção de legitimidade, imperatividade e tipicidade", "eficiência, eficácia, efetividade, publicidade e impessoalidade"], "correta": 0, "comentario": "Art. 37, caput, da CF/88: a administração pública direta e indireta de qualquer dos Poderes obedecerá aos princípios de LEGALIDADE, IMPESSOALIDADE, MORALIDADE, PUBLICIDADE e EFICIÊNCIA (mnemônico LIMPE). Os demais são princípios implícitos, como razoabilidade, proporcionalidade, motivação, ampla defesa e segurança jurídica.", "analise": "As outras alternativas misturam princípios implícitos ou atributos dos atos administrativos com os princípios expressos.", "ref": "CF/88 art. 37, caput"}, {"id": "LE-019", "materia": "LE", "topico": "Ética e democracia: exercício da cidadania", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a relação entre ética e democracia no serviço público, assinale a CORRETA.", "alternativas": ["A ética é indiferente ao regime político, pois é assunto exclusivamente privado.", "A democracia exige a participação cidadã e a responsabilização dos agentes públicos, sendo a ética pública condição de legitimidade do exercício do poder.", "A cidadania se esgota no voto, não envolvendo controle social.", "A transparência é obstáculo à eficiência administrativa.", "A corrupção é um fato natural da política, sem relação com a ética."], "correta": 1, "comentario": "Ética e democracia se conectam porque o poder público é poder delegado: prestação de contas (accountability), participação popular, transparência e probidade são condições de legitimidade. A cidadania se exerce também por mecanismos de controle social (audiências públicas, conselhos, transparência, ouvidoria, acesso à informação).", "analise": "A) ética pública é matéria de interesse coletivo. C) cidadania é exercício permanente, não apenas voto. D) transparência é instrumento de eficiência e controle. E) corrupção é fenômeno combatido juridicamente.", "ref": "Ética e democracia"}, {"id": "LE-020", "materia": "LE", "topico": "Ética e responsabilidade social; ética e função pública", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Constitui dever ético elementar do servidor público no atendimento ao cidadão:", "alternativas": ["prestar atendimento com cortesia, eficiência, respeito e sem discriminação, informando com clareza os prazos e procedimentos.", "condicionar o atendimento à apresentação de documentos não exigidos em lei, para maior segurança.", "negar informações sobre o andamento do processo para preservar a administração.", "priorizar conhecidos e autoridades em qualquer fila.", "transferir ao cidadão a responsabilidade por erro administrativo."], "correta": 0, "comentario": "Os deveres éticos de atendimento incluem cortesia, presteza, respeito, impessoalidade (sem privilégios) e informação clara. O Manual de Redação da Presidência da República e a Lei nº 13.460/2017 (Código de Defesa dos Usuários de Serviços Públicos) reforçam o direito à informação adequada, à qualidade no atendimento e à participação.", "analise": "As demais alternativas descrevem condutas vedadas pela ética pública e pela Lei nº 13.460/2017.", "ref": "Lei nº 13.460/2017 e ética no serviço público"}, {"id": "LE-021", "materia": "LE", "topico": "Constituição do Estado do Pará aplicada ao Poder Legislativo", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Nos termos da Constituição do Estado do Pará, o Poder Legislativo estadual:", "alternativas": ["é exercido pela Assembleia Legislativa, que goza de autonomia administrativa e financeira.", "é exercido pelo Governador, com auxílio da Assembleia.", "é exercido em modelo bicameral, com Assembleia e Senado estadual.", "não possui autonomia financeira, dependendo de repasse discricionário do Executivo.", "é exercido pelo Tribunal de Contas do Estado."], "correta": 0, "comentario": "Art. 86 da Constituição do Estado do Pará: 'O Poder Legislativo é exercido pela Assembleia Legislativa, gozando de autonomia administrativa e financeira'. A ALEPA é órgão UNICAMERAL (não existe Senado estadual) e elabora sua proposta orçamentária nos limites da LDO, encaminhada pelo seu Presidente após aprovação do Plenário. Cada legislatura dura 4 anos.", "analise": "B) o Governador exerce o Executivo. C) não há bicameralismo estadual. D) a autonomia financeira está expressa. E) o TCE é órgão de controle externo auxiliar, não Poder Legislativo.", "ref": "Constituição do Estado do Pará, art. 86"}, {"id": "LE-022", "materia": "LE", "topico": "Constituição do Estado do Pará aplicada ao Poder Legislativo", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a composição da Assembleia Legislativa do Pará, é CORRETO afirmar que:", "alternativas": ["é composta por 41 Deputados Estaduais, eleitos pelo sistema proporcional, para mandato de 4 anos.", "é composta por 24 Deputados Estaduais, eleitos pelo sistema majoritário.", "é composta por 41 Deputados Estaduais, eleitos pelo sistema majoritário, para mandato de 8 anos.", "seu número de membros é fixado pelo Governador a cada eleição.", "é composta por 51 Deputados Estaduais, correspondente ao triplo da bancada federal sem qualquer limite."], "correta": 0, "comentario": "A ALEPA tem 41 Deputados Estaduais. O número decorre da regra do art. 27, §1º, da CF/88 — o número de deputados estaduais corresponde ao triplo da representação do Estado na Câmara dos Deputados e, atingido o número de 36, será acrescido de tantos quantos forem os Deputados Federais acima de 12. Com 17 deputados federais: 36 + (17 − 12) = 41. A eleição é pelo sistema proporcional e o mandato é de 4 anos.", "analise": "B) o número é 41 e o sistema é proporcional. C) mandato de 4 anos. D) o número é fixado pela Constituição/CF, não pelo Governador. E) a regra tem o limite de acréscimo acima de 12 deputados federais.", "ref": "CF/88 art. 27, §1º; Constituição do Pará, arts. 86 e 87"}, {"id": "LE-023", "materia": "LE", "topico": "Constituição do Estado do Pará aplicada ao Poder Legislativo", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Quanto à composição da Mesa e das Comissões da Assembleia Legislativa do Pará, a Constituição estadual assegura:", "alternativas": ["representação proporcional dos partidos ou blocos parlamentares, tanto quanto possível, e, em qualquer caso, pelo menos um Deputado integrante da oposição na Mesa e nas comissões.", "eleição dos membros das comissões pelo Governador do Estado.", "composição exclusivamente por Deputados da base do Governo.", "que apenas o Presidente da Mesa seja eleito, sendo os demais cargos de livre nomeação.", "que as comissões sejam compostas apenas por Deputados federais."], "correta": 0, "comentario": "A Constituição do Estado do Pará, ao tratar da organização do Poder Legislativo estadual, reproduz a lógica da CF/88: representação proporcional dos partidos e blocos na Mesa e nas comissões e garantia de assento à oposição. A eleição da Mesa é feita pelos próprios Deputados.", "analise": "B) a competência é do Plenário, não do Governador. C) a proporcionalidade impede composição exclusiva da base. D) a Mesa é eleita em sua composição, por votação dos pares. E) não há participação de deputados federais na ALEPA.", "ref": "Constituição do Estado do Pará – organização do Poder Legislativo"}, {"id": "LE-024", "materia": "LE", "topico": "Constituição do Estado do Pará aplicada ao Poder Legislativo", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a imunidade material (inviolabilidade) dos Deputados Estaduais, é CORRETO afirmar que:", "alternativas": ["os Deputados Estaduais gozam das mesmas imunidades conferidas aos Deputados Federais, nos termos da Constituição Federal.", "é limitada apenas às manifestações feitas dentro do plenário, sendo puníveis as declarações na internet.", "não
