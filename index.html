alcança opiniões, palavras e votos, aplicando-se apenas a atos administrativos.", "os Deputados Estaduais gozam de imunidade absoluta e irrestrita, inclusive em crimes comuns sem relação com o mandato.", "é concedida por ato do Governador."], "correta": 0, "comentario": "Art. 27, §1º, da CF/88: os Deputados Estaduais gozam das mesmas imunidades dos Deputados Federais e Senadores, aplicando-se o art. 53 da CF. A imunidade material alcança opiniões, palavras e votos no exercício do mandato e na circunscrição do Estado (não importa o local de emissão, desde que haja nexo com o mandato — entendimento do STF). A imunidade formal (prerrogativa de foro e processo) segue as regras do art. 53, §§ 3º a 5º, e, para crimes comuns, aplica-se a regra fixada pelo STF no julgamento da ADI 7.246 (competência da Justiça Estadual, em regra).", "analise": "B) a extensão envolve qualquer meio, desde que haja nexo com o mandato. C) exatamente o contrário. D) a imunidade não é absoluta em crimes comuns alheios ao mandato. E) decorre da Constituição, não de ato do Governador.", "ref": "CF/88 arts. 27, §1º, e 53"}, {"id": "LE-025", "materia": "LE", "topico": "Constituição do Estado do Pará aplicada ao Poder Legislativo", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Compete à Assembleia Legislativa do Estado do Pará, com auxílio do Tribunal de Contas do Estado, o exercício do controle externo, o que inclui:", "alternativas": ["julgar as contas do Governador sem participação do PCE, transformando-as em coisa julgada administrativa insuscetível de revisão judicial.", "apreciar e julgar as contas do Governador, sustar atos normativos do Executivo que exorbitem do poder regulamentar e fiscalizar atos da administração estadual.", "fiscalizar apenas as autarquias, excluindo fundações e empresas estatais.", "delegar ao Governador a apreciação das contas do Estado.", "exercer o controle apenas por meio de CPI, com exclusão dos pareceres prévios do TCE."], "correta": 1, "comentario": "O controle externo no Estado é exercido pela Assembleia Legislativa, com o auxílio do Tribunal de Contas do Estado (TCE-PA), nos moldes dos arts. 70 e 71 da CF/88. Cabe ao Legislativo julgar as contas do Chefe do Executivo (mediante parecer prévio do TCE), fiscalizar as unidades administrativas, suspender por decreto legislativo atos normativos do Executivo que exorbitem do poder regulamentar e instaurar CPIs. Suas decisões não formam coisa julgada insuscetível de controle judicial — o controle judicial é exercido na forma da lei.", "analise": "A) o parecer prévio é peça obrigatória e o controle judicial é possível. C) o alcance inclui administração direta e indireta. D) a competência é indelegável. E) o TCE emite parecer prévio e atua junto à ALEPA.", "ref": "CF/88 arts. 70, 71 e 49, V; Constituição do Pará – controle externo"}, {"id": "LE-026", "materia": "LE", "topico": "Ética e função pública", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A vedação ao uso do cargo público para obter vantagem pessoal, o dever de zelar pelos bens públicos e a obrigação de prestar contas decorrem diretamente do princípio da:", "alternativas": ["autotutela", "continuidade do serviço público", "moralidade administrativa e da probidade", "autotelia", "especialidade"], "correta": 2, "comentario": "Moralidade administrativa (art. 37, caput, CF) e probidade (art. 37, §4º, CF) impõem deveres de ética, lealdade institucional, zelo, impessoalidade e prestação de contas. A violação de valores éticos e de probidade pode gerar responsabilização administrativa, civil (improbidade) e política. Autotutela é o poder de a Administração rever seus próprios atos (Súmulas 346 e 473 do STF); continuidade é princípio do serviço público; autotelia não é princípio aplicável.", "analise": "A) autotutela trata de controle de atos. B) trata da não interrupção do serviço. D) e E) não expressam deveres de probidade.", "ref": "CF/88 art. 37, caput e §4º"}, {"id": "LE-027", "materia": "LE", "topico": "Segurança da informação: fundamentos, conceitos e mecanismos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a comunicação de incidentes de segurança envolvendo dados pessoais, a LGPD determina que o controlador deve comunicar à ANPD e ao titular a ocorrência de incidente que possa acarretar risco ou dano relevante, em prazo:", "alternativas": ["de 24 horas, improrrogável.", "razoável, definido em regulamentação da ANPD, que hoje fixa o prazo de 3 dias úteis.", "de 30 dias corridos, contados do encerramento da investigação.", "de 90 dias úteis.", "exclusivamente após decisão judicial."], "correta": 1, "comentario": "Art. 48 da LGPD: o controlador deverá comunicar à ANPD e ao titular a ocorrência de incidente de segurança que possa acarretar risco ou dano relevante aos titulares. A lei fala em 'prazo razoável'; a Resolução CD/ANPD nº 15/2024 fixou o prazo de 3 (três) dias úteis, contados do conhecimento do incidente. Se a informação for sobre dado pessoal de acesso restrito, a comunicação pode ser apenas à ANPD quando não houver risco relevante.", "analise": "Os prazos das demais alternativas não correspondem à norma vigente; a boa prática é memorizar: LGPD → prazo razoável regulamentado pela ANPD (3 dias úteis).", "ref": "LGPD art. 48 e Resolução CD/ANPD nº 15/2024"}, {"id": "LE-028", "materia": "LE", "topico": "Lei nº 8.429/1992 e alterações (Lei nº 14.230/2021)", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o acordo de não persecução civil (ANPC) na improbidade administrativa, assinale a CORRETA.", "alternativas": ["Pode ser celebrado exclusivamente pelo particular que figure como réu, vedada a participação do Ministério Público.", "Depende de homologação judicial, exige reparação integral do dano e confissão da participação no ato de improbidade e gera, ao cumprimento integral, a extinção da punibilidade quanto às sanções da Lei nº 8.429/1992.", "Impede o ressarcimento ao erário, que deve ser buscado em ação própria.", "Pode ser celebrado após o trânsito em julgado da condenação.", "Sua celebração exige que o fato tenha causado prejuízo superior a 1 milhão de reais."], "correta": 1, "comentario": "Art. 17-B da Lei nº 8.429/1992 (incluído pela Lei nº 14.230/2021): o Ministério Público poderá, na fase de investigação, mediante acordo de não persecução civil, desde que ocorra o ressarcimento integral do dano, a confissão da participação no ato de improbidade e o cumprimento de condições, com homologação judicial. Com o cumprimento integral, o juiz declarará extinta a punibilidade das sanções previstas na lei; o acordo NÃO impede o ressarcimento do dano. Não há exigência de valor mínimo de prejuízo.", "analise": "A) é celebrado pelo MP, não pelo particular sozinho. C) o ressarcimento é pressuposto do acordo. D) a fase é de investigação/propositura, não após trânsito em julgado. E) não há esse requisito de valor.", "ref": "Lei nº 8.429/1992, art. 17-B"}, {"id": "LE-029", "materia": "LE", "topico": "Ética profissional", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Configura conflito de interesses no serviço público a situação em que o agente público:", "alternativas": ["participa de decisão administrativa que beneficia empresa da qual é sócio ou de parente próximo, sem se declarar impedido.", "cumpre a lei estritamente, mesmo contra o interesse de parente.", "recusa vantagem indevida oferecida por fornecedor.", "declara-se suspeito e se afasta da análise de processo em que tem interesse pessoal.", "encaminha denúncia de irregularidade ao órgão competente."], "correta": 0, "comentario": "Conflito de interesses é a situação na qual o agente público, por razões de ordem pessoal, familiar ou econômica, tem interesses que podem influenciar indevidamente o exercício da função. No Brasil, a Lei nº 12.813/2013 veda a divulgação de informação privilegiada e o exercício de atividade incompatível, além de exigir declaração de impedimento/suspeição (art. 18 a 20 da Lei nº 9.784/1999 no âmbito federal). Afastar-se e declarar-se impedido é a conduta correta — e é justamente o que evita o conflito.", "analise": "B, C, D e E são condutas éticas e conformes à lei.", "ref": "Ética profissional e conflito de interesses"}, {"id": "LE-030", "materia": "LE", "topico": "Lei Anticorrupção – Lei nº 12.846/2013", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Entre os atos lesivos à administração pública tipificados na Lei nº 12.846/2013, estão:", "alternativas": ["frustrar o caráter competitivo de procedimento licitatório e impedir a investigação ou fiscalização de órgãos de controle.", "apenas atos praticados por agentes públicos, excluídas as pessoas jurídicas.", "exclusivamente o pagamento de propina a autoridade estrangeira.", "tão somente a prática de fraude fiscal.", "exclusivamente condutas praticadas por consórcios de empresas."], "correta": 0, "comentario": "Art. 5º da Lei nº 12.846/2013 lista os atos lesivos: prometer, oferecer ou dar vantagem indevida a agente público (I); comprovar ou tentar comprovar vantagem de forma fraudulenta em licitação ou contrato (II, III, IV); dificultar atividade de investigação/fiscalização (V); fraudar licitação ou contrato (incluindo ajuste irregular de condições, preços, entregas) e criar pessoa jurídica para ocultar ou dissimular interesses ou beneficiários de atos lesivos.", "analise": "B) a lei responsabiliza pessoas jurídicas. C) alcança a administração pública nacional e estrangeira, mas não só casos internacionais. D) fraude fiscal é matéria de outra lei. E) alcança qualquer pessoa jurídica, não apenas consórcios.", "ref": "Lei nº 12.846/2013, art. 5º"}, {"id": "INFO-001", "materia": "INFO", "topico": "Sistemas operacionais Windows 10 e Windows 11", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No Windows 10/11, o atalho de teclado Ctrl + Shift + Esc tem como função:", "alternativas": ["abrir o Gerenciador de Tarefas diretamente.", "reiniciar o computador.", "abrir o Explorador de Arquivos.", "bloquear a estação de trabalho.", "alternar entre janelas abertas."], "correta": 0, "comentario": "Ctrl + Shift + Esc abre o Gerenciador de Tarefas (Task Manager) imediatamente. Outros atalhos importantes: Ctrl+Alt+Del (tela de segurança), Win+E (Explorador de Arquivos), Win+L (bloquear), Alt+Tab (alternar janelas), Win+D (mostrar área de trabalho), Win+R (Executar).", "analise": "B) reiniciar não tem atalho padrão. C) Win+E. D) Win+L. E) Alt+Tab.", "ref": "Windows 10/11 – atalhos"}, {"id": "INFO-002", "materia": "INFO", "topico": "Sistemas operacionais Windows 10 e Windows 11", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No Windows, o local padrão onde ficam armazenados temporariamente os arquivos excluídos e que permite a restauração é:", "alternativas": ["Painel de Controle", "Lixeira", "Área de Transferência", "Registro do Windows", "Pasta Documentos"], "correta": 1, "comentario": "A Lixeira guarda temporariamente os arquivos excluídos, permitindo restaurá-los. Observação: arquivos excluídos de unidades removíveis (pendrive) ou de rede, em regra, não vão para a Lixeira; arquivos da Área de Transferência (clipboard) ficam na memória e não geram arquivos.", "analise": "A) permite configurações do sistema. C) memória temporária de cópia/recorte. D) base de configurações do Windows. E) pasta de documentos do usuário.", "ref": "Windows – organização de arquivos"}, {"id": "INFO-003", "materia": "INFO", "topico": "Hardware e periféricos de microcomputador", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a memória de um microcomputador, é CORRETO afirmar que:", "alternativas": ["a memória RAM é volátil, ou seja, perde seu conteúdo quando o computador é desligado.", "a memória ROM é volátil e apagada a cada reinicialização.", "a memória cache é mais lenta que a RAM.", "o disco rígido (HD) é uma memória volátil.", "a memória RAM armazena permanentemente os dados do usuário."], "correta": 0, "comentario": "RAM (Random Access Memory) é volátil e armazena temporariamente dados e programas em execução; ROM é não volátil (contém firmware/BIOS-UEFI); cache é pequena e muito mais rápida que a RAM; HD/SSD são memórias secundárias, não voláteis.", "analise": "B) ROM é não volátil. C) cache é mais rápida. D) HD é secundário (não volátil). E) RAM não é permanente.", "ref": "Hardware – memórias"}, {"id": "INFO-004", "materia": "INFO", "topico": "Hardware e periféricos de microcomputador", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A interface de conexão de armazenamento mais moderna, que utiliza o barramento PCI Express e alcança velocidades muito superiores ao SSD SATA, é:", "alternativas": ["IDE", "USB 1.0", "NVMe (via M.2 PCIe)", "PS/2", "VGA"], "correta": 2, "comentario": "SSDs NVMe (Non-Volatile Memory Express) conectados em slots M.2 com PCI Express oferecem taxas de transferência muito superiores às do SATA III (que fica em torno de 600 MB/s), chegando a milhares de MB/s. IDE e PS/2 são interfaces antigas; VGA é saída de vídeo.", "analise": "A) IDE é interface antiga de discos. B) USB 1.0 é lenta. D) PS/2 conecta teclado/mouse antigos. E) VGA é vídeo analógico.", "ref": "Hardware – armazenamento NVMe"}, {"id": "INFO-005", "materia": "INFO", "topico": "Ferramentas de escritório: Word, Excel e PowerPoint", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No Microsoft Excel, a fórmula =SOMASE(B2:B10;\"Analista\";C2:C10) tem como função:", "alternativas": ["somar todos os valores de C2:C10.", "somar os valores de C2:C10 apenas nas linhas em que B2:B10 for igual a \"Analista\".", "contar quantas vezes aparece \"Analista\" em B2:B10.", "multiplicar os valores de B2:B10 por C2:C10.", "retornar a média dos valores de C2:C10."], "correta": 1, "comentario": "SOMASE(intervalo; critério; intervalo_soma) soma os valores do intervalo de soma apenas quando o critério é atendido no primeiro intervalo. Equivalentes: CONT.SE (conta ocorrências), CONT.SES, SOMASES, MÉDIASE.", "analise": "A) sem critério, seria =SOMA(C2:C10). C) seria =CONT.SE(B2:B10;\"Analista\"). D) seria produto (sem agregação condicional). E) seria =MÉDIASE.", "ref": "Excel – funções de agregação condicional"}, {"id": "INFO-006", "materia": "INFO", "topico": "Ferramentas de escritório: Word, Excel e PowerPoint", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No Excel, ao pressionar F4 sobre uma referência de célula (por exemplo, A1), o que ocorre?", "alternativas": ["A célula é excluída.", "Alterna-se entre referência relativa, absoluta ($A$1) e mistas ($A1, A$1).", "A célula é formatada como moeda.", "Abre-se a janela de impressão.", "O valor é convertido em texto."], "correta": 1, "comentario": "F4 alterna os tipos de referência: relativa (A1) → absoluta ($A$1) → mista ($A1) → mista (A$1). Referências absolutas são essenciais em planilhas com fórmulas copiadas (travar linha/coluna).", "analise": "As demais funções não correspondem a F4 (excluir = Delete; moeda = Ctrl+Shift+4 em alguns layouts; imprimir = Ctrl+P).", "ref": "Excel – referências relativas e absolutas"}, {"id": "INFO-007", "materia": "INFO", "topico": "Ferramentas de escritório: Word, Excel e PowerPoint", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A função do Microsoft Word que permite gerar vários documentos personalizados (por exemplo, ofícios com nome e endereço de cada destinatário a partir de uma planilha) é:", "alternativas": ["Índice Remissivo", "Mala Direta", "Controle de Alterações", "Marca d'água", "Referência Cruzada"], "correta": 1, "comentario": "Mala Direta (Mailing) combina um documento-modelo com uma fonte de dados (planilha Excel, base do Access/Outlook, lista digitada) para gerar cartas, etiquetas, envelopes, e-mails personalizados. Etapas: Iniciar Mala Direta → Selecionar destinatários → Inserir campos de mesclagem → Concluir e mesclar.", "analise": "A) e E) criam índices e referências internas. C) registra revisões. D) insere imagem de fundo.", "ref": "Word – mala direta"}, {"id": "INFO-008", "materia": "INFO", "topico": "LibreOffice 7 ou superior (Writer, Calc, Impress)", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No LibreOffice Calc, as fórmulas seguem a mesma lógica do Excel, mas os argumentos são separados por:", "alternativas": ["ponto e vírgula, em configuração padrão em português.", "reticências", "barra invertida", "arrouba (@)", "cerquilha (#)"], "correta": 0, "comentario": "No LibreOffice Calc (locale pt-BR), a separação de argumentos é feita por ponto e vírgula (;), enquanto no Microsoft Excel em português usa-se também ponto e vírgula, e em inglês vírgula. Ex.: =SOMA(A1;B1;C1) no Calc. O formato de arquivo padrão do LibreOffice é o ODF (.ods, .odt, .odp), sendo também compatível com os formatos do Microsoft Office (.xlsx, .docx, .pptx).", "analise": "As demais opções não são separadores de argumentos.", "ref": "LibreOffice Calc"}, {"id": "INFO-009", "materia": "INFO", "topico": "Segurança da informação: fundamentos, antimalware, firewall, hardening, controle de USB", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o firewall pessoal, é CORRETO afirmar que:", "alternativas": ["ele elimina vírus já instalados no computador.", "ele controla o tráfego de rede que entra e sai do computador, permitindo ou bloqueando conexões conforme regras definidas.", "ele criptografa automaticamente todos os arquivos do disco.", "ele substitui o antivírus em qualquer cenário.", "ele serve exclusivamente para backup de dados."], "correta": 1, "comentario": "Firewall é um filtro de tráfego (pacotes/portas/aplicações) baseado em regras. Não remove malware já instalado (função do antimalware) nem criptografa arquivos. Complementa-se com antimalware, atualizações (patches), hardening (desativação de serviços/portas desnecessários), controle de dispositivos USB e backups.", "analise": "A) tarefa do antimalware. C) tarefa de ferramentas de criptografia (BitLocker etc.). D) funções complementares. E) backup é função de ferramentas específicas.", "ref": "Segurança – firewall"}, {"id": "INFO-010", "materia": "INFO", "topico": "Segurança da informação: fundamentos, antimalware, firewall, hardening, controle de USB", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O malware que criptografa os arquivos da vítima e exige pagamento de resgate (geralmente em criptomoeda) para liberar o acesso é chamado de:", "alternativas": ["adware", "spyware", "ransomware", "rootkit", "keylogger"], "correta": 2, "comentario": "Ransomware = sequestro de dados (ransom = resgate). Boas práticas de proteção: backups offline/3-2-1, atualização de sistemas, não abrir anexos suspeitos, segmentação de rede e plano de resposta a incidentes. A recomendação oficial (inclusive da ANPD) é não pagar o resgate e acionar o time de segurança.", "analise": "Adware exibe anúncios; spyware espiona; rootkit oculta acesso privilegiado; keylogger registra teclas.", "ref": "Segurança – malwares"}, {"id": "INFO-011", "materia": "INFO", "topico": "Organização e gerenciamento de informações, arquivos, pastas e programas", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a organização de arquivos no Windows, é CORRETO afirmar que:", "alternativas": ["uma pasta só pode conter arquivos de um único tipo.", "a extensão do arquivo indica, em regra, o tipo de conteúdo e o programa associado (ex.: .docx, .xlsx, .pdf).", "nomes de arquivo não podem conter mais de 8 caracteres.", "pastas não podem ser aninhadas.", "arquivos com extensão exibida não podem ser renomeados."], "correta": 1, "comentario": "A extensão (sufixo após o ponto) indica o formato: .docx/.odt (texto), .xlsx/.ods (planilha), .pdf (documento portátil), .jpg/.png (imagem), .mp4 (vídeo), .exe (executável). Pastas podem ser aninhadas (subpastas) e arquivos/pastas podem ser renomeados (F2), renomeações em massa podem ser feitas com o recurso Renomear em lote.", "analise": "As demais afirmativas contrariam o funcionamento do sistema de arquivos.", "ref": "Windows – sistema de arquivos"}, {"id": "INFO-012", "materia": "INFO", "topico": "Redes de computadores: conceitos básicos, Internet e intranet", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O serviço de rede responsável por traduzir nomes de domínio (ex.: www.alepa.pa.gov.br) em endereços IP é o:", "alternativas": ["DHCP", "DNS", "FTP", "SMTP", "SNMP"], "correta": 1, "comentario": "DNS (Domain Name System) resolve nomes em endereços IP. DHCP distribui endereços IP automaticamente na rede; FTP transfere arquivos; SMTP envia e-mail; SNMP gerencia dispositivos de rede.", "analise": "As demais siglas têm funções distintas das descritas.", "ref": "Redes – protocolos e serviços"}, {"id": "INFO-013", "materia": "INFO", "topico": "Redes de computadores: conceitos básicos, Internet e intranet", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre intranet e Internet, assinale a CORRETA.", "alternativas": ["A intranet é uma rede restrita a uma organização, que utiliza as mesmas tecnologias da Internet (TCP/IP, HTTP), mas com acesso controlado.", "A intranet é acessível livremente por qualquer usuário do mundo.", "A Internet é uma rede privada de uma única organização.", "Extranet é sinônimo de Internet.", "Intranet não pode usar navegadores web."], "correta": 0, "comentario": "Intranet: rede corporativa privada baseada nas tecnologias da Internet (protocolos TCP/IP, serviços HTTP/HTTPS), restrita a usuários autorizados. Extranet: extensão da intranet para parceiros, fornecedores e clientes externos, com acesso controlado. Internet: rede mundial pública.", "analise": "B) intranet é restrita. C) Internet é pública e mundial. D) extranet tem escopo distinto. E) navegadores são o principal meio de acesso à intranet.", "ref": "Redes – intranet, extranet e Internet"}, {"id": "INFO-014", "materia": "INFO", "topico": "Navegadores Web: Chrome, Edge e Firefox", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Nos principais navegadores (Chrome, Edge e Firefox), o atalho Ctrl + Shift + N (no Chrome/Edge) ou Ctrl + Shift + P (Firefox) abre:", "alternativas": ["uma nova janela de navegação privada/anônima.", "a página inicial.", "o histórico completo.", "a janela de downloads.", "o modo de leitura."], "correta": 0, "comentario": "Navegação privada (anônima) não registra histórico, cookies de sessão e dados de formulário localmente — ATENÇÃO: isso não torna o usuário invisível para o provedor, para a rede corporativa ou para os sites acessados. No Chrome/Edge: Ctrl+Shift+N; no Firefox: Ctrl+Shift+P.", "analise": "B) Alt+Home. C) Ctrl+H. D) Ctrl+J. E) não há atalho universal específico.", "ref": "Navegadores Web"}, {"id": "INFO-015", "materia": "INFO", "topico": "Busca e pesquisa na Web", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Em mecanismos de busca como o Google, o uso de \"aspas\" em um termo de pesquisa serve para:", "alternativas": ["ignorar o termo na busca.", "buscar a expressão exata, naquela ordem.", "buscar apenas imagens.", "pesquisar apenas em redes sociais.", "aumentar o número de resultados."], "correta": 1, "comentario": "Operadores úteis: \"expressão exata\" (busca literal), -palavra (exclui), site:dominio.gov.br (restrito a um site), filetype:pdf (formato), OR (alternância), * (curinga). São recursos de pesquisa avançada frequentemente cobrados.", "analise": "As demais opções não correspondem à função do operador.", "ref": "Busca e pesquisa na Web"}, {"id": "INFO-016", "materia": "INFO", "topico": "Correio eletrônico (Outlook 2013 a O365)", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No envio de uma mensagem, o campo Cco (Cópia Carbono Oculta):", "alternativas": ["exibe todos os destinatários para todos.", "permite enviar cópia a destinatários cujos endereços não são revelados aos demais.", "impede o envio de anexos.", "é usado apenas para responder a mensagens.", "só funciona em listas de distribuição."], "correta": 1, "comentario": "Para = destinatário principal; Cc = cópia visível a todos; Cco (Bcc) = cópia oculta, com preservação da privacidade dos endereços. Boa prática no serviço público: ao enviar para muitos destinatários, usar Cco para evitar exposição de dados pessoais (princípio da LGPD) e uso indevido de 'Responder a todos'.", "analise": "As demais opções não descrevem o campo Cco.", "ref": "Correio eletrônico – Outlook"}, {"id": "INFO-017", "materia": "INFO", "topico": "Correio eletrônico (Outlook 2013 a O365)", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São protocolos de recebimento/consulta de e-mail:", "alternativas": ["SMTP e HTTP", "POP3 e IMAP", "FTP e TELNET", "DNS e DHCP", "SNMP e ICMP"], "correta": 1, "comentario": "SMTP é protocolo de ENVIO (e também de transferência entre servidores). POP3 baixa mensagens (em geral removendo-as do servidor) e IMAP mantém as mensagens no servidor, sincronizando pastas e estados entre dispositivos — por isso o IMAP é preferível em uso multidispositivo.", "analise": "As demais alternativas não incluem protocolos de recebimento de e-mail.", "ref": "Protocolos de e-mail"}, {"id": "INFO-018", "materia": "INFO", "topico": "Redes sociais: X, Facebook, LinkedIn, WhatsApp, YouTube, Instagram e Telegram", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o uso de redes sociais por órgãos públicos, assinale a CORRETA.", "alternativas": ["O uso institucional deve observar os princípios da publicidade, impessoalidade e transparência, sem confundir-se com perfis pessoais de agentes públicos.", "É vedado a órgãos públicos manter perfis institucionais.", "Mensagens diretas em redes sociais substituem integralmente os canais oficiais de protocolo.", "Publicações institucionais podem conter promoção pessoal de autoridades.", "O conteúdo publicado pode ser excluído sem qualquer registro."], "correta": 0, "comentario": "A comunicação pública digital deve observar a CF/88 (art. 37, caput), vedada a promoção pessoal (art. 37, §1º), e seguir boas práticas de acessibilidade e de proteção de dados. Redes sociais complementam — não substituem — canais oficiais de atendimento e protocolo (ouvidoria, e-SIC, protocolo).", "analise": "B) o uso institucional é admitido e incentivado. C) canais oficiais permanecem. D) promoção pessoal é vedada. E) a gestão de conteúdo deve observar normas de arquivamento e transparência.", "ref": "Redes sociais – uso institucional"}, {"id": "INFO-019", "materia": "INFO", "topico": "Educação a distância: Moodle, SharePoint e Google Drive", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O Moodle é:", "alternativas": ["um sistema de gestão de aprendizagem (LMS) de código aberto, usado para cursos a distância com recursos como fóruns, tarefas, questionários e trilhas de aprendizagem.", "um editor de planilhas.", "um protocolo de redes.", "um aplicativo de videoconferência exclusivo.", "um repositório de arquivos pagos."], "correta": 0, "comentario": "Moodle é um Ambiente Virtual de Aprendizagem (AVA/LMS) gratuito e de código aberto, com recursos de fórum, chat, tarefa, questionário, wiki, banco de questões, certificados e relatórios de participação (trilhas de aprendizagem). SharePoint é plataforma de colaboração e gestão documental; Google Drive é serviço de armazenamento e edição colaborativa em nuvem.", "analise": "As demais alternativas atribuem funções de outras ferramentas ao Moodle.", "ref": "EAD – plataformas"}, {"id": "INFO-020", "materia": "INFO", "topico": "Ferramentas colaborativas: Teams, Cisco Webex e Google Meet", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São ferramentas de colaboração e reuniões em tempo real, com compartilhamento de tela, chat e gravação de sessões:", "alternativas": ["Microsoft Teams, Cisco Webex e Google Meet", "Word, Excel e PowerPoint", "Chrome, Edge e Firefox", "FTP, SFTP e SSH", "Windows 10, Linux e macOS"], "correta": 0, "comentario": "Teams, Webex e Google Meet são plataformas de colaboração/videoconferência com chat, compartilhamento de tela, quadro branco, gravação e integração com calendários. As demais alternativas listam suítes de escritório, navegadores, protocolos de transferência e sistemas operacionais.", "analise": "Nenhuma das demais combinações reúne ferramentas colaborativas.", "ref": "Ferramentas colaborativas"}, {"id": "INFO-021", "materia": "INFO", "topico": "Tecnologias e ferramentas multimídia; áudio e vídeo", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Assinale a alternativa que relaciona corretamente formato e tipo de mídia.", "alternativas": ["MP3 (áudio), MP4 (vídeo), PNG (imagem), DOCX (texto)", "MP3 (vídeo), MP4 (áudio), PNG (texto), DOCX (imagem)", "MP3 (imagem), MP4 (texto), PNG (vídeo), DOCX (áudio)", "MP3 (texto), MP4 (imagem), PNG (áudio), DOCX (vídeo)", "MP3 (planilha), MP4 (apresentação), PNG (banco de dados), DOCX (áudio)"], "correta": 0, "comentario": "MP3 = áudio comprimido com perdas; MP4 = contêiner de vídeo (com áudio); PNG = imagem com suporte a transparência (sem perdas); DOCX = documento de texto do Microsoft Word. Outros: WAV/OGG/FLAC (áudio), AVI/MKV/MOV (vídeo), JPG/GIF/WEBP (imagem), PDF (documento portátil), PPTX (apresentação), XLSX (planilha).", "analise": "As demais alternativas trocam sistematicamente os tipos de mídia.", "ref": "Multimídia – formatos"}, {"id": "INFO-022", "materia": "INFO", "topico": "Sistemas operacionais Windows 10 e Windows 11", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No Windows 10 e 11, o recurso que permite manter múltiplas áreas de trabalho para organizar janelas de tarefas diferentes é:", "alternativas": ["Área de Trabalho Remota", "Áreas de Trabalho Virtuais (Task View / Visão de Tarefas)", "Gerenciador de Dispositivos", "Modo Tablet", "Central de Segurança"], "correta": 1, "comentario": "Áreas de Trabalho Virtuais (atalho Win+Tab e Win+Ctrl+D para criar, Win+Ctrl+←/→ para alternar) permitem agrupar aplicações por contexto. Área de Trabalho Remota é acesso remoto via RDP; o Gerenciador de Dispositivos controla drivers.", "analise": "As demais opções descrevem funcionalidades diferentes.", "ref": "Windows – recursos de produtividade"}, {"id": "INFO-023", "materia": "INFO", "topico": "Ferramentas de escritório: Word, Excel e PowerPoint", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No Excel, a fórmula =SE(C2>=60;\"Aprovado\";\"Reprovado\") retorna:", "alternativas": ["\"Aprovado\" sempre.", "\"Aprovado\" se o valor de C2 for maior ou igual a 60 e \"Reprovado\" caso contrário.", "\"Reprovado\" se C2 for maior que 60.", "a soma de C2 com 60.", "um erro, pois o SE não aceita textos."], "correta": 1, "comentario": "A função SE(teste_lógico; valor_se_verdadeiro; valor_se_falso) realiza desvio condicional. Textos devem ser inseridos entre aspas. É possível encadear SEs (=SE(...;...;SE(...;...;...))) e usar SEERRO, E, OU para testes compostos.", "analise": "As demais opções descrevem resultados incorretos do teste lógico.", "ref": "Excel – função SE"}, {"id": "INFO-024", "materia": "INFO", "topico": "Segurança da informação: fundamentos, antimalware, firewall, hardening, controle de USB", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre autenticação e controle de acesso, é CORRETO afirmar que:", "alternativas": ["a autenticação de dois fatores combina algo que o usuário sabe, algo que possui ou algo que é, aumentando a segurança do acesso.", "senhas fortes dispensam autenticação de dois fatores.", "biometria não é considerada fator de autenticação.", "o princípio do menor privilégio recomenda conceder acesso administrativo a todos os usuários.", "o bloqueio de dispositivos USB é vedado por normas de segurança."], "correta": 0, "comentario": "Fatores de autenticação: conhecimento (senha/PIN), posse (token, celular, smartcard) e biometria (algo que se é). A MFA (autenticação multifator) combina fatores distintos. Princípio do menor privilégio: cada usuário recebe apenas as permissões necessárias. O controle de dispositivos USB é medida legítima e recomendada (prevenção de exfiltração e de malwares).", "analise": "As demais opções contrariam boas práticas de segurança.", "ref": "Segurança – autenticação e controle de acesso"}, {"id": "INFO-025", "materia": "INFO", "topico": "Ferramentas de escritório: Word, Excel e PowerPoint", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No PowerPoint, o recurso que organiza a sequência de telas de forma semelhante a um sumário, permitindo reordenar e agrupar seções, é:", "alternativas": ["Modo de Exibição de Anotações", "Modo de Exibição de Estrutura de Tópicos / painel de miniaturas de slides", "Modo de Leitura", "Classificação de Slides no Excel", "Controle de Alterações"], "correta": 1, "comentario": "Os modos de exibição do PowerPoint incluem: Normal, Estrutura de Tópicos (outline), Classificação de Slides (miniaturas para reordenar/agrupar em seções), Anotações (notas do apresentador) e Apresentação de Slides. O Painel de Seleção ajuda a organizar objetos em camadas.", "analise": "As demais opções não descrevem o recurso de reordenação de slides.", "ref": "PowerPoint – modos de exibição"}, {"id": "INFO-026", "materia": "INFO", "topico": "Redes de computadores: conceitos básicos, Internet e intranet", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre equipamentos de interconexão de redes, é CORRETO afirmar que:", "alternativas": ["o hub encaminha os dados apenas ao destinatário correto, como o switch.", "o switch opera na camada de enlace (2) e encaminha quadros com base no endereço MAC, enquanto o roteador opera na camada de rede (3) e encaminha pacotes com base no endereço IP.", "o roteador opera apenas na camada física.", "o repetidor separa domínios de broadcast.", "o gateway é usado apenas para conectar impressoras."], "correta": 1, "comentario": "Hub: repete o sinal para todas as portas (camada 1); switch: encaminha por MAC (camada 2), com VLANs e domínios de broadcast; roteador: encaminha pacotes entre redes por IP (camada 3); repetidor: amplifica/regenera o sinal; gateway: converte/roteia entre redes com protocolos distintos (porta de saída da rede).", "analise": "A) hub não é inteligente. C) roteador opera na camada 3. D) o repetidor não segmenta broadcast. E) gateway não se limita a impressoras.", "ref": "Redes – interconexão"}, {"id": "INFO-027", "materia": "INFO", "topico": "Noções de hardware e software", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "É exemplo de software de sistema e de software aplicativo, respectivamente:", "alternativas": ["Microsoft Word e Windows 11", "Windows 11 e Microsoft Word", "Google Chrome e BIOS", "Editor de texto e sistema operacional", "Firmware e antivírus"], "correta": 1, "comentario": "Software de sistema inclui sistemas operacionais (Windows, Linux, macOS), drivers, utilitários e BIOS/UEFI (firmware). Software aplicativo atende a tarefas do usuário: editores de texto, planilhas, navegadores, aplicativos de e-mail. A alternativa A inverte os papéis.", "analise": "C) BIOS é firmware e Chrome é aplicativo — a ordem pedida exige sistema primeiro. D) e E) invertem ou misturam categorias.", "ref": "Hardware e software – conceitos"}, {"id": "INFO-028", "materia": "INFO", "topico": "Segurança da informação: fundamentos, antimalware, firewall, hardening, controle de USB", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A estratégia de backup conhecida como 3-2-1 recomenda:", "alternativas": ["3 cópias dos dados, em 2 mídias diferentes, sendo 1 delas fora do local principal (offsite).", "3 backups por dia, 2 por semana, 1 por mês.", "3 servidores, 2 nuvens, 1 disco externo, todos no mesmo local.", "3 usuários autorizados, 2 senhas, 1 administrador.", "3 antivírus instalados, 2 firewalls, 1 roteador."], "correta": 0, "comentario": "Regra 3-2-1: mantenha pelo menos 3 cópias dos dados (a original + 2 backups), em 2 tipos de mídia diferentes, com 1 cópia armazenada fora do local (offsite/nuvem). Protege contra ransomware, falha de hardware, incêndio e erro humano. Complementa-se com testes periódicos de restauração, essenciais em órgãos públicos.", "analise": "As demais opções descrevem regras inexistentes.", "ref": "Segurança – backup"}, {"id": "RL-001", "materia": "RL", "topico": "Porcentagem", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Um projeto de lei recebeu 250 emendas. Desse total, 40% foram rejeitadas na Comissão de Constituição e Justiça. Quantas emendas foram rejeitadas?", "alternativas": ["60", "80", "100", "120", "150"], "correta": 2, "comentario": "40% de 250 = 0,40 × 250 = 100 emendas rejeitadas. Restariam 150 aprovadas (60%).", "analise": "Erro comum: calcular 40% de outro valor de referência ou inverter a proporção (60% de 250 = 150).", "ref": "Porcentagem"}, {"id": "RL-002", "materia": "RL", "topico": "Porcentagem", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Após dois aumentos sucessivos de 10% e 20%, um valor final de R$ 132,00 corresponde a um valor inicial de:", "alternativas": ["R$ 100,00", "R$ 105,00", "R$ 110,00", "R$ 112,00", "R$ 120,00"], "correta": 0, "comentario": "Aumentos sucessivos são multiplicativos: 1,10 × 1,20 = 1,32 (aumento total de 32%). Assim, valor inicial = 132 ÷ 1,32 = R$ 100,00. Cuidado com a armadilha de somar as taxas (30% daria R$ 101,54).", "analise": "A alternativa R$ 120 decorre do erro de somar 10% e 20% = 30% e dividir por 1,30.", "ref": "Porcentagem – variações sucessivas"}, {"id": "RL-003", "materia": "RL", "topico": "Regra de três simples e composta", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Se 6 analistas elaboram 24 relatórios em 4 dias, quantos relatórios 9 analistas elaborarão em 6 dias, mantendo o mesmo ritmo?", "alternativas": ["36", "48", "54", "60", "72"], "correta": 2, "comentario": "Produção por analista por dia = 24 ÷ (6 × 4) = 1 relatório. Com 9 analistas em 6 dias: 9 × 6 × 1 = 54 relatórios. Alternativamente: relatórios ∝ analistas × dias → 24 × (9/6) × (6/4) = 24 × 1,5 × 1,5 = 54.", "analise": "Erros típicos: relacionar apenas uma grandeza (24 × 9/6 = 36) ou aplicar a razão invertida (24 × 2/3 = 16).", "ref": "Regra de três composta"}, {"id": "RL-004", "materia": "RL", "topico": "Razão e proporção", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Em uma comissão, a razão entre homens e mulheres é 3/5. Se a comissão tem 64 membros, a diferença entre o número de mulheres e de homens é:", "alternativas": ["8", "12", "16", "20", "24"], "correta": 2, "comentario": "3 + 5 = 8 partes; 64 ÷ 8 = 8 membros por parte. Homens = 3 × 8 = 24; mulheres = 5 × 8 = 40. Diferença = 40 − 24 = 16.", "analise": "Quem responde 24 está indicando o número de homens, não a diferença — leia sempre o comando final da questão.", "ref": "Razão e proporção"}, {"id": "RL-005", "materia": "RL", "topico": "Divisão proporcional", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Um valor de R$ 36.000,00 será distribuído entre três setores em partes inversamente proporcionais a 2, 3 e 6. O setor que receberá a MAIOR quantia receberá:", "alternativas": ["R$ 6.000,00", "R$ 12.000,00", "R$ 16.000,00", "R$ 18.000,00", "R$ 20.000,00"], "correta": 3, "comentario": "Divisão inversamente proporcional: transforma-se em diretamente proporcional aos inversos (1/2, 1/3, 1/6). Reduzindo ao mesmo denominador: 3/6, 2/6, 1/6 → partes 3 : 2 : 1 = 6 partes. 36.000 ÷ 6 = 6.000 por parte → 18.000, 12.000 e 6.000. A maior quantia é R$ 18.000,00 (do setor com peso 2).", "analise": "Quem divide proporcionalmente pelos números dados (2:3:6) obtém 6.545/9.818/19.636 — resultado errado, pois inverte o critério.", "ref": "Divisão proporcional inversa"}, {"id": "RL-006", "materia": "RL", "topico": "Juros simples", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Um capital de R$ 8.000,00 é aplicado a juros simples de 1,5% ao mês por 8 meses. Os juros produzidos são:", "alternativas": ["R$ 720,00", "R$ 840,00", "R$ 900,00", "R$ 960,00", "R$ 1.120,00"], "correta": 3, "comentario": "J = C · i · t = 8.000 × 0,015 × 8 = R$ 960,00. Montante = 8.000 + 960 = R$ 8.960,00.", "analise": "Respostas como R$ 720 surgem do uso de 6 meses ou de taxa incorreta (1,125%).", "ref": "Juros simples"}, {"id": "RL-007", "materia": "RL", "topico": "Média", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Um candidato fez quatro provas com notas 6, 7, 5 e 8. Para que a média das cinco provas (incluindo a quinta) seja 7, a nota da quinta prova deve ser:", "alternativas": ["7", "8", "8,5", "9", "9,5"], "correta": 3, "comentario": "Soma atual = 6 + 7 + 5 + 8 = 26. Para média 7 com 5 provas, a soma total deve ser 35. Nota da quinta = 35 − 26 = 9.", "analise": "A 'regra do quanto falta' é a mais rápida: quanto falta para a média atual (6,5) chegar a 7, multiplicado pelo número de provas.", "ref": "Média aritmética"}, {"id": "RL-008", "materia": "RL", "topico": "Raciocínio sequencial", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Na sequência 3, 7, 15, 31, 63, ..., o próximo termo é:", "alternativas": ["95", "111", "120", "127", "135"], "correta": 3, "comentario": "Padrão: cada termo é o dobro do anterior mais 1 (3×2+1=7; 7×2+1=15; 15×2+1=31; 31×2+1=63; 63×2+1=127). Outra leitura: potências de 2 menos 1 (2²−1, 2³−1, ..., 2⁷−1 = 127).", "analise": "Alternativas como 95 surgem de somar sempre 32 (diferenças 4, 8, 16, 32 → próxima diferença 64: 63+64=127, o que também confirma o gabarito).", "ref": "Raciocínio sequencial"}, {"id": "RL-009", "materia": "RL", "topico": "Conjuntos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Em uma repartição, 45 servidores usam o sistema A, 38 usam o sistema B e 20 usam ambos. Quantos servidores usam pelo menos um dos dois sistemas?", "alternativas": ["55", "58", "63", "68", "83"], "correta": 2, "comentario": "n(A ∪ B) = n(A) + n(B) − n(A ∩ B) = 45 + 38 − 20 = 63 servidores.", "analise": "A resposta 83 (45+38) ignora a interseção contada duas vezes — erro clássico.", "ref": "Teoria dos conjuntos – inclusão e exclusão"}, {"id": "RL-010", "materia": "RL", "topico": "Lógica proposicional", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A negação da proposição \"Todos os requerimentos foram protocolados no prazo\" é:", "alternativas": ["Nenhum requerimento foi protocolado no prazo.", "Algum requerimento não foi protocolado no prazo.", "Todos os requerimentos não foram protocolados no prazo.", "Alguns requerimentos foram protocolados no prazo.", "Nem todos os requerimentos foram protocolados fora do prazo."], "correta": 1, "comentario": "Negação de proposição universal afirmativa: 'Algum A não é B' (existe ao menos um contraexemplo). Estrutura: ¬(todo A é B) = algum A não é B.", "analise": "'Nenhum' é o contrário, não a negação; 'todos não foram' é mais forte do que a negação (negação basta um caso).", "ref": "Lógica proposicional – quantificadores"}, {"id": "RL-011", "materia": "RL", "topico": "Lógica proposicional", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sabe-se que a proposição \"Se o projeto é urgente, então ele é votado na mesma sessão\" é FALSA. Conclui-se que:", "alternativas": ["o projeto é urgente e não é votado na mesma sessão.", "o projeto não é urgente e é votado na mesma sessão.", "o projeto não é urgente e não é votado na mesma sessão.", "o projeto é urgente e é votado na mesma sessão.", "nada se pode concluir."], "correta": 0, "comentario": "A condicional P → Q só é falsa em uma situação: quando P é verdadeira e Q é falsa (V → F = F). Logo, 'o projeto é urgente' (P verdadeiro) e 'não é votado na mesma sessão' (Q falso).", "analise": "As demais combinações tornariam a condicional verdadeira.", "ref": "Lógica proposicional – tabela-verdade"}, {"id": "RL-012", "materia": "RL", "topico": "Lógica proposicional", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A proposição \"Não é verdade que o servidor faltou E apresentou justificativa\" é equivalente a:", "alternativas": ["O servidor faltou ou apresentou justificativa.", "O servidor não faltou e não apresentou justificativa.", "O servidor não faltou ou não apresentou justificativa.", "Se o servidor faltou, então apresentou justificativa.", "O servidor faltou e não apresentou justificativa."], "correta": 2, "comentario": "Lei de De Morgan: ¬(P ∧ Q) ≡ ¬P ∨ ¬Q. A negação da conjunção é a disjunção das negações.", "analise": "A opção B aplica errado a lei (negação de conjunção não é conjunção de negações); a D é a equivalência da condicional; a E é a própria negação da condicional.", "ref": "Lógica proposicional – De Morgan"}, {"id": "RL-013", "materia": "RL", "topico": "Raciocínio verbal", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Ana é mais velha que Bruno. Carla é mais nova que Bruno. Diego é mais velho que Ana. Quem é o mais velho e quem é o mais novo, respectivamente?", "alternativas": ["Diego e Carla", "Ana e Carla", "Diego e Bruno", "Ana e Bruno", "Diego e Ana"], "correta": 0, "comentario": "Organizando em ordem decrescente de idade: Diego > Ana > Bruno > Carla. Logo, o mais velho é Diego e o mais novo é Carla.", "analise": "Basta escrever a 'fila' de comparações, evitando concluir com base em impressões.", "ref": "Raciocínio verbal – relações arbitrárias"}, {"id": "RL-014", "materia": "RL", "topico": "Orientação espacial e temporal", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Cinco servidores (A, B, C, D e E) sentam-se em fila, nesta ordem da esquerda para a direita. Sabe-se que: A não é o primeiro; C está exatamente no meio; E é o último; D está imediatamente à esquerda de C. Qual é a ordem correta da esquerda para a direita?", "alternativas": ["B, D, C, A, E", "B, C, D, A, E", "D, B, C, A, E", "A, D, C, B, E", "B, A, C, D, E"], "correta": 0, "comentario": "C é o 3º (meio) e E é o 5º. D está imediatamente à esquerda de C → D é o 2º. Restam as posições 1 e 4 para A e B, e A não é o primeiro → A é o 4º e B é o 1º. Ordem: B, D, C, A, E.", "analise": "Nas alternativas restantes, D não fica imediatamente à esquerda de C ou A ocupa a primeira posição.", "ref": "Orientação espacial – arranjo de posições"}, {"id": "RL-015", "materia": "RL", "topico": "Probabilidade", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Lançando-se dois dados honestos, qual é a probabilidade de a soma dos pontos ser igual a 7?", "alternativas": ["1/12", "1/9", "1/6", "7/36", "1/3"], "correta": 2, "comentario": "Casos possíveis: 6 × 6 = 36. Casos favoráveis (soma 7): (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) = 6. Probabilidade = 6/36 = 1/6.", "analise": "A soma 7 é a mais provável entre 2 e 12, justamente por ter 6 combinações.", "ref": "Probabilidade"}, {"id": "RL-016", "materia": "RL", "topico": "Análise combinatória", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Em uma sessão solene, 5 deputados devem ser dispostos em uma bancada de 3 cadeiras distintas (presidente, secretário e orador). De quantas maneiras isso pode ser feito?", "alternativas": ["10", "20", "30", "60", "120"], "correta": 3, "comentario": "A ordem importa (funções distintas) e não há repetição: arranjo A(5,3) = 5!/(5−3)! = 5×4×3 = 60 maneiras.", "analise": "A resposta 10 corresponde à combinação C(5,3), que seria correta se as cadeiras fossem idênticas (apenas escolher quem participa).", "ref": "Análise combinatória – arranjo"}, {"id": "RL-017", "materia": "RL", "topico": "Conjuntos numéricos racionais e reais", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O valor da expressão (2/3 + 1/6) ÷ (1/2) é:", "alternativas": ["1/3", "5/9", "5/3", "3/2", "10/9"], "correta": 2, "comentario": "2/3 + 1/6 = 4/6 + 1/6 = 5/6. Dividir por 1/2 é multiplicar por 2: 5/6 × 2 = 10/6 = 5/3.", "analise": "Erros comuns: somar 2/3 + 1/6 = 3/9 (somando numeradores e denominadores) ou esquecer de inverter a fração na divisão.", "ref": "Operações com frações"}, {"id": "RL-018", "materia": "RL", "topico": "Números e grandezas proporcionais", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Uma máquina produz 900 peças em 6 horas. Mantendo o mesmo ritmo, quantas peças ela produzirá em 9 horas e 20 minutos?", "alternativas": ["1.200", "1.350", "1.400", "1.500", "1.800"], "correta": 2, "comentario": "Ritmo = 900 ÷ 6 = 150 peças/hora. 9h20min = 9 + 1/3 = 28/3 horas. Produção = 150 × 28/3 = 1.400 peças.", "analise": "Quem converte 20 minutos em 0,20 hora chega a 1.380 (errado). Sempre converta minutos em fração de hora (20/60 = 1/3).", "ref": "Grandezas proporcionais"}, {"id": "RL-019", "materia": "RL", "topico": "Formação de conceitos e discriminação de elementos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Considere a regra: 'Todo A é B; algum B é C'. É CORRETO concluir que:", "alternativas": ["todo A é C.", "algum A é C.", "nenhum A é C.", "nada se pode garantir sobre a relação entre A e C.", "todo C é A."], "correta": 3, "comentario": "Das premissas 'todo A é B' e 'algum B é C' não decorre nenhuma conclusão necessária entre A e C: o 'algum B' que é C pode ser justamente o B que não é A. Diagramas de Venn mostram cenários compatíveis com A ⊂ C, com A ∩ C = ∅ e com interseção parcial.", "analise": "As alternativas A, B, C e E afirmam vínculos não garantidos pelas premissas.", "ref": "Compreensão do processo lógico – silogismo"}, {"id": "RL-020", "materia": "RL", "topico": "Compreensão do processo lógico: hipóteses e conclusões válidas", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Se Ana estuda, então Bruno é aprovado. Bruno NÃO foi aprovado. Logo:", "alternativas": ["Ana estudou.", "Ana não estudou.", "Ana estudou e Bruno foi aprovado.", "nada se pode concluir.", "Bruno estudou no lugar de Ana."], "correta": 1, "comentario": "Modus tollens: de P → Q e ¬Q conclui-se ¬P. Se a consequência não ocorreu, a premissa também não pode ter ocorrido. Logo, Ana não estudou.", "analise": "Concluir 'Ana estudou' seria a falácia da afirmação do consequente.", "ref": "Processo lógico válido – modus tollens"}, {"id": "RL-021", "materia": "RL", "topico": "Raciocínio matemático – problemas", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Um servidor tem um salário de R$ 4.200,00, do qual 40% vão para despesas fixas e 25% para outras despesas. Do restante, ele poupa a metade. Quanto ele poupa por mês?", "alternativas": ["R$ 630,00", "R$ 735,00", "R$ 840,00", "R$ 1.050,00", "R$ 1.260,00"], "correta": 1, "comentario": "Despesas fixas = 40% e outras = 25% → total 65%. Restam 35% = 0,35 × 4.200 = R$ 1.470,00. Metade poupada = R$ 735,00.", "analise": "Erros comuns: poupar 35% de 4.200 (1.470) sem dividir por 2, ou aplicar 25% sobre o valor já reduzido.", "ref": "Raciocínio matemático – quatro operações"}, {"id": "RL-022", "materia": "RL", "topico": "Discriminação de elementos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Ana, Bruno e Carla são servidores de setores distintos (Protocolo, Orçamento e Recursos Humanos, não necessariamente nessa ordem). Sabe-se que: Ana não trabalha no Protocolo; Carla trabalha no Orçamento. Em que setor trabalha Bruno?", "alternativas": ["Protocolo", "Orçamento", "Recursos Humanos", "Protocolo ou Orçamento", "Não é possível determinar"], "correta": 0, "comentario": "Carla = Orçamento. Restam Protocolo e Recursos Humanos para Ana e Bruno. Ana não está no Protocolo → Ana está em Recursos Humanos e Bruno, no Protocolo.", "analise": "A eliminação sucessiva é o método mais rápido em questões de 'associação lógica'.", "ref": "Discriminação de elementos"}, {"id": "RL-023", "materia": "RL", "topico": "Orientação temporal", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Um projeto deve ser votado em até 45 dias corridos a partir de 1º de outubro de 2026. Considerando que o prazo começa a contar em 2 de outubro (excluindo-se o dia de início, inclusive), qual é a data-limite?", "alternativas": ["14 de novembro de 2026", "15 de novembro de 2026", "16 de novembro de 2026", "13 de novembro de 2026", "20 de novembro de 2026"], "correta": 1, "comentario": "Contando-se a partir de 2 de outubro, 30 dias levam a 31 de outubro; restam 15 dias → 15 de novembro de 2026. (Verificação: outubro tem 31 dias; do dia 2 ao dia 31 são 30 dias; 45 − 30 = 15 dias em novembro → 15/11/2026.)", "analise": "O erro usual é incluir o dia do início e deslocar a resposta em um dia.", "ref": "Orientação temporal – contagem de prazos"}, {"id": "RL-024", "materia": "RL", "topico": "Raciocínio verbal", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Três servidores fazem afirmações sobre um processo: A diz 'B foi o responsável'; B diz 'C não foi o responsável'; C diz 'A mente'. Sabe-se que APENAS UM deles mente e que apenas um deles foi o responsável. Se B foi o responsável, quem mente?", "alternativas": ["A", "B", "C", "A e C", "Ninguém mente"], "correta": 2, "comentario": "Se B foi o responsável: A diz a verdade (B foi responsável). B diz 'C não foi o responsável' — verdade (quem foi foi B). C diz 'A mente' — como A diz a verdade, a afirmação de C é FALSA. Logo, apenas C mente, o que confirma a condição do enunciado.", "analise": "Sempre teste a hipótese dada pelo enunciado nas três declarações e verifique a consistência com 'apenas um mente'.", "ref": "Lógica da argumentação"}, {"id": "RL-025", "materia": "RL", "topico": "Números e grandezas proporcionais", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Uma equipe de 12 servidores, trabalhando 8 horas por dia, conclui um trabalho em 15 dias. Para concluir o mesmo trabalho em 10 dias, trabalhando 6 horas por dia, seriam necessários quantos servidores?", "alternativas": ["18", "20", "22", "24", "30"], "correta": 3, "comentario": "Servidores × horas × dias = constante: 12 × 8 × 15 = 1.440 homem-hora. Novos: n × 6 × 10 = 1.440 → 60n = 1.440 → n = 24 servidores.", "analise": "Relações inversas: reduzindo os dias (15→10) e as horas (8→6), é necessário mais gente. Conferir se o resultado cresce na direção esperada é uma boa verificação.", "ref": "Regra de três composta"}, {"id": "SEC-001", "materia": "SEC", "topico": "Técnicas de arquivo", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O método de arquivamento que organiza os documentos por assunto, reunindo sob uma mesma classificação todos os documentos que tratem do mesmo tema, é o método:", "alternativas": ["alfabético", "numérico", "ideográfico (por assunto)", "geográfico", "cronológico"], "correta": 2, "comentario": "Métodos de arquivamento: alfabético (nome), geográfico (local), numérico (número), cronológico (data) e ideográfico/por assunto — este último subdivide-se em dicionário (ordem alfabética de assuntos) e enciclopédico (assuntos organizados hierarquicamente por classes e subclasses). É o método mais completo e mais comum em arquivos públicos.", "analise": "As demais opções usam critérios distintos de ordenação (nome, número, local, data).", "ref": "Técnicas de arquivo"}, {"id": "SEC-002", "materia": "SEC", "topico": "Técnicas de arquivo", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "De acordo com a teoria das três idades (arquivística), os arquivos são classificados em:", "alternativas": ["ativo, passivo e morto", "corrente (primeira idade), intermediário (segunda idade) e permanente (terceira idade)", "público, privado e misto", "simples, composto e complexo", "provisório, definitivo e eventual"], "correta": 1, "comentario": "Teoria das três idades: arquivo CORRENTE (uso frequente, junto aos órgãos produtores), INTERMEDIÁRIO (uso pouco frequente, aguardando prazo prescricional para eliminação ou recolhimento) e PERMANENTE (guardado definitivamente por valor histórico/informativo, não pode ser eliminado). A passagem de idade ocorre pela Tabela de Temporalidade e Destinação de Documentos.", "analise": "As expressões 'arquivo morto' e 'ativo/passivo' são do senso comum, não técnicas.", "ref": "Gestão de documentos – teoria das três idades"}, {"id": "SEC-003", "materia": "SEC", "topico": "Controle de documentos: envio e recebimento", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O setor responsável por registrar a entrada e a saída de documentos e processos, atribuindo-lhes número e data, é o:", "alternativas": ["setor de licitações", "protocolo", "arquivo permanente", "almoxarifado", "setor de recursos humanos"], "correta": 1, "comentario": "O protocolo é a unidade que recebe, registra, autua, distribui e controla a tramitação de documentos e processos, conferindo autenticidade e rastreabilidade (número, data, interessado, setor de destino). O arquivamento definitivo cabe ao arquivo permanente; licitações e RH tratam de matérias específicas.", "analise": "O almoxarifado controla materiais, não documentos.", "ref": "Protocolo e controle de documentos"}, {"id": "SEC-004", "materia": "SEC", "topico": "Noções básicas de secretaria: preparo, preenchimento e tratamento de documentos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre a redação de um ofício, é CORRETO afirmar que:", "alternativas": ["deve conter vocativo, texto, fecho e identificação do signatário, seguindo a estrutura definida no Manual de Redação da Presidência da República.", "dispensa a identificação do expediente (número e data).", "deve sempre conter a expressão 'Digníssimo Senhor' antes do nome da autoridade.", "não admite o uso de parágrafos.", "é destinado exclusivamente a autoridades federais."], "correta": 0, "comentario": "O padrão ofício (Manual de Redação da Presidência da República) contempla: cabeçalho (brasão, nome do órgão, endereço), identificação do expediente (número, data), assunto, destinatário (endereçamento), texto em parágrafos, fecho ('Respeitosamente' para autoridade superior; 'Atenciosamente' para mesma hierarquia ou inferior) e identificação do signatário (nome, cargo, assinatura). O uso de 'Digníssimo' foi abolido desde a 3ª edição do Manual.", "analise": "B) a numeração identifica o expediente. C) 'Digníssimo' não se usa mais. D) o texto é dividido em parágrafos. E) ofícios destinam-se a órgãos e autoridades em geral.", "ref": "Manual de Redação da Presidência da República"}, {"id": "SEC-005", "materia": "SEC", "topico": "Preparo de relatórios, formulários e planilhas", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Ao elaborar uma planilha de controle de processos, o recurso que garante que os valores de uma coluna sejam sempre somados automaticamente conforme novos dados são inseridos é:", "alternativas": ["formatação condicional", "tabela dinâmica", "fórmula com referência a intervalo ou tabela estruturada (ex.: =SOMA(A2:A1000) ou =SOMA(Tabela1[Valor]))", "congelamento de painéis", "validação de dados"], "correta": 2, "comentario": "Fórmulas aplicadas a intervalos amplos ou a Tabelas Estruturadas (Ctrl+T) somam automaticamente novos lançamentos. Formatação condicional destaca visualmente; tabela dinâmica resume dados; congelamento de painéis melhora navegação; validação de dados restringe entradas.", "analise": "As demais opções têm outras funções.", "ref": "Planilhas – Excel/Calc aplicado"}, {"id": "SEC-006", "materia": "SEC", "topico": "Noções de atendimento ao público", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Segundo a Lei nº 13.460/2017, o usuário de serviços públicos tem direito, entre outros, a:", "alternativas": ["obter atendimento sem identificação e sem limites.", "informações precisas e de fácil acesso sobre os serviços, com respeito à sua dignidade e sem discriminação.", "exigir prioridade em qualquer fila, independentemente de lei.", "receber resposta em até 90 dias improrrogáveis.", "ser atendido apenas por escrito."], "correta": 1, "comentario": "A Lei nº 13.460/2017 (Código de Defesa do Usuário de Serviço Público) assegura: presença de padrões de qualidade, informação clara sobre serviços, atendimento sem discriminação, ouvidoria, participação na avaliação do serviço, resposta às manifestações em até 30 dias prorrogáveis por igual período mediante justificativa, e acompanhamento processual.", "analise": "A) exige identificação e respeito a regras. C) a prioridade segue lei específica (idosos, PcD, gestantes). D) o prazo é de 30 dias prorrogáveis. E) o atendimento pode ser presencial, telefônico ou digital.", "ref": "Lei nº 13.460/2017"}, {"id": "SEC-007", "materia": "SEC", "topico": "Planejamento: tipos de planos, abrangência e horizonte temporal", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São características do planejamento estratégico, tático e operacional, respectivamente:", "alternativas": ["longo prazo e visão global; médio prazo e foco em unidades/setores; curto prazo e foco em tarefas e rotinas.", "curto prazo e visão global; médio prazo e foco em tarefas; longo prazo e foco em rotinas.", "longo prazo e foco em tarefas; curto prazo e foco em setores; médio prazo e visão global.", "todos possuem horizonte temporal idêntico.", "o tático é mais amplo que o estratégico."], "correta": 0, "comentario": "Estratégico: longo prazo (em regra, 3 a 5 anos ou mais), nível institucional, definição de missão, visão, objetivos e diretrizes. Tático: médio prazo, nível intermediário (departamentos/unidades), traduz as diretrizes em planos setoriais. Operacional: curto prazo, nível de execução, tarefas e procedimentos detalhados.", "analise": "As demais alternativas invertem horizonte e abrangência.", "ref": "Planejamento – níveis"}, {"id": "SEC-008", "materia": "SEC", "topico": "Plano de Ação 5W2H", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No Plano de Ação 5W2H, a pergunta 'How much (quanto custa?)' refere-se a:", "alternativas": ["ao responsável pela execução.", "ao prazo de conclusão.", "aos custos e recursos envolvidos.", "à justificativa da ação.", "ao local de execução."], "correta": 2, "comentario": "5W2H: What (o que), Why (por que), Who (quem), Where (onde), When (quando), How (como) e How much (quanto custa). Serve para planejar e organizar ações com clareza de responsabilidades, prazos e recursos.", "analise": "Quem = Who; Quando = When; Onde = Where; Por que = Why.", "ref": "Ferramenta 5W2H"}, {"id": "SEC-009", "materia": "SEC", "topico": "Ciclo PDCA", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O ciclo PDCA é composto, em ordem, pelas etapas:", "alternativas": ["Planejar (Plan), Executar (Do), Verificar (Check) e Agir/Corrigir (Act).", "Praticar, Desenvolver, Controlar e Aplicar.", "Planejar, Distribuir, Coordenar e Avaliar.", "Prever, Demonstrar, Corrigir e Aprovar.", "Projetar, Decidir, Comunicar e Arquivar."], "correta": 0, "comentario": "PDCA (ciclo de Deming/Shewhart): Plan (planejar metas e métodos), Do (executar e capacitar), Check (verificar resultados comparando com a meta), Act (agir corretivamente e padronizar). É a base das ferramentas de melhoria contínua e do Gerenciamento pelas Diretrizes.", "analise": "As demais alternativas não correspondem à sigla.", "ref": "Ciclo PDCA"}, {"id": "SEC-010", "materia": "SEC", "topico": "Gerenciamento de projetos: conceito, projeto x processo, tipos, stakeholders, benefícios, ciclo de vida e papel do gerente", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A diferença essencial entre projeto e processo é que:", "alternativas": ["o projeto é temporário, com início, meio e fim definidos e produto/serviço único; o processo é contínuo, repetitivo e permanente, destinado a manter a operação.", "o projeto é permanente e o processo é temporário.", "projeto não tem objetivo definido.", "processo é sempre maior em custo.", "não há diferença conceitual entre eles."], "correta": 0, "comentario": "Projeto: esforço TEMPORÁRIO, com escopo, prazo, custo e recursos definidos, para criar um produto, serviço ou resultado único (ex.: implantar um novo sistema de protocolo). Processo: conjunto de atividades contínuas e repetitivas que gera valor de forma recorrente (ex.: rotina diária de protocolo de documentos). Ambos coexistem: o projeto entrega; o processo mantém.", "analise": "As demais alternativas invertem ou negam a distinção clássica (PMBOK).", "ref": "Gerenciamento de projetos – conceitos"}, {"id": "SEC-011", "materia": "SEC", "topico": "Gerenciamento de projetos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No gerenciamento de projetos, os stakeholders são:", "alternativas": ["apenas os patrocinadores financeiros do projeto.", "todas as pessoas, grupos ou organizações que podem afetar o projeto ou ser por ele afetados, como equipe, usuários, alta administração, órgãos de controle e cidadãos.", "somente os membros da equipe de execução.", "os concorrentes da instituição.", "os fornecedores de software exclusivamente."], "correta": 1, "comentario": "Stakeholders (partes interessadas) incluem, além da equipe e do patrocinador (sponsor): usuários, alta administração, órgãos de controle externo e interno, sindicatos, cidadãos, fornecedores e a comunidade. O gerente de projetos deve identificar, analisar e engajar as partes interessadas, gerindo expectativas e comunicação.", "analise": "As demais alternativas restringem indevidamente o conceito.", "ref": "Gerenciamento de projetos – partes interessadas"}, {"id": "SEC-012", "materia": "SEC", "topico": "Gerenciamento de projetos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O documento que autoriza formalmente a existência do projeto e confere autoridade ao gerente para aplicar recursos às atividades é:", "alternativas": ["termo de encerramento", "termo de abertura do projeto (TAP/project charter)", "plano de riscos", "matriz RACI", "declaração de escopo"], "correta": 1, "comentario": "O Termo de Abertura do Projeto (TAP), ou project charter, formaliza o início, designa o gerente, define objetivos, premissas, restrições, marcos e orçamento preliminar. O plano de gerenciamento do projeto detalha como o projeto será executado, monitorado e encerrado.", "analise": "As demais opções são artefatos distintos do ciclo de vida.", "ref": "Gerenciamento de projetos – termo de abertura"}, {"id": "SEC-013", "materia": "SEC", "topico": "Modelos de gestão: competência, processos, projetos e resultados", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A gestão por competências no serviço público caracteriza-se por:", "alternativas": ["avaliar apenas a titulação acadêmica do servidor.", "identificar conhecimentos, habilidades e atitudes (CHA) necessários ao desempenho das funções, orientando seleção, capacitação e avaliação.", "substituir a avaliação de desempenho por sorteio.", "priorizar exclusivamente a antiguidade.", "eliminar a necessidade de treinamento."], "correta": 1, "comentario": "Gestão por competências trabalha com CHA: Conhecimentos (saber), Habilidades (saber fazer) e Atitudes (querer fazer), mapeando competências necessárias e comparando com as existentes (lacunas de competência = base do plano de capacitação). A Política Nacional de Desenvolvimento de Pessoas (Decreto nº 9.991/2019, substituído pelo Decreto nº 11.069/2022) adota essa lógica no âmbito federal.", "analise": "As demais alternativas contrariam o modelo.", "ref": "Gestão por competências"}, {"id": "SEC-014", "materia": "SEC", "topico": "Modelos de gestão: processos", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A gestão por processos (BPM) tem como característica central:", "alternativas": ["visão departamental e fragmentada das atividades.", "visão horizontal e integrada das atividades, orientada ao valor entregue ao cidadão/cliente, com mapeamento, modelagem, execução, monitoramento e melhoria contínua.", "eliminação de indicadores de desempenho.", "foco exclusivo em auditoria de contas.", "substituição da estrutura organizacional por projetos temporários."], "correta": 1, "comentario": "BPM (Business Process Management) busca a visão ponta a ponta do processo, com identificação de entradas, atividades, saídas, donos do processo e indicadores, permitindo padronização, automação e melhoria contínua. É a lógica de 'desburocratização' e da Lei nº 13.726/2018 (racionalização de procedimentos).", "analise": "As opções A, C, D e E descrevem práticas contrárias ao modelo.", "ref": "Gestão de processos – BPM"}, {"id": "SEC-015", "materia": "SEC", "topico": "Manual de Redação da Presidência da República", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No Manual de Redação da Presidência da República, a 'mensagem' é o instrumento de comunicação:", "alternativas": ["entre unidades administrativas do mesmo órgão.", "do Chefe do Poder Executivo com o Poder Legislativo (por exemplo, para encaminhar projeto de lei ou vetar).", "entre órgãos da administração federal e particulares.", "exclusivamente interna, para fins disciplinares.", "usada apenas em publicidade oficial."], "correta": 1, "comentario": "Tipos de expediente no Manual: ofício (comunicação externa entre autoridades/órgãos), memorando/Comunicação Interna (comunicação interna entre unidades), exposição de motivos (ao Presidente da República), mensagem (do Chefe do Executivo ao Legislativo — encaminhamento de projeto de lei, veto, informações), aviso e declaração. A mensagem é instrumento do Executivo para com o Legislativo.", "analise": "As demais opções descrevem ofício, comunicação interna ou instrumentos específicos.", "ref": "Manual de Redação – tipos de expediente"}, {"id": "SEC-016", "materia": "SEC", "topico": "Noções de atendimento ao público", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "No atendimento ao público, a escuta ativa pressupõe:", "alternativas": ["interromper o cidadão para agilizar o atendimento.", "ouvir com atenção, demonstrar compreensão, confirmar entendimento e registrar as informações essenciais.", "evitar perguntas para não constranger o cidadão.", "repassar o atendimento a outro setor sem informação.", "usar linguagem técnica incompreensível."], "correta": 1, "comentario": "Escuta ativa é técnica de comunicação que envolve atenção plena, postura empática, parafrasear/reformular, confirmar o entendimento e registrar dados para dar encaminhamento correto ao pedido.", "analise": "As demais alternativas são barreiras à comunicação eficaz.", "ref": "Atendimento ao público"}, {"id": "SEC-017", "materia": "SEC", "topico": "Planejamento: tipos de planos, abrangência e horizonte temporal", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Sobre o planejamento no setor público, é CORRETO afirmar que:", "alternativas": ["o PPA é instrumento de médio prazo (4 anos) que orienta as prioridades do governo, enquanto a LDO e a LOA são de curto prazo.", "o PPA tem duração mensal.", "a LOA é revisada a cada 10 anos.", "o planejamento público é vedado pela Constituição.", "a LDO tem vigência de 4 anos."], "correta": 0, "comentario": "Instrumentos de planejamento orçamentário: PPA (Plano Plurianual — 4 anos, região do planejamento estratégico), LDO (Lei de Diretrizes Orçamentárias — anual, orienta a elaboração da LOA), LOA (Lei Orçamentária Anual — execução do orçamento no exercício). Integram o sistema previsto nos arts. 165 a 169 da CF/88.", "analise": "B, C e E trazem vigências inexistentes; D contraria o texto constitucional.", "ref": "CF/88 arts. 165 a 169 – planejamento"}, {"id": "SEC-018", "materia": "SEC", "topico": "Gerenciamento de projetos: ciclo de vida e papel do gerente", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "São grupos de processos do gerenciamento de projetos (PMBOK), em sequência lógica:", "alternativas": ["iniciação, planejamento, execução, monitoramento e controle, encerramento", "entrada, processamento, saída e feedback", "planejar, organizar, dirigir e controlar", "ideação, prototipagem, teste e descarte", "licitar, contratar, fiscalizar e pagar"], "correta": 0, "comentario": "Grupos de processos do PMBOK: Iniciação, Planejamento, Execução, Monitoramento e Controle e Encerramento. As áreas de conhecimento incluem escopo, tempo, custo, qualidade, recursos, comunicações, riscos, aquisições, partes interessadas e integração. A alternativa C descreve as funções administrativas de Fayol (PODC).", "analise": "As demais alternativas descrevem outros modelos.", "ref": "Gerenciamento de projetos – grupos de processos"}, {"id": "SEC-019", "materia": "SEC", "topico": "Noções básicas de secretaria", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O documento interno por meio do qual unidades administrativas do mesmo órgão trocam informações para tratar de assuntos administrativos é o:", "alternativas": ["memorando (ou comunicação interna)", "ofício", "mensagem", "exposição de motivos", "declaração"], "correta": 0, "comentario": "Memorando/Comunicação Interna: expediente entre unidades administrativas do MESMO órgão, para assuntos administrativos internos. Ofício: comunicação EXTERNA entre autoridades/órgãos distintos. Mensagem: Chefe do Executivo ao Legislativo. Exposição de motivos: submete assunto à consideração do Presidente da República.", "analise": "As demais opções têm âmbito externo ou destinatário específico.", "ref": "Manual de Redação – expedientes"}, {"id": "SEC-020", "materia": "SEC", "topico": "Técnicas de arquivo", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "A Tabela de Temporalidade e Destinação de Documentos é o instrumento que:", "alternativas": ["define prazos de guarda nos arquivos corrente e intermediário e a destinação final (eliminação ou guarda permanente) de cada documento.", "lista os servidores autorizados a acessar o arquivo.", "define o horário de funcionamento do protocolo.", "autoriza a digitalização de todos os documentos.", "substitui o plano de classificação."], "correta": 0, "comentario": "A Tabela de Temporalidade (aprovada por comissão de avaliação e autoridade competente) estabelece prazos de guarda por espécie documental e a destinação final; é complementar ao Plano de Classificação, que organiza os documentos por função e atividade. Digitalização não autoriza, por si só, eliminação do original sem previsão legal e atendimento a requisitos de autenticidade.", "analise": "As demais opções descrevem finalidades alheias ao instrumento.", "ref": "Gestão de documentos – Tabela de Temporalidade"}, {"id": "SEC-021", "materia": "SEC", "topico": "Controle de documentos: envio e recebimento", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Ao receber um documento sigiloso, o servidor do protocolo deve:", "alternativas": ["abrir e comentar seu conteúdo com colegas do setor.", "manter a restrição de acesso, adotando controle de entrega com registro (recibo), identificando o destinatário autorizado e preservando o sigilo.", "digitalizar e disponibilizar em área pública da intranet.", "encaminhar por e-mail aberto a todos os setores.", "devolver ao remetente sem registro."], "correta": 1, "comentario": "Documentos com restrição de acesso (a Lei nº 12.527/2011 prevê graus de sigilo: ultrassecreto, secreto e reservado) exigem controle rigoroso de tramitação, registro de entrega e limitação de acesso a pessoas autorizadas, com fundamento na Lei de Acesso à Informação, na LGPD e nas normas de segurança da informação.", "analise": "As demais alternativas violam o dever de sigilo (que também é dever funcional do servidor).", "ref": "Segurança da informação e LAI"}, {"id": "SEC-022", "materia": "SEC", "topico": "Modelos de gestão: resultados e indicadores", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Na gestão por resultados, os indicadores devem possuir, preferencialmente, as características de:", "alternativas": ["subjetividade, complexidade e sigilo.", "objetividade, mensurabilidade, relevância, comparabilidade e periodicidade definida.", "exclusividade de medição em unidades monetárias.", "atualização anual, com dispensa de metas.", "definição exclusiva pelos órgãos de controle externo."], "correta": 1, "comentario": "Bons indicadores são mensuráveis, válidos (medem o que importam), confiáveis, relevantes, comparáveis ao longo do tempo e com periodicidade definida. Distinguem-se metas (valor a atingir em prazo) de indicadores (medida de desempenho). São a base de modelos como o Balanced Scorecard e do Gerenciamento pelas Diretrizes.", "analise": "As demais alternativas contrariam os requisitos técnicos de indicadores.", "ref": "Gestão por resultados – indicadores"}, {"id": "SEC-023", "materia": "SEC", "topico": "Preparo de relatórios, formulários e planilhas", "dif": "media", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Um relatório administrativo eficaz deve conter, essencialmente:", "alternativas": ["dados apenas qualitativos, sem conclusões.", "identificação (origem, data, assunto), objetivo, dados/resultados apresentados de forma objetiva, análise, conclusões e recomendações/encaminhamentos.", "redação literária e adjetivada.", "somente tabelas, sem texto explicativo.", "linguagem coloquial e opiniões pessoais como fundamento principal."], "correta": 1, "comentario": "Estrutura típica: cabeçalho/identificação, histórico ou introdução, objetivo, metologia, dados e análise, conclusão e recomendações. A linguagem deve ser técnica, impessoal, objetiva e clara — atributos da redação oficial.", "analise": "As demais alternativas afrontam os atributos da comunicação no serviço público.", "ref": "Relatórios administrativos"}, {"id": "SEC-024", "materia": "SEC", "topico": "Gerenciamento de projetos: tipos de projetos e benefícios", "dif": "dificil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "Um projeto de transformação digital que implanta sistemas de informação integrados tem como benefícios esperados, entre outros:", "alternativas": ["aumento de retrabalho e duplicidade de registros.", "ganho de eficiência, redução de custos operacionais, melhoria da qualidade e da disponibilidade de informações para a tomada de decisão e maior transparência ao cidadão.", "aumento exclusivo do quadro de pessoal.", "restrição do acesso à informação.", "eliminação de controles internos."], "correta": 1, "comentario": "Projetos de TI no setor público visam eficiência administrativa, integração de dados, transparência (LAI), rastreabilidade e melhoria dos serviços prestados. Benefícios podem ser tangíveis (economia, redução de tempo) e intangíveis (satisfação do usuário, imagem institucional, governança). O plano de benefícios é acompanhado como parte do ciclo de vida do projeto.", "analise": "As demais opções descrevem prejuízos ou retrocessos, não benefícios.", "ref": "Gerenciamento de projetos – benefícios"}, {"id": "DA-001", "materia": "DA", "topico": "Direito administrativo: conceito, objeto e fontes", "dif": "facil", "banca": "Fundação CETAP", "ano": 2026, "enunciado": "O objeto do Direito Administrativo é, essencialmente:", "alternativas": ["o conjunto de normas e princípios que regulam a organização e o funcionamento da Administração Pública e suas relações com os administrados.", "apenas as normas de direito privado aplicadas ao Estado.", "exclusivamente a organização do Poder Judiciário.", "somente os contratos entre particulares.", "a definição de crimes praticados por agentes públicos."], "correta": 0, "comentario": "O Direito Adm
